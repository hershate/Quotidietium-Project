# 主分类菜单
main-menu:
  title: "成就"
  rows: 4
  items:
    category:
      name: "&a{category_name} 成就"
      lore:
        - "{category_description}"
        - ""
        - "&7已解锁：&b{unlocked_achievements}&7/&b{total_achievements} &8（{unlocked_achievements_percentage}%）"
        - "&7点数：&e{points}&7/&e{total_points} &8（{points_percentage}%）"
        - ""
        - "&e点击查看成就！"
      flags:
        - HIDE_ATTRIBUTES
    category-locked:
      name: "&c{category_name} 成就"
      lore:
        - "{category_description}"
        - ""
        - "&c分类已锁定！"
      flags:
        - HIDE_ATTRIBUTES
    rewards:
      material: GOLD_INGOT
      name: "&6成就奖励"
      lore:
        - "&7解锁在追寻成就过程中"
        - "&7获得的专属奖励。"
      slot: 27
    close:
      material: ARROW
      name: "&c关闭"
      lore:
        - "&7关闭菜单"
      slot: 30
    summary:
      material: DIAMOND
      name: "&a成就完成度"
      lore:
        - "&7玩家：{player}"
        - ""
        - "&7已解锁：&b{unlocked_achievements}&7/&b{total_achievements} &8（{unlocked_achievements_percentage}%）"
        - "&7点数：&e{points}&7/&e{total_points} &8（{points_percentage}%）"
      slot: 31
    tracker:
      material: REPEATER
      name: "&c成就追踪器"
      lore:
        - "&7在此菜单中追踪成就，"
        - "&7快速访问并即时获取"
        - "&7进度反馈。"
      slot: 32
    search:
      material: OAK_SIGN
      name: "&a搜索"
      lore:
        - "&7通过名称、描述或分类"
        - "&7搜索成就。"
      slot: 35
  custom-items: {}
