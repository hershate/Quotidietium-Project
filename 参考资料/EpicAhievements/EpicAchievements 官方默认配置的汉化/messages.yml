      - "&a{achievement_name} {tier_roman}"
      - "&f{achievement_description}"
      - ""
      - "&7进度：&a{achievement_progress}&7/&a{tier_requirement}"
      - "&7奖励："
      - "{tier_rewards}"
      - ""
      - "&e点击查看成就！"
