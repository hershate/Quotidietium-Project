      - "&a{achievement_name}"
      - "&f{achievement_description}"
      - ""
      - "&7进度：&a已完成！&7（&a{tier_requirement}&7）"
      - "&7奖励："
      - "{tier_rewards}"
      - ""
      - "&e点击查看成就！"
  tiered:
    message:
      - "&f"
      - "&e&ka&r&a>> 成就解锁：&6{achievement_name} {tier_roman} &a<<&e&ka"
      - "&f"
