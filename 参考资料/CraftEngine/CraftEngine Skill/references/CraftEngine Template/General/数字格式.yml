# =============================================================================
# CraftEngine 数字格式配置模板
# =============================================================================
# 参考文档 (本地):
#   参考资料/CraftEngine/CraftEngine Wiki/reference/number_format.md
#
# 用法:
#   1. 将顶级命名空间 "custom" 替换为你的实际命名空间
#   2. 将每个示例的 ID (如 constant_example) 替换为实际配置 ID
#   3. 将所有 # << CHANGE THIS 标记的值替换为实际数值
#   4. 取消注释简写形式作为精简写法
#
# 注意:
#   - 此文件包含所有 11 种数字格式的完整示例
#   - 每个示例之间相互独立，可单独使用
#   - 同名配置 ID 在同一命名空间下不可重复
# =============================================================================

custom:  # << CHANGE THIS 命名空间

  # ===========================================================================
  # 一、基础格式
  # ===========================================================================

  # ===========================================================================
  # 1. 常量 (constant)
  # ===========================================================================
  # 提供一个固定的数值
  constant_example:  # << CHANGE THIS 配置 ID
    type: constant
    value: 1  # << CHANGE THIS 固定数值

  # ---------------------------------------------------------------------------
  # 简写形式: 直接使用裸数值
  # ---------------------------------------------------------------------------
  # constant_example_shorthand: 1  # << CHANGE THIS 固定数值


  # ===========================================================================
  # 2. 均匀随机数 (uniform)
  # ===========================================================================
  # 在 [min, max] 范围内均匀随机取值
  uniform_example:  # << CHANGE THIS 配置 ID
    type: uniform
    min: 1   # << CHANGE THIS 最小值 (含)
    max: 10  # << CHANGE THIS 最大值 (含)

  # ---------------------------------------------------------------------------
  # 简写形式: "min~max" 字符串
  # ---------------------------------------------------------------------------
  # uniform_example_shorthand: "1~10"  # << CHANGE THIS

  # ---------------------------------------------------------------------------
  # 嵌套用法: min / max 本身也支持数字格式或 PlaceholderAPI 表达式
  # ---------------------------------------------------------------------------
  # uniform_nested_example:  # << CHANGE THIS 配置 ID
  #   type: uniform
  #   min:                                    # << CHANGE THIS 嵌套均匀分布
  #     type: uniform
  #     min: 2                                # << CHANGE THIS
  #     max: 7                                # << CHANGE THIS
  #   max: "<papi:skilllevel_farming>*5~<papi:skilllevel_farming>*10"  # << CHANGE THIS


  # ===========================================================================
  # 3. 表达式 (expression)
  # ===========================================================================
  # 使用 EvalEx 表达式引擎求值
  # 完整文档: https://ezylang.github.io/EvalEx/references/references.html
  expression_example:  # << CHANGE THIS 配置 ID
    type: expression
    expression: "20 + 70 / 2"  # << CHANGE THIS 表达式字符串

  # ---------------------------------------------------------------------------
  # 简写形式: 直接使用表达式字符串 (配方例如含 PAPI 变量)
  # ---------------------------------------------------------------------------
  # expression_example_shorthand: "<papi:skilllevel_farming> / 20 + 5"  # << CHANGE THIS


  # ===========================================================================
  # 二、离散概率分布
  # ===========================================================================

  # ===========================================================================
  # 4. 二项分布 (binomial)
  # ===========================================================================
  # 使用二项分布作为随机数生成器
  binomial_example:  # << CHANGE THIS 配置 ID
    type: binomial
    extra: 10        # << CHANGE THIS 必需: 独立重复的伯努利试验次数
    probability: 0.2 # << CHANGE THIS 必需: 每次试验的成功概率


  # ===========================================================================
  # 5. 加权列表 (weighted)
  # ===========================================================================
  # 基于权重从数值列表中随机选取一个返回值; 权重自动归一化
  weighted_example:  # << CHANGE THIS 配置 ID
    type: weighted
    weights:
      "10": 70   # << CHANGE THIS 数值 "10" 权重 70 (约 70%)
      "50": 25   # << CHANGE THIS 数值 "50" 权重 25 (约 25%)
      "200": 5   # << CHANGE THIS 数值 "200" 权重 5 (约 5%)


  # ===========================================================================
  # 三、连续概率分布
  # ===========================================================================

  # ===========================================================================
  # 6. 高斯/正态分布 (gaussian)
  # ===========================================================================
  # 使用高斯/正态分布作为随机数生成器, 支持 min/max 截断
  gaussian_example:  # << CHANGE THIS 配置 ID
    type: gaussian
    min: 10            # << CHANGE THIS 必需: 最小值限制
    max: 20            # << CHANGE THIS 必需: 最大值限制
    mean: 15           # << CHANGE THIS 可选: 均值, 默认 (min+max)/2
    std_dev: 1         # << CHANGE THIS 可选: 标准差, 默认 (max-min)/6
    max_attempts: 128  # << CHANGE THIS 可选: 最大重试次数, 默认 128


  # ===========================================================================
  # 7. 偏态分布 (skew_normal)
  # ===========================================================================
  # 允许不对称分布, 数据可更集中地聚集在最小值或最大值附近
  skew_normal_example:  # << CHANGE THIS 配置 ID
    type: skew_normal
    min: 0               # << CHANGE THIS 必需: 最小预期值
    max: 100             # << CHANGE THIS 必需: 最大预期值
    mean: 50             # << CHANGE THIS 可选: 均值, 默认 (min+max)/2
    std_dev: 10          # << CHANGE THIS 可选: 标准差, 默认 (max-min)/6
    skewness: 0.5        # << CHANGE THIS 可选: 偏度, 范围 [-0.995, 0.995], 默认 0
    max_attempts: 128    # << CHANGE THIS 可选: 最大重试次数, 默认 128


  # ===========================================================================
  # 8. 对数正态分布 (log_normal)
  # ===========================================================================
  # 始终为正且右偏, 适合模拟货币贬值、消耗耐久度等场景
  log_normal_example:  # << CHANGE THIS 配置 ID
    type: log_normal
    min: 1     # << CHANGE THIS 必需: 最小预期值 (必须 > 0)
    max: 1000  # << CHANGE THIS 必需: 最大预期值

    # ---- 方案一: 直接提供真实平均值和真实标准差 (直观) ----
    # 生成器将自动计算对数的 μ 和 σ 参数
    mean: 50       # << CHANGE THIS 可选: 真实平均值
    std_dev: 20    # << CHANGE THIS 可选: 真实标准差

    # ---- 方案二: 对数参数 (高级, 与方案一互斥) ----
    # location: 3.5  # << CHANGE THIS μ (自然对数平均值)
    # scale: 0.5     # << CHANGE THIS σ (自然对数标准差)

    max_attempts: 128  # << CHANGE THIS 可选: 最大重试次数, 默认 128


  # ===========================================================================
  # 9. 三角分布 (triangle)
  # ===========================================================================
  # 计算效率高的正态分布替代方案, 具有天然的边界特性
  triangle_example:  # << CHANGE THIS 配置 ID
    type: triangle
    min: 10   # << CHANGE THIS 必需: 低限
    max: 100  # << CHANGE THIS 必需: 上限
    mode: 30  # << CHANGE THIS 可选: 众数 (三角形顶点), 默认 (min+max)/2


  # ===========================================================================
  # 10. 贝塔分布 (beta)
  # ===========================================================================
  # 在固定范围内定义的灵活性分布, 通过 α 和 β 两个形状参数模拟多种分布
  beta_example:  # << CHANGE THIS 配置 ID
    type: beta
    min: 0     # << CHANGE THIS 可选: 最小预期值, 默认 0.0
    max: 10    # << CHANGE THIS 可选: 最大预期值, 默认 1.0
    alpha: 5.0 # << CHANGE THIS 可选: 形状参数 α, 默认 2.0 (越大越向最大值集中)
    beta: 2.0  # << CHANGE THIS 可选: 形状参数 β, 默认 2.0 (越大越向最小值集中)


  # ===========================================================================
  # 11. 指数分布 (exponential)
  # ===========================================================================
  # 常用于模拟随机事件之间的时间间隔
  exponential_example:  # << CHANGE THIS 配置 ID
    type: exponential
    min: 0   # << CHANGE THIS 可选: 最小预期值, 默认 0.0
    max: 60  # << CHANGE THIS 可选: 最大预期值, 默认 Double.MAX_VALUE

    # ---- 二选一: mean 或 lambda ----
    mean: 10  # << CHANGE THIS 平均间隔 (均值 = 1/lambda)

    # lambda: 0.1  # << CHANGE THIS 速率参数 (单位时间内事件的平均次数)
