# =============================================================================
# CraftEngine 字体配置模板 (Minecraft 自定义字体)
# =============================================================================
# 基于 CraftEngine 官方文档: configuration/font.md
# 严格遵循文档中出现的配置项，未出现的不使用。
# =============================================================================
#
# Minecraft 自定义字体通过资源包中 assets/<命名空间>/font/default.json 配置。
# providers 数组从上到下依次为字符匹配字形，匹配即停止。若已有 default.json，
# 将新 provider 追加到现有 providers 数组末尾即可。
#
# TTF/位图/Unihex 三种字体类型的配置方式如下。
# =============================================================================

providers:

  # ============================================================
  # 1. TTF (TrueType 矢量字体)
  # ============================================================
  # 文档完整记载了四项配置键: type, file, oversample, size。
  # 字体文件位置: assets/<命名空间>/font/<文件名>.ttf
  # ============================================================
  - type: "ttf"
    file: "custom:font/custom_font.ttf"  # << CHANGE THIS: TTF 字体文件路径 (命名空间:路径)
    oversample: 10                        # << CHANGE THIS: 过采样倍率 (整数，越高越平滑但越耗纹理内存)
    size: 11                              # << CHANGE THIS: 字体大小 (像素)

  # ============================================================
  # 2. 位图字体 (Bitmap)
  # ============================================================
  # 文档记载: 将 PNG 文件放置在 assets/<命名空间>/font/ 目录下，即可
  # 自动替换原版字符图片。无需在 providers 中添加 JSON 条目。
  #
  # 文件路径示例:
  #   assets/custom/font/<文件名>.png
  #
  # 若需要自定义字符映射（如为特定 Unicode 码位分配字符），请参见:
  #   https://zh.minecraft.wiki/w/自定义字体#bitmap
  # ============================================================

  # --- 位图字体文件放置示例 (无需 JSON) ---
  # 将 PNG 图片放入以下目录:
  #   assets/custom/font/glyph_sheet.png
  #
  # PNG 文件名 (不含扩展名) 即作为纹理标识符，游戏自动按 ASCII 顺序
  # 从左到右、从上到下分配字形，替换原版对应字符的显示。

  # ============================================================
  # 3. Unihex 字体
  # ============================================================
  # 文档记载: 参考 Minecraft Wiki 获取详细说明。
  #
  # Unihex 是一种基于十六进制文本的位图字体格式，使用 .hex 文件
  # 定义字符像素数据。适用于需要定义少量特殊字符或自定义图标的场景。
  #
  # 详细介绍及配置方法:
  #   https://zh.minecraft.wiki/w/自定义字体#unihex
  # ============================================================

  # --- Unihex 字体文件放置示例 ---
  # 将 .hex 文件放入以下目录:
  #   assets/custom/font/<文件名>.hex
  #
  # 如需在 providers 中添加 unihex 条目，请参考上述 MC Wiki 链接
  # 获取完整的 JSON 结构及配置参数说明。
