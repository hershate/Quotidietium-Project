# ============================================================================
# 字体配置 — 自定义字体参考模板 (Oraxen 风格)
# ============================================================================
# 对应 Wiki: configuration/font.md
#
# 本文档以 Oraxen 风格列出 CraftEngine 中可用的字体配置项。
# 覆盖三种字体类型: TTF (TrueType 矢量字体)、Bitmap (位图字体)、Unihex。
#
# CraftEngine 的字体系统基于 Minecraft 原版自定义字体机制。
# 当你启用资源包生成时，CraftEngine / Oraxen 会根据以下配置自动生成
# `assets/<命名空间>/font/default.json` 文件，无需手动编辑。
#
# 注意: 本文件为模板参考文件，不直接加载。请将所需配置项复制到实际
#       的字体配置文件 (如 `plugins/Oraxen/fonts.yml`) 中，或作为查阅
#       速查表使用。
# ============================================================================

# --------------------------------------------------------------------------
# settings (全局设置)
# 控制字体的整体行为，如是否自动生成 default.json、权限集成等。
# --------------------------------------------------------------------------
settings:
  # 是否让插件自动根据下方配置生成 default.json？
  # true  - 自动生成 (推荐)，插件接管字体资源包管理
  # false - 手动管理，需自行编写 default.json
  # 类型: boolean
  # 默认值: true
  automatically_generate: true

  # 聊天中的字形颜色前缀占位符 (PlaceholderAPI)。
  # 用于在聊天中自动为玩家显示其 LuckPerms 元数据中定义的颜色。
  # 类型: string (PlaceholderAPI 占位符) 或 null
  # 默认值: null
  #perms_chatcolor: "%luckperms_meta_chatcolor%"

# --------------------------------------------------------------------------
# bitmaps (位图字体 / 精灵表)
# --------------------------------------------------------------------------
# 位图字体使用 PNG 图片作为字体纹理。你既可以使用单张独立图片作为单个
# 字形，也可以将多个字形排列在一张精灵表 (Sprite Sheet) 上，通过行列
# 索引来引用其中的特定格子。
#
# 适用场景:
#   - 表情符号 (聊天中的 :heart:、:smile:)
#   - 图标 (物品描述中的稀有度标记、等级徽章)
#   - HUD 元素 (自定义血条、经验条)
#   - GUI 装饰 (库存背景、按钮)
#
# 纹理文件位置: plugins/Oraxen/pack/textures/ (或资源包对应目录)
# 纹理格式: PNG，建议单张不超过 256x256 像素 (大图请使用 grid 网格模式)
# 配置文件加载: 此条目定义后，在字形配置中通过 bitmap.id 引用。
# --------------------------------------------------------------------------
bitmaps:

  # --- 单一位图示例 ---
  #   example_bitmap:
  #     texture: example/example_bitmap     # 【必填】纹理路径 (相对于 pack/textures/，不加 .png)
  #     rows: 4                             # 【必填】精灵表的行数 (垂直方向的表情数量)
  #     columns: 9                          # 【必填】精灵表的列数 (水平方向的表情数量)
  #     ascent: 8                           # 【必填】垂直偏移 (像素)，控制字形在文本行中的上下位置
  #     height: 8                           # 【必填】显示高度 (像素)，控制字形的缩放大小
  #
  #   # --- 聊天表情精灵表示例 ---
  #   chat_emojis:
  #     texture: default/chat/emojis_sheet
  #     rows: 4
  #     columns: 9
  #     ascent: 8
  #     height: 8
  #
  #   # --- 图标精灵表示例 ---
  #   icon_sheet:
  #     texture: icons/icon_sheet
  #     rows: 2
  #     columns: 8
  #     ascent: 12
  #     height: 12

  # --- 示例: 自定义字体位图 (替换原版字符) ---
  # 如果你希望替换原版字符图片 (如数字、字母)，可以参考下方配置。
  # 将 PNG 文件放置在 assets/<命名空间>/font/ 目录下，然后在位图定义中引用。
  #custom_font_bitmap:
  #  texture: minecraft:custom_font          # 纹理路径
  #  rows: 16                                # ASCII 位图通常为 16 行
  #  columns: 16                             # ASCII 位图通常为 16 列
  #  ascent: 8
  #  height: 8

# --------------------------------------------------------------------------
# fonts (TTF 矢量字体)
# --------------------------------------------------------------------------
# TrueType (.ttf) 矢量字体允许你使用平滑缩放的字体文件，而非像素位图。
# Minecraft 原生支持 TTF 字体提供器 (自 1.16+)，CraftEngine / Oraxen
# 会自动在 default.json 中生成对应的 providers 条目。
#
# 适用场景:
#   - 全字体替换 (将游戏内所有文本替换为自定义字体)
#   - 特殊符号/字符集 (生僻字、装饰性符号)
#   - 统一风格 (使资源包中的文本字体一致)
#
# 字体文件位置: assets/<命名空间>/font/ (或 pack/fonts/)
# 字体格式: .ttf (TrueType), 也支持 .otf (OpenType)
#
# Minecraft Wiki 参考:
#   https://zh.minecraft.wiki/w/自定义字体#ttf
# --------------------------------------------------------------------------
fonts:

  # --- TTF 字体示例 ---
  # my_custom_font:
  #   type: "ttf"                           # 【必填】字体类型，固定为 "ttf"
  #   file: "minecraft:custom_font.ttf"     # 【必填】字体文件路径 (命名空间:路径格式)
  #   shift_x: 0.0                          # 【可选】水平偏移 (像素)，正数向右，负数向左
  #                                         # 类型: float
  #                                         # 默认: 0.0
  #   shift_y: 1.6                          # 【可选】垂直偏移 (像素)，正数向下，负数向上
  #                                         # 类型: float
  #                                         # 默认: 0.0
  #   size: 8.0                             # 【可选】字体大小，控制渲染字符的尺寸
  #                                         # 类型: float
  #                                         # 默认: 11.0
  #   oversample: 10.0                      # 【可选】过采样率，控制字体渲染的平滑度
  #                                         # 较高的值使字体更平滑但增加纹理内存占用
  #                                         # 类型: float
  #                                         # 默认: 10.0 (Minecraft 默认推荐值)

  # --- 完整示例: 替换游戏默认字体 ---
  #default_font:
  #  type: "ttf"
  #  file: "minecraft:default.ttf"
  #  shift_x: 0.0
  #  shift_y: 0.0
  #  size: 11.0
  #  oversample: 10.0

  # --- 完整示例: 装饰性标题字体 ---
  #title_font:
  #  type: "ttf"
  #  file: "minecraft:title_decorative.ttf"
  #  shift_x: 0.5
  #  shift_y: 2.0
  #  size: 16.0
  #  oversample: 12.0

# --------------------------------------------------------------------------
# unihex (Unihex 字体)
# --------------------------------------------------------------------------
# Unihex 字体是一种基于十六进制编码的位图字体格式，通常用于显示特殊
# 字符集或自定义字形。在 Minecraft 中，unihex 字体通过字体提供器加载
# .hex 文件来定义字符像素数据。
#
# 特点:
#   - 基于文本的位图定义 (非图片文件)
#   - 适合定义少量特殊字符或图标
#   - 文件体积小，无需图片处理
#   - 使用场景相对不常见
#
# Unihex 字体文件应放置在资源包的 assets/<命名空间>/font/ 目录下，
# 然后在 default.json 中添加对应提供器条目。
#
# Minecraft Wiki 参考:
#   https://zh.minecraft.wiki/w/自定义字体#unihex
# --------------------------------------------------------------------------
unihex:

  # --- Unihex 字体示例 ---
  # my_unihex_font:
  #   type: "unihex"                        # 【必填】字体类型，固定为 "unihex"
  #   file: "minecraft:custom_chars.hex"    # 【必填】unihex 文件路径 (命名空间:路径格式)
  #   shift_x: 0.0                          # 【可选】水平偏移 (像素)
  #                                         # 类型: float
  #                                         # 默认: 0.0
  #   shift_y: 0.0                          # 【可选】垂直偏移 (像素)
  #                                         # 类型: float
  #                                         # 默认: 0.0
  #   size: 8.0                             # 【可选】字体大小
  #                                         # 类型: float
  #                                         # 默认: 11.0
  #   oversample: 8.0                       # 【可选】过采样率
  #                                         # 类型: float
  #                                         # 默认: 8.0

  # --- 完整示例: 自定义特殊字符集合 ---
  #special_symbols:
  #  type: "unihex"
  #  file: "minecraft:special_symbols.hex"
  #  shift_x: 0.0
  #  shift_y: 0.0
  #  size: 10.0
  #  oversample: 8.0

# ============================================================================
# 附: default.json 自动生成结构参考
# ============================================================================
# 当 settings.automatically_generate 为 true 时，插件会根据以上配置
# 自动在资源包中生成类似以下结构的 default.json 文件:
#
# {
#   "providers": [
#     {
#       "type": "ttf",
#       "file": "minecraft:custom_font.ttf",
#       "oversample": 10.0,
#       "size": 11.0
#     },
#     {
#       "type": "bitmap",
#       "file": "minecraft:custom_font.png",
#       "ascent": 8,
#       "height": 8,
#       "chars": ["..."]
#     },
#     {
#       "type": "unihex",
#       "file": "minecraft:custom_chars.hex",
#       "oversample": 8.0,
#       "size": 10.0
#     }
#   ]
# }
#
# 你也可以在资源包中手动创建/编辑 default.json 来覆盖插件生成的配置。
# 手动编辑时，将新的 provider JSON 对象追加到 "providers" 数组末尾。
# 注意: 自动生成开启后，手动修改可能会被插件覆盖。
# ============================================================================

# ============================================================================
# 附: 字体类型速查
# ============================================================================
# | 类型    | 文件格式 | 适用场景                 | 配置文件路径                             |
# |---------|----------|--------------------------|------------------------------------------|
# | TTF     | .ttf     | 矢量字体，全字体替换     | assets/<ns>/font/<file>.ttf              |
# | Bitmap  | .png     | 表情符号，图标，HUD      | assets/<ns>/font/<file>.png              |
# | Unihex  | .hex     | 特殊字符，小规模图标集   | assets/<ns>/font/<file>.hex              |
# |         |          |                          |                                          |
# | 字形参考| .yml     | 字形配置 (Oraxen)        | plugins/Oraxen/glyphs/<name>.yml         |
# | 字体配置| .yml     | 字体全局设置 (Oraxen)    | plugins/Oraxen/fonts.yml                 |
# ============================================================================
