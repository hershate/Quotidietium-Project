# CraftEngine Wiki: reference/text_format.md
# MiniMessage text formatting tags — complete working config for all tag types
# namespace: custom

items:
  # <shift:_像素值_> — 像素级文本偏移
  example_shift:
    material: STICK
    data:
      item_name: "<!i><shift:-100><#FF8C00>向左偏移的文本" # << CHANGE THIS
      lore:
        - "<!i><shift:50>向右偏移的文本" # << CHANGE THIS

  # <papi:_占位符_:[_默认值_]> — PlaceholderAPI 占位符
  example_papi:
    material: DIAMOND
    data:
      item_name: "<!i><#FF8C00><papi:player_name>的钻石" # << CHANGE THIS
      lore:
        - "经验倍率: <papi:exp_multiplier:1>" # << CHANGE THIS
        - "在线人数: <papi:server_online:0>" # << CHANGE THIS

  # <viewer_papi:_占位符_:[_默认值_]> — 观察者视角 PlaceholderAPI
  example_viewer_papi:
    material: PAPER
    data:
      item_name: "<viewer_papi:player_name>看到的名字" # << CHANGE THIS
      lore:
        - "观察者血量: <viewer_papi:player_health:0>" # << CHANGE THIS

  # <rel_papi:_占位符_:[_默认值_]> — 关系型 PlaceholderAPI
  example_rel_papi:
    material: PLAYER_HEAD
    data:
      item_name: "<rel_papi:rel_faction_name:无派系>的玩家" # << CHANGE THIS
      lore:
        - "好友数量: <rel_papi:rel_friend_count:0>" # << CHANGE THIS

  # <image:_命名空间_:_路径_:[_行_]:[_列_]:[_格式_]> — 字体图片
  example_image:
    material: BOOK
    data:
      item_name: "<!i><white><image:custom:icons><#FF8C00>带图标的物品" # << CHANGE THIS
      lore:
        - "<!i><white><image:custom:icons:0:1> 指定行列图标" # << CHANGE THIS
        - "<!i><red><image:custom:icons:'<!shadow><white>'> 带格式图标" # << CHANGE THIS

  # <i18n:_标识符_> — 服务端侧翻译
  example_i18n:
    material: PAPER
    data:
      item_name: "<i18n:item.custom_example>" # << CHANGE THIS
      lore:
        - "<i18n:lore.custom_example_desc>" # << CHANGE THIS

  # <l10n:_标识符_> — 客户端侧翻译
  example_l10n:
    material: PAPER
    data:
      item_name: "<l10n:item.custom_example>" # << CHANGE THIS
      lore:
        - "<l10n:lore.custom_example_desc>" # << CHANGE THIS

  # <expr:_格式_:_表达式_> — 数学运算
  example_expr:
    material: CLOCK
    data:
      item_name: "<!i><#FF8C00><expr:0.##:'70 / 8'>" # << CHANGE THIS
      lore:
        - "<expr:0.00:'<papi:player_x> / 8'>" # << CHANGE THIS
        - "<expr:#.##%:'<papi:player_health> / <papi:player_max_health> * 100'>" # << CHANGE THIS

  # <arg:_索引_> / <arg:_标识符_> — 索引参数 / 命名参数 / 通用参数 / 上下文主体参数
  example_arg:
    material: WRITABLE_BOOK
    data:
      item_name: "时间: <arg:cooking_time>刻" # << CHANGE THIS
      lore:
        - "经验: <arg:cooking_experience>" # << CHANGE THIS
        - "随机数: <arg:random>"
        - "方块坐标: <arg:block.x> <arg:block.y> <arg:block.z>"

  # <viewer_arg:_标识符_> — 观察者视角命名参数
  example_viewer_arg:
    material: WRITTEN_BOOK
    data:
      item_name: "你好, <viewer_arg:player.name>" # << CHANGE THIS
      lore:
        - "<arg:player.name> 与方块进行了交互" # << CHANGE THIS

  # <global:_标识符_:[参数...]> — 全局变量引用
  example_global:
    material: NETHER_STAR
    data:
      item_name: "<global:rare_tag> 稀有三叉戟" # << CHANGE THIS
      lore:
        - "<global:custom_prefix>全局前缀示例" # << CHANGE THIS

  # <bubble:_id_:_left_:_right_:_内容_> — 气泡文字 (需要 CustomNameplates)
  example_bubble:
    material: NAME_TAG
    data:
      item_name: "<bubble:chat_1:1:1:'<black><!shadow>发生了什么'>" # << CHANGE THIS

  # <nameplate:_id_:_left_:_right_:_内容_> — 铭牌文字 (需要 CustomNameplates)
  example_nameplate:
    material: NAME_TAG
    data:
      item_name: "<nameplate:xmas:1:1:'ABCDEFG'>" # << CHANGE THIS

  # <background:_id_:_left_:_right_:_内容_> — 背景文字 (需要 CustomNameplates)
  example_background:
    material: NAME_TAG
    data:
      item_name: "<background:bedrock_1:1:1:'ABCDEFG'>" # << CHANGE THIS
