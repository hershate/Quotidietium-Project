# Wiki: CraftEngine Wiki/reference/file_conflict.md
# 冲突处理器 - config.yml > resource-pack.duplicated-files-handler
# 按顺序匹配，使用第一个符合条件的解决方案；无匹配则控制台警告。
# 注意：插件不支持着色器 (shader) 文件的合并。

duplicated-files-handler:
  # =========================================================================
  # 1. JSON深度合并 - 物品模型（多版本路径兼容）
  # =========================================================================
  - term:
      type: any_of
      terms:
        - type: parent_path_suffix
          suffix: "minecraft/items"                    # 1.21.4+  << CHANGE THIS
        - type: parent_path_suffix
          suffix: "minecraft/models/item"              # 1.20-1.21.3  << CHANGE THIS
    resolution:
      type: merge_json
      deeply: true                                     # << CHANGE THIS

  # =========================================================================
  # 2. pack.mcmeta 专用合并
  # =========================================================================
  - term:
      type: exact
      path: "pack.mcmeta"                              # << CHANGE THIS
    resolution:
      type: merge_pack_mcmeta
      description: "<gray>Custom 资源包"                # << CHANGE THIS

  # =========================================================================
  # 3. pack.png 保留匹配 - 优先保留指定目录中的文件
  # =========================================================================
  - term:
      type: exact
      path: "pack.png"                                 # << CHANGE THIS
    resolution:
      type: retain_matching
      term:
        type: contains
        path: "custom/resourcepack"                    # << CHANGE THIS

  # =========================================================================
  # 4. sounds.json 文件名匹配 + 浅层JSON合并
  # =========================================================================
  - term:
      type: filename
      name: "sounds.json"                              # << CHANGE THIS
    resolution:
      type: merge_json
      deeply: false                                    # << CHANGE THIS

  # =========================================================================
  # 5. 纹理图集 - atlases 专用合并
  # =========================================================================
  - term:
      type: pattern
      pattern: "atlases/.+\\.json"                     # << CHANGE THIS
    resolution:
      type: merge_atlas

  # =========================================================================
  # 6. 字体文件 - font 目录专用合并
  # =========================================================================
  - term:
      type: parent_path_prefix
      path: "assets/custom/font"                       # << CHANGE THIS
    resolution:
      type: merge_font

  # =========================================================================
  # 7. 条件解析 - 根据冲突文件来源选择不同方案
  # =========================================================================
  - term:
      type: exact
      path: "assets/custom/lang/zh_cn.json"            # << CHANGE THIS
    resolution:
      type: conditional
      term:
        type: contains
        path: "custom/lang"                            # << CHANGE THIS
      resolution:
        type: merge_json
        deeply: false                                  # << CHANGE THIS

  # =========================================================================
  # 8. 反向匹配 - 排除特定目录后执行JSON合并
  # =========================================================================
  - term:
      type: inverted
      term:
        type: contains
        path: "custom/excluded"                        # << CHANGE THIS
    resolution:
      type: merge_json
      deeply: true                                     # << CHANGE THIS

  # =========================================================================
  # 9. 全条件与 - 所有条件同时满足才匹配
  # =========================================================================
  - term:
      type: all_of
      terms:
        - type: filename
          name: "model_data.json"                      # << CHANGE THIS
        - type: parent_path_prefix
          path: "assets/custom"                        # << CHANGE THIS
    resolution:
      type: retain_matching
      term:
        type: parent_path_suffix
        suffix: "custom/models"                        # << CHANGE THIS
