# CraftEngine Wiki: reference/text_format/chain_arguments.md
# 链式参数 — 使用点表示法以层级结构访问对象相关参数
# 标签格式: <arg:对象.属性.子属性>
# 例如 <arg:player.world.name> 获取玩家当前所在世界的名称

namespace: custom                                                        # << CHANGE THIS

# ============================================================================
# player — 玩家对象链式参数演示
# ============================================================================
player_example:
  coordinates:
    double: "<arg:player.x> <arg:player.y> <arg:player.z>"
    block: "<arg:player.block_x> <arg:player.block_y> <arg:player.block_z>"
  identity:
    name: "<arg:player.name>"
    uuid: "<arg:player.uuid>"
  state:
    is_flying: "<arg:player.is_flying>"
    is_sneaking: "<arg:player.is_sneaking>"
    gamemode: "<arg:player.gamemode>"
    game_edition: "<arg:player.game_edition>"
  held_items:
    main_hand_id: "<arg:player.main_hand_item.id>"
    main_hand_count: "<arg:player.main_hand_item.count>"
    main_hand_custom_model_data: "<arg:player.main_hand_item.custom_model_data>"
    main_hand_is_custom: "<arg:player.main_hand_item.is_custom>"
    off_hand_id: "<arg:player.off_hand_item.id>"
    off_hand_count: "<arg:player.off_hand_item.count>"
    off_hand_custom_model_data: "<arg:player.off_hand_item.custom_model_data>"
    off_hand_is_custom: "<arg:player.off_hand_item.is_custom>"
  world:
    name: "<arg:player.world.name>"
    uuid: "<arg:player.world.uuid>"
    time: "<arg:player.world.time>"
  position:
    x: "<arg:player.position.x>"
    y: "<arg:player.position.y>"
    z: "<arg:player.position.z>"
    yaw: "<arg:player.position.yaw>"
    pitch: "<arg:player.position.pitch>"
    block_x: "<arg:player.position.block_x>"
    block_y: "<arg:player.position.block_y>"
    block_z: "<arg:player.position.block_z>"
    world_name: "<arg:player.position.world.name>"

