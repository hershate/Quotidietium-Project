# =============================================================================
# CraftEngine 物品更新器配置参考 (Item Updater Reference)
# 基于 CraftEngine Wiki: configuration/item/updater.md
# 风格: Oraxen 风格 — 每个更新器类型独立示例, 清晰注释, 开箱即用.
# =============================================================================
#
# === 目录 ===
#   1.  apply_data — 应用数据（更新物品名称/描述等）
#   2.  transmute — 材质置换（替换基础材质保留数据）
#   3.  reset — 重置（将物品更新至最新状态）
#   4.  多版本链式更新 — 多个版本号组合更新
#   5.  列表格式多更新器 — 同版本号下执行多个更新操作
#
# =============================================================================
# 使用说明:
#   - 在 config.yml 中启用 item.update-triggers 以触发更新检测
#   - 物品默认版本号为 0，插件会尝试将其更新至最新版本
#   - 只更新视觉元素 (custom_model_data/item_model/lore/name) 时，
#     优先考虑 client_bound_data 而非 updater 以减少性能开销
# =============================================================================

items:

  # ===========================================================================
  # 1. apply_data — 应用数据
  # ===========================================================================
  # 更新物品名称、描述(lore)、自定义模型数据等任意 CraftEngine 支持的物品数据。
  # 适用于首次上架或改名等需要修改物品元数据的场景。
  # ===========================================================================
  custom:updater_apply_data:
    material: diamond_sword
    updater:
      1:
        type: apply_data
        data:
          item_name: "<gradient:#FF6B6B:#FFE66D>烈焰之刃</gradient>"
          lore:
            - " "
            - "<gray>这把剑在熔火之心淬炼而成。</gray>"
            - "<red>🔥 攻击力: +8</red>"
          custom_model_data: 1001

  # ===========================================================================
  # 2. transmute — 材质置换
  # ===========================================================================
  # 将物品的基础材质替换为另一种材质，同时保留所有组件或 NBT 数据。
  # 常用于升级物品外观而不丢失附魔等数据。
  # ===========================================================================
  custom:updater_transmute:
    material: iron_sword
    data:
      enchantments:
        sharpness: 3
      unbreakable: true
    updater:
      1:
        type: transmute
        material: diamond_sword

  # ===========================================================================
  # 3. reset — 重置
  # ===========================================================================
  # 将存量物品立即更新至最新物品配置状态，同时保留指定组件或 NBT 标签。
  # keep_components: 适用于 Minecraft 1.20.5+（数据组件名称）
  # keep_tags: 适用于旧版本（NBT 标签名称）
  # ===========================================================================
  custom:updater_reset:
    material: netherite_chestplate
    data:
      enchantments:
        protection: 4
        unbreaking: 3
      trim:
        material: "minecraft:netherite"
        pattern: "minecraft:sentry"
    updater:
      1:
        type: reset
        # Minecraft 1.20.5+ 数据组件保留
        keep_components:
          - minecraft:enchantments
          - minecraft:trim
        # 旧版本 NBT 标签保留
        keep_tags:
          - Enchantments
          - Trim

  # ===========================================================================
  # 4. 多版本链式更新
  # ===========================================================================
  # 通过递增版本号实现多阶段物品更新。
  # 若物品版本为 0 -> 依次执行 1 和 2
  # 若物品版本为 1 -> 仅执行 2
  # 适用于物品经历多次调整的场景。
  # ===========================================================================
  custom:updater_chain:
    material: wooden_sword
    updater:
      # 版本 1: 初次更新 — 改名 + 材质升级
      1:
        type: apply_data
        data:
          item_name: "<yellow>训练之剑</yellow>"
          lore:
            - "<gray>新手冒险者的第一把剑</gray>"
      # 版本 2: 二次更新 — 材质置换 + 添加附魔数据
      2:
        type: transmute
        material: stone_sword

  # ===========================================================================
  # 5. 列表格式多更新器（同版本号下执行多个操作）
  # ===========================================================================
  # 同一版本号下可以通过列表格式同时应用多个更新器。
  # 按列表顺序依次执行，先 apply_data 再 transmute。
  # ===========================================================================
  custom:updater_multi:
    material: leather_chestplate
    updater:
      1:
        - type: apply_data
          data:
            item_name: "<aqua>冰霜链甲</aqua>"
            lore:
              - "<blue>❄ 蕴含极寒之力的护甲</blue>"
            dye:
              color: "#00BFFF"
            trim:
              material: "minecraft:diamond"
              pattern: "minecraft:wild"
            unbreakable: true
        - type: transmute
          material: iron_chestplate
        - type: reset
          keep_components:
            - minecraft:dyed_color
            - minecraft:trim
