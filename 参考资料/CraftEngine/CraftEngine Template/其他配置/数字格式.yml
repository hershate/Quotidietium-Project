# Wiki 源文件: CraftEngine Wiki/reference/number_format.md
# 数字格式配置模板 - 替换 namespace 和物品/技能 ID 后即可使用

namespace: custom

# ============================================================
# 常量 (Constant)
# ============================================================
example_constant:
  count:
    type: constant
    value: 1 # << CHANGE THIS

# ============================================================
# 均匀随机数 (Uniform)
# ============================================================
example_uniform:
  count:
    type: uniform
    min: 1  # << CHANGE THIS
    max: 3  # << CHANGE THIS

# ============================================================
# 表达式 (Expression)
# ============================================================
example_expression:
  count:
    type: expression
    expression: "20 + 70 / 2" # << CHANGE THIS

# ============================================================
# 二项分布 (Binomial)
# ============================================================
example_binomial:
  count:
    type: binomial
    extra: 10       # << CHANGE THIS - 独立伯努利试验次数
    probability: 0.2 # << CHANGE THIS - 单次试验成功概率

# ============================================================
# 高斯/正态分布 (Gaussian)
# ============================================================
example_gaussian:
  count:
    type: gaussian
    min: 10          # << CHANGE THIS - 最小值下限
    max: 20          # << CHANGE THIS - 最大值上限
    mean: 15         # << CHANGE THIS - 均值，默认为 (min+max)/2
    std_dev: 1       # << CHANGE THIS - 标准差，默认为 (max-min)/6
    max_attempts: 128 # << CHANGE THIS - 最大重试次数

# ============================================================
# 偏态分布 (Skew Normal)
# ============================================================
example_skew_normal:
  count:
    type: skew_normal
    min: 0           # << CHANGE THIS - 最小预期值
    max: 100         # << CHANGE THIS - 最大预期值
    mean: 50         # << CHANGE THIS - 期望，默认为 (min+max)/2
    std_dev: 10      # << CHANGE THIS - 标准差，默认为 (max-min)/6
    skewness: 0.5    # << CHANGE THIS - 偏度，范围 [-0.995, 0.995]，默认 0
    max_attempts: 128 # << CHANGE THIS - 最大重试次数

# ============================================================
# 对数正态分布 (Log Normal)
# ============================================================
example_log_normal:
  count:
    type: log_normal
    min: 1          # << CHANGE THIS - 最小预期值（必须 > 0）
    max: 1000       # << CHANGE THIS - 最大预期值

    # 方案一：直接提供真实平均值和标准差
    mean: 50        # << CHANGE THIS - 真实平均值
    std_dev: 20     # << CHANGE THIS - 真实标准差

    # 方案二（与方案一互斥，取消注释后使用）：
    # location: 3.5  # μ：自然对数平均值
    # scale: 0.5     # σ：自然对数标准差

    max_attempts: 128 # << CHANGE THIS - 最大重试次数

# ============================================================
# 三角分布 (Triangle)
# ============================================================
example_triangle:
  count:
    type: triangle
    min: 10   # << CHANGE THIS - 低限
    max: 100  # << CHANGE THIS - 上限
    mode: 30  # << CHANGE THIS - 众数（顶点），默认为 (min+max)/2

# ============================================================
# 贝塔分布 (Beta)
# ============================================================
example_beta:
  count:
    type: beta
    min: 0     # << CHANGE THIS - 最小预期值，默认 0.0
    max: 10    # << CHANGE THIS - 最大预期值，默认 1.0
    alpha: 5.0 # << CHANGE THIS - α 形状参数，默认 2.0
    beta: 2.0  # << CHANGE THIS - β 形状参数，默认 2.0

# ============================================================
# 加权列表 (Weighted)
# ============================================================
example_weighted:
  count:
    type: weighted
    weights:
      "10": 70  # << CHANGE THIS - 数值 10 的权重（约 70% 概率）
      "50": 25  # << CHANGE THIS - 数值 50 的权重（约 25% 概率）
      "200": 5  # << CHANGE THIS - 数值 200 的权重（约 5% 概率）

# ============================================================
# 指数分布 (Exponential)
# ============================================================
example_exponential:
  count:
    type: exponential
    min: 0     # << CHANGE THIS - 最小预期值，默认 0.0
    max: 60    # << CHANGE THIS - 最大预期值，默认双精度最大值
    mean: 10   # << CHANGE THIS - 平均间隔（均值 = 1/lambda）
    # 或用 lambda 替代 mean（取消注释后使用）：
    # lambda: 0.1  # 速率参数（单位时间内事件平均次数）
