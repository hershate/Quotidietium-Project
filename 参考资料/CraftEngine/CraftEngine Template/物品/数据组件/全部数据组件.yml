# =============================================================================
# CraftEngine 全部数据组件参考手册
# =============================================================================
# 基于 CraftEngine Wiki: configuration/item/data.md
# 涵盖所有硬编码数据组件、自定义数据组件 (NBT/Components)、
# 客户端侧数据 (client_bound_data) 以及外部插件兼容配置.
#
# 命名空间: custom (示例均使用 custom: 前缀)
# 风格: Oraxen 风格 — 每个组件独立示例, 清晰注释, 开箱即用.
# =============================================================================
#
# === 目录 ===
#   [硬编码数据 - 基础]
#   1.  item_name              物品名称
#   2.  custom_name            自定义名称
#   3.  lore                   物品提示框描述
#   4.  overwritable_lore      可覆写的提示框描述
#   5.  insert_lore            插入提示框描述行
#   6.  remove_lore            移除提示框描述行
#   7.  overwritable_item_name 可覆写的物品名称
#   8.  unbreakable            无法破坏
#   9.  enchantment            魔咒
#   10. dyed_color             染色颜色
#   11. custom_model_data      自定义模型数据
#   12. hide_tooltip           隐藏提示框
#   13. block_state            方块状态
#   14. attribute_modifiers    属性修饰符
#   15. food                   食物 (1.20.5+)
#   16. max_damage             最大耐久度 (1.20.5+)
#   17. damage                 当前耐久度损伤
#   18. jukebox_playable       唱片机播放 (1.21+)
#   19. item_model             物品模型 (1.21.2+)
#   20. tooltip_style          提示框样式 (1.21.2+)
#   21. use_remainder          使用后返还物品 (1.21.2+)
#   22. trim                   盔甲纹饰
#   23. equippable             可穿戴性 (1.21.2+)
#   24. pdc                    持久化数据容器
#   25. profile                玩家游戏档案 (头颅)
#   26. conditional            条件数据 (付费版)
#   27. painting_variant       画变种
#   28. charged_projectile     充能弹射物 (1.21+)
#   29. debug_stick            调试棒状态
#   [自定义数据]
#   30. nbt                    NBT 原始数据 (1.20-1.20.4)
#   31. components             原生组件 (1.20.5+)
#   32. remove_components      移除组件 (1.20.5+)
#   [外部插件兼容]
#   33. external               外部插件物品引用
#   [客户端侧数据]
#   34. client_bound_data      客户端侧数据 (付费版)
# =============================================================================

items:

  # ===========================================================================
  # 1. item_name — 物品名称
  # ===========================================================================
  # 控制物品的默认名称.
  # - 无法通过铁砧修改.
  # - 不在物品展示框中显示名称.
  # - 带有此组件的旗帜在充当地图标记时不显示名称.
  # - 控制等级永久最低, 会被其他影响名称的组件覆盖.
  # ===========================================================================
  custom:item_name_example:
    material: diamond
    data:
      item_name: "<!i><#FF8C00>炎阳之刃"

  # ===========================================================================
  # 2. custom_name — 自定义名称
  # ===========================================================================
  # 控制物品的自定义名称, 类似于在铁砧中设置的名称.
  # ===========================================================================
  custom:custom_name_example:
    material: diamond_sword
    data:
      custom_name: "<#FF4500>熔铸之刃"

  # ===========================================================================
  # 3. lore — 物品提示框中的描述信息
  # ===========================================================================
  # 控制物品提示框中所显示的描述信息.
  #
  # 基础用法: 字符串列表
  # 高级用法: 支持 priority (优先级)、split_lines (分割)、conditions (条件)
  # ===========================================================================
  custom:lore_basic_example:
    material: diamond
    data:
      lore:
        - "<!i><gray>一块稀有的红色钻石"
        - "<!i><yellow>传闻它在火山深处形成"

  # 高级用法 — 分段优先级、分割、条件
  custom:lore_advanced_example:
    material: diamond
    data:
      lore:
        # 段 1: 无优先级, 默认置于底部
        - content:
            - "<!i><gray>第一段描述"
            - "<!i><dark_gray>副描述文本"
        # 段 2: priority 2, 靠近顶部
        - content: "<!i><green>稀有品质"
          priority: 2
        # 段 3: priority 1, 位于最顶部
        - content: "<!i><gold><bold>传说之石"
          priority: 1
        # 段 4: 继承上一段的优先级
        - content: "<!i><gray>同样在最顶部区域"
        # 段 5: 自动换行
        - content: "<!i><red>第一行\n<!i><blue>换行后的第二行"
          split_lines: true
        # 段 6: 带权限条件
        - content: "<!i><light_purple>管理员专属标识"
          conditions:
            - type: permission
              permission: "custom.admin"

  # ===========================================================================
  # 4. overwritable_lore — 可覆写的物品提示框中的描述信息
  # ===========================================================================
  # 专为 client_bound_data 设计.
  # 仅在物品提示框中的描述信息为空时生效.
  # 优先显示其他插件设置的 lore，不会被此值覆盖.
  # 适用于商店插件等场景.
  # ===========================================================================
  custom:overwritable_lore_example:
    material: diamond
    client_bound_data:
      overwritable_lore:
        - "<!i><gray>此物品的描述可被其他插件覆写"
        - "<!i><yellow>若商店插件设置了描述则优先显示商店的描述"

  # ===========================================================================
  # 5. insert_lore — 插入物品提示框中的描述信息
  # ===========================================================================
  # 在现有的 lore 中动态插入新行.
  # 支持基于正则表达式的定位插入以及失败回退.
  # ===========================================================================
  custom:insert_lore_example:
    material: diamond_sword
    data:
      # 基础插入: 在匹配行之后插入
      insert_lore:
        position: AFTER
        pattern: "攻击伤害"
        lore:
          - content: "<green>额外: <yellow>+5 火焰伤害"
            priority: 1
        fallback:
          position: TAIL
          lore:
            - content: "<red>未找到目标行, 回退至尾部"

  # 插入到头部 / 尾部 (无需 pattern) — 支持列表形式
  custom:insert_lore_head_tail_example:
    material: diamond_sword
    data:
      insert_lore:
        - position: HEAD
          lore:
            - content: "<gold>=== 传奇武器 ==="
        - position: TAIL
          lore:
            - content: "<gold>=== 小心使用 ==="

  # ===========================================================================
  # 6. remove_lore — 移除物品提示框中的描述信息
  # ===========================================================================
  # 根据正则表达式从现有的 lore 中移除匹配的行.
  # ===========================================================================
  custom:remove_lore_example:
    material: diamond_sword
    data:
      remove_lore: "过期的描述文本"

  # 移除多行 (列表形式)
  custom:remove_lore_multi_example:
    material: diamond_sword
    data:
      remove_lore:
        - "攻击伤害"
        - "攻击速度"
        - "耐久度:.*"

  # ===========================================================================
  # 7. overwritable_item_name — 可覆写的物品名称
  # ===========================================================================
  # 类似于 overwritable_lore, 但专为 item_name 设计.
  # ===========================================================================
  custom:overwritable_item_name_example:
    material: diamond_sword
    client_bound_data:
      overwritable_item_name: "<#FF8C00>神秘之刃"

  # ===========================================================================
  # 8. unbreakable — 无法破坏
  # ===========================================================================
  # 控制物品是否无法被破坏 (不会消耗耐久度).
  # ===========================================================================
  custom:unbreakable_example:
    material: diamond_sword
    data:
      unbreakable: true

  # ===========================================================================
  # 9. enchantment — 魔咒
  # ===========================================================================
  # 控制物品存储的魔咒信息.
  # 当物品类型为附魔书时, 任何魔咒将自动转换为"无活性"魔咒.
  # ===========================================================================
  custom:enchantment_basic_example:
    material: diamond_sword
    data:
      enchantment:
        minecraft:sharpness: 5
        minecraft:fire_aspect: 2
        minecraft:unbreaking: 3
        custom:my_enchantment: 1

  # 带 merge 选项 — 与物品已有魔咒合并
  custom:enchantment_merge_example:
    material: diamond_sword
    data:
      enchantment:
        merge: true
        enchantments:
          minecraft:sharpness: 3
          minecraft:knockback: 1

  # ===========================================================================
  # 10. dyed_color — 所染颜色
  # ===========================================================================
  # 控制可染色物品 (皮革盔甲等) 存储的颜色值.
  # 格式: R,G,B (范围 0-255)
  # ===========================================================================
  custom:dyed_color_example:
    material: leather_chestplate
    data:
      dyed_color: "255,100,50"

  # 白色染色
  custom:dyed_color_white_example:
    material: leather_helmet
    data:
      dyed_color: "255,255,255"

  # ===========================================================================
  # 11. custom_model_data — 自定义模型数据
  # ===========================================================================
  # 注意: 在 data 中配置仅表示使用此组件本身.
  # 如需生成资源包文件, 请在物品顶级配置中设置.
  # 此处仅支持整数值 (向后兼容).
  # ===========================================================================
  custom:custom_model_data_example:
    material: diamond
    data:
      custom_model_data: 100

  # 生成资源包的写法 (在顶级而非 data 内)
  custom:custom_model_data_pack_example:
    material: diamond
    custom_model_data: 10001   # 顶级: 会生成对应的资源包文件
    data:
      item_name: "<!i><gray>测试模型物品"

  # ===========================================================================
  # 12. hide_tooltip — 隐藏物品提示框
  # ===========================================================================
  # 隐藏此物品上由指定组件提供的工具提示.
  # 原名 HideFlags (1.20.4 及以下).
  # ===========================================================================
  custom:hide_tooltip_example:
    material: diamond_sword
    data:
      hide_tooltip:
        - dye_color
        - enchantments
        - attribute_modifiers
        - unbreakable
        - can_break
        - can_place_on
        - trim
        - debug_stick_state
        - food
        - max_stack_size

  # ===========================================================================
  # 13. block_state — 方块状态
  # ===========================================================================
  # 控制方块物品放置时将应用的方块状态.
  # 未指定的属性使用默认值.
  # 对于高延迟玩家尤其有益, 能显著提升方块放置体验.
  # ===========================================================================
  # 方式一: 精细的原版方块属性键值对
  custom:block_state_keyvalue_example:
    material: note_block
    data:
      block_state:
        note: "1"
        powered: "false"
        instrument: "harp"

  # 方式二: 自动应用自定义方块状态定义的视觉属性
  custom:block_state_auto_example:
    material: oak_sapling
    data:
      block_state: "custom:palm_sapling[stage=0]"

  # 方式三: client_bound_data + client_bound_material (付费版)
  # 保持服务端原版物品机制, 同时优化客户端体验.
  custom:block_state_clientbound_example:
    material: nether_brick
    client_bound_material: mushroom_stem
    data:
      item_name: "<!i><i18n:item.custom_palm_planks>"
    client_bound_data:
      block_state: "custom:palm_planks"

  # ===========================================================================
  # 14. attribute_modifiers — 属性修饰符
  # ===========================================================================
  # 将属性修饰符应用于物品.
  # 可在旧版本上安全使用最新的属性名称, 插件会帮助转换.
  # ===========================================================================
  custom:attribute_modifiers_basic_example:
    material: diamond_sword
    data:
      attribute_modifiers:
        - type: attack_damage
          amount: 8.0
          operation: add_value        # add_value, add_multiplied_base, add_multiplied_total
          slot: mainhand
        - type: attack_speed
          amount: 0.5
          operation: add_multiplied_base
          slot: mainhand

  # 完整属性修饰符 — 带 id 和 display
  custom:attribute_modifiers_full_example:
    material: diamond_sword
    data:
      attribute_modifiers:
        - type: attack_damage
          amount: 10.0
          operation: add_value
          id: "custom:legendary_damage"
          slot: mainhand
          display:
            type: override
            value: "<yellow>攻击伤害 +10"

        - type: movement_speed
          amount: 0.05
          operation: add_multiplied_base
          id: "custom:speed_boost"
          slot: any
          display:
            type: override
            value: "<green>移动速度 +5%"

        - type: armor
          amount: 4.0
          operation: add_value
          id: "custom:bonus_armor"
          slot: chest
          display:
            type: override
            value: "<aqua>额外护甲 +4"

  # ===========================================================================
  # 15. food — 食物 (1.20.5+)
  # ===========================================================================
  # 设置物品的食物属性: 营养值、饱和度、是否可随时食用.
  # 旧版请使用 settings.food.
  # ===========================================================================
  custom:food_example:
    material: apple
    data:
      food:
        nutrition: 5
        saturation: 3.5
        can_always_eat: false

  # 可随时食用的特殊食物
  custom:food_always_eat_example:
    material: golden_apple
    data:
      food:
        nutrition: 8
        saturation: 12.0
        can_always_eat: true

  # ===========================================================================
  # 16. max_damage — 最大耐久度 (1.20.5+)
  # ===========================================================================
  # 存储物品的最大耐久度, 与 damage 组件一起控制物品能否被损坏.
  # 此组件不存在时, 若物品被损坏则游戏将最大耐久度视为 0.
  # ===========================================================================
  custom:max_damage_example:
    material: wooden_sword
    data:
      max_damage: 100

  # ===========================================================================
  # 17. damage — 当前耐久度损伤 (1.20.5+)
  # ===========================================================================
  # 与 max_damage 配合使用. damage 表示已经损失的耐久度.
  # 耐久度 = max_damage - damage (已损失)
  # ===========================================================================
  custom:damage_example:
    material: diamond_pickaxe
    data:
      max_damage: 1561
      damage: 500   # 显示为剩余约 2/3 耐久

  # ===========================================================================
  # 18. jukebox_playable — 插入唱片机所播放的音乐 (1.21+)
  # ===========================================================================
  # 控制物品存储的音乐信息, 以及是否能插进唱片机中播放.
  # ===========================================================================
  custom:jukebox_playable_example:
    material: stick
    data:
      jukebox_playable: "custom:my_custom_music"

  # ===========================================================================
  # 19. item_model — 物品模型 (1.21.2+)
  # ===========================================================================
  # 控制物品的物品模型映射.
  # 注意: 在 data 中配置仅表示使用此组件本身.
  # 如需生成资源包文件, 请在物品顶级配置中设置.
  # ===========================================================================
  custom:item_model_data_example:
    material: stick
    data:
      item_model: "custom:music_stick"

  # 生成资源包的写法 (在顶级)
  custom:item_model_pack_example:
    material: stick
    item_model: "custom:music_stick"   # 顶级: 会生成资源包文件
    data:
      item_name: "<!i><gray>音乐棒"

  # ===========================================================================
  # 20. tooltip_style — 物品提示框背景和边框样式 (1.21.2+)
  # ===========================================================================
  # 控制物品的提示框的外观.
  # 纹理须放置在 assets/<命名空间>/textures/gui/sprites/tooltip/ 下.
  # ===========================================================================
  custom:tooltip_style_example:
    material: diamond
    data:
      tooltip_style: "custom:legendary_tooltip"

  # ===========================================================================
  # 21. use_remainder — 使用后返还物品 (1.21.2+)
  # ===========================================================================
  # 物品使用后返还的另一物品.
  # ===========================================================================
  custom:use_remainder_example:
    material: cooked_chicken
    use_remainder: "custom:chicken_bone"

  # ===========================================================================
  # 22. trim — 盔甲纹饰
  # ===========================================================================
  # 存储物品的盔甲纹饰数据.
  # 提示框中会显示盔甲纹饰的名称.
  # pattern: 盔甲纹饰图案文件名 (不带 .json 后缀)
  # material: 盔甲纹饰材料文件名 (不带 .json 后缀)
  # ===========================================================================
  custom:trim_example:
    material: diamond_chestplate
    data:
      trim:
        pattern: eye
        material: iron

  # 高级盔甲纹饰
  custom:trim_advanced_example:
    material: netherite_chestplate
    data:
      trim:
        pattern: sentry
        material: diamond

  # ===========================================================================
  # 23. equippable — 可穿戴性 (1.21.2+)
  # ===========================================================================
  # 控制物品是否可被生物装备穿戴.
  # slot: head / chest / legs / feet / body / mainhand / offhand / saddle
  # ===========================================================================
  custom:equippable_helmet_example:
    material: diamond_helmet
    data:
      equippable:
        slot: head
        asset_id: "custom:my_helmet"
        dispensable: true
        damage_on_hurt: true
        swappable: true
        equip_on_interact: true

  # 自定义马铠 (鞍)
  custom:equippable_saddle_example:
    material: leather_horse_armor
    data:
      equippable:
        slot: saddle
        asset_id: "custom:my_saddle"
        camera_overlay: "custom:textures/overlay"

  # 可穿戴身体装备
  custom:equippable_body_example:
    material: diamond
    data:
      equippable:
        slot: body
        asset_id: "custom:body_armor"

  # ===========================================================================
  # 24. pdc — 持久化数据容器 (Persistent Data Container)
  # ===========================================================================
  # 在物品上存储自定义键值数据, 供其他插件 (如 PlaceholderAPI) 识别.
  # 支持: 字符串、数字、列表、映射.
  # ===========================================================================
  custom:pdc_example:
    material: diamond_sword
    data:
      pdc:
        custom:owner: "Zurker"
        custom:level: 99
        custom:rarity: "legendary"
        custom:soulbound: true
        custom:drops:
          - "custom:item_1"
          - "custom:item_2"
          - "custom:item_3"
        custom:stats:
          strength: 15
          agility: 8
          intelligence: 12

  # ===========================================================================
  # 25. profile — 玩家游戏档案信息 (头颅)
  # ===========================================================================
  # 用于显示玩家的头颅/头像.
  # 支持: 玩家名、纹理 URL、Base64 字符串.
  # ===========================================================================
  # 通过玩家名
  custom:profile_name_example:
    material: player_head
    data:
      profile: "XiaoMoMi"

  # 通过 PlaceholderAPI 占位符
  custom:profile_papi_example:
    material: player_head
    data:
      profile: "<arg:player.name>"

  # 通过纹理 URL
  custom:profile_url_example:
    material: player_head
    data:
      profile: "http://textures.minecraft.net/texture/ed83db5c2294f03bf069f4a2ac5428df93a13c7c7487d6b1f2ed3ce30b5acec8"

  # 通过 Base64 字符串
  custom:profile_base64_example:
    material: player_head
    data:
      profile: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWQ4M2RiNWMyMjk0ZjAzYmYwNjlmNGEyYWM1NDI4ZGY5M2ExM2M3Yzc0ODdkNmIxZjJlZDNjZTMwYjVhY2VjOCJ9fX0="

  # ===========================================================================
  # 26. conditional — 条件数据 (付费版)
  # ===========================================================================
  # 根据条件动态切换物品数据.
  # 适用于根据权限、变量等显示不同名称/描述的物品.
  # ===========================================================================
  custom:conditional_example:
    material: diamond_sword
    client_bound_data:
      conditional#1:
        conditions:
          - type: permission
            permission: "custom.item.unlock"
        data:
          item_name: "<gold>神话之剑"
          lore:
            - "<!i><gray>由星辰打造而来"
            - "<!i><yellow>你被选中挥舞此剑"
      conditional#2:
        conditions:
          - type: "!permission"
            permission: "custom.item.unlock"
        data:
          item_name: "<dark_gray>??? 之剑"
          lore:
            - "<!i><dark_gray>????????"

  # ===========================================================================
  # 27. painting_variant — 画变种
  # ===========================================================================
  # 指定物品放置后显示的画作变种.
  # ===========================================================================
  custom:painting_variant_example:
    material: painting
    data:
      painting_variant: "custom:painting_dragon"

  # ===========================================================================
  # 28. charged_projectile — 充能弹射物 (1.21+)
  # ===========================================================================
  # 控制物品作为弩箭/风弹等弹射物时的充能行为.
  # ===========================================================================
  custom:charged_projectile_example:
    material: firework_rocket
    data:
      charged_projectile:
        item:
          minecraft:firework_rocket: {}

  # ===========================================================================
  # 29. debug_stick — 调试棒状态
  # ===========================================================================
  # 控制调试棒存储的方块状态修改信息.
  # ===========================================================================
  custom:debug_stick_example:
    material: debug_stick
    data:
      debug_stick:
        minecraft:note_block:
          note: "instrument"
        minecraft:oak_fence_gate:
          facing: "open"

  # ===========================================================================
  # ===========================================================================
  # 自定义数据部分
  # ===========================================================================
  # ===========================================================================

  # ===========================================================================
  # 30. nbt — NBT 原始数据 (1.20-1.20.4)
  # ===========================================================================
  # 使用原版 NBT 格式, 不做格式转换.
  # 注意: NBT 已过时, 仅用于旧版兼容.
  # ===========================================================================
  custom:nbt_example:
    material: diamond
    data:
      nbt:
        CustomModelData: 1000
        HideFlags: 1
        display:
          Name: '{"text":"测试物品"}'

  # ===========================================================================
  # 31. components — 原生组件 (1.20.5+)
  # ===========================================================================
  # 严格遵循 Minecraft Wiki 数据组件规范.
  # 格式: minecraft:<组件名>: <值>
  # 当组件只需存在而无需赋值时使用 {}.
  # ===========================================================================

  # [★] max_damage — 接受整数 (I)
  custom:components_max_damage_example:
    material: diamond_pickaxe
    data:
      components:
        minecraft:max_damage: 128

  # [★★] food — 接受复合对象 (nutrition/saturation/can_always_eat)
  custom:components_food_example:
    material: apple
    data:
      components:
        minecraft:food:
          nutrition: 4
          saturation: 2.0
          can_always_eat: false

  # [★★] block_state — 接受键值对, 值必须为字符串
  custom:components_block_state_example:
    material: oak_leaves
    data:
      components:
        minecraft:block_state:
          distance: "1"
          persistent: "false"
          waterlogged: "false"

  # [★★★] instrument — 支持字符串 (ID) 或复合对象 (自定义)
  custom:components_instrument_id_example:
    material: goat_horn
    data:
      components:
        minecraft:instrument: "seek_goat_horn"

  custom:components_instrument_custom_example:
    material: goat_horn
    data:
      components:
        minecraft:instrument:
          description:
            text: "自定义号角"
            color: "red"
          sound_event: "minecraft:block.note_block.bell"
          use_duration: 1
          range: 16

  # [★★★★] fireworks — 烟花火箭
  custom:components_fireworks_example:
    material: firework_rocket
    data:
      components:
        minecraft:fireworks:
          flight_duration: 3
          explosions:
            - shape: small_ball
              colors: [16711680]      # 十进制 RGB
              fade_colors: [16776960]
              has_trail: true
              has_twinkle: true

  # 组件仅需存在 — 使用 {} 空对象
  custom:components_empty_example:
    material: diamond_sword
    data:
      components:
        minecraft:unbreakable: {}

  # ===========================================================================
  # 32. remove_components — 移除组件 (1.20.5+)
  # ===========================================================================
  # 去除物品上已存在的原生组件.
  # ===========================================================================
  custom:remove_components_example:
    material: diamond_chestplate
    data:
      remove_components:
        - "minecraft:equippable"
        - "minecraft:trim"
        - "minecraft:dyed_color"

  # ===========================================================================
  # ===========================================================================
  # 外部插件兼容
  # ===========================================================================
  # ===========================================================================

  # ===========================================================================
  # 33. external — 外部插件物品引用
  # ===========================================================================
  # 引用其他插件的物品数据, CraftEngine 将保留原物品的数据.
  # ===========================================================================
  # 通过插件名 + ID
  custom:external_neigeitems_example:
    data:
      external:
        plugin: neigeitems
        id: "example_item"

  # 通过命名空间 ID
  custom:external_namespace_example:
    data:
      external:
        id: "test_namespace:test/my_path"

  # 带类型的插件 (如 MMOItems)
  custom:external_mmoitems_example:
    data:
      external:
        id: "MATERIAL:IRON_INGOT"

  # ===========================================================================
  # ===========================================================================
  # 客户端侧数据 (付费版)
  # ===========================================================================
  # ===========================================================================

  # ===========================================================================
  # 34. client_bound_data — 客户端侧数据 (付费版)
  # ===========================================================================
  # 仅存在于客户端侧, 不涉及任何服务端侧数据.
  # 可实时更新提示框信息, 包括 item_model 和 custom_model_data.
  # 在创造模式下不会被摸坏.
  # ===========================================================================
  # 基础: 客户端侧名称 (与 data 共存)
  custom:client_bound_data_basic_example:
    material: diamond_sword
    client_bound_data:
      item_name: "<!i><#FF8C00>客户端显示名称"
    data:
      item_name: "<!i><#FF8C00>服务端显示名称"

  # 客户端侧模型 + 方块破坏标签
  custom:client_bound_data_pickaxe_example:
    material: golden_pickaxe
    settings:
      tags:
        - "custom:topaz_tools"
    data:
      components:
        minecraft:max_damage: 64
        can_break:
          blocks: "#mineable/pickaxe"
    client_bound_data:
      components:
        can_break:
          blocks: "minecraft:mushroom_stem"
    model:
      template: "default:model/simplified_handheld"
      arguments:
        path: "minecraft:item/custom/topaz_pickaxe"

  # 客户端侧 overwritable_lore — 商店插件友好
  custom:client_bound_data_shop_example:
    material: diamond
    client_bound_data:
      overwritable_lore:
        - "<!i><gray>商店商品 — 购买前请检查详情"
      overwritable_item_name: "<#FF8C00>待售宝石"

  # ===========================================================================
  # ===========================================================================
  # 附录: 快速参考 — 组件速查表
  # ===========================================================================
  # ===========================================================================
  #
  # 组件名称               | 版本要求      | 类型          | 说明
  # ---------------------------------------------------------------------------
  # item_name              | 1.20.5+      | 硬编码        | 物品名称 (最低优先级)
  # custom_name            | 1.20.5+      | 硬编码        | 自定义名称
  # lore                   | 全部版本     | 硬编码        | 提示框描述
  # overwritable_lore      | 全部版本     | 硬编码        | 可覆写的提示框描述
  # insert_lore            | 全部版本     | 硬编码        | 动态插入提示框行
  # remove_lore            | 全部版本     | 硬编码        | 移除提示框行
  # overwritable_item_name | 全部版本     | 硬编码        | 可覆写的物品名称
  # unbreakable            | 全部版本     | 硬编码        | 无法破坏
  # enchantment            | 全部版本     | 硬编码        | 魔咒
  # dyed_color             | 全部版本     | 硬编码        | 染色颜色
  # custom_model_data      | 全部版本     | 硬编码        | 自定义模型数据 (整数)
  # hide_tooltip           | 全部版本     | 硬编码        | 隐藏提示框组件
  # block_state            | 全部版本     | 硬编码        | 方块状态
  # attribute_modifiers    | 全部版本     | 硬编码        | 属性修饰符
  # food                   | 1.20.5+      | 硬编码        | 食物属性
  # max_damage             | 1.20.5+      | 硬编码        | 最大耐久度
  # damage                 | 1.20.5+      | 硬编码        | 耐久度损伤
  # jukebox_playable       | 1.21+        | 硬编码        | 唱片机播放
  # item_model             | 1.21.2+      | 硬编码        | 物品模型
  # tooltip_style          | 1.21.2+      | 硬编码        | 提示框样式
  # use_remainder          | 1.21.2+      | 硬编码        | 使用后返还
  # trim                   | 全部版本     | 硬编码        | 盔甲纹饰
  # equippable             | 1.21.2+      | 硬编码        | 可穿戴性
  # pdc                    | 全部版本     | 硬编码        | 持久化数据容器
  # profile                | 全部版本     | 硬编码        | 玩家档案 (头颅)
  # conditional            | 付费版       | 硬编码        | 条件数据
  # painting_variant       | 全部版本     | 硬编码        | 画变种
  # charged_projectile     | 1.21+        | 硬编码        | 充能弹射物
  # debug_stick            | 全部版本     | 硬编码        | 调试棒状态
  # nbt                    | 1.20-1.20.4  | 自定义数据     | NBT 原始标签
  # components             | 1.20.5+      | 自定义数据     | 原生组件
  # remove_components      | 1.20.5+      | 自定义数据     | 移除组件
  # external               | 全部版本     | 外部兼容       | 外部插件引用
  # client_bound_data      | 付费版       | 客户端侧       | 客户端专属数据
