# =============================================================================
# CraftEngine 物品数据组件 - 完整模板参考
# 本地 Wiki 路径: 参考资料/CraftEngine/CraftEngine Wiki/configuration/item/data.md
#
# 每个数据组件均有独立的 items: 配置块, 修改命名空间和物品 ID 后即可使用。
# 命名空间示例: "custom"。所有需自定义的值均标有 # << CHANGE THIS。
# =============================================================================

# =============================================================================
# 1. item_name (物品名称)
# 控制物品的默认名称。无法通过铁砧修改,不能在物品展示框中显示名称,
# 带有该组件的旗帜在充当地图标记时也不会显示名称。
# 此组件对物品名称的控制等级永远最低,会被其他所有影响物品名称的组件覆盖。
# =============================================================================
items:
  custom:example_item_name:
    data:
      item_name: "<!i><#FF8C00>黄玉钓竿" # << CHANGE THIS

# =============================================================================
# 2. custom_name (自定义名称)
# 控制物品的自定义名称,类似于在铁砧中设置的名称。
# =============================================================================
items:
  custom:example_custom_name:
    data:
      custom_name: "<!i><#FF8C00>黄玉钓竿" # << CHANGE THIS

# =============================================================================
# 3. lore (物品提示框中的描述信息)
# 控制物品提示框中所显示的描述信息。
# =============================================================================
items:
  custom:example_lore:
    data:
      lore:
        - "我去这鱼竿直接把我24K狗眼闪瞎了" # << CHANGE THIS

# =============================================================================
# 4. lore - 高级格式 (分段优先级、自动分割、条件)
# priority 决定文本段的最终显示位置,数值越低越靠近顶部。
# split_lines: true 时 \n 会被分割为多行。
# conditions 支持按权限等条件控制显示。
# =============================================================================
items:
  custom:example_lore_advanced:
    data:
      lore:
        - content:
            - "hello"
            - 123456
        - content: "优先级 2" # << CHANGE THIS
          priority: 2
        - content: "优先级 1" # << CHANGE THIS
          priority: 1
        - content: "此行继承上一行的优先级"
        - content: "分割\n此行文本" # << CHANGE THIS
          split_lines: true
          conditions:
            - type: permission
              permission: craftengine.admin # << CHANGE THIS

# =============================================================================
# 5. overwritable_lore (可覆写的物品提示框中的描述信息)
# 专为 client_bound_data 设计。仅在物品提示框中的描述信息为空时才会生效。
# 会优先显示其他插件设置的 lore(例如商店插件展示售卖物品时不会覆盖商店的 lore)。
# =============================================================================
items:
  custom:example_overwritable_lore:
    client_bound_data:
      overwritable_lore:
        - "我去这鱼竿直接把我24K狗眼闪瞎了" # << CHANGE THIS

# =============================================================================
# 6. insert_lore (插入物品提示框中的描述信息)
# 在现有 lore 中动态插入新行。支持基于正则表达式的定位插入及失败回退。
# position: HEAD / TAIL / BEFORE / AFTER (HEAD 和 TAIL 不需要 pattern)
# =============================================================================
items:
  custom:example_insert_lore:
    data:
      insert_lore:
        position: AFTER # << CHANGE THIS (HEAD / TAIL / BEFORE / AFTER)
        pattern: "匹配此行" # << CHANGE THIS (仅 BEFORE / AFTER 时需要)
        lore:
          - content: "<green>插入的行" # << CHANGE THIS
            priority: 1
        fallback:
          position: TAIL # << CHANGE THIS
          lore:
            - content: "<red>回退到尾部" # << CHANGE THIS

# =============================================================================
# 7. remove_lore (移除物品提示框中的描述信息)
# 根据正则表达式从现有 lore 中移除匹配的行。
# =============================================================================
items:
  custom:example_remove_lore:
    data:
      remove_lore: "删除此行" # << CHANGE THIS (正则表达式)

# =============================================================================
# 8. overwritable_item_name (可覆写的物品名称)
# 类似于 overwritable_lore,但专为 item_name 设计。位于 client_bound_data 中。
# =============================================================================
items:
  custom:example_overwritable_item_name:
    client_bound_data:
      overwritable_item_name: "<#FF8C00>黄玉钓竿" # << CHANGE THIS

# =============================================================================
# 9. unbreakable (无法破坏)
# 控制物品是否无法被破坏。
# =============================================================================
items:
  custom:example_unbreakable:
    data:
      unbreakable: true # << CHANGE THIS

# =============================================================================
# 10. enchantment (魔咒)
# 控制物品存储的魔咒信息。当物品类型为附魔书时,魔咒将自动转换为"无活性"魔咒。
# =============================================================================
items:
  custom:example_enchantment:
    data:
      enchantment:
        minecraft:sharpness: 1  # << CHANGE THIS
        custom:enchant: 3       # << CHANGE THIS

# =============================================================================
# 11. enchantment - 带 merge 选项
# merge: true 时,魔咒将与物品已有的魔咒合并,对配方的结果后处理器很有用。
# =============================================================================
items:
  custom:example_enchantment_merge:
    data:
      enchantment:
        merge: true # << CHANGE THIS
        enchantments:
          minecraft:sharpness: 1 # << CHANGE THIS
          custom:enchant: 3      # << CHANGE THIS

# =============================================================================
# 12. dyed_color (所染颜色)
# 控制物品存储的颜色值(RGB)。
# =============================================================================
items:
  custom:example_dyed_color:
    data:
      dyed_color: 255,255,255 # << CHANGE THIS

# =============================================================================
# 13. custom_model_data (自定义模型数据)
# 在 data 中设置仅表示使用该组件本身。
# 如需生成对应的资源包文件,请在物品根层级设置 custom_model_data。
# 此处仅支持整数值。如需使用较新版本的功能,请用 components 代替。
# =============================================================================
items:
  custom:example_custom_model_data:
    data:
      custom_model_data: 100 # << CHANGE THIS

# =============================================================================
# 14. hide_tooltip (隐藏物品提示框)
# 隐藏此物品上由指定 components 提供的任何工具提示。(原名 HideFlags)
# =============================================================================
items:
  custom:example_hide_tooltip:
    data:
      hide_tooltip:
        - dyed_color          # << CHANGE THIS
        - enchantments        # << CHANGE THIS
        - attribute_modifiers # << CHANGE THIS

# =============================================================================
# 15. block_state (方块状态) - 精细格式
# 控制方块物品被放置时将应用于方块的方块状态。
# 未指定的属性使用默认值。材质必须与目标方块外观匹配。
# 对高延迟玩家尤其有益,能显著提升方块放置体验。
# =============================================================================
items:
  custom:example_block_state:
    material: note_block # << CHANGE THIS
    data:
      block_state:
        note: "1"          # << CHANGE THIS
        powered: "false"   # << CHANGE THIS
        instrument: "harp" # << CHANGE THIS

# =============================================================================
# 16. block_state (方块状态) - 自动应用格式
# 自动应用自定义方块状态定义的视觉属性。
# =============================================================================
items:
  custom:example_block_state_auto:
    material: oak_sapling # << CHANGE THIS
    data:
      block_state: custom:palm_sapling[stage=0] # << CHANGE THIS

# =============================================================================
# 17. attribute_modifiers (属性修饰符)
# 将属性修饰符应用于物品。可在旧版本上安全使用最新的属性名称。
# operation: add_value / add_multiplied_base / add_multiplied_total
# slot: any / hand / armor / mainhand / offhand / head / chest / legs / feet / body / saddle
# =============================================================================
items:
  custom:example_attribute_modifiers:
    data:
      attribute_modifiers:
        - type: attack_speed  # << CHANGE THIS
          amount: 1.0         # << CHANGE THIS
          operation: add_value # << CHANGE THIS
          id: custom:custom_attribute # << CHANGE THIS (可选)
          slot: any # << CHANGE THIS
          display: # 1.21.5+, 可选
            type: override
            value: "<yellow>攻击速度 +1" # << CHANGE THIS

# =============================================================================
# 18. food (食物) (1.20.5+)
# 控制物品的食物属性。旧版 Minecraft 请使用 settings 中的 food。
# =============================================================================
items:
  custom:example_food:
    material: apple # << CHANGE THIS
    data:
      food:
        nutrition: 5    # << CHANGE THIS
        saturation: 3.5 # << CHANGE THIS
        can_always_eat: false # << CHANGE THIS

# =============================================================================
# 19. max_damage (最大耐久度) (1.20.5+)
# 与 damage 组件一起控制物品能否被损坏。
# 此组件不存在时若物品被损坏,游戏将最大耐久度视为 0。
# =============================================================================
items:
  custom:example_max_damage:
    material: wooden_sword # << CHANGE THIS
    data:
      max_damage: 100 # << CHANGE THIS

# =============================================================================
# 20. damage (当前耐久度损伤) (1.20.5+)
# 表示物品已经损失的耐久度值。与 max_damage 配合使用。
# 当前耐久度 = max_damage - damage。
# 注意: 此组件在 wiki 文档的 max_damage 章节上下文中提及,非独立章节。
# =============================================================================
items:
  custom:example_damage:
    material: diamond_pickaxe # << CHANGE THIS
    data:
      max_damage: 1561 # << CHANGE THIS
      damage: 500      # << CHANGE THIS (已损失耐久度)

# =============================================================================
# 21. jukebox_playable (插入唱片机所播放的音乐) (1.21+)
# 控制物品存储的音乐信息,以及是否能插进唱片机中播放。
# =============================================================================
items:
  custom:example_jukebox_playable:
    material: stick # << CHANGE THIS
    data:
      jukebox_playable: custom:credits_music # << CHANGE THIS

# =============================================================================
# 22. item_model (物品模型) (1.21.2+)
# 控制物品的物品模型映射。在 data 中设置仅表示使用该组件本身。
# 如需生成对应的资源包文件,请在物品根层级设置 item_model。
# =============================================================================
items:
  custom:example_item_model:
    data:
      item_model: custom:music_stick # << CHANGE THIS

# =============================================================================
# 23. tooltip_style (物品提示框背景和边框样式) (1.21.2+)
# 控制物品的提示框外观。纹理需放置在 assets/<命名空间>/textures/gui/sprites/tooltip/ 下。
# =============================================================================
items:
  custom:example_tooltip_style:
    data:
      tooltip_style: minecraft:topaz # << CHANGE THIS

# =============================================================================
# 24. use_remainder (使用后返还物品) (1.21.2+)
# 注意: use_remainder 位于物品根层级,不在 data 下。
# =============================================================================
items:
  custom:example_use_remainder:
    use_remainder: custom:chicken_bone # << CHANGE THIS

# =============================================================================
# 25. trim (盔甲纹饰)
# 控制物品存储的盔甲纹饰数据。提示框中会显示盔甲纹饰的名称。
# pattern/material 对应 trim_pattern/trim_material 注册表文件名(不含 .json 后缀)。
# =============================================================================
items:
  custom:example_trim:
    data:
      trim:
        pattern: eye   # << CHANGE THIS
        material: iron # << CHANGE THIS

# =============================================================================
# 26. equippable (可穿戴性) (1.21.2+)
# 控制物品是否可被生物装备穿戴。
# slot: head / chest / legs / feet / body / mainhand / offhand / saddle
# =============================================================================
items:
  custom:example_equippable:
    data:
      equippable:
        slot: head           # << CHANGE THIS
        asset_id: minecraft:topaz # << CHANGE THIS (可选)
        camera_overlay: "命名空间:路径" # << CHANGE THIS (可选)
        dispensable: true    # << CHANGE THIS (可选)
        damage_on_hurt: true # << CHANGE THIS (可选)
        swappable: true      # << CHANGE THIS (可选)
        equip_on_interact: true # << CHANGE THIS (可选, 1.21.5+)

# =============================================================================
# 27. pdc (持久化数据容器)
# 在物品上存储自定义键值数据,供其他插件识别。
# 支持字符串、数字、列表、映射。
# =============================================================================
items:
  custom:example_pdc:
    data:
      pdc:
        key1: string_value   # << CHANGE THIS
        key2: 114514         # << CHANGE THIS
        example_list:        # << CHANGE THIS
          - 1
          - 2
          - 3
        map_example:         # << CHANGE THIS
          key: "value"

# =============================================================================
# 28. profile (玩家游戏档案信息)
# 用于显示玩家头像。支持玩家名、纹理 URL、Base64 字符串三种方式。
# =============================================================================
items:
  custom:example_profile_by_name:
    data:
      profile: XiaoMoMi # << CHANGE THIS

items:
  custom:example_profile_by_url:
    data:
      profile: "http://textures.minecraft.net/texture/ed83db5c2294f03bf069f4a2ac5428df93a13c7c7487d6b1f2ed3ce30b5acec8" # << CHANGE THIS

items:
  custom:example_profile_by_base64:
    data:
      profile: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWQ4M2RiNWMyMjk0ZjAzYmYwNjlmNGEyYWM1NDI4ZGY5M2ExM2M3Yzc0ODdkNmIxZjJlZDNjZTMwYjVhY2VjOCJ9fX0=" # << CHANGE THIS

# =============================================================================
# 29. conditional (条件数据) [付费版专属]
# 根据条件动态切换物品显示数据(名称、描述等)。
# =============================================================================
items:
  custom:example_conditional:
    client_bound_data:
      conditional#1:
        conditions:
          - type: permission
            permission: item.unlock # << CHANGE THIS
        data:
          item_name: "神话剑" # << CHANGE THIS
          lore:
            - "由星辰打造而来" # << CHANGE THIS
      conditional#2:
        conditions:
          - type: "!permission"
            permission: item.unlock # << CHANGE THIS
        data:
          item_name: "????剑" # << CHANGE THIS
          lore:
            - "????????" # << CHANGE THIS

# =============================================================================
# 30. painting_variant (画变种)
# =============================================================================
items:
  custom:example_painting_variant:
    data:
      painting_variant: custom:painting_custom # << CHANGE THIS

# =============================================================================
# 31. external (外部插件兼容)
# 使 CraftEngine 物品保留外部插件物品的数据。
# =============================================================================
items:
  custom:example_external:
    data:
      external:
        plugin: neigeitems # << CHANGE THIS
        id: example_item   # << CHANGE THIS

# 对使用命名空间 ID 的插件
items:
  custom:example_external_namespace_id:
    data:
      external:
        id: "test_namespace:test/my_path" # << CHANGE THIS

# 对包含类型的插件(如 MMOItems),使用冒号分隔类型与标识符
items:
  custom:example_external_typed:
    data:
      external:
        id: "MATERIAL:IRON_INGOT" # << CHANGE THIS

# =============================================================================
# 32. NBT (自定义 NBT 数据) (1.20-1.20.4)
# 注意: NBT 格式已过时,此处仅作参考。格式遵循 Minecraft Wiki 物品格式。
# =============================================================================
items:
  custom:example_nbt:
    data:
      nbt:
        CustomModelData: 1000 # << CHANGE THIS

# =============================================================================
# 33. components (自定义组件) (1.20.5+)
# 严格遵循 Minecraft Wiki 数据组件规范。格式与游戏原生数据组件完全一致。
# =============================================================================

# --- max_damage [接受整数 I] ---
items:
  custom:example_components_max_damage:
    data:
      components:
        minecraft:max_damage: 128 # << CHANGE THIS

# --- food [复合对象: nutrition(整数)/saturation(浮点数)/can_always_eat(布尔值)] ---
items:
  custom:example_components_food:
    data:
      components:
        minecraft:food:
          nutrition: 4    # << CHANGE THIS
          saturation: 2.0 # << CHANGE THIS
          can_always_eat: false # << CHANGE THIS

# --- block_state [字符串键值对,值必须是字符串类型] ---
items:
  custom:example_components_block_state:
    data:
      components:
        minecraft:block_state:
          distance: '1'       # << CHANGE THIS
          persistent: 'false' # << CHANGE THIS
          waterlogged: 'false' # << CHANGE THIS

# --- instrument [支持简单字符串 ID 或完整复合对象] ---
items:
  custom:example_components_instrument_simple:
    material: goat_horn # << CHANGE THIS
    data:
      components:
        minecraft:instrument: "seek_goat_horn" # << CHANGE THIS

items:
  custom:example_components_instrument_complex:
    material: goat_horn # << CHANGE THIS
    data:
      components:
        minecraft:instrument:
          description:
            text: "自定义乐器" # << CHANGE THIS
            color: "red"       # << CHANGE THIS
          sound_event: minecraft:block.note_block.bell # << CHANGE THIS
          use_duration: 1 # << CHANGE THIS
          range: 16       # << CHANGE THIS

# --- fireworks [复杂嵌套: flight_duration + explosions 列表] ---
items:
  custom:example_components_fireworks:
    material: firework_rocket # << CHANGE THIS
    data:
      components:
        minecraft:fireworks:
          flight_duration: 3 # << CHANGE THIS
          explosions:
            - shape: small_ball # << CHANGE THIS
              colors: [11223344]  # << CHANGE THIS
              fade_colors: [0]    # << CHANGE THIS
              has_trail: true     # << CHANGE THIS
              has_twinkle: true   # << CHANGE THIS

# --- 仅需存在无需赋值的组件,使用 {} ---
items:
  custom:example_components_empty:
    data:
      components:
        minecraft:unbreakable: {} # << CHANGE THIS

# =============================================================================
# 34. remove_components (移除组件) (1.20.5+)
# 去除物品上已存在的原生组件。
# =============================================================================
items:
  custom:example_remove_components:
    data:
      remove_components:
        - minecraft:equippable # << CHANGE THIS

# =============================================================================
# 35. client_bound_data (客户端侧数据) [付费版专属]
# 仅存在于客户端侧,不涉及任何服务端侧数据。
# 可实时更新提示框信息,包括 item_model 和 custom_model_data。
# 在创造模式下不会被摸坏。
# =============================================================================
items:
  custom:example_client_bound_data_basic:
    client_bound_data:
      item_name: "<!i><#FF8C00>骗你的我不是黄玉钓竿" # << CHANGE THIS
    data:
      item_name: "<!i><#FF8C00>黄玉钓竿" # << CHANGE THIS

# =============================================================================
# 36. client_bound_data + components (客户端侧自定义组件)
# 在冒险模式中,允许玩家在服务端破坏某些自定义方块。
# 服务端侧和客户端侧可以有不同的 can_break 配置。
# =============================================================================
items:
  custom:example_client_bound_data_components:
    material: golden_pickaxe # << CHANGE THIS
    settings:
      tags:
        - "custom:topaz_tools" # << CHANGE THIS
    data:
      components:
        minecraft:max_damage: 64 # << CHANGE THIS
        can_break:
          blocks: "#mineable/pickaxe" # << CHANGE THIS
    client_bound_data:
      components:
        can_break:
          blocks: minecraft:mushroom_stem # << CHANGE THIS
    model:
      template: default:model/simplified_handheld
      arguments:
        path: "minecraft:item/custom/topaz_pickaxe" # << CHANGE THIS
