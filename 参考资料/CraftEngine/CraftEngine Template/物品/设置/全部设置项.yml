# ============================================================
# 教程文档路径: CraftEngine Wiki/configuration/item/settings.md
# 说明: 完整物品配置示例。将 custom 替换为你的命名空间。
#       修改示例 ID 及标记 # << CHANGE THIS 的值。
# ============================================================

# ============================================================
# fuel_time（烧炼时间）
# ============================================================
custom:example_fuel:
  settings:
    fuel_time: 100 # << CHANGE THIS 燃烧时长（单位：刻，20刻=1秒）

# ============================================================
# tags（标签）
# ============================================================
custom:example_tagged:
  settings:
    tags:
      - "custom:example_logs"         # << CHANGE THIS
      - "minecraft:logs"              # << CHANGE THIS
      - "minecraft:logs_that_burn"    # << CHANGE THIS

# ============================================================
# equipment（装备）
# ============================================================
custom:example_helmet:
  settings:
    equipment:
      asset_id: custom:topaz                     # << CHANGE THIS
      client_bound_model: true
      slot: head                                   # << CHANGE THIS head/chest/legs/feet/body/saddle
      camera_overlay: custom:textures/models/armor/example # << CHANGE THIS
      dispensable: true
      damage_on_hurt: true
      swappable: true
      equip_on_interact: true

# ============================================================
# repairable（可修复）
# ============================================================
custom:example_repairable:
  settings:
    repairable: true # << CHANGE THIS

custom:example_repairable_detailed:
  settings:
    repairable:
      crafting_table: true   # << CHANGE THIS
      anvil_repair: false    # << CHANGE THIS
      anvil_combine: true    # << CHANGE THIS

# ============================================================
# anvil_repair_item（铁砧材料修复）
# ============================================================
custom:example_anvil_repair:
  settings:
    anvil_repair_item:
      - target: "#custom:example_tools" # << CHANGE THIS
        amount: 20                       # << CHANGE THIS 恢复耐久度（固定值）
      - target:
          - "minecraft:iron_pickaxe"     # << CHANGE THIS
          - "minecraft:shears"           # << CHANGE THIS
        percent: 0.25                    # << CHANGE THIS 恢复百分比（0.25=25%）

# ============================================================
# renameable（可重命名）
# ============================================================
custom:example_renameable:
  settings:
    renameable: false # << CHANGE THIS

# ============================================================
# allowed_projectiles（可装载的弹射物）
# ============================================================
custom:example_crossbow:
  settings:
    allowed_projectiles:
      - "custom:gun_ammo"       # << CHANGE THIS
      - "minecraft:ender_pearl" # << CHANGE THIS

# ============================================================
# projectile（弹射物）
# ============================================================
custom:example_projectile:
  settings:
    projectile:
      display:
        item: custom:topaz_trident     # << CHANGE THIS
        translation: 0,0,0
        rotation: 1,1,1,1
        display_transform: NONE
        scale: 0.5
      sounds:
        throw: minecraft:item.trident.throw        # << CHANGE THIS
        hit_entity: minecraft:item.trident.hit      # << CHANGE THIS
        hit_block: minecraft:item.trident.hit_ground # << CHANGE THIS
      ignore_infinity_enchantment: false
      pickupable: true
      remove_on_hit: false
      gravity: true
      velocity: 1.0      # << CHANGE THIS
      damage: 10.0       # << CHANGE THIS
      pierce_level: 5    # << CHANGE THIS

# ============================================================
# dyeable（可染色）
# ============================================================
custom:example_dyeable:
  settings:
    dyeable: true # << CHANGE THIS

# ============================================================
# enchantable（可附魔）
# ============================================================
custom:example_enchantable:
  settings:
    enchantable: false # << CHANGE THIS

# ============================================================
# compost_probability（堆肥成功率）
# ============================================================
custom:example_compost:
  settings:
    compost_probability: 0.5 # << CHANGE THIS 0.0~1.0

# ============================================================
# respect_repairable_component（尊重 repairable 组件）
# ============================================================
custom:example_respect_repair:
  settings:
    respect_repairable_component: true # << CHANGE THIS

# ============================================================
# dye_color（染色颜色）
# ============================================================
custom:example_dye:
  settings:
    dye_color: 255,140,0 # << CHANGE THIS R,G,B

# ============================================================
# firework_color（烟火颜色）
# ============================================================
custom:example_firework:
  settings:
    firework_color: 255,140,0 # << CHANGE THIS R,G,B
