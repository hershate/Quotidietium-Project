# Wiki: CraftEngine Wiki/configuration/item/behaviors/liquid_collision_block_item.md
# 检查交互是否与液体/冰/霜冰/含水方块碰撞，适用于在水源或熔岩表面放置方块

items:
  custom:your_item: # << CHANGE THIS
    material: paper # << CHANGE THIS
    behavior:
      type: liquid_collision_block_item

      # 放置方块时相对于玩家视角的 Y 轴偏移量
      offset_y: 1 # << CHANGE THIS

      # 方式一：引用已定义的方块（通过命名空间ID）
      block: custom:your_block # << CHANGE THIS

      # 方式二：或内联完整方块配置（二选一，注释掉上面那行）
      # block:
      #   behavior:
      #     type: ...
      #   settings:
      #     ...
      #   states:
      #     ...
      #   loot:
      #     ...
      #   events:
      #     ...
