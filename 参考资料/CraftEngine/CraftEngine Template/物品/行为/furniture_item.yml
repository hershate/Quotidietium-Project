# Wiki: 参考资料/CraftEngine/CraftEngine Wiki/configuration/item/behaviors/furniture_item.md
# 家具物品 - 绑定家具到物品上，右键点击放置

items:
  custom:my_furniture_item:   # << CHANGE THIS item namespace:ID
    behavior:
      type: furniture_item
      rules:
        ground:               # << CHANGE THIS variant name (e.g. ground, wall, etc.)
          rotation: four      # << CHANGE THIS  any / four / eight / sixteen / north / east / west / south
          alignment: center   # << CHANGE THIS  any / center / half / quarter / corner
      furniture: custom:my_furniture   # << CHANGE THIS furniture namespace:ID (reference style)
      # --- 或在此处内联完整家具配置（二选一） ---
      # furniture:            # << 取消注释并注释掉上面的 reference 行，使用内联风格
      #   settings: ...
      #   variants: ...
      #   loot: ...
      #   events: ...
      ignore_placer: false    # << CHANGE THIS 放置时是否忽略放置者的碰撞箱
      ignore_entities: false  # << CHANGE THIS 放置时是否忽略所有实体的碰撞箱
