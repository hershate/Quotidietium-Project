# ============================================================================
# CraftEngine - 可堆肥物品 (compostable_item) 行为模板
# ============================================================================
# 功能: 将原本不可堆肥的物品变为可堆肥，使其能被放入堆肥桶中。
#
# 注意:
#   - 此功能不适用于漏斗。Minecraft 的堆肥系统是硬编码的，
#     只有原版就可堆肥的物品才能在漏斗中正常工作。
#   - 你仍可以将可堆肥物品作为基础材质，并通过物品设置中的
#     compost_probability 调整堆肥成功率。
# ============================================================================

# 物品定义
items:
  # ====================================================================
  # 示例: 末影珍珠花种子 (将末影珍珠变为可堆肥)
  # 将 "<namespace>:<item_id>" 替换为你的物品 ID
  # ====================================================================
  <namespace>:<item_id>:
    behavior:
      # 行为类型: 固定为 compostable_item
      type: compostable_item

      # 堆肥成功率 (0.0 ~ 1.0)
      #   0.0 = 永远不会成功
      #   0.5 = 50% 概率增加一层堆肥
      #   1.0 = 每次必定增加一层堆肥
      chance: <0.0 ~ 1.0>
