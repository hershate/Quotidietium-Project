# Wiki: CraftEngine Wiki/configuration/item/models/model.md
# 完整 minecraft:model 配置模板 — 含所有着色 tint 类型

items:
  # ------------------------------------------------------------------
  # 基础: 仅 type + path
  # ------------------------------------------------------------------
  custom:example_item:
    model:
      type: minecraft:model
      path: minecraft:item/custom/example_item                    # << CHANGE THIS

  # ------------------------------------------------------------------
  # 模型生成 (generation)
  # ------------------------------------------------------------------
  custom:example_pickaxe:
    model:
      type: minecraft:model
      path: minecraft:item/custom/example_pickaxe                 # << CHANGE THIS
      generation:
        parent: "minecraft:item/handheld"                         # << CHANGE THIS
        textures:
          "layer0": "minecraft:item/custom/example_pickaxe"       # << CHANGE THIS

  # ------------------------------------------------------------------
  # 模型变换 (transformation) — 26.1+
  # ------------------------------------------------------------------
  custom:example_transformed:
    model:
      type: minecraft:model
      path: minecraft:item/custom/example_transformed             # << CHANGE THIS
      transformation:
        scale: 1.5,1.5,1.5                                        # << CHANGE THIS
        translation: 0.5,0.0,0.0                                  # << CHANGE THIS
        right_rotation:
          angle: 1.5708                                           # << CHANGE THIS; 弧度
          axis: 0.0,1.0,0.0                                       # << CHANGE THIS
        left_rotation: 0.0,0.0,0.0,0.0                            # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:constant — 恒定颜色
  # ------------------------------------------------------------------
  custom:tint_constant:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_constant                   # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_constant"            # << CHANGE THIS
      tints:
        - type: "minecraft:constant"
          value: -12012264                                         # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:custom_model_data — 从 CustomModelData 组件取色
  # ------------------------------------------------------------------
  custom:tint_custom_model_data:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_custom_model_data          # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_custom_model_data"   # << CHANGE THIS
      tints:
        - type: "minecraft:custom_model_data"
          index: 0                                                 # << CHANGE THIS
          default: -12012264                                       # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:dye — 染料颜色
  # ------------------------------------------------------------------
  custom:tint_dye:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_dye                        # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_dye"                 # << CHANGE THIS
      tints:
        - type: "minecraft:dye"
          default: -12012264                                       # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:firework — 烟花颜色
  # ------------------------------------------------------------------
  custom:tint_firework:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_firework                   # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_firework"            # << CHANGE THIS
      tints:
        - type: "minecraft:firework"
          default: -12012264                                       # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:grass — 生物群系草地色（温湿度）
  # ------------------------------------------------------------------
  custom:tint_grass:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_grass                      # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_grass"               # << CHANGE THIS
      tints:
        - type: "minecraft:grass"
          temperature: 0.5                                         # << CHANGE THIS; 0.0–1.0
          downfall: 0.5                                            # << CHANGE THIS; 0.0–1.0

  # ------------------------------------------------------------------
  # tint: minecraft:map_color — 地图颜色
  # ------------------------------------------------------------------
  custom:tint_map_color:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_map_color                  # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_map_color"           # << CHANGE THIS
      tints:
        - type: "minecraft:map_color"
          default: -12012264                                       # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:potion — 药水颜色
  # ------------------------------------------------------------------
  custom:tint_potion:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_potion                     # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_potion"              # << CHANGE THIS
      tints:
        - type: "minecraft:potion"
          default: -12012264                                       # << CHANGE THIS

  # ------------------------------------------------------------------
  # tint: minecraft:team — 队伍颜色
  # ------------------------------------------------------------------
  custom:tint_team:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_team                       # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_team"                # << CHANGE THIS
      tints:
        - type: "minecraft:team"
          default: -12012264                                       # << CHANGE THIS

  # ------------------------------------------------------------------
  # 复合: 多 tintindex 示例（对应 BlockBench 中多个勾选"着色"的面）
  # ------------------------------------------------------------------
  custom:tint_multi:
    model:
      type: minecraft:model
      path: minecraft:item/custom/tint_multi                      # << CHANGE THIS
      generation:
        parent: "minecraft:block/custom/tint_multi"               # << CHANGE THIS
      tints:
        - type: "minecraft:dye"                                   # tintindex=0
          default: 144,80,62                                      # << CHANGE THIS
        - type: "minecraft:grass"                                 # tintindex=1
          temperature: 0.5                                        # << CHANGE THIS
          downfall: 0.5                                           # << CHANGE THIS

# 颜色值格式（均可用于 value / default）:
#   -12012264          十进制整数
#   16711680            十进制整数
#   255,0,0            RGB 逗号分隔
#   1.0,0.0,0.0        浮点逗号分隔
#   [255, 0, 0]        RGB 数组
#   [1.0, 0.0, 0.0]    浮点数组
