# =============================================================================
# CraftEngine 模型映射类型参考: minecraft:select（枚举条件型）
# =============================================================================
# 基于 CraftEngine Wiki: configuration/item/models/select.md
# 枚举条件型物品模型映射类型。先计算物品堆叠内给定的一个枚举属性，
# 游戏使用枚举属性值对应的物品模型映射。若无匹配则使用 fallback。
#
# 命名空间: custom（示例均使用 custom: 前缀）
# 风格: Oraxen 风格 — 每个属性独立示例, 清晰注释, 开箱即用.
# =============================================================================
#
# === 目录 ===
#   1.  charge_type            弩充能弹射物类型
#   2.  context_dimension      玩家所在维度
#   3.  context_entity_type    持有者实体类型
#   4.  display_context        渲染位置（手持/展示框/地面）
#   5.  main_hand              主手惯用手
#   6.  trim_material          盔甲纹饰材料
#   7.  block_state            方块属性值
#   8.  component              数据组件值 (1.21.5+)
#   9.  custom_model_data      自定义模型数据下标字符串
#   10. local_time             本地时间日期字符串
#
# =============================================================================

items:

  # ===========================================================================
  # 1. minecraft:charge_type — 弩充能弹射物类型
  # ===========================================================================
  # 检查物品堆叠的 charged_projectiles 组件。
  # 返回: none（组件空/不存在）、rocket（烟花火箭）、arrow（其他情况）。
  # ===========================================================================
  custom:select_charge_type:
    material: crossbow
    data:
      charged_projectile:
        - type: minecraft:firework_rocket
    model:
      type: "minecraft:select"
      property: "minecraft:charge_type"
      cases:
        - when: arrow
          model:
            type: minecraft:model
            path: "minecraft:item/crossbow_arrow"
        - when: rocket
          model:
            type: minecraft:model
            path: "minecraft:item/crossbow_firework"
        - when: none
          model:
            type: minecraft:model
            path: "minecraft:item/crossbow_standby"
      fallback:
        type: minecraft:model
        path: "minecraft:item/crossbow_standby"

  # ===========================================================================
  # 2. minecraft:context_dimension — 玩家所在维度
  # ===========================================================================
  # 当前玩家所在维度的命名空间 ID。
  # 常用于维度切换显示不同外观（如下界/末地可发光的物品）。
  # ===========================================================================
  custom:select_context_dimension:
    material: compass
    model:
      type: "minecraft:select"
      property: "minecraft:context_dimension"
      cases:
        - when: "minecraft:overworld"
          model:
            type: minecraft:model
            path: "minecraft:item/compass"
        - when: "minecraft:the_nether"
          model:
            type: minecraft:model
            path: "minecraft:item/compass_nether"
        - when: "minecraft:the_end"
          model:
            type: minecraft:model
            path: "minecraft:item/compass_end"
      fallback:
        type: minecraft:model
        path: "minecraft:item/compass"

  # ===========================================================================
  # 3. minecraft:context_entity_type — 持有者实体类型
  # ===========================================================================
  # 持有此物品堆叠的实体类型命名空间 ID。
  # 可用于玩家/生物手持时显示不同外观。
  # ===========================================================================
  custom:select_context_entity_type:
    material: stick
    model:
      type: "minecraft:select"
      property: "minecraft:context_entity_type"
      cases:
        - when: "minecraft:player"
          model:
            type: minecraft:model
            path: "custom:item/player_stick"
        - when: "minecraft:villager"
          model:
            type: minecraft:model
            path: "custom:item/villager_stick"
        - when: "minecraft:iron_golem"
          model:
            type: minecraft:model
            path: "custom:item/golem_stick"
      fallback:
        type: minecraft:model
        path: "minecraft:item/stick"

  # ===========================================================================
  # 4. minecraft:display_context — 渲染位置
  # ===========================================================================
  # 获取当前物品堆叠渲染位置。
  # 常见枚举值: thirdperson_lefthand, thirdperson_righthand,
  # firstperson_lefthand, firstperson_righthand, head, gui, ground,
  # fixed（物品展示框）。
  # ===========================================================================
  custom:select_display_context:
    material: diamond
    model:
      type: "minecraft:select"
      property: "minecraft:display_context"
      cases:
        - when: gui
          model:
            type: minecraft:model
            path: "minecraft:item/diamond"
        - when: ground
          model:
            type: minecraft:model
            path: "custom:item/diamond_ground"
        - when: fixed
          model:
            type: minecraft:model
            path: "custom:item/diamond_frame"
        - when: head
          model:
            type: minecraft:model
            path: "custom:item/diamond_head"
      fallback:
        type: minecraft:model
        path: "minecraft:item/diamond"

  # ===========================================================================
  # 5. minecraft:main_hand — 主手惯用手
  # ===========================================================================
  # 获取玩家的主手是 left（左手）还是 right（右手）。
  # 如果物品堆叠不在玩家身上则为 null，无法匹配。
  # ===========================================================================
  custom:select_main_hand:
    material: sword
    model:
      type: "minecraft:select"
      property: "minecraft:main_hand"
      cases:
        - when: left
          model:
            type: minecraft:model
            path: "custom:item/sword_left"
        - when: right
          model:
            type: minecraft:model
            path: "custom:item/sword_right"
      fallback:
        type: minecraft:model
        path: "minecraft:item/sword"

  # ===========================================================================
  # 6. minecraft:trim_material — 盔甲纹饰材料
  # ===========================================================================
  # 读取物品堆叠的 trim 组件并获取盔甲纹饰材料。
  # 如果物品堆叠无此组件则为 null，无法匹配。
  # ===========================================================================
  custom:select_trim_material:
    material: diamond_chestplate
    data:
      trim:
        material: "minecraft:netherite"
        pattern: "minecraft:sentry"
    model:
      type: "minecraft:select"
      property: "minecraft:trim_material"
      cases:
        - when: "minecraft:amethyst"
          model:
            type: minecraft:model
            path: "custom:item/chestplate_amethyst_trim"
        - when: "minecraft:netherite"
          model:
            type: minecraft:model
            path: "custom:item/chestplate_netherite_trim"
        - when: "minecraft:redstone"
          model:
            type: minecraft:model
            path: "custom:item/chestplate_redstone_trim"
      fallback:
        type: minecraft:model
        path: "minecraft:item/diamond_chestplate"

  # ===========================================================================
  # 7. minecraft:block_state — 方块属性值
  # ===========================================================================
  # 读取物品堆叠的 block_state 组件，获取指定方块属性的值。
  # block_state_property 指定要读取的方块属性名。
  # 如果物品堆叠不存在此组件或方块不具有对应属性则返回 null。
  # ===========================================================================
  custom:select_block_state:
    material: stick
    data:
      block_state:
        facing: "north"
    model:
      type: "minecraft:select"
      property: "minecraft:block_state"
      block_state_property: "facing"
      cases:
        - when: north
          model:
            type: minecraft:model
            path: "custom:item/block_north"
        - when: south
          model:
            type: minecraft:model
            path: "custom:item/block_south"
        - when: east
          model:
            type: minecraft:model
            path: "custom:item/block_east"
        - when: west
          model:
            type: minecraft:model
            path: "custom:item/block_west"
      fallback:
        type: minecraft:model
        path: "minecraft:item/stick"

  # ===========================================================================
  # 8. minecraft:component — 数据组件值 (1.21.5+)
  # ===========================================================================
  # 读取物品堆叠的可持久化组件数据，完全匹配组件值。
  # component 指定要读取的组件命名空间 ID。
  # 不支持不可持久化的组件。
  # ===========================================================================
  custom:select_component:
    material: diamond_pickaxe
    data:
      components:
        minecraft:unbreakable: {}
    model:
      type: "minecraft:select"
      property: "minecraft:component"
      component: "minecraft:unbreakable"
      cases:
        - when: {}
          model:
            type: minecraft:model
            path: "custom:item/unbreakable_pickaxe"
      fallback:
        type: minecraft:model
        path: "minecraft:item/diamond_pickaxe"

  # ===========================================================================
  # 9. minecraft:custom_model_data — 自定义模型数据下标字符串
  # ===========================================================================
  # 读取物品堆叠 custom_model_data 组件中的 strings 数组，
  # 获取指定下标 index 的字符串。
  # 如果下标超出范围或组件不存在则返回 null。
  # ===========================================================================
  custom:select_custom_model_data:
    material: iron_sword
    data:
      custom_model_data:
        strings:
          - "iron_sword_default"
          - "iron_sword_flame"
          - "iron_sword_frost"
    model:
      type: "minecraft:select"
      property: "minecraft:custom_model_data"
      index: 0
      cases:
        - when: "iron_sword_default"
          model:
            type: minecraft:model
            path: "custom:item/iron_sword_default"
        - when: "iron_sword_flame"
          model:
            type: minecraft:model
            path: "custom:item/iron_sword_flame"
        - when: "iron_sword_frost"
          model:
            type: minecraft:model
            path: "custom:item/iron_sword_frost"
      fallback:
        type: minecraft:model
        path: "minecraft:item/iron_sword"

  # ===========================================================================
  # 10. minecraft:local_time — 本地时间日期字符串
  # ===========================================================================
  # 读取当前时间，根据指定时区、地区设置和日期格式获得日期字符串。
  # 此字符串每秒最多获取一次。
  # locale: 地区设置（如 zh_CN, en_US）
  # time_zone: 时区偏移（如 GMT+8:00, +8:00, America/New_York）
  # pattern: 日期时间格式（如 HH:mm:ss, yyyy-MM-dd, EEEE）
  # ===========================================================================
  custom:select_local_time:
    material: clock
    model:
      type: "minecraft:select"
      property: "minecraft:local_time"
      locale: "zh_CN"
      time_zone: "GMT+8:00"
      pattern: "HH:mm:ss"
      cases:
        - when: "06:00:00"
          model:
            type: minecraft:model
            path: "custom:item/clock_dawn"
        - when: "12:00:00"
          model:
            type: minecraft:model
            path: "custom:item/clock_noon"
        - when: "18:00:00"
          model:
            type: minecraft:model
            path: "custom:item/clock_dusk"
        - when: "00:00:00"
          model:
            type: minecraft:model
            path: "custom:item/clock_midnight"
      fallback:
        type: minecraft:model
        path: "minecraft:item/clock"

  # ===========================================================================
  # 完整示例: 带 transformation 的 select 模型
  # ===========================================================================
  # transformation 为可选节，支持 scale, translation,
  # right_rotation（初始旋转，angle 弧度+axis 向量）,
  # left_rotation（四元数再旋转）。>= CraftEngine 26.1
  # ===========================================================================
  custom:select_with_transformation:
    material: bow
    model:
      type: "minecraft:select"
      property: "minecraft:charge_type"
      cases:
        - when: arrow
          model:
            type: minecraft:model
            path: "minecraft:item/bow"
        - when: rocket
          model:
            type: minecraft:model
            path: "minecraft:item/bow"
      fallback:
        type: minecraft:model
        path: "minecraft:item/bow"
      transformation:
        scale: "1.5,1.5,1.5" # 以原点为中心缩放
        translation: "0.5,0.0,0.0" # 平移变换 (x,y,z)
        right_rotation:
          angle: 1.57079632679 # 90度（弧度）
          axis: "0.0,0.0,1.0" # 绕 Z 轴旋转
        left_rotation: "0.0,0.0,0.0,0.0" # 四元数再旋转
