# 来源: CraftEngine Wiki/configuration/item/models.md
# 简化模型 - 1.21.4+ 物品模型配置模板

# ============================================================
# 1. 2D 图标 (简化写法)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_icon_item:
    # << CHANGE THIS: 选择合适的材质
    material: paper
    # << CHANGE THIS: 替换为你的纹理路径
    texture: minecraft:item/custom/my_icon_texture

---
# ============================================================
# 2. 手持物品 (简化写法, 如工具/武器)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_handheld_tool:
    # << CHANGE THIS: 选择合适的工具材质
    material: iron_sword
    # << CHANGE THIS: 替换为你的纹理路径
    texture: minecraft:item/custom/my_handheld_tool

---
# ============================================================
# 3. 钓鱼竿 (简化写法)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_fishing_rod:
    material: fishing_rod
    # << CHANGE THIS: 第一个纹理为未抛竿状态, 第二个为抛竿后状态
    textures:
      - minecraft:item/custom/my_fishing_rod
      - minecraft:item/custom/my_fishing_rod_cast

---
# ============================================================
# 4. 鞘翅 (简化写法)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_elytra:
    material: elytra
    # << CHANGE THIS: 第一个纹理为正常状态, 第二个为破损状态
    textures:
      - minecraft:item/custom/my_elytra
      - minecraft:item/custom/my_elytra_broken

---
# ============================================================
# 5. 弓 (简化写法)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_bow:
    material: bow
    # << CHANGE THIS: 纹理顺序: 默认 / 拉弓阶段0 / 拉弓阶段1 / 拉弓阶段2
    textures:
      - minecraft:item/custom/my_bow
      - minecraft:item/custom/my_bow_pulling_0
      - minecraft:item/custom/my_bow_pulling_1
      - minecraft:item/custom/my_bow_pulling_2

---
# ============================================================
# 6. 弩 (简化写法)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_crossbow:
    material: crossbow
    # << CHANGE THIS: 纹理顺序: 默认 / 拉弦阶段0 / 拉弦阶段1 / 拉弦阶段2 / 装填箭 / 装填烟花
    textures:
      - minecraft:item/custom/my_crossbow
      - minecraft:item/custom/my_crossbow_pulling_0
      - minecraft:item/custom/my_crossbow_pulling_1
      - minecraft:item/custom/my_crossbow_pulling_2
      - minecraft:item/custom/my_crossbow_arrow
      - minecraft:item/custom/my_crossbow_firework

---
# ============================================================
# 7. 盾牌 (简化写法)
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_shield:
    material: shield
    # << CHANGE THIS: 第一个为默认模型, 第二个为格挡模型
    models:
      - minecraft:item/custom/my_shield
      - minecraft:item/custom/my_shield_blocking

---
# ============================================================
# 8. 模型列表 (直接指定已有模型文件)
# 适用于已制作好模型文件, 不需要自动生成纹理的情况
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_3d_rod:
    material: fishing_rod
    # << CHANGE THIS: 直接指定模型文件路径 (多个状态)
    models:
      - minecraft:item/custom/my_3d_rod
      - minecraft:item/custom/my_3d_rod_cast

---
# ============================================================
# 9. 模型快捷指定 (单个模型文件)
# 适用于只有一个静态模型, 无需多状态的物品
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_simple_icon:
    material: paper
    # << CHANGE THIS: 直接指定单个模型文件路径
    model: minecraft:item/custom/my_simple_icon

---
# ============================================================
# 10. 完整示例: 纹理 + 模型路径同时指定
# 当你同时需要自定义纹理和模型路径时使用
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_complex_item:
    # << CHANGE THIS: 选择合适的材质
    material: paper
    # << CHANGE THIS: 手动指定模型路径
    model: minecraft:item/custom/my_complex_model
    # << CHANGE THIS: 指定纹理路径
    texture: minecraft:item/custom/my_complex_texture

---
# ============================================================
# 11. 完整示例: 钓鱼竿 纹理 + 模型路径同时指定
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_complex_rod:
    material: fishing_rod
    # << CHANGE THIS: 手动指定模型路径 (多状态)
    models:
      - minecraft:item/custom/my_complex_rod
      - minecraft:item/custom/my_complex_rod_cast
    # << CHANGE THIS: 指定纹理路径 (多状态)
    textures:
      - minecraft:item/custom/my_complex_rod
      - minecraft:item/custom/my_complex_rod_cast

---
# ============================================================
# 12. 旧版模型 (legacy_model)
# 用于 1.21.3 及更早版本的回退配置。
# 仅在自动转换有问题时使用此部分。
# ============================================================
items:
  # << CHANGE THIS: 替换为你的物品 ID
  custom:my_legacy_item:
    material: fishing_rod
    # << CHANGE THIS: 旧版 item_model
    item_model: custom:my_legacy_item
    settings:
      # << CHANGE THIS: 根据需要调整标签
      tags:
        - "custom:my_tools"
    data:
      # << CHANGE THIS: 根据需要调整名称和描述
      item_name: "<!i><#FF8C00><i18n:item.my_legacy_item>"
      tooltip_style: minecraft:default
    model:
      # << CHANGE THIS: 使用你的模板
      template: custom:model/simplified_fishing_rod_2d
      arguments:
        # << CHANGE THIS: 替换纹理路径
        path: minecraft:item/custom/my_legacy_item
        cast_path: minecraft:item/custom/my_legacy_item_cast
    # << CHANGE THIS: 旧版模型覆盖
    legacy_model:
      # << CHANGE THIS: 默认模型路径
      path: minecraft:item/custom/my_legacy_item
      overrides:
        # << CHANGE THIS: 根据条件添加覆盖
        - path: minecraft:item/custom/my_legacy_item_cast
          predicate:
            cast: 1
