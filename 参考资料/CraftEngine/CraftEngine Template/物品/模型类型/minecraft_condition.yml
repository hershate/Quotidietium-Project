# CraftEngine Wiki: configuration/item/models/condition.md
# minecraft:condition — Boolean condition item model mapping
# Each entry below demonstrates one documented property (predicate).

items:

  # ──────────────────────────────────────────────────────────────────
  # minecraft:broken — Checks if the item stack is about to break
  # (durability remaining = 1). Returns false if unbreakable.
  # ──────────────────────────────────────────────────────────────────
  custom:broken_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:broken"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/broken_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/broken_true"   # << CHANGE THIS
      transformation:                                 # optional; 26.1+
        scale: 1,1,1                                  # << CHANGE THIS
        translation: 0,0,0                            # << CHANGE THIS
        right_rotation:
          angle: 0.0                                  # << CHANGE THIS
          axis: 0,0,0                                 # << CHANGE THIS
        left_rotation: 0,0,0,0                        # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:carried — Checks if the player is carrying this item
  # stack with the cursor in a container screen.
  # ──────────────────────────────────────────────────────────────────
  custom:carried_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:carried"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/carried_false"   # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/carried_true"    # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:damaged — Checks if the item stack damage (damage
  # component) is non-zero. Returns false if unbreakable.
  # ──────────────────────────────────────────────────────────────────
  custom:damaged_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:damaged"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/damaged_false"   # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/damaged_true"    # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:extended_view — Checks if Shift is held while the item
  # is rendered inside a GUI.
  # ──────────────────────────────────────────────────────────────────
  custom:extended_view_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:extended_view"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/extended_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/extended_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:fishing_rod/cast — Checks if the fishing hook has
  # been cast. Returns false if the player is not fishing.
  # ──────────────────────────────────────────────────────────────────
  custom:fishing_rod_cast:
    model:
      type: "minecraft:condition"
      property: "minecraft:fishing_rod/cast"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/fishing_cast_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/fishing_cast_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:selected — Checks if the player has this item stack
  # selected in the hotbar.
  # ──────────────────────────────────────────────────────────────────
  custom:selected_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:selected"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/selected_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/selected_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:using_item — Checks if the item stack is being used
  # (e.g. eating food, drawing a bow).
  # ──────────────────────────────────────────────────────────────────
  custom:using_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:using_item"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/using_false"     # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/using_true"      # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:view_entity — Checks if the holder of this item stack
  # is the current camera entity (the player in survival, or the
  # spectated entity in spectator mode).
  # ──────────────────────────────────────────────────────────────────
  custom:view_entity_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:view_entity"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/view_entity_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/view_entity_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:bundle/has_selected_item — Checks if the player has
  # selected an item stack inside this bundle. Returns false if the
  # item stack lacks a bundle_contents component.
  # ──────────────────────────────────────────────────────────────────
  custom:bundle_selected:
    model:
      type: "minecraft:condition"
      property: "minecraft:bundle/has_selected_item"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/bundle_selected_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/bundle_selected_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:component (1.21.5+) — Checks if the item stack
  # satisfies the given data component predicate.
  # ──────────────────────────────────────────────────────────────────
  custom:component_predicate_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:component"
      predicate:                                # << CHANGE THIS — component predicate
        custom:my_data: {}                      # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/component_false"   # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/component_true"    # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:has_component — Checks if the item stack has a given
  # component type.
  # ──────────────────────────────────────────────────────────────────
  custom:has_component_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:has_component"
      component: "minecraft:enchantments"        # << CHANGE THIS
      ignore-default: false                      # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/has_component_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/has_component_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:keybind_down — Checks if a key binding is pressed.
  # ──────────────────────────────────────────────────────────────────
  custom:keybind_down_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:keybind_down"
      keybind: "key.left"                        # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/keybind_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/keybind_true"   # << CHANGE THIS

  # ──────────────────────────────────────────────────────────────────
  # minecraft:custom_model_data — Reads the custom_model_data
  # component on the item stack to determine the condition result.
  # ──────────────────────────────────────────────────────────────────
  custom:custom_model_data_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:custom_model_data"
      index: 0                                   # << CHANGE THIS (optional)
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/custom_model_false"  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/custom_model_true"   # << CHANGE THIS
