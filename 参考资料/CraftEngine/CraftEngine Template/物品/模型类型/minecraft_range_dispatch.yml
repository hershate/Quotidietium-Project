# Wiki: CraftEngine Wiki/configuration/item/models/range_dispatch.md
# 值调配型 - 根据数值属性渲染物品模型。选择阈值小于或等于属性值的最后一个条目。
items:
  # ======================================================
  # minecraft:crossbow/pull
  # 弩被拉伸的程度；未加载 charged_projectiles 则返回 0
  # ======================================================
  custom:crossbow_pull_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:crossbow/pull"
      scale: 1.0 # << CHANGE THIS
      entries:
        - threshold: 0.58 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/pulling_1" # << CHANGE THIS
        - threshold: 1.0 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/pulling_2" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/standby" # << CHANGE THIS

  # ======================================================
  # minecraft:bundle/fullness
  # 收纳袋容量 0-1；无 bundle_contents 组件则返回 0
  # ======================================================
  custom:bundle_fullness_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:bundle/fullness"
      scale: 1.0
      entries:
        - threshold: 0.25 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/filled_25" # << CHANGE THIS
        - threshold: 0.5 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/filled_50" # << CHANGE THIS
        - threshold: 0.75 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/filled_75" # << CHANGE THIS
        - threshold: 1.0 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/full" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/empty" # << CHANGE THIS

  # ======================================================
  # minecraft:cooldown
  # 物品冷却程度；不在玩家物品栏则返回 0, 范围 0-1
  # ======================================================
  custom:cooldown_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:cooldown"
      scale: 1.0
      entries:
        - threshold: 0.001 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/on_cooldown" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/ready" # << CHANGE THIS

  # ======================================================
  # minecraft:compass
  # 指南针指针摆动进度 0-1；特有字段 target, wobble
  # ======================================================
  custom:compass_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:compass"
      target: spawn # << CHANGE THIS; spawn / recovery / lodestone / none
      wobble: true # << CHANGE THIS
      scale: 1.0
      entries:
        - threshold: 0.125 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_12" # << CHANGE THIS
        - threshold: 0.25 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_25" # << CHANGE THIS
        - threshold: 0.375 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_37" # << CHANGE THIS
        - threshold: 0.5 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_50" # << CHANGE THIS
        - threshold: 0.625 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_62" # << CHANGE THIS
        - threshold: 0.75 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_75" # << CHANGE THIS
        - threshold: 0.875 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/compass_87" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/compass_00" # << CHANGE THIS

  # ======================================================
  # minecraft:count
  # 物品数量；超出最大堆叠则取最大值；特有字段 normalize
  # ======================================================
  custom:count_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:count"
      normalize: true # << CHANGE THIS; true=归一化 0-1, false=实际数量
      scale: 1.0
      entries:
        - threshold: 0.25 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/count_1" # << CHANGE THIS
        - threshold: 0.5 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/count_2" # << CHANGE THIS
        - threshold: 0.75 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/count_3" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/count_0" # << CHANGE THIS

  # ======================================================
  # minecraft:damage
  # 损坏值；无 damage 组件则返回 0；特有字段 normalize
  # ======================================================
  custom:damage_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:damage"
      normalize: true # << CHANGE THIS; true=归一化 0-1, false=实际损坏值
      scale: 1.0
      entries:
        - threshold: 0.25 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/damage_worn" # << CHANGE THIS
        - threshold: 0.5 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/damage_damaged" # << CHANGE THIS
        - threshold: 0.75 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/damage_broken" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/damage_new" # << CHANGE THIS

  # ======================================================
  # minecraft:time
  # 当前维度时间 0-1；特有字段 source, wobble
  # source: daytime / moon_phase
  # ======================================================
  custom:time_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:time"
      source: daytime # << CHANGE THIS; daytime / moon_phase
      wobble: true # << CHANGE THIS
      scale: 1.0
      entries:
        - threshold: 0.125 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_12" # << CHANGE THIS
        - threshold: 0.25 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_25" # << CHANGE THIS
        - threshold: 0.375 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_37" # << CHANGE THIS
        - threshold: 0.5 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_50" # << CHANGE THIS
        - threshold: 0.625 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_62" # << CHANGE THIS
        - threshold: 0.75 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_75" # << CHANGE THIS
        - threshold: 0.875 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/time_87" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/time_00" # << CHANGE THIS

  # ======================================================
  # minecraft:use_cycle
  # 使用时间对 period 取模；特有字段 period
  # ======================================================
  custom:use_cycle_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:use_cycle"
      period: 1.0 # << CHANGE THIS; 取模周期（秒）
      scale: 1.0
      entries:
        - threshold: 0.2 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cycle_1" # << CHANGE THIS
        - threshold: 0.4 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cycle_2" # << CHANGE THIS
        - threshold: 0.6 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cycle_3" # << CHANGE THIS
        - threshold: 0.8 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cycle_4" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/cycle_0" # << CHANGE THIS

  # ======================================================
  # minecraft:use_duration
  # 使用时间或剩余使用时间；特有字段 remaining
  # ======================================================
  custom:use_duration_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:use_duration"
      remaining: false # << CHANGE THIS; true=剩余时间, false=已使用时间
      scale: 1.0
      entries:
        - threshold: 0.65 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/duration_1" # << CHANGE THIS
        - threshold: 0.9 # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/duration_2" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/duration_0" # << CHANGE THIS

  # ======================================================
  # minecraft:custom_model_data
  # 读取 custom_model_data 字符串数组指定下标；特有字段 index
  # entries.threshold 使用字符串而非浮点数
  # ======================================================
  custom:custom_model_data_example: # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:custom_model_data"
      index: 0 # << CHANGE THIS; 字符串数组下标
      scale: 1.0
      entries:
        - threshold: "value_a" # << CHANGE THIS; 匹配字符串
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cmd_a" # << CHANGE THIS
        - threshold: "value_b" # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cmd_b" # << CHANGE THIS
        - threshold: "value_c" # << CHANGE THIS
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/cmd_c" # << CHANGE THIS
      fallback:
        type: "minecraft:model"
        path: "minecraft:item/custom/cmd_default" # << CHANGE THIS
