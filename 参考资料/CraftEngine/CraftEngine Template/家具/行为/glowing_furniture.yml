# Wiki: configuration/furniture/behaviors/glowing_furniture.md
# 发光家具 - 使家具成为实际光源方块

# --- 统一光源配置（所有变体共用）---
furniture:
  custom:my_glowing_furniture: # << CHANGE THIS namespace:item_id
    behaviors:
      type: glowing_furniture
      lights:
        - position: 0,0,0  # << CHANGE THIS 光源相对位置 (x,y,z)
          level: 15         # << CHANGE THIS 亮度等级 (0-15)

