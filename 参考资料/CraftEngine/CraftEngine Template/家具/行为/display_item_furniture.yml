# -----------------------------------------------------------
# Reference: CraftEngine Wiki /configuration/furniture/behaviors/display_item_furniture.md
# Behavior type: display_item_furniture
# Allows placing items onto furniture for display. Each variant
# can independently define the floating item position and its own
# interaction hitbox (useful for multi-slot furniture).
# -----------------------------------------------------------
furniture:
  custom:display_table:                                     # << CHANGE THIS: furniture ID
    behavior:
      type: display_item_furniture
      data_key: craftengine:display_item                   # << CHANGE THIS: NBT data key storing the item
      sounds:
        put: minecraft:block.decorated_pot.insert          # << CHANGE THIS: sound when item is placed
        take: minecraft:block.decorated_pot.insert_fail    # << CHANGE THIS: sound when item is taken
      variants:
        # -- Ground variant ----------------------------------
        ground:
          item_position: 0,0.07,0                          # << CHANGE THIS: x,y,z offset of the floating item
          hitboxes: []                                     # << CHANGE THIS: see "判定箱" under furniture variants

        # -- Wall variant ------------------------------------
        wall:
          item_position: 0,0.85,-0.35
          hitboxes: []

        # -- Double-slot shelf example -----------------------
        shelf_slot_left:
          item_position: -0.25,0.5,0
          hitboxes:
            - type: box
              min: -0.45,0.3,-0.15
              max: -0.05,0.7,0.15

        shelf_slot_right:
          item_position: 0.25,0.5,0
          hitboxes:
            - type: box
              min: 0.05,0.3,-0.15
              max: 0.45,0.7,0.15
