# ============================================================================
# 家具设置 (Furniture Settings)
# 参考: CraftEngine Wiki - configuration/furniture/settings.md
# ============================================================================

# 物品 (item)
# 决定家具对应的物品是什么。通常在创造模式使用鼠标中键点击来获取家具（1.21.4+ 版本）。
item: "namespace:item_id"

# 击打次数 (hit_times)
# 决定玩家需要击打家具多少次以破坏此家具
hit_times: 3

# 音效 (sounds)
# 决定家具在各种情况下的音效。
# 支持两种格式：
#   1. 简写格式: "命名空间:音效id"
#   2. 详细格式: 包含 id / pitch / volume 字段
sounds:
  # break   - 当玩家破坏家具时
  break: "minecraft:block.bamboo_wood.break"
  # place   - 当玩家放置家具时
  place: "minecraft:block.bamboo_wood.place"
  # hit     - 当玩家击打家具时
  hit: "minecraft:block.bamboo_wood.hit"

  # 详细格式示例 (取消注释以使用精确控制):
  # break:
  #   id: "minecraft:block.deepslate.break"
  #   pitch: 0.5
  #   volume: 0.25
  # place: "minecraft:block.deepslate.step"
  # hit:
  #   id: "minecraft:block.deepslate.hit"
  #   pitch: 1.0
  #   volume: 1.0

# 冒险模式破坏 (adventure_mode_breaking)
# 是否允许在冒险模式下破坏此家具
adventure_mode_breaking: true

# 合适挖掘工具 (correct_tools)
# 决定哪些工具可以高效挖掘此家具
# 支持标签 (tag) 和具体物品两种格式
correct_tools:
  - "#minecraft:axes"          # 标签: 所有斧类工具
  - "minecraft:diamond_pickaxe" # 具体物品: 钻石镐
