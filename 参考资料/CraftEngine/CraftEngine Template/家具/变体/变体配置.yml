# =============================================================================
# Source: CraftEngine Wiki/configuration/furniture/variants.md
# Template: Furniture Variants — ground / wall / ceiling
# =============================================================================
# This is a complete working template covering all variant types, element
# types (item_display, text_display, item, armor_stand, better_model,
# model_engine), hitbox types (interaction, shulker, happy_ghast, custom),
# seats, entity_culling, display_transform, billboard, glow, and brightness.
#
# Usage: Replace "custom:" with your own namespace.  Change every value
# marked with "<< CHANGE THIS".  The config is immediately usable as-is
# after namespace and item ID changes.
# =============================================================================

furniture:
  # ---------------------------------------------------------------------------
  # GROUND variant — placed on top of a block.
  # Demonstrates every element type, every hitbox type, seats, and full
  # entity_culling with ray tracing.
  # ---------------------------------------------------------------------------
  custom:ground_example:
    variants:
      ground:
        # << CHANGE THIS — offset for dropped loot so it does not spawn inside a block
        loot_spawn_offset: 0.5,0.5,0

        # --- Elements ---
        elements:
          # ======== item_display ========
          - type: item_display
            item: custom:my_item                                                                     # << CHANGE THIS
            display_transform: NONE                                                                  # << CHANGE THIS (NONE / THIRD_PERSON_LEFT_HAND / THIRD_PERSON_RIGHT_HAND / FIRST_PERSON_LEFT_HAND / FIRST_PERSON_RIGHT_HAND / HEAD / GUI / GROUND / FIXED / ON_SHELF)
            billboard: FIXED                                                                        # << CHANGE THIS (FIXED / VERTICAL / HORIZONTAL / CENTER)
            position: 0.5,0,0                                                                       # << CHANGE THIS
            translation: 0,0.5,0                                                                    # << CHANGE THIS
            pitch: 0.0
            yaw: 0.0
            scale: 1                                                                                # << CHANGE THIS — single value or x,y,z
            glow_color: 255,255,255                                                                 # << CHANGE THIS — r,g,b (0-255)
            brightness:
              block_light: 15                                                                       # << CHANGE THIS (0-15)
              sky_light: 15                                                                         # << CHANGE THIS (0-15)
            view_range: 1.0                                                                        # << CHANGE THIS
            # rotation: 45                                                                          # Y-axis
            # rotation: 45,45,0                                                                     # Euler angles
            # rotation: 0,0,0.7071,0.7071                                                           # Quaternion
            apply_dyed_color: true                                                                  # << CHANGE THIS
            tint_source:
              - dyed_color                                                                          # << CHANGE THIS (dyed_color / map_color / firework_explosion / potion_contents)

          # ======== text_display ========
          - type: text_display
            text: "你好 <papi:player_name>"                                                         # << CHANGE THIS
            billboard: CENTER                                                                       # << CHANGE THIS
            position: 0.5,0.8,0                                                                    # << CHANGE THIS
            translation: 0,0,0
            pitch: 0.0
            yaw: 0.0
            scale: 1
            glow_color: 255,255,0
            brightness:
              block_light: 15
              sky_light: 15
            view_range: 1.0
            line_width: 200                                                                         # << CHANGE THIS
            background_color: 64,0,0,0                                                             # << CHANGE THIS — A,R,G,B
            text_opacity: -1                                                                       # << CHANGE THIS (-1 = opaque)
            has_shadow: false                                                                      # << CHANGE THIS
            is_see_through: false                                                                  # << CHANGE THIS
            use_default_background_color: false                                                     # << CHANGE THIS
            alignment: center                                                                      # << CHANGE THIS (center / left / right)

          # ======== item (dropped-item render) ========
          - type: item
            item: custom:my_item                                                                     # << CHANGE THIS
            position: 0,1,0                                                                         # << CHANGE THIS
            tint_source:
              - dyed_color

          # ======== armor_stand ========
          - type: armor_stand
            item: custom:my_item                                                                     # << CHANGE THIS
            position: 0,1,0                                                                         # << CHANGE THIS
            pitch: 0.0
            yaw: 0.0
            scale: 1
            small: false                                                                            # << CHANGE THIS
            glow_color: white                                                                       # << CHANGE THIS (black / dark_blue / dark_green / dark_aqua / dark_red / dark_purple / gold / gray / dark_gray / blue / green / aqua / red / light_purple / yellow / white)
            tint_source:
              - dyed_color

          # ======== better_model ========
          - type: better_model
            model: custom_model                                                                      # << CHANGE THIS
            position: 0,0,0
            yaw: 0
            pitch: 0
            sight_trace: true                                                                       # << CHANGE THIS

          # ======== model_engine ========
          - type: model_engine
            model: custom_model                                                                      # << CHANGE THIS
            position: 0,0,0
            yaw: 0
            pitch: 0

        # --- Hitboxes ---
        hitboxes:
          # ======== interaction (no collision) ========
          - type: interaction
            can_use_item_on: false                                                                  # << CHANGE THIS
            can_be_hit_by_projectile: false                                                         # << CHANGE THIS
            blocks_building: false                                                                  # << CHANGE THIS
            position: 0,0,0
            width: 1                                                                                # << CHANGE THIS
            height: 2                                                                               # << CHANGE THIS
            # scale: 1,2                                                                           # shorthand for width,height
            interactive: true                                                                       # << CHANGE THIS
            invisible: false                                                                        # << CHANGE THIS
            seats:
              - 0,0,-0.1 0                                                                          # << CHANGE THIS — "x,y,z yaw" or just "x,y,z"

          # ======== shulker (hard collision) ========
          - type: shulker
            can_use_item_on: true                                                                   # << CHANGE THIS
            can_be_hit_by_projectile: true                                                          # << CHANGE THIS
            blocks_building: true                                                                   # << CHANGE THIS
            position: 0,0,0
            scale: 1                                                                                # << CHANGE THIS
            peek: 0                                                                                 # << CHANGE THIS (0-100)
            direction: UP                                                                           # << CHANGE THIS (UP / DOWN / NORTH / WEST / EAST / SOUTH)
            interaction_entity: true                                                                # << CHANGE THIS
            interactive: true
            invisible: false
            seats:
              - 0,0,-0.1 0

          # ======== happy_ghast (hard or soft collision) ========
          - type: happy_ghast
            can_use_item_on: true
            can_be_hit_by_projectile: true
            blocks_building: true
            hard_collision: true                                                                    # << CHANGE THIS
            position: 0,0,0
            scale: 0.25                                                                             # << CHANGE THIS (default: 1)
            seats:
              - 0,0,-0.1 0

          # ======== custom (soft collision, any entity) ========
          - type: custom
            position: 0,0,0
            scale: 5                                                                                # << CHANGE THIS
            entity_type: slime                                                                      # << CHANGE THIS (default: slime)
            seats:
              - 0,0,-0.1 0

        # --- Entity culling ---
        # Option A: disable
        # entity_culling: false
        # Option B: enable with full config
        entity_culling:
          # aabb: -0.5,0,-0.5,0.5,2,0.5                                                           # auto-calculated if omitted
          view_distance: 64                                                                         # << CHANGE THIS (-1 = unlimited; not recommended with ray_tracing: true)
          ray_tracing: false                                                                        # << CHANGE THIS

  # ---------------------------------------------------------------------------
  # WALL variant — attached to the side of a block.
  # Uses a small position offset + inverse translation to prevent the
  # black-render bug documented in the wiki.
  # ---------------------------------------------------------------------------
  custom:wall_example:
    variants:
      wall:
        elements:
          - type: item_display
            item: custom:wall_item                                                                   # << CHANGE THIS
            display_transform: NONE
            billboard: FIXED
            # Small offset on the axis facing the wall, then inverse
            # translation to pull the visual position back.
            position: 0.5,0.5,0.01                                                                 # << CHANGE THIS — small offset required
            translation: 0,0,-0.01                                                                 # << CHANGE THIS — inverse compensation
            pitch: 0.0
            yaw: 0.0
            scale: 1
            glow_color: 255,200,100
            brightness:
              block_light: 15
              sky_light: 15

          - type: text_display
            text: "Wall Sign"
            billboard: VERTICAL
            position: 0.5,0.8,0.01
            translation: 0,0,-0.01
            line_width: 200
            alignment: center

        hitboxes:
          - type: interaction
            position: 0,0,0
            width: 1
            height: 1
            interactive: true
            seats:
              - 0.5,0.4,0

        entity_culling:
          view_distance: 48
          ray_tracing: false

  # ---------------------------------------------------------------------------
  # CEILING variant — hangs from the underside of a block.
  # Same position/translation rule as wall to avoid the black-render bug:
  # offset the element slightly away from the ceiling face.
  # ---------------------------------------------------------------------------
  custom:ceiling_example:
    variants:
      ceiling:
        elements:
          - type: item_display
            item: custom:lantern                                                                     # << CHANGE THIS
            display_transform: NONE
            billboard: FIXED
            # Offset downward (negative Y) so the element is not coplanar
            # with the ceiling block face.
            position: 0.5,-0.01,0.5                                                                # << CHANGE THIS — small offset required
            translation: 0,0.8,0                                                                   # << CHANGE THIS — inverse compensation
            pitch: 0.0
            yaw: 0.0
            scale: 1
            glow_color: 255,180,60
            brightness:
              block_light: 15
              sky_light: 5

          - type: model_engine
            model: custom:lantern_chain                                                              # << CHANGE THIS
            position: 0.5,-0.5,0.5
            yaw: 0
            pitch: 0

        hitboxes:
          - type: happy_ghast
            can_use_item_on: true
            can_be_hit_by_projectile: false
            blocks_building: true
            hard_collision: true
            position: 0.5,0,0.5
            scale: 0.5
            seats:
              - 0.5,0.2,0.5 180

        entity_culling:
          view_distance: 48
          ray_tracing: false

  # ---------------------------------------------------------------------------
  # BLUEPRINT shortcut — use when the entire model (elements + hitboxes) is
  # registered externally via ModelEngine, BetterModel, or the API.
  # ---------------------------------------------------------------------------
  custom:blueprint_example:
    variants:
      ground:
        blueprint: model_id                                                                         # << CHANGE THIS
      wall:
        blueprint: model_id                                                                         # << CHANGE THIS
      ceiling:
        blueprint: model_id                                                                         # << CHANGE THIS
