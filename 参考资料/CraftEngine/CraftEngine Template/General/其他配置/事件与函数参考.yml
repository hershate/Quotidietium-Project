# =============================================================================
# CraftEngine 事件、函数与条件参考模板
# =============================================================================
# 基于 CraftEngine 官方文档:
#   reference/events.md
#   reference/conditions.md
# 严格遵循文档中出现的配置项，未出现的不使用。
# =============================================================================
#
# events 结构:
#   events:
#     - on: 触发器名       # 可为单个字符串或列表
#       functions: []     # 执行的函数列表
#       conditions: []    # 执行条件 (可选)
#
# 物品触发器: break, right_click, left_click, consume, pick_up, attack
# 方块触发器: break, place, right_click, left_click, step
# 家具触发器: break, place, right_click
# =============================================================================

# =============================================================================
# 事件配置示例 - 物品
# =============================================================================
items:
  custom:example_sword:
    material: diamond_sword
    data:
      item_name: "<#FF8C00>示例剑"
    events:
      # 单个触发器
      - on: right_click
        functions:
          - type: command
            command: say 右键点击了剑!
        conditions:
          - type: permission
            permission: "example.use"
      # 多个触发器
      - on:
          - attack
          - left_click
        functions:
          - type: command
            command: say 攻击或左键!

# =============================================================================
# 事件配置示例 - 方块
# =============================================================================
blocks:
  custom:example_block:
    state:
      auto_state: note_block
      model:
        texture: "minecraft:block/custom/example"
    events:
      - on: step
        functions:
          - type: command
            command: say 有人踩在了方块上!
      - on: break
        functions:
          - type: command
            command: say 方块被破坏了!

# =============================================================================
# 事件配置示例 - 家具 (需配置在 furniture 部分下)
# =============================================================================
furniture:
  custom:example_chair:
    settings:
      item: custom:example_chair
    variants:
      ground:
        elements:
          - item: custom:example_chair
        hitboxes:
          - position: 0,0,0
            type: shulker
      events:
        - on: right_click
          functions:
            - type: command
              command: say 点击了椅子!

# =============================================================================
# 全部函数类型 (type)
# =============================================================================
# 以下列出文档中所有已实现的函数类型及参数:

# ---------------------------------------------------------------------------
# cancel_event - 取消原始事件
# ---------------------------------------------------------------------------
# type: cancel_event

# ---------------------------------------------------------------------------
# run - 按顺序运行一系列函数 (共享相同条件)
# ---------------------------------------------------------------------------
# type: run
# delay: 0                # 可选; 数字; 默认值: 0
# functions:              # 必填; 函数列表
#   - type: command
#   - type: message

# ---------------------------------------------------------------------------
# command - 执行命令
# ---------------------------------------------------------------------------
# type: command
# command: "say 你好"     # 必填; 字符串/字符串列表
# target: "self"          # 可选; all, self/玩家选择器; 默认: self
# as_player: false        # 可选; 以玩家身份执行
# as_op: false            # 可选; 以OP身份执行
# as_event: false         # 可选; 以事件驱动兼容模式执行

# ---------------------------------------------------------------------------
# message - 发送消息
# ---------------------------------------------------------------------------
# type: message
# message: "你好"         # 必填; 字符串/字符串列表
# target: "self"          # 可选; all, self/玩家选择器
# overlay: false          # false=聊天框, true=动作栏

# ---------------------------------------------------------------------------
# actionbar - 发送动作栏消息
# ---------------------------------------------------------------------------
# type: actionbar
# actionbar: "消息内容"   # 必填; 字符串
# target: "self"          # 可选; 默认: self

# ---------------------------------------------------------------------------
# title - 发送屏幕标题
# ---------------------------------------------------------------------------
# type: title
# title: "<red>标题"      # 必填; 字符串
# subtitle: "<yellow>副标题"  # 必填; 字符串
# fade_in: 20             # 可选; 数字; 默认: 10
# stay: 10                # 可选; 数字; 默认: 20
# fade_out: 10            # 可选; 数字; 默认: 5

# ---------------------------------------------------------------------------
# open_window - 打开GUI窗口
# ---------------------------------------------------------------------------
# type: open_window
# gui_type: anvil         # 必填; anvil, enchantment, grindstone, loom
#                         #   smithing, crafting, cartography
# title: "窗口标题"       # 可选; 字符串
# target: "self"          # 可选; 默认: self

# ---------------------------------------------------------------------------
# break_block - 破坏方块
# ---------------------------------------------------------------------------
# type: break_block
# x: <arg:position.x>     # 可选; 数字; 默认: <arg:position.x>
# y: <arg:position.y>     # 可选; 数字; 默认: <arg:position.y>
# z: <arg:position.z>     # 可选; 数字; 默认: <arg:position.z>

# ---------------------------------------------------------------------------
# place_block - 放置方块
# ---------------------------------------------------------------------------
# type: place_block
# block_state: "custom:example"   # 必填; 字符串
# x: <arg:block.block_x>          # 可选; 数字; 默认: <arg:position.x>
# y: <arg:block.block_y>          # 可选; 数字; 默认: <arg:position.y>
# z: <arg:block.block_z>          # 可选; 数字; 默认: <arg:position.z>

# ---------------------------------------------------------------------------
# update_block_property - 更新方块属性
# ---------------------------------------------------------------------------
# type: update_block_property
# properties:              # 必填; 键值对
#   axis: x
#   age: 7
# x: <arg:block.block_x>   # 可选
# y: <arg:block.block_y>   # 可选
# z: <arg:block.block_z>   # 可选

# ---------------------------------------------------------------------------
# transform_block - 转换方块 (保留全部属性)
# ---------------------------------------------------------------------------
# type: transform_block
# block: custom:palm_log   # 必填; 新方块ID
# properties:              # 可选; 键值对
#   property_a: b
# x: <arg:block.block_x>   # 可选
# y: <arg:block.block_y>   # 可选
# z: <arg:block.block_z>   # 可选

# ---------------------------------------------------------------------------
# drop_loot - 掉落战利品
# ---------------------------------------------------------------------------
# type: drop_loot
# x: <arg:block.block_x> + 0.5   # 可选
# y: <arg:block.block_y> + 0.5   # 可选
# z: <arg:block.block_z> + 0.5   # 可选
# to_inventory: false
# loot:
#   pools: ...

# ---------------------------------------------------------------------------
# update_interaction_tick - 更新交互游戏刻
# ---------------------------------------------------------------------------
# type: update_interaction_tick

# ---------------------------------------------------------------------------
# set_count - 设置物品数量
# ---------------------------------------------------------------------------
# type: set_count
# add: true               # 默认: false
# count: -1               # 必填; 数字
# target: "self"          # 可选; all, self/玩家选择器

# ---------------------------------------------------------------------------
# set_food - 设置饥饿值
# ---------------------------------------------------------------------------
# type: set_food
# add: true               # 可选; 默认: false
# food: 4                 # 必填; 数字 (0~20)
# target: "self"          # 可选

# ---------------------------------------------------------------------------
# set_saturation - 设置饱和度
# ---------------------------------------------------------------------------
# type: set_saturation
# add: true
# saturation: 2.5
# target: "self"          # 可选

# ---------------------------------------------------------------------------
# swing_hand - 挥手
# ---------------------------------------------------------------------------
# type: swing_hand
# hand: main_hand         # 可选; main_hand, off_hand

# ---------------------------------------------------------------------------
# particle - 生成粒子效果
# ---------------------------------------------------------------------------
# type: particle
# particle: minecraft:end_rod    # 必填; 字符串
# x: "<arg:position.x>"         # 可选
# y: "<arg:position.y>"         # 可选
# z: "<arg:position.z>"         # 可选
# count: 5                      # 可选; 默认: 1
# offset_x: 0.3                 # 可选; 默认: 0
# offset_y: 0.3                 # 可选; 默认: 0
# offset_z: 0.3                 # 可选; 默认: 0
# speed: 0                      # 可选; 默认: 0
# # 以下为特定粒子类型的可选参数:
# item: custom:item             # 粒子类型: item
# block_state: default:block    # 粒子类型: block, block_marker, fallind_dust, etc.
# charge: 1.5                   # 粒子类型: sculk_charge
# shriek: 1                     # 粒子类型: shriek
# color: 255,255,255            # 粒子类型: dust
# scale: 1.0                    # 粒子类型: dust
# from: 255,255,255             # 粒子类型: dust_color_transition
# to: 0,0,0
# target_x/y/z: 0               # 粒子类型: vibration, trail
# arrival_time: 10              # 粒子类型: vibration
# duration: 10                  # 粒子类型: trail

# ---------------------------------------------------------------------------
# potion_effect - 添加状态效果
# ---------------------------------------------------------------------------
# type: potion_effect
# potion_effect: minecraft:blindness   # 必填
# duration: 20                  # 可选; 默认: 20
# amplifier: 0                 # 可选; 默认: 0
# ambient: false               # 可选; 是否来自信标
# particles: true              # 可选; 是否显示粒子

# ---------------------------------------------------------------------------
# remove_potion_effect - 移除状态效果
# ---------------------------------------------------------------------------
# type: remove_potion_effect
# potion_effect: minecraft:blindness   # 如果 all=true 则为可选
# all: false                   # 可选; 默认: false

# ---------------------------------------------------------------------------
# leveler_exp - 添加技能/职业经验
# ---------------------------------------------------------------------------
# type: leveler_exp
# plugin: AuraSkills           # 可选; 字符串
# leveler: fishing             # 可选; 职业/技能ID
# count: 10                    # 可选; 数字

# ---------------------------------------------------------------------------
# set_cooldown - 设置冷却时间
# ---------------------------------------------------------------------------
# type: set_cooldown
# time: 1m30s                # 时间字符串 (如: 30s, 1m30s, 1h)
# id: my_cooldown            # 可选; 字符串
# add: false                 # 可选; 是否累加冷却时间

# ---------------------------------------------------------------------------
# remove_cooldown - 移除冷却时间
# ---------------------------------------------------------------------------
# type: remove_cooldown
# id: my_cooldown            # 如果 all=true 则为可选
# all: false                 # 可选; 默认: false

# ---------------------------------------------------------------------------
# play_sound - 播放音效
# ---------------------------------------------------------------------------
# type: play_sound
# sound: minecraft:entity.xxx.xxx
# x: <arg:position.x>         # 可选
# y: <arg:position.y>         # 可选
# z: <arg:position.z>         # 可选
# target: "self"              # 可选; all, self/玩家选择器
# pitch: 1                    # 可选; 默认: 1
# volume: 1                   # 可选; 默认: 1
# source: master              # 可选; music, master, record, weather, block,
#                             #   hostile, neutral, player, ambient, voice, ui

# ---------------------------------------------------------------------------
# cast_mythic_skill - 释放MythicMobs技能
# ---------------------------------------------------------------------------
# type: cast_mythic_skill
# skill: skill_id             # 必填; 字符串
# power: 1.0                  # 可选; 数字; 默认: 1.0

# ---------------------------------------------------------------------------
# spawn_furniture - 生成家具
# ---------------------------------------------------------------------------
# type: spawn_furniture
# furniture_id: "custom:bench"   # 可选; 字符串
# x: <arg:position.x>            # 可选
# y: <arg:position.y>            # 可选
# z: <arg:position.z>            # 可选
# pitch: <arg:position.pitch>    # 可选
# yaw: <arg:position.yaw>        # 可选
# variant: ground                # 可选
# play_sound: true               # 可选; 默认: true

# ---------------------------------------------------------------------------
# remove_furniture - 移除家具
# ---------------------------------------------------------------------------
# type: remove_furniture
# drop_loot: true            # 可选; 默认: true
# play_sound: true           # 可选; 默认: true

# ---------------------------------------------------------------------------
# replace_furniture - 替换家具
# ---------------------------------------------------------------------------
# type: replace_furniture
# furniture_id: "custom:bench"   # 新家具ID
# x: <arg:furniture.x>           # 可选
# y: <arg:furniture.y>           # 可选
# z: <arg:furniture.z>           # 可选
# pitch: <arg:furniture.pitch>   # 可选
# yaw: <arg:furniture.yaw>       # 可选
# variant: ground                # 可选
# drop_loot: true                # 默认: true
# play_sound: true               # 默认: true

# ---------------------------------------------------------------------------
# rotate_furniture - 旋转家具
# ---------------------------------------------------------------------------
# type: rotate_furniture
# degree: 90
# on_success: []             # 成功时执行的函数
# on_failure: []             # 失败时执行的函数

# ---------------------------------------------------------------------------
# teleport - 传送
# ---------------------------------------------------------------------------
# type: teleport
# x: <arg:position.x>        # 必填; 数字
# y: 100                     # 必填; 数字
# z: <arg:position.z> + 5    # 必填; 数字
# pitch: <arg:player.pitch>  # 可选; 默认: 0
# yaw: <arg:player.yaw>      # 可选; 默认: 0
# world: world               # 可选; 字符串

# ---------------------------------------------------------------------------
# toast - 发送弹窗
# ---------------------------------------------------------------------------
# type: toast
# toast: 弹窗文本             # 必填; 字符串
# advancement_type: goal      # 可选; goal, task, challenge; 默认: goal
# icon: minecraft:stone      # 必填; 字符串

# ---------------------------------------------------------------------------
# damage - 伤害玩家
# ---------------------------------------------------------------------------
# type: damage
# target: self               # 可选; all, self/玩家选择器; 默认: self
# amount: 1.0                # 可选; 数字; 默认: 1.0
# damage_type: generic       # 可选; 字符串; 默认: generic

# ---------------------------------------------------------------------------
# set_variable - 设置变量 (可通过 <arg:var_名称> 访问)
# ---------------------------------------------------------------------------
# type: set_variable
# name: my_variable          # 必填; 字符串
# number: 1.0                # 可选; 数字
# as_int: false              # 可选; 默认: false
# text: "你好"               # 可选; 字符串

# ---------------------------------------------------------------------------
# merchant_trade - 打开自定义村民交易界面
# ---------------------------------------------------------------------------
# type: merchant_trade
# title: "自定义奸商"
# offers:
#   - cost_1:
#       item: iron_pickaxe
#       components:          # 可选的组件检查
#         minecraft:enchantments:
#           minecraft:unbreaking: 1
#     cost_2:                # 可选; 第二个收购物品
#       item: cobblestone
#       count: 8
#     result:
#       item: custom:topaz
#       count: 4
#     experience: 3          # 可选; 交易经验
#   - cost_1: stone          # 更多交易选项
#     result: custom:topaz

# ---------------------------------------------------------------------------
# remove_entity - 移除实体
# ---------------------------------------------------------------------------
# type: remove_entity

# ---------------------------------------------------------------------------
# if_else - 条件判断 (执行首个满足条件的函数列)
# ---------------------------------------------------------------------------
# type: if_else
# rules:
#   - conditions:
#       - type: permission
#         permission: group.admin
#     functions:
#       - type: command
#         command: say 管理员你好
#   - conditions:
#       - type: permission
#         permission: group.vip
#     functions:
#       - type: command
#         command: say VIP你好
#   - functions:              # 默认 (无条件)
#       - type: command
#         command: say 玩家你好

# ---------------------------------------------------------------------------
# when - 条件匹配 (switch-case)
# ---------------------------------------------------------------------------
# type: when
# source: <papi:player_world>
# cases:
#   - when: "world"
#     functions:
#       - type: message
#         message: "您位于主世界。"
#   - when:
#       - "world_nether"
#       - "world_the_end"
#     functions:
#       - type: message
#         message: "您正处于危险维度！"
# fallback:                    # 可选; 默认处理
#   - type: message
#     message: "您处于未知世界中。"

# ---------------------------------------------------------------------------
# damage_item - 消耗物品耐久度
# ---------------------------------------------------------------------------
# type: damage_item
# amount: 1                   # 可选; 数字; 默认: 1
# slot: mainhand              # 可选; mainhand, offhand, feet, legs, chest, head

# ---------------------------------------------------------------------------
# cycle_block_property - 循环方块属性
# ---------------------------------------------------------------------------
# type: cycle_block_property
# property: axis              # 必填; 字符串
# inverse: <arg:player.is_sneaking>  # 可选
# x: <arg:block.block_x>      # 可选
# y: <arg:block.block_y>      # 可选
# z: <arg:block.block_z>      # 可选
# # 自定义循环规则:
# rules:
#   north: east
#   east: south
#   south: west
#   west: north

# ---------------------------------------------------------------------------
# set_exp - 设置经验值
# ---------------------------------------------------------------------------
# type: set_exp
# count: 1                    # 必填; 数字
# add: true                   # 可选; 默认: false
# target: "self"              # 可选

# ---------------------------------------------------------------------------
# set_level - 设置经验等级
# ---------------------------------------------------------------------------
# type: set_level
# count: 1                    # 必填; 数字
# add: true                   # 可选; 默认: false
# target: "self"              # 可选

# ---------------------------------------------------------------------------
# play_totem_animation - 播放图腾动画
# ---------------------------------------------------------------------------
# type: play_totem_animation
# item: "custom:topaz"        # 必填; 显示的物品
# sound: minecraft:entity.player.levelup  # 可选
# pitch: 1                    # 可选; 默认: 1
# volume: 1                   # 可选; 默认: 1
# silent: false               # 可选; 默认: false
# target: "self"              # 可选

# ---------------------------------------------------------------------------
# close_inventory - 关闭容器
# ---------------------------------------------------------------------------
# type: close_inventory
# target: "self"              # 可选

# ---------------------------------------------------------------------------
# clear_item - 清理背包物品
# ---------------------------------------------------------------------------
# type: clear_item
# id: "custom:topaz"          # 必填; 字符串
# count: 1                    # 可选; 数字; 默认: 1

# ---------------------------------------------------------------------------
# heal - 治疗玩家
# ---------------------------------------------------------------------------
# type: heal
# amount: 1.0                 # 可选; 数字; 默认: 1.0
# target: "self"              # 可选

# ---------------------------------------------------------------------------
# spawn_mythic_mob - 生成MythicMobs生物
# ---------------------------------------------------------------------------
# type: spawn_mythic_mob
# mob: "test_mob"             # 必填; 字符串
# level: 1.0                  # 可选; 数字; 默认: 1.0
# world: "world"              # 可选; 字符串
# x: "<arg:position.x>"       # 可选
# y: "<arg:position.y>"       # 可选
# z: "<arg:position.z>"       # 可选
# pitch: "<arg:position.pitch>"  # 可选
# yaw: "<arg:position.yaw>"      # 可选

# =============================================================================
# 全部条件类型
# =============================================================================
# 在条件类型前加 "!" 可反转判断逻辑。
# conditions 可放在 events 或 functions 下。

conditions:
  # 逻辑条件
  - type: any_of             # 满足任意条件即可
    terms:
      - type: permission
        permission: "craftengine.vip"
      - type: random
        value: 0.5

  - type: all_of             # 所有条件都必须满足
    terms:
      - type: permission
        permission: "craftengine.vip"
      - type: has_item

  - type: inverted           # 对结果取反
    term:
      type: permission
      permission: "craftengine.admin"

  # 实体/物品检测
  - type: falling_block      # 掉落物是否由下落的方块掉落
  - type: survives_explosion # 1/爆炸半径 概率通过
  - type: has_item           # 检查是否有手持物品

  - type: match_item         # 检查手持物品ID
    id: "minecraft:iron_pickaxe"
    regex: false

  - type: match_item         # 多ID匹配
    id:
      - "minecraft:iron_pickaxe"
      - "minecraft:stone_pickaxe"
    regex: false

  - type: match_block_property  # 检查方块状态
    properties:
      age: 3

  - type: match_block        # 匹配方块类型
    x: <arg:position.x>
    y: <arg:position.y>
    z: <arg:position.z>
    id: minecraft:stone
    regex: false

  - type: match_entity       # 匹配实体类型
    id: minecraft:enderman
    regex: false

  - type: match_furniture_variant  # 匹配家具变体
    variants:
      - wall

  # 魔咒/随机相关
  - type: enchantment        # 检测物品魔咒
    predicate: minecraft:silk_touch>=1   # > >= = < <=

  - type: table_bonus        # 以魔咒等级为索引的概率表
    enchantment: minecraft:fortune
    chances:
      - 0.1
      - 0.5
      - 0.8
      - 1

  - type: random             # 随机概率
    value: 0.1               # 10%

  # 权限/表达式
  - type: permission         # 检查权限
    permission: "craftengine.admin"

  - type: expression         # 检查表达式
    expression: "<papi:farming_level> >= 10"

  # 字符串相关
  - type: string_equals      # 字符串相等
    value1: "<arg:player.name>"
    value2: "玩家A"

  - type: string_contains    # 字符串包含
    value1: "<arg:player.name>"
    value2: "A"

  - type: regex              # 正则匹配
    value: "<arg:player.name>"
    regex: "[a-Z]"

  - type: is_null            # 检查参数是否为空
    argument: "player.main_hand_item"

  - type: hand               # 检查交互手
    hand: main_hand          # main_hand, off_hand

  - type: on_cooldown        # 检查是否在冷却中
    id: my_cooldown_id

  # 位置/距离
  - type: worldguard:region  # 检查WorldGuard区域
    mode: 1                  # 1=并集, 2=交集
    regions:
      - A
      - B

  - type: distance           # 检测距离
    min: 0
    max: 32

  - type: test_flag          # 检查权限标志
    flag: break              # break, place, interact, open_container

  # 玩家状态
  - type: has_player         # 检测玩家是否存在
  - type: is_bedrock_player  # 检测是否基岩版玩家

  - type: inventory_has_item # 检测背包物品
    id: "minecraft:iron_pickaxe"
    count: 1
