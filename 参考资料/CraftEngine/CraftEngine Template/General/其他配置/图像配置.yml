# =============================================================================
# CraftEngine 图像配置模板
# =============================================================================
# 基于 CraftEngine 官方文档: configuration/image.md
# =============================================================================
#
# 图像通过字体系统将 Unicode 字符映射到图片文件来渲染纹理。
# 使用 "images:" 作为根键。

images:
  # ===========================================================================
  # 1. 单字符位图
  # ===========================================================================
  custom:item_browser:
    height: 140                          # 图片高度 (像素)
    ascent: 18                           # 上升高度 (必须 <= height)
    font: minecraft:internal             # 字体命名空间:路径
    file: minecraft:font/gui/custom/item_browser.png  # 图片文件路径
    # char: '뀀'                     # 可选; 不填写则自动分配

  # ===========================================================================
  # 2. 多字符位图 (手动指定字符)
  # ===========================================================================
  custom:icons:
    height: 10
    ascent: 9
    font: minecraft:icons
    file: minecraft:font/image/icons.png
    chars:
      - '뀀뀁뀂'           # 第一行: 三个字符
      - '뀃뀄뀅'           # 第二行: 三个字符

  # ===========================================================================
  # 3. 多字符位图 (自动分配字符)
  # ===========================================================================
  custom:emojis:
    height: 10
    ascent: 9
    font: minecraft:icons
    file: minecraft:font/image/emojis.png
    grid_size: 2,3                       # 行数,列数 - 自动分配字符

  # ===========================================================================
  # 4. 引用 (为多字符精灵图中的某个图设定别名)
  # ===========================================================================
  custom:angry_emoji:
    ref: custom:emojis:0:1               # 引用 ID:行:列

  # 或使用显式行/列
  custom:happy_emoji:
    ref: custom:emojis
    row: 0
    column: 0

  # ===========================================================================
  # 5. 在语言文件中使用 (font 必须为 minecraft:default)
  # ===========================================================================
  custom:custom_ui:
    height: 140
    ascent: 18
    font: minecraft:default              # 必须使用默认字体
    file: minecraft:font/gui/custom/gui.png
