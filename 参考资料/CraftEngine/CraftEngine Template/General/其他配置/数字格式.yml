# =============================================================================
# CraftEngine 数字格式参考模板
# =============================================================================
# 基于 CraftEngine 官方文档: reference/number_format.md
# =============================================================================
#
# 用于战利品数量、冷却时间、随机数值等场景。
# 部分地方支持简写形式 (如 count: 1 等价于 type: constant, value: 1)

# ===========================================================================
# 1. 常量
# ===========================================================================
count:
  type: constant
  value: 1
# 简写: count: 1

# ===========================================================================
# 2. 均匀随机数 (uniform)
# ===========================================================================
count:
  type: uniform
  min: 1
  max: 3
# 简写: count: 1~3

# 嵌套使用:
count:
  type: uniform
  min:
    type: uniform
    min: 2
    max: 7
  max: "<papi:skilllevel_farming>*5~<papi:skilllevel_farming>*10"

# ===========================================================================
# 3. 表达式 (expression)
# ===========================================================================
count:
  type: expression
  expression: "20 + 70 / 2"
# 简写: count: "<papi:skilllevel_farming> / 20 + 5"

# ===========================================================================
# 4. 二项分布 (binomial)
# ===========================================================================
count:
  type: binomial
  extra: 10                   # 独立试验次数
  probability: 0.2            # 每次试验的成功概率

# ===========================================================================
# 5. 高斯/正态分布 (gaussian)
# ===========================================================================
count:
  type: gaussian
  min: 10                     # 最小值限制
  max: 20                     # 最大值限制
  mean: 15                    # 可选; 均值 (默认: (min+max)/2)
  std_dev: 1                  # 可选; 标准差 (默认: (max-min)/6)
  max_attempts: 128           # 可选; 最大生成尝试次数 (默认: 128)

# ===========================================================================
# 6. 偏态分布 (skew_normal)
# ===========================================================================
count:
  type: skew_normal
  min: 0
  max: 100
  mean: 50                    # 可选; 默认: (min+max)/2
  std_dev: 10                 # 可选; 默认: (max-min)/6
  skewness: 0.5               # 可选; 偏度 [-0.995, 0.995]; 默认: 0
  max_attempts: 128

# ===========================================================================
# 7. 对数正态分布 (log_normal)
# ===========================================================================
count:
  type: log_normal
  min: 1                      # 必须 > 0
  max: 1000
  mean: 50                    # 方案一: 真实平均值
  std_dev: 20                 # 真实标准差
  # 或方案二: 直接提供对数参数
  # location: 3.5             # μ: 自然对数平均值
  # scale: 0.5                # σ: 自然对数标准差
  max_attempts: 128

# ===========================================================================
# 8. 三角分布 (triangle)
# ===========================================================================
count:
  type: triangle
  min: 10
  max: 100
  mode: 30                    # 可选; 众数 (默认: (min+max)/2)

# ===========================================================================
# 9. 贝塔分布 (beta)
# ===========================================================================
count:
  type: beta
  min: 0                      # 可选; 默认: 0.0
  max: 10                     # 可选; 默认: 1.0
  alpha: 5.0                  # 可选; Alpha形状参数 (默认: 2.0)
  beta: 2.0                   # 可选; Beta形状参数 (默认: 2.0)

# ===========================================================================
# 10. 加权列表 (weighted)
# ===========================================================================
count:
  type: weighted
  weights:                     # "数值: 权重" 映射表
    "10": 70                   # 70% 概率返回 10
    "50": 25                   # 25% 概率返回 50
    "200": 5                   # 5% 概率返回 200

# ===========================================================================
# 11. 指数分布 (exponential)
# ===========================================================================
count:
  type: exponential
  min: 0                      # 可选; 默认: 0.0
  max: 60                     # 可选; 默认: 双精度最大值
  mean: 10                    # 平均间隔 (或使用 lambda: 速率参数)
