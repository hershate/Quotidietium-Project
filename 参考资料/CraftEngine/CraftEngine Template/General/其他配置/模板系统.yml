# =============================================================================
# CraftEngine 模板系统参考
# =============================================================================
# 基于 CraftEngine 官方文档: reference/template.md
# =============================================================================
#
# 模板系统用于减少重复配置，支持参数、覆写、合并、配置工厂等。

# ===========================================================================
# 1. 基础模板定义
# ===========================================================================
templates:
  custom:apple_template:
    material: apple
    data:
      food:
        nutrition: "${nutrition}"         # 参数占位符: ${参数名}
        saturation: "${saturation}"

# ===========================================================================
# 使用模板
# ===========================================================================
items:
  custom:custom_apple:
    template: custom:apple_template       # 引用模板
    arguments:
      nutrition: 1
      saturation: 2.5

  # =========================================================================
  # 2. 多模板组合
  # =========================================================================
  custom:custom_item:
    template:
      - custom:first_template
      - custom:second_template           # 后列出的模板覆盖先列的

  # =========================================================================
  # 3. 合并 (merges) — 深度整合配置
  # =========================================================================
  custom:custom_bread:
    template: custom:apple_template
    arguments:
      nutrition: 1
      saturation: 2.5
    merges:                               # 深度合并到现有配置
      data:
        food:
          can_always_eat: true

  # =========================================================================
  # 4. 覆写 (overrides) — 完全替换配置路径
  # =========================================================================
  custom:custom_bread_override:
    template: custom:apple_template
    arguments:
      nutrition: 1
      saturation: 2.5
    overrides:                            # 完全替换指定路径
      material: bread

  # =========================================================================
  # 5. 使用 ${__NAMESPACE__} 和 ${__ID__}
  # =========================================================================
  custom:palm_log:
    template: custom:my_template
templates:
  custom:my_template:
    data:
      item_name: "<lang:item.${__NAMESPACE__}.${__ID__}>"
      # 展开后: "<lang:item.custom.palm_log>"

  # =========================================================================
  # 6. 扩展参数类型
  # =========================================================================
  # 6a. 列表参数
  # arguments:
  #   arg1:
  #     - value1
  #     - value2

  # 6b. 映射参数 (含 type 键需加 __skip_template_argument__)
  # arguments:
  #   hitbox:
  #     __skip_template_argument__: {}
  #     type: shulker
  #     scale: 2

  # 6c. 条件参数 (condition)
  # arguments:
  #   leaves_model:
  #     type: condition
  #     condition: "${tintable:-false}"
  #     on_true: leaves
  #     on_false: cube_all

  # 6d. 条件匹配 (when)
  # arguments:
  #   slot:
  #     type: when
  #     source: "${part}"
  #     when:
  #       helmet: head
  #       chestplate: chest
  #       leggings: legs
  #       boots: feet
  #     fallback: any

  # 6e. 大小写转换 (to_upper_case / to_lower_case)
  # arguments:
  #   tier.uppercase:
  #     type: to_upper_case
  #     value: "${tier}"
  #     locale: en

  # 6f. 自增整数 (self_increase_int)
  # arguments:
  #   id:
  #     type: self_increase_int
  #     from: 0
  #     to: 20
  #     step: 1
  #     step_interval: 1

  # 6g. 表达式 (expression)
  # arguments:
  #   damage:
  #     type: expression
  #     expression: "${base_damage:-10d} * ${damage_multiplier:-1d}"
  #     value_type: double
  #     # int/double/short/long/float/boolean/byte

# ===========================================================================
# 7. 配置工厂 (config_factory) — 批量实例化
# ===========================================================================
config_factory#wool:
  blueprint:
    items:
      "custom:${color}_wool":
        material: ${color}_wool
        data::
          item_name: "<lang:block.minecraft.${color}_wool>"
    recipes:
      "custom:${color}_wool":
        type: shaped
        pattern:
          - AA
          - AB
        ingredients:
          A: "minecraft:white_wool"
          B: "minecraft:${color}_dye"
        result:
          id: ${__NAMESPACE__}:${__ID__}
          count: ${result_count:-3}
  instances:
    - color: red
      result_count: 5
    - color: blue
      result_count: 2
    - color: orange
