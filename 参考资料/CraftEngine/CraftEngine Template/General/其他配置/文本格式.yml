# =============================================================================
# CraftEngine 文本格式参考模板
# =============================================================================
# 基于 CraftEngine 官方文档: reference/text_format.md
# =============================================================================
#
# CraftEngine 使用 MiniMessage 格式。
# 官网: https://docs.papermc.io/adventure/minimessage/format/

# ===========================================================================
# 插件提供的附加标签
# ===========================================================================
items:
  custom:example_item:
    material: paper
    data:
      # <!i> 移除斜体, <#RRGGBB> 设置颜色
      item_name: "<!i><#FF8C00>示例物品"

      # <shift:像素值> — 偏移字符
      # item_name: "<!i><shift:-100><#FF8C00>偏移文本"

      lore:
        # <papi:占位符:[默认值]> — PlaceholderAPI 占位符
        - "<!i><gray>玩家: <papi:player_name>"
        # <image:命名空间:路径:[行]:[列]:[格式]> — 显示图像
        - "<!i><white><image:custom:icons><#FF8C00>带图标的文本"
        # <i18n:标识符> — 服务端翻译
        - "<!i><gray><i18n:item.example_lore>"
        # <l10n:标识符> — 客户端翻译
        - "<!i><gray><l10n:item.example_lore>"
        # <expr:格式:表达式> — 数学运算
        - "<!i><gray><expr:0.##:'70 / 8'>"
        # <global:标识符:[参数...]> — 全局变量
        - "<!i><global:coin> 金币"
        # <arg:标识符> — 上下文参数
        - "<!i><gray>位置: <arg:position.x>, <arg:position.y>, <arg:position.z>"
        # <viewer_arg:标识符> — 观察者参数
        - "<!i><gray>你好, <viewer_arg:player.name>"
        # <viewer_papi:占位符:[默认值]> — 观察者PAPI
        # <rel_papi:占位符:[默认值]> — 关系型PAPI

# ===========================================================================
# 标签速查
# ===========================================================================
# <!i>                 移除斜体
# <#RRGGBB>            十六进制颜色
# <red>/<blue>/<gray>  原版颜色代码
# <bold>/<b>           粗体
# <hover:show_text:'文本'>  悬停显示文本
# <lang:翻译键>        Minecraft 语言键

# <shift:像素值>       偏移字符
# <papi:占位符:默认值>  PlaceholderAPI
# <viewer_papi:占位符:默认值>  观察者PAPI
# <rel_papi:占位符:默认值>     关系型PAPI

# <image:ns:path>      显示图像
# <image:ns:path:行:列>
# <image:ns:path:行:列:'格式'>

# <i18n:key>           服务端翻译 (实际替换)
# <l10n:key>           客户端翻译 (发送标签)
# <expr:格式:表达式>   数学运算
# <arg:标识符>         上下文参数
# <arg:random>         随机数 (0~1)
# <arg:last_random>    上一个随机数
# <viewer_arg:标识符>  观察者上下文参数
# <global:标识符:参数> 全局变量

# 下方标签需要 CustomNameplates 插件:
# <bubble:id:left:right:'文本'>    气泡文字
# <nameplate:id:left:right:'文本'> 铭牌文字
# <background:id:left:right:'文本'> 背景文字

# ===========================================================================
# 示例: 完整物品名
# ===========================================================================
  custom:fancy_item:
    material: diamond
    data:
      item_name: "<!i><white><image:custom:icons:0:0><#FF8C00>黄玉物品"
