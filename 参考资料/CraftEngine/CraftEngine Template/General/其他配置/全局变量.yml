# =============================================================================
# CraftEngine 全局变量配置模板
# =============================================================================
# 基于 CraftEngine 官方文档: configuration/global_variable.md
# =============================================================================
#
# 使用 "global_variables:" 作为根键。
# 全局变量可在任意上下文中访问 (表达式、物品数据等)。
# 使用方式: <global:变量名> 或 <global:变量名:'参数1':'参数2'>

global_variables:
  # ===========================================================================
  # 1. 简单常量
  # ===========================================================================
  coin: "<!shadow><#FFD700>$</#FFD700></!shadow>"

  # ===========================================================================
  # 2. 带参数的变量 (<arg:0>, <arg:1> 为位置参数)
  # ===========================================================================
  item_prefix: "<!i><#FF8C00><arg:0>的<arg:1>"

  # ===========================================================================
  # 3. 用于其他插件的变量 (通过数据包替换)
  # ===========================================================================
  coin_without_shadow: "<!shadow><image:custom:icons>"

# ===========================================================================
# 使用示例
# ===========================================================================
items:
  # <global:coin> 显示金币图标
  custom:gold_coin:
    material: gold_nugget
    data:
      item_name: "<!i><global:coin> 金币"

  # <global:item_prefix:'玩家名':'物品名'> 显示带前缀的名称
  custom:topaz_rod:
    data:
      item_name: "<global:item_prefix:'<arg:player.name>':'<i18n:item.topaz_rod>'>"

# 在其他插件中使用 (注释示例):
# line: "<global:coin_without_shadow> 我的金币: %vault_eco_balance%"
