# =============================================================================
# CraftEngine 音效配置模板
# =============================================================================
# 基于 CraftEngine 官方文档: configuration/sound.md
# =============================================================================
#
# 使用 "sounds:" 作为根键。
# 音效事件ID格式: "minecraft:custom_xxx"
# 实际的音效文件位于资源包的 sounds 目录。

sounds:
  # ===========================================================================
  # 1. 简单音效事件 (单个音效)
  # ===========================================================================
  minecraft:custom_block.place:
    replace: false                       # 是否替换已存在的同名事件
    subtitle: subtitles.custom_block.place  # 字幕翻译键
    sounds:
      - "block/custom_block_1"           # 音效文件路径 (不含扩展名)

  # ===========================================================================
  # 2. 加权多音效事件
  # ===========================================================================
  minecraft:custom_ambient.custom_biome:
    replace: false
    subtitle: subtitles.custom_ambient.custom_biome
    sounds:
      - name: "ambient/custom_biome_1"   # 音效文件路径
        volume: 0.4                       # 音量 (0.0~1.0)
        weight: 3                         # 权重 (概率 = weight/总和)
      - name: "ambient/custom_biome_2"
        volume: 0.4
        weight: 7
      - name: "ambient/custom_biome_3"
        volume: 0.4
        weight: 10
        stream: false                    # 是否流式加载 (长音效用 true)
        attenuation_distance: 16         # 衰减距离
        preload: false                   # 是否预加载
        type: "file"                     # file = 文件, event = 引用其他事件
