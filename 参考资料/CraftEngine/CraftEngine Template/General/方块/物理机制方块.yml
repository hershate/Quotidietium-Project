# ============================================================================
# 附录 B: 属性类型速查
# ============================================================================
# boolean              - true / false
# int                  - 整数范围，如 range: 1~7
# string               - 枚举值，如 values: [red, green, blue]
# direction            - north, south, west, east, up, down
# horizontal_direction - north, south, west, east
# axis                 - x, y, z
# single_block_half    - top, bottom
# double_block_half    - upper, lower
# hinge                - left, right
# slab_type            - top, bottom, double
# stairs_shape         - straight, inner_left, inner_right, outer_left, outer_right
# sofa_shape           - straight, inner_left, inner_right
# anchor_type          - floor, wall, ceiling
#
# 每个属性值的组合构成一个内部状态。
# 变体总数 = 各属性可能的值的数量的乘积。
# 例如: waterlogged(2) × persistent(2) × distance(7) = 28 个内部状态
# ============================================================================


# ============================================================================
# 附录 C: 常用 auto_state 组速查
# ============================================================================
# solid                          - 音符盒 + 蘑菇方块（最通用）
# note_block                     - 仅音符盒（可用数量最多）
# mushroom_stem                  - 仅蘑菇柄
# red_mushroom_block             - 红色蘑菇方块
# brown_mushroom_block           - 棕色蘑菇方块
# mushroom                       - 所有蘑菇方块
# tintable_leaves                - 可着色树叶（不含水）
# waterlogged_tintable_leaves    - 可着色树叶（含水）
# non_tintable_leaves            - 不可着色树叶（不含水）
# waterlogged_non_tintable_leaves - 不可着色树叶（含水）
# leaves                         - 所有树叶（不含水）
# waterlogged_leaves             - 所有树叶（含水）
# lower_tripwire                 - 矮碰撞箱
# higher_tripwire                - 高碰撞箱
# tripwire                       - 所有绊线
# sapling                        - 所有树苗
# pressure_plate                 - 所有测重压力板
# cactus                         - 仙人掌
# sugar_cane                     - 甘蔗
# weeping_vine                   - 垂泪藤
# twisting_vine                  - 缠怨藤
# cave_vine                      - 洞穴藤蔓
# kelp                           - 海带
# chorus                         - 紫颂植株
# ============================================================================


# ============================================================================
# 附录 D: 方块设置关键项速查
# ============================================================================
# 稳定设置（完全支持）:
#   hardness              - 硬度（默认 2.0）
#   resistance            - 爆炸抗性（默认 2.0）
#   push_reaction         - 活塞反应: NORMAL / DESTROY / BLOCK / IGNORE / PUSH_ONLY
#   map_color             - 地图基色编号
#   burnable              - 熔岩是否可在其上生成火
#   fire_spread_chance    - 火焰蔓延几率 (0~100)
#   burn_chance           - 烧毁几率 (0~100)
#   item                  - 对应的物品 ID（鼠标中键选取）
#   replaceable           - 是否可被其他方块替换
#   is_redstone_conductor - 是否传导红石信号
#   is_suffocating        - 生物在其内部是否窒息
#   is_view_blocking      - 是否阻挡视野
#   sounds                - 音效配置（break/step/place/hit/fall）
#   require_correct_tools - 是否需要合适工具
#   respect_tool_component - 是否尊重 minecraft:tool 组件
#   correct_tools         - 合适挖掘工具列表
#   incorrect_tool_dig_speed - 错误工具挖掘惩罚 (0~1)
#   tags                  - 方块标签
#   instrument            - 音符盒乐器类型
#   fluid_state           - 流体状态: empty / water
#   support_shape         - 手动指定的支撑形状
#
# 不稳定设置（仅非玩家实体生效）:
#   bounce_restitution    - 弹性碰撞系数（0~1, 26.2+）
#   friction              - 阻力系数
#   jump_factor           - 跳跃乘数
#   speed_factor          - 速度乘数
#   luminance             - 发光等级（0~15）
#   can_occlude           - 是否阻挡光线
#   block_light           - 散射光照等级
#   propagate_skylight    - 是否传播天空光照
# ============================================================================
