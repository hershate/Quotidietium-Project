# =============================================================================
# CraftEngine 字体配置文件模板
# 参考 Wiki: 参考资料/CraftEngine/CraftEngine Wiki/configuration/font.md
# =============================================================================
# 路径说明:
#   本文件内容应写入资源包的 assets/<namespace>/font/default.json。
#   如果你已有 default.json，只需将 providers 条目追加到现有数组末尾。
#
# 命名空间:
#   将下文中所有 <namespace> 替换为你的自定义命名空间。
# =============================================================================

# =============================================================================
# 1. TTF (TrueType 矢量字体)
#    Wiki 参考: font.md 第 10-28 行
# =============================================================================
providers:
  # ---------------------------------------------------------------------------
  # 1a. 基础 TTF 字体提供器
  # ---------------------------------------------------------------------------
  - type: ttf                                          # << 固定值 "ttf", 不可修改
    file: "<namespace>:<font_filename>.ttf"             # << CHANGE THIS  例: "my_mod:custom_font.ttf"
    oversample: <整数>                                  # << CHANGE THIS  过采样倍率, 例: 10
    size: <整数>                                        # << CHANGE THIS  字号大小, 例: 11

  # ---------------------------------------------------------------------------
  # 1b. 多字体示例 (按需取消注释并重复)
  #     如需在同一资源包中加载多套 TTF 字体，重复此结构即可。
  # ---------------------------------------------------------------------------
  # - type: ttf
  #   file: "<namespace>:<another_font>.ttf"            # << CHANGE THIS
  #   oversample: <整数>                                 # << CHANGE THIS
  #   size: <整数>                                       # << CHANGE THIS

# =============================================================================
# 2. 位图字体 (Bitmap)
#    Wiki 参考: font.md 第 32-38 行
# =============================================================================
# Wiki 说明:
#   如需替换原版字符图片，直接将 PNG 文件放置在资源包对应路径中即可，
#   无需在 default.json 中额外编写 JSON 提供器配置。
#
# PNG 文件放置路径:
#   assets/<namespace>/textures/font/<filename>.png     # << CHANGE THIS
#
# 完整参考: https://zh.minecraft.wiki/w/自定义字体#bitmap
# =============================================================================

# =============================================================================
# 3. Unihex 字体
#    Wiki 参考: font.md 第 40-44 行
# =============================================================================
# Wiki 说明:
#   Unihex 字体相对不常见且很少使用。
#   具体配置方式请参考 Minecraft Wiki:
#   https://zh.minecraft.wiki/w/自定义字体#unihex
# =============================================================================

# =============================================================================
# 资源包目录结构总览
# =============================================================================
# pack.mcmeta
# assets/
#   └── <namespace>/                           # << CHANGE THIS (自定义命名空间)
#        ├── font/
#        │   └── default.json                  # ← 本模板中的 providers 写入此文件
#        │   └── <font_file>.ttf               # << CHANGE THIS (TTF 字体文件)
#        └── textures/
#             └── font/                        # ← 位图 PNG 文件放置目录
# =============================================================================
