# =============================================================================
# CraftEngine 家具配置模板
# 本文件展示了从最简到最完整的家具配置方式，涵盖所有可配置部分。
#
# 家具结构速览:
#   furniture:                       # 配置区域 — 可定义在任意配置文件夹中的任意配置文件中
#     <命名空间>:<路径>:              # 家具 ID — 可在其他地方通过此 ID 引用
#       settings:                    # 家具设置 — 可选，基本属性（物品绑定、音效、硬度）
#       behavior:                    # 家具行为 — 可选，机制性行为（存储、发光、物品展示）
#       variants:                    # 家具变体 — 必填，决定外观和交互体积
#         ground:                    # 地面变体 — 放置在地面上的形态
#         wall:                      # 墙壁变体 — 挂在墙面上的形态
#         ceiling:                   # 天花板变体 — 挂在天花板下的形态
#       loot:                        # 战利品表 — 可选，被破坏时掉落什么
#       events:                      # 事件     — 可选，对玩家交互的反应（右键、放置、破坏）
#
# 元素 (element) 类型:
#   item_display:    物品展示实体 — 最常用，渲染静态物品模型
#   text_display:    文本展示实体 — 渲染悬浮文字
#   item:            掉落物实体   — 渲染旋转的掉落物形式
#   armor_stand:     盔甲架实体   — 基于盔甲架渲染物品
#   better_model:    BetterModel 模型
#   model_engine:    ModelEngine 模型
#
# 判定箱 (hitbox) 类型:
#   interaction:     无碰撞判定箱   — 仅用于交互/坐垫，不阻挡移动
#   shulker:         硬碰撞判定箱   — 实体无法穿过，类似实体方块
#   happy_ghast:     硬/软碰撞判定箱 — 可切换硬碰撞或软碰撞
#   custom:          软碰撞判定箱   — 基于任意实体的自定义判定箱
#
# 参考资料（基于本地文档）:
#   CraftEngine Wiki/configuration/furniture.md
#   CraftEngine Wiki/configuration/furniture/settings.md
#   CraftEngine Wiki/configuration/furniture/variants.md
#   CraftEngine Wiki/configuration/furniture/behaviors.md
# =============================================================================

# =============================================================================
# 全局 furniture 配置区域
# 所有自定义家具都定义在此键下。可分散在多个配置文件中，插件会自动合并。
# =============================================================================
furniture:

  # ===========================================================================
  # 示例 1: 简单装饰性家具
  # 仅包含一个元素，无判定箱，纯粹作为装饰品存在。
  # 这是一个家具所需的最少配置。
  # ===========================================================================
  custom:simple_vase:

    # ---------- 家具设置 ----------
    settings:
      # item: 绑定到该家具的物品 ID。在创造模式使用鼠标中键点击家具来获取物品。
      item: custom:simple_vase

      # sounds: 家具在不同事件下的音效。
      # break: 破坏时播放 / place: 放置时播放 / hit: 击打时播放
      sounds:
        break: minecraft:block.glass.break
        place: minecraft:block.glass.place
        hit: minecraft:block.glass.hit

      # hit_times: 玩家需要击打多少次才能破坏此家具（类似方块硬度）。
      # 默认值: 1
      hit_times: 2

    # ---------- 家具变体 ----------
    variants:
      # ground: 地面变体 — 默认放置形态
      ground:
        # loot_spawn_offset: 掉落物生成偏移，防止掉落物卡在家具内部。
        # 格式: x,y,z（相对于家具坐标）
        loot_spawn_offset: 0.5,0.5,0

        # ---------- 展示元素 ----------
        # 元素列表，一个家具可以由多个元素拼接而成。
        elements:

          # --- 元素 1: 花瓶主体 ---
          # type: item_display 表示这是一个物品展示实体
          - type: item_display  # 可选，默认值: item_display

            # item: 该元素显示的物品（模型）
            item: custom:simple_vase

            # display_transform: 物品模型的显示变换方式
            # 可选值: none / third_person_left_hand / third_person_right_hand
            #         first_person_left_hand / first_person_right_hand
            #         head / gui / ground / fixed / on_shelf
            display_transform: none

            # billboard: 元素面朝玩家的方式
            #   fixed:      固定朝向（不跟随玩家视角）
            #   vertical:   仅固定垂直轴，水平跟随玩家
            #   horizontal: 仅固定水平轴，垂直跟随玩家
            #   center:     始终朝向玩家中心
            billboard: fixed

            # position: 元素锚点在方块内的位置（相对于家具位置的左下前角）。
            # 范围 0.0~1.0 表示方块内坐标。
            # 格式: x,y,z
            position: 0.5,0,0

            # translation: 展示实体自身的位移（NBT 属性）。
            # position 修改实体的坐标，translation 是实体视觉上的偏移。
            # 格式: x,y,z
            translation: 0,0.5,0

            # scale: 元素的缩放比例
            # 格式: 单一数值（等比缩放）或 x,y,z（分别设定）
            # scale: 1

  # ===========================================================================
  # 示例 2: 带座位的椅子
  # 包含一个元素和一个 shulker 判定箱，判定箱内含座位定义。
  # 玩家可以右键坐在椅子上，也可以站在椅子上面。
  # ===========================================================================
  custom:wooden_chair:

    # ---------- 家具设置 ----------
    settings:
      item: custom:wooden_chair
      sounds:
        break: minecraft:block.wood.break
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
      hit_times: 3

      # correct_tools: 适合挖掘此家具的工具列表。
      # 支持原版工具标签（#minecraft:axes）和具体物品 ID。
      correct_tools:
        - "#minecraft:axes"

    # ---------- 家具变体 ----------
    variants:
      ground:
        loot_spawn_offset: 0.5,0.5,0

        elements:
          # 椅子主体模型
          - type: item_display
            item: custom:wooden_chair
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.5,0

        # ---------- 判定箱 ----------
        # 判定箱列表，一个家具可以有多个判定箱。
        hitboxes:

          # --- 判定箱 1: 硬碰撞 + 座位 ---
          # type: shulker 是硬碰撞判定箱，实体无法穿过。
          - type: shulker

            # position: 判定箱锚点在方块内的位置
            position: 0,0,0

            # scale: 判定箱尺寸
            # 格式: 单一数值（1 = 1x1x1 方块）或 width,height
            # 等价于 width: 1, height: 1
            scale: 1,1

            # peek: 潜影贝缩壳程度 (0~100)
            # 0 = 完全展开（最大碰撞体积）/ 100 = 完全缩回（无碰撞）
            # 默认值: 100
            peek: 100

            # direction: 判定箱的相对朝向
            # up / down / north / west / east / south
            direction: up

            # 交互设置
            # blocks_building: 是否阻挡方块放置
            blocks_building: true
            # interactive: 交互实体是否可交互
            interactive: true
            # interaction_entity: 是否额外生成一个交互实体以改善交互体验
            interaction_entity: true

            # ---------- 座位 ----------
            # seats: 此判定箱提供的座位列表。
            # 每个座位格式: "x,y,z" 或 "x,y,z yaw"
            #   x,y,z:  玩家入座后相对于家具的位置
            #   yaw:    可选的强制朝向角度，不指定则玩家可自由旋转
            seats:
              - 0,0.35,-0.15 0   # 座位1: 朝向北(0度)，位于椅子前半部
              - 1,0.35,-0.15 0   # 座位2: 如果椅子宽度为2格

  # ===========================================================================
  # 示例 3: 多元素桌子（带复杂判定箱）
  # 由多个元素拼接而成的大型家具，包含多个判定箱精细控制碰撞体积。
  # ===========================================================================
  custom:dining_table:

    # ---------- 家具设置 ----------
    settings:
      item: custom:dining_table
      sounds:
        break: minecraft:block.wood.break
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
      hit_times: 5
      correct_tools:
        - "#minecraft:axes"

      # adventure_mode_breaking: 冒险模式是否允许破坏
      adventure_mode_breaking: false

    # ---------- 家具变体 ----------
    variants:
      ground:
        loot_spawn_offset: 0.5,0.8,0

        # ---------- 元素 ----------
        elements:

          # --- 元素 1: 桌面（大平板）---
          - type: item_display
            item: custom:dining_table_top
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.85,0
            scale: 1

          # --- 元素 2: 桌腿（前左）---
          - type: item_display
            item: custom:dining_table_leg
            display_transform: none
            billboard: fixed
            position: 0.15,0,0.15
            translation: 0,0.1,0

          # --- 元素 3: 桌腿（前右）---
          - type: item_display
            item: custom:dining_table_leg
            display_transform: none
            billboard: fixed
            position: 0.85,0,0.15
            translation: 0,0.1,0

          # --- 元素 4: 桌腿（后左）---
          - type: item_display
            item: custom:dining_table_leg
            display_transform: none
            billboard: fixed
            position: 0.15,0,0.85
            translation: 0,0.1,0

          # --- 元素 5: 桌腿（后右）---
          - type: item_display
            item: custom:dining_table_leg
            display_transform: none
            billboard: fixed
            position: 0.85,0,0.85
            translation: 0,0.1,0

        # ---------- 判定箱 ----------
        hitboxes:

          # --- 桌面判定箱（硬碰撞，阻挡通行）---
          - type: shulker
            position: 0,0.75,0
            scale: 1,0.85
            peek: 100
            direction: up
            blocks_building: true
            interactive: false
            interaction_entity: false

          # --- 桌腿判定箱（硬碰撞）---
          # 四根独立的细判定箱模拟桌腿碰撞
          - type: shulker
            position: 0.1,0,0.1
            scale: 0.2,0.75
            peek: 100
            direction: up
            blocks_building: true
            interactive: false

          - type: shulker
            position: 0.7,0,0.1
            scale: 0.2,0.75
            peek: 100
            direction: up
            blocks_building: true
            interactive: false

          - type: shulker
            position: 0.1,0,0.7
            scale: 0.2,0.75
            peek: 100
            direction: up
            blocks_building: true
            interactive: false

          - type: shulker
            position: 0.7,0,0.7
            scale: 0.2,0.75
            peek: 100
            direction: up
            blocks_building: true
            interactive: false

          # --- 座位判定箱（无碰撞，仅用于交互入座）---
          - type: interaction
            position: 0,0,0
            scale: 1,0.75
            blocks_building: false
            interactive: true
            # 可在此判定箱使用物品（如放置盘子）
            can_use_item_on: true
            # 投影物是否可击中此判定箱
            can_be_hit_by_projectile: false
            seats:
              - 0.2,0.4,0.5 0
              - 0.5,0.4,0.2 90
              - 0.8,0.4,0.5 180

  # ===========================================================================
  # 示例 4: 墙壁挂饰（wall 变体）
  # 挂在墙面上的家具。使用 wall 变体。
  # 注意: wall 变体需要为 position 设置微小偏移，否则可能出现黑色渲染。
  # 通过设置反向 translation 将模型恢复到正确视觉位置。
  # ===========================================================================
  custom:wall_painting:

    # ---------- 家具设置 ----------
    settings:
      item: custom:wall_painting
      sounds:
        break: minecraft:block.scaffolding.break
        place: minecraft:block.scaffolding.place
        hit: minecraft:block.scaffolding.hit
      hit_times: 2

    # ---------- 家具变体 ----------
    variants:
      # wall: 墙壁变体 — 挂在墙面上
      # 家具物品需要配置 wall_block_item 行为才能放置到墙上。
      wall:
        loot_spawn_offset: 0.5,0.5,0

        elements:
          # ⚠️ wall/ceiling 变体必须使用微小的 position 偏移来避免黑色渲染
          # 然后用反向 translation 拉回正确位置
          - type: item_display
            item: custom:wall_painting
            display_transform: none
            billboard: fixed
            # position 向前(z+0.01)做微小偏移，避免与墙壁共面而变黑
            position: 0.5,0,0.01
            # translation 向后(z-0.01)拉回，保持视觉位置正确
            translation: 0,0.5,-0.01
            scale: 1

        # ---------- 判定箱 ----------
        hitboxes:
          # 无碰撞判定箱，仅用于交互（破坏/右键等）
          - type: interaction
            position: 0,0,0
            scale: 1,1
            blocks_building: false
            interactive: true
            can_use_item_on: false

      # 如果也需要地面放置形态，可以同时配置 ground 变体
      ground:
        loot_spawn_offset: 0.5,0.5,0
        elements:
          - type: item_display
            item: custom:wall_painting
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.5,0
        hitboxes:
          - type: interaction
            position: 0,0,0
            scale: 1,1
            blocks_building: false
            interactive: true

  # ===========================================================================
  # 示例 5: 天花板吊灯（ceiling 变体）
  # 挂在天花板下的家具。使用 ceiling 变体。
  # 同样需要注意 position 和 translation 的偏移配合。
  # ===========================================================================
  custom:ceiling_lamp:

    # ---------- 家具设置 ----------
    settings:
      item: custom:ceiling_lamp
      sounds:
        break: minecraft:block.lantern.break
        place: minecraft:block.lantern.place
        hit: minecraft:block.lantern.hit
      hit_times: 3

    # ---------- 家具变体 ----------
    variants:
      ceiling:
        loot_spawn_offset: 0.5,0.5,0.5

        elements:
          # 灯具主体
          - type: item_display
            item: custom:ceiling_lamp
            display_transform: none
            billboard: fixed
            # position 向下(y-0.01)做微小偏移避免黑色渲染
            position: 0.5,-0.01,0
            # translation 向上(y+0.01)拉回
            translation: 0,-0.8,0.01
            scale: 1

          # 吊链（第二个元素模拟链条）
          - type: item_display
            item: custom:ceiling_lamp_chain
            display_transform: none
            billboard: fixed
            position: 0.5,-0.01,0
            translation: 0,-0.3,0.01
            scale: 1

        # ---------- 判定箱 ----------
        hitboxes:
          # 软碰撞判定箱 — 玩家可以穿过灯具但物品不能放置
          - type: interaction
            position: 0,0,0
            scale: 1,1
            blocks_building: true
            interactive: true

  # ===========================================================================
  # 示例 6: 带发光和阴影效果的家具
  # 展示 glow_color、shadow_radius、shadow_strength、brightness 等视觉属性。
  # 适用于需要氛围光照的家具（灯具、魔法物品等）。
  # ===========================================================================
  custom:glowing_crystal:

    # ---------- 家具设置 ----------
    settings:
      item: custom:glowing_crystal
      sounds:
        break:
          id: minecraft:block.amethyst_block.break
          pitch: 1.2       # 音调（0.5~2.0）
          volume: 0.8      # 音量（0.0~1.0）
        place:
          id: minecraft:block.amethyst_block.place
          pitch: 1.2
          volume: 0.8
        hit: minecraft:block.amethyst_block.chime
      hit_times: 4

    # ---------- 家具行为 ----------
    behavior:
      # glowing_furniture: 使家具成为实际光源方块，照亮周围环境
      type: glowing_furniture
      # lights: 统一配置所有变体的光源
      # 也可以通过 variants 分变体配置
      lights:
        - position: 0,0,0
          level: 15        # 光照等级 0~15

    # ---------- 家具变体 ----------
    variants:
      ground:
        loot_spawn_offset: 0.5,0.5,0

        # entity_culling: 实体剔除，提升性能
        # 可设置为 true/false 或详细配置对象
        entity_culling:
          # aabb: 剔除范围包围盒 (x1,y1,z1,x2,y2,z2)
          # 不手动配置时插件自动计算
          view_distance: 64    # 可视距离剔除，-1 表示不限制
          ray_tracing: false   # 是否启用光线追踪剔除

        elements:
          # 发光水晶主体
          - type: item_display
            item: custom:glowing_crystal
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.5,0
            scale: 1

            # glow_color: 发光颜色（RGB 格式）
            # 格式: R,G,B（范围 0~255）
            glow_color: 180,100,255   # 紫色辉光

            # shadow_radius: 阴影扩散半径（默认值: 0）
            shadow_radius: 1.0

            # shadow_strength: 阴影强度（默认值: 1.0，范围 0.0~1.0）
            shadow_strength: 0.6

            # brightness: 光照覆盖
            # block_light: 方块光照等级覆盖（0~15）
            # sky_light: 天空光照等级覆盖（0~15）
            brightness:
              block_light: 15  # 自身始终满亮度，不受环境黑暗影响
              sky_light: 15

            # apply_dyed_color: 是否应用染色颜色（默认值: true）
            # 当物品有染色组件时自动染色
            apply_dyed_color: false  # 水晶不染色

            # tint_source: 染色来源
            # 可选: dyed_color / map_color / firework_explosion / potion_contents
            tint_source:
              - dyed_color

            # view_range: 可见范围倍率（默认值: 1.0）
            view_range: 1.5  # 比普通实体远50%可见

          # 悬浮粒子光环（第二个元素）
          - type: item_display
            item: custom:glowing_crystal_ring
            display_transform: none
            # billboard: center — 始终面向玩家中心旋转
            billboard: center
            position: 0.5,0,0
            translation: 0,0.5,0
            scale: 1.1
            glow_color: 120,180,255   # 蓝色辉光
            shadow_radius: 0           # 光环无阴影
            shadow_strength: 0

        # ---------- 判定箱 ----------
        hitboxes:
          - type: shulker
            position: 0,0,0
            scale: 0.5,0.8
            peek: 100
            direction: up
            blocks_building: true
            interactive: true
            interaction_entity: true

  # ===========================================================================
  # 示例 7: 带存储功能的家具（箱子/柜子）
  # 使用 simple_storage_furniture 行为为家具添加容器存储能力。
  # ===========================================================================
  custom:storage_cabinet:

    # ---------- 家具设置 ----------
    settings:
      item: custom:storage_cabinet
      sounds:
        break: minecraft:block.wood.break
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
      hit_times: 5
      correct_tools:
        - "#minecraft:axes"

    # ---------- 家具行为 ----------
    behavior:
      # simple_storage_furniture: 简单存储家具
      # 右键打开一个容器界面
      type: simple_storage_furniture

      # data_key: 存储数据的 NBT 键名
      data_key: craftengine:simple_storage_contents

      # title: 容器界面的标题
      title: "储物柜"

      # rows: 容器行数（1~6，每行9格）
      rows: 3   # 3行 = 27格存储空间

      # sounds: 容器打开/关闭音效
      sounds:
        open: minecraft:block.chest.open
        close: minecraft:block.chest.close

    # ---------- 家具变体 ----------
    variants:
      ground:
        loot_spawn_offset: 0.5,0.5,0

        elements:
          # 柜体
          - type: item_display
            item: custom:storage_cabinet
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.5,0

        hitboxes:
          - type: shulker
            position: 0,0,0
            scale: 1,1
            peek: 100
            direction: up
            blocks_building: true
            interactive: true      # 必须为 true 才能右键打开容器
            interaction_entity: true

    # ---------- 家具事件 ----------
    # 家具支持右键交互事件
    events:
      # on: 事件触发器（家具支持: break / place / right_click）
      - on: right_click
        functions:
          # 右键时的消息提示（如果需要额外反馈）
          # 注意: 存储界面会由 simple_storage_furniture 行为自动打开
          - type: message
            message: "<green>你打开了储物柜</green>"
            target: self
            overlay: false  # false = 聊天框 / true = 动作栏

  # ===========================================================================
  # 示例 8: 带自定义战利品表的家具
  # 不使用模板战利品表，而是内联自定义完整的战利品表结构。
  # ===========================================================================
  custom:treasure_chest:

    # ---------- 家具设置 ----------
    settings:
      item: custom:treasure_chest
      sounds:
        break:
          id: minecraft:block.chest.break
          pitch: 0.8
          volume: 1.0
        place:
          id: minecraft:block.chest.place
          pitch: 0.8
          volume: 1.0
        hit: minecraft:block.chest.hit
      hit_times: 6
      correct_tools:
        - "#minecraft:axes"

    # ---------- 家具变体 ----------
    variants:
      ground:
        loot_spawn_offset: 0.5,0.5,0

        elements:
          - type: item_display
            item: custom:treasure_chest
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.5,0

        hitboxes:
          - type: shulker
            position: 0,0,0
            scale: 1,0.8
            peek: 100
            direction: up
            blocks_building: true
            interactive: true
            interaction_entity: true

    # ---------- 战利品表 ----------
    # 方式 A: 使用模板战利品表（推荐简单场景）
    #   loot:
    #     template: default:loot_table/furniture
    #     arguments:
    #       item: custom:treasure_chest
    #
    # 方式 B: 内联自定义战利品表（完整控制掉落逻辑）
    loot:
      # ---------- 战利品池 ----------
      pools:
        # --- 战利品池 1: 必然掉落的物品 ---
        - rolls: 1
          # conditions: 此池的掉落条件
          conditions:
            - type: survives_explosion  # 爆炸后仍存活的物品才掉落
          entries:
            # 主掉落: 家具物品本身
            # furniture_item 类型: 返回放置时的原始家具物品，若无法获取则使用 fallback
            - type: furniture_item
              item: custom:treasure_chest  # fallback 物品
              weight: 1
              functions: []

        # --- 战利品池 2: 概率掉落额外宝物 ---
        - rolls: 1
          entries:
            # alternatives: 依次检查子条目的 conditions，
            # 选择第一个满足条件的条目
            - type: alternatives
              children:
                # 条件分支 1: 如果使用精准采集附魔工具破坏，掉落特殊物品
                - type: item
                  item: custom:ancient_coin
                  weight: 1
                  conditions:
                    - type: enchantment
                      predicate: "minecraft:silk_touch>=1"
                  functions:
                    # set_count: 设置掉落数量
                    - type: set_count
                      count: 3
                      add: false

                # 条件分支 2: 否则根据时运附魔增加普通奖励数量
                - type: item
                  item: minecraft:gold_nugget
                  weight: 1
                  functions:
                    # apply_bonus: 根据时运附魔增加数量
                    - type: apply_bonus
                      enchantment: minecraft:fortune
                      formula:
                        type: binomial_with_bonus_count
                        extra: 3
                        probability: 0.5
                    # explosion_decay: 爆炸破坏时概率消失
                    - type: explosion_decay
                    # limit_count: 限制最终数量范围
                    - type: limit_count
                      min: 1
                      max: 8

        # --- 战利品池 3: 随机掉落附加物品 ---
        - rolls: 1
          conditions:
            - type: survives_explosion
          entries:
            # 多条目权重随机选择
            - type: item
              item: minecraft:diamond
              weight: 1       # 相对权重 1
              functions:
                - type: set_count
                  count: 1
            - type: item
              item: minecraft:emerald
              weight: 3       # 相对权重 3（比钻石高3倍概率）
              functions:
                - type: set_count
                  count: 1
            - type: item
              item: minecraft:iron_ingot
              weight: 6       # 相对权重 6（最常见）
              functions:
                - type: set_count
                  count: 2

  # ===========================================================================
  # 示例 9 (进阶): 带物品展示功能的家具
  # 使用 display_item_furniture 行为展示玩家放入的物品。
  # 适用于展示柜、奖杯座、物品框等。
  # ===========================================================================
  custom:item_showcase:

    # ---------- 家具设置 ----------
    settings:
      item: custom:item_showcase
      sounds:
        break: minecraft:block.glass.break
        place: minecraft:block.glass.place
        hit: minecraft:block.glass.hit
      hit_times: 3

    # ---------- 家具行为 ----------
    behavior:
      # display_item_furniture: 允许玩家将物品放入家具进行展示
      type: display_item_furniture

      # data_key: 存储展示物品数据的 NBT 键名
      data_key: craftengine:display_item

      # sounds: 放入/取出物品的音效
      sounds:
        put: minecraft:block.decorated_pot.insert
        take: minecraft:block.decorated_pot.insert_fail

      # variants: 分变体配置展示物品位置和判定箱
      variants:
        ground:
          # item_position: 展示物品在家具中的显示位置
          item_position: 0,0.07,0
          # hitboxes: 展示物品的额外判定箱（可选覆盖/追加）
          # 空列表表示不追加判定箱
          hitboxes: []

    # ---------- 家具变体 ----------
    variants:
      ground:
        loot_spawn_offset: 0.5,0.5,0

        elements:
          # 展示柜底座
          - type: item_display
            item: custom:item_showcase
            display_transform: none
            billboard: fixed
            position: 0.5,0,0
            translation: 0,0.5,0

        hitboxes:
          # 点击判定 — 玩家右键打开展示槽位
          - type: interaction
            position: 0,0,0
            scale: 1,1
            blocks_building: true
            interactive: true
            can_use_item_on: true   # 允许在此放置物品
