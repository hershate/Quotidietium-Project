# ============================================================================
# 附录 A：关键概念速查
# ============================================================================
#
# ┌─ 装备资源 (equipments) ───────────────────────────────────────────────┐
# │                                                                       │
# │ equipments 定义的是"渲染资源"（纹理+模型类型），不是物品属性。         │
# │ 物品的属性（护甲值、耐久等）在 items.data 中定义。                    │
# │                                                                       │
# │ 两种类型：                                                            │
# │   component  (1.21.2+) : 使用原版可装备组件，支持完整模型类型         │
# │   trim       (1.20+)   : 基于盔甲纹饰机制，仅 humanoid/leggings      │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 可用模型类型 (component) ────────────────────────────────────────────┐
# │                                                                       │
# │ 玩家类：                                                              │
# │   humanoid              - 双足人形（头盔/胸甲/靴子）                  │
# │   humanoid_leggings     - 双足人形护腿（裤装模型）                    │
# │   wings                 - 鞘翅/翅膀                                   │
# │                                                                       │
# │ 动物类：                                                              │
# │   wolf_body             - 狼身体                                      │
# │   horse_body            - 马身体                                      │
# │   llama_body            - 羊驼身体                                    │
# │   happy_ghast_body      - 快乐恶魂身体                                │
# │   nautilus_body         - 鹦鹉螺身体（1.21.5+）                       │
# │                                                                       │
# │ 鞍具类：                                                              │
# │   pig_saddle            - 猪鞍                                        │
# │   strider_saddle        - 炽足兽鞍                                    │
# │   camel_saddle          - 骆驼鞍                                      │
# │   horse_saddle          - 马鞍                                        │
# │   donkey_saddle         - 驴鞍                                        │
# │   mule_saddle           - 骡鞍                                        │
# │   skeleton_horse_saddle - 骷髅马鞍                                    │
# │   zombie_horse_saddle   - 僵尸马鞍                                    │
# │   camel_husk_saddle     - 尸壳骆驼鞍（1.21.5+）                       │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ equipment 设置项 (items.settings.equipment) ─────────────────────────┐
# │                                                                       │
# │ asset_id:           必填。指向 equipments 中的装备资源ID              │
# │ slot:               指定槽位: head / chest / legs / feet / body /     │
# │                     saddle（需要指定 slot 后以下可选参数才生效）       │
# │ camera_overlay:     第一人称遮罩纹理路径                              │
# │                     assets/<namespace>/textures/<path>                 │
# │ dispensable:        是否可通过发射器穿戴                              │
# │ damage_on_hurt:     受伤时是否损耗耐久                                │
# │ swappable:          是否可直接右键穿戴                                │
# │ equip_on_interact:  对生物使用时是否可为其穿戴 (>= 1.21.5)            │
# │ client_bound_model: 是否使用客户端模型（默认跟随全局设置）            │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 块形式配置 (humanoid/wings/wolf_body 等的完整写法) ──────────────────┐
# │                                                                       │
# │ 简写形式：                                                            │
# │   humanoid: "namespace:entity/equipment/humanoid/my_armor"            │
# │                                                                       │
# │ 块形式（单层）：                                                      │
# │   humanoid:                                                           │
# │     texture: "namespace:entity/equipment/humanoid/my_armor"           │
# │     dyeable:                                                          │
# │       color_when_undyed: -6265536                                     │
# │     use_player_texture: false                                         │
# │                                                                       │
# │ 块形式（多层叠加）：                                                  │
# │   humanoid:                                                           │
# │     - texture: "namespace:entity/equipment/humanoid/base"             │
# │       dyeable:                                                        │
# │         color_when_undyed: -6265536                                   │
# │     - texture: "namespace:entity/equipment/humanoid/overlay"          │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 纹理路径约定 ────────────────────────────────────────────────────────┐
# │                                                                       │
# │ 装备纹理路径格式: <namespace>:entity/equipment/<model_type>/<id>      │
# │                                                                       │
# │ 实际文件位置:                                                         │
# │   assets/<namespace>/textures/entity/equipment/<model_type>/<id>.png  │
# │                                                                       │
# │ 例如：                                                                │
# │   custom:entity/equipment/humanoid/steel                              │
# │   对应文件: assets/custom/textures/entity/equipment/humanoid/steel.png│
# │                                                                       │
# │ 物品图标纹理路径: <namespace>:item/custom/<item_name>                 │
# │ 实际文件位置:                                                         │
# │   assets/<namespace>/textures/item/custom/<item_name>.png             │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 装备槽位 (slot) 与 material 对应关系 ────────────────────────────────┐
# │                                                                       │
# │   head    → leather_helmet, iron_helmet, diamond_helmet, ...          │
# │   chest   → leather_chestplate, iron_chestplate, ...                  │
# │   legs    → leather_leggings, iron_leggings, ...                      │
# │   feet    → leather_boots, iron_boots, ...                            │
# │   body    → wolf_armor, diamond_horse_armor, ... (动物护甲)           │
# │   saddle  → saddle (鞍)                                               │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 盔甲属性类型 (attribute_modifiers) ──────────────────────────────────┐
# │                                                                       │
# │   armor                - 护甲值（直接减少伤害）                       │
# │   armor_toughness      - 护甲韧性（减少高伤害的护甲穿透）             │
# │   knockback_resistance - 击退抗性                                     │
# │   movement_speed       - 移动速度                                     │
# │   max_health           - 最大生命值                                   │
# │   luck                 - 幸运值                                       │
# │                                                                       │
# │ 操作类型 (operation):                                                 │
# │   add_value              - 直接加数值                                 │
# │   add_multiplied_base    - 乘以基础值的百分比                         │
# │   add_multiplied_total   - 乘以总值的百分比                           │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 颜色值速查 ──────────────────────────────────────────────────────────┐
# │                                                                       │
# │ 十进制 RGB 颜色值（用于 color_when_undyed）：                         │
# │   -1        = 白色 (255, 255, 255)                                   │
# │   -16777216 = 黑色 (0, 0, 0)                                         │
# │   -65536    = 红色 (255, 0, 0)                                       │
# │   -16711936 = 绿色 (0, 255, 0)                                       │
# │   -16776961 = 蓝色 (0, 0, 255)                                       │
# │   -6265536  = 皮革棕色 (160, 101, 64)                                │
# │                                                                       │
# │ 计算方式：-(255*255*255 + 1 - RGB_to_decimal)                        │
# │ 或使用在线工具：搜索 "Minecraft color decimal converter"             │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 事件触发器 ──────────────────────────────────────────────────────────┐
# │                                                                       │
# │ 盔甲物品可用的常见事件：                                              │
# │   right_click  - 右键点击时                                           │
# │   equip        - 装备穿戴时                                           │
# │   unequip      - 装备卸下时                                           │
# │   break        - 耐久耗尽损坏时                                       │
# │                                                                       │
# │ 常用函数：                                                            │
# │   command        - 执行命令                                           │
# │   message        - 发送聊天消息                                       │
# │   actionbar      - 发送动作栏消息                                     │
# │   play_sound     - 播放音效                                           │
# │   particle       - 生成粒子                                           │
# │   potion_effect  - 添加药水效果                                       │
# │   set_cooldown   - 设置冷却时间                                       │
# │   heal           - 治疗玩家                                           │
# │   if_else        - 条件分支                                           │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ Trim 类型注意事项 ───────────────────────────────────────────────────┐
# │                                                                       │
# │ 1. 仅支持 humanoid 和 humanoid_leggings 模型类型                      │
# │ 2. 使用此类型的盔甲无法再接受额外纹饰（纹饰槽已被占用）              │
# │ 3. 可能导致被"破坏"的原版锁链甲等变成透明                             │
# │    修复（付费版）：/ce resource enable legacy_armor                   │
# │ 4. 如果盔甲无法正确应用纹理或玩家被踢出服务器，请检查配置             │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 关于 3D 头盔 ────────────────────────────────────────────────────────┐
# │                                                                       │
# │ 3D 头盔的创建与 equipments 定义完全无关。                             │
# │ 如果需要制作 3D 建模头盔（而非盔甲纹理渲染），使用以下方法：          │
# │                                                                       │
# │ 方法 1（1.21.2+）：重写 equippable 组件，移除 asset_id：              │
# │   items:                                                              │
# │     custom:my_3d_helmet:                                              │
# │       material: diamond_helmet                                        │
# │       data:                                                           │
# │         equippable:                                                   │
# │           slot: head                                                  │
# │                                                                       │
# │ 方法 2（1.20+）：使用 client_bound_material 修改客户端渲染：          │
# │   items:                                                              │
# │     custom:my_3d_helmet:                                              │
# │       material: diamond_helmet                                        │
# │       client_bound_material: paper                                    │
# └───────────────────────────────────────────────────────────────────────┘
#
# ┌─ 快速命令 ────────────────────────────────────────────────────────────┐
# │                                                                       │
# │   /ce reload                         - 重载所有配置                   │
# │   /ce item get <id>                  - 获取物品                       │
# │   /ce item give <player> <id> [数量] - 给玩家物品                     │
# │   /ce item list                      - 列出所有自定义物品             │
# │   /ce debug item                     - 调试手持物品信息              │
# │   /ce resource enable legacy_armor   - 修复原版盔甲（付费版）         │
# └───────────────────────────────────────────────────────────────────────┘
# ============================================================================
