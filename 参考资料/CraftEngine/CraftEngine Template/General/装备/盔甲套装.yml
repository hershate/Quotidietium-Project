# ============================================================================
# CraftEngine 装备模板 — 盔甲套装 (Armor/Equipment Template)
# ============================================================================
# 本文件演示如何使用 CraftEngine 创建自定义装备（盔甲、鞘翅、马铠、狼铠等）。
#
# 关键概念：
#   - equipments 节点用于定义装备资源（纹理及其渲染模型类型）
#   - items 节点中的物品通过 settings.equipment.asset_id 引用装备资源
#   - 两种类型：component（1.21.2+ 推荐）和 trim（1.20+ 纹饰兼容）
#
# 适用 Minecraft 版本：
#   - type: component  → 1.21.2+
#   - type: trim       → 1.20+
#
# 命名空间说明：
#   "custom" 是本模板使用的命名空间。你可以替换为自己的命名空间ID。
#   命名空间ID格式：<namespace>:<id>，如 custom:my_armor
#
# 使用方式：
#   1. 将需要的配置放入 resources/<你的包>/configuration/ 下的任意 YML 文件
#   2. 运行 /ce reload 重载配置
#   3. 使用 /ce item get custom:steel_helmet 获取物品
#   4. 将对应的纹理 PNG 放入资源包：
#      assets/<namespace>/textures/entity/equipment/<model_type>/<id>.png
#
# 文本格式参考：MiniMessage (https://docs.papermc.io/adventure/minimessage/format/)
# ============================================================================


# ============================================================================
# 模板区 (Templates) —— 可复用的配置片段
# ============================================================================
templates:

  # --- 通用盔甲物品模板（component 类型） ---
  # 提供基础的名称、描述和装备关联结构。
  # 使用方式：在 items 中通过 template + arguments 调用。
  custom:armor_template:
    data:
      item_name: "<!i>${item_color:-<white>}${item_name:-未命名盔甲}"
      lore:
        - "<!i><gray>${rarity:-普通}装备"
        - ""
        - "<!i><dark_gray>▶ 护甲值: <blue>${armor_value:-0}"
        - "<!i><dark_gray>▶ 护甲韧性: <dark_aqua>${toughness:-0}"
    settings:
      tags:
        - "custom:equipment"
        - "custom:custom_items"
      repairable:
        crafting_table: true
        anvil_repair: true
        anvil_combine: true
      equipment:
        asset_id: "${asset_id}"

  # --- 通用手持物品模型模板 ---
  custom:model_generated:
    model:
      type: "minecraft:model"
      path: "${model_path:-minecraft:item/custom/default_item}"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "${texture_path:-minecraft:item/custom/default_item}"


# ============================================================================
# 装备资源配置 (Equipments)
# ============================================================================
# 装备资源定义了纹理及其适用的模型类型。
# 装备本身不关心物品的属性（护甲值、耐久等），只负责渲染。
# 物品的属性在 items 部分的 data.attribute_modifiers 中定义。
# ============================================================================
equipments:

  # ==========================================================================
  # 示例 1：完整盔甲套装 — Component 类型 (1.21.2+)
  # ==========================================================================
  # 使用 component 类型，支持 humanoid 和 humanoid_leggings 两种玩家模型。
  # humanoid        → 头盔、胸甲、靴子
  # humanoid_leggings → 护腿（裤装模型，贴合腿部形状）
  #
  # 纹理文件位置（详见文末附录）：
  #   assets/<namespace>/textures/entity/equipment/humanoid/<id>.png
  #   assets/<namespace>/textures/entity/equipment/humanoid_leggings/<id>.png
  # ==========================================================================
  custom:steel_armor:
    # 类型：component（1.21.2+，推荐）
    # 另一种类型：trim（1.20+，纹饰方式，参见示例 2）
    type: component

    # -------- humanoid 模型 --------
    # 应用于头盔、胸甲、靴子（玩家、僵尸、骷髅等双足人形生物）
    humanoid: "minecraft:entity/equipment/humanoid/steel"

    # -------- humanoid_leggings 模型 --------
    # 应用于护腿（紧贴腿部形状的裤装渲染）
    humanoid_leggings: "minecraft:entity/equipment/humanoid_leggings/steel"

  # ==========================================================================
  # 示例 2：完整盔甲套装 — Trim 类型 (1.20+)
  # ==========================================================================
  # 使用 trim 类型，通过去除原版基础纹理后应用自定义纹饰来实现。
  # 限制：仅支持 humanoid 和 humanoid_leggings 模型。
  # 注意：使用此类型的盔甲无法再接受额外纹饰（因为纹饰槽已被占用）。
  #
  # 适用场景：
  #   - 服务器运行 1.20.x 无法升级到 1.21.2+
  #   - 需要与旧版资源包兼容
  # ==========================================================================
  custom:steel_armor_trim:
    # 类型：trim（1.20+，基于盔甲纹饰机制）
    type: trim

    humanoid: "minecraft:entity/equipment/humanoid/steel"
    humanoid_leggings: "minecraft:entity/equipment/humanoid_leggings/steel"

  # ==========================================================================
  # 示例 3：可染色盔甲 (Dyeable Armor)
  # ==========================================================================
  # 使用块形式配置，支持 dyeable 选项。
  # color_when_undyed: 未染色时的默认颜色（十进制 RGB 值）。
  #   例如 -6265536 = 皮革棕色（对应 160, 101, 64 的 RGB）
  #
  # 玩家可在工作台中使用染料为盔甲染色。
  # ==========================================================================
  custom:dyeable_robe:
    type: component

    # -------- 块形式：单纹理可染色 --------
    humanoid:
      # 纹理路径：与简写形式相同
      texture: "minecraft:entity/equipment/humanoid/dyeable_robe"
      # 染色配置
      dyeable:
        # 未染色时的默认颜色（十进制整数）
        # 常用颜色值：
        #   -6265536  = 皮革棕色
        #   -1        = 白色
        #   -16777216 = 黑色
        color_when_undyed: -6265536
      # use_player_texture: 是否使用玩家自身纹理（用于鞘翅/披风类装备）
      use_player_texture: false

    humanoid_leggings:
      texture: "minecraft:entity/equipment/humanoid_leggings/dyeable_robe"
      dyeable:
        color_when_undyed: -6265536
      use_player_texture: false

  # ==========================================================================
  # 示例 4：部分可染色盔甲（多纹理层）
  # ==========================================================================
  # 通过列表组合多个纹理层，每层可独立配置是否可染色。
  # 纹理按列表顺序从底到顶叠加渲染。
  #
  # 经典用例：饰品 + 底料分开，饰品固定颜色，底料可染色。
  # ==========================================================================
  custom:partial_dyeable_armor:
    type: component

    humanoid:
      # 层 0：可染色的底料纹理（最先渲染，在最底层）
      - texture: "minecraft:entity/equipment/humanoid/armor_base"
        dyeable:
          color_when_undyed: -6265536
      # 层 1：不可染色的金属镶边纹理（覆盖在底料之上）
      - texture: "minecraft:entity/equipment/humanoid/armor_trim_gold"

    humanoid_leggings:
      - texture: "minecraft:entity/equipment/humanoid_leggings/armor_base"
        dyeable:
          color_when_undyed: -6265536
      - texture: "minecraft:entity/equipment/humanoid_leggings/armor_trim_gold"

  # ==========================================================================
  # 示例 5：鞘翅/翅膀装备 (Elytra / Wings)
  # ==========================================================================
  # 使用 wings 模型类型，适用于鞘翅类装备。
  # 支持 use_player_texture 选项（如使用玩家皮肤中的披风纹理）。
  # ==========================================================================
  custom:dragon_wings:
    type: component

    # -------- wings 模型 --------
    # 为玩家渲染背部翅膀/鞘翅纹理
    wings:
      texture: "minecraft:entity/equipment/wings/dragon_wings"
      # 是否使用玩家皮肤纹理（如原版鞘翅使用披风纹理）
      # true: 忽略 texture，使用玩家的披风/皮肤纹理
      # false: 使用 texture 指定的纹理
      use_player_texture: false
      # 染色配置（可选）
      # dyeable:
      #   color_when_undyed: -1

  # ==========================================================================
  # 示例 6：狼铠 (Wolf Armor)
  # ==========================================================================
  # 使用 wolf_body 模型类型。
  # 1.21.2+ 原版已支持狼铠。CraftEngine 允许自定义狼铠纹理。
  #
  # 注意：
  #   - 狼铠物品的 material 应设为 wolf_armor
  #   - settings.equipment.slot 应设为 body
  # ==========================================================================
  custom:reinforced_wolf_armor:
    type: component

    # -------- wolf_body 模型 --------
    # 渲染到狼的身体上
    wolf_body: "minecraft:entity/equipment/wolf_body/reinforced_wolf_armor"

    # 如果需要染色狼铠，可使用块形式：
    # wolf_body:
    #   texture: "minecraft:entity/equipment/wolf_body/reinforced_wolf_armor"
    #   dyeable:
    #     color_when_undyed: -1

  # ==========================================================================
  # 示例 7：马铠 (Horse Armor)
  # ==========================================================================
  # 使用 horse_body 模型类型。
  #
  # 注意：
  #   - 马铠物品的 material 应设为 diamond_horse_armor（或铁马铠/金马铠/皮革马铠）
  #   - settings.equipment.slot 应设为 body
  # ==========================================================================
  custom:royal_horse_armor:
    type: component

    # -------- horse_body 模型 --------
    horse_body: "minecraft:entity/equipment/horse_body/royal_horse_armor"

    # 其他可用的动物模型类型（按需使用）：
    #   llama_body
    #   pig_saddle
    #   strider_saddle
    #   camel_saddle
    #   horse_saddle
    #   donkey_saddle
    #   mule_saddle
    #   skeleton_horse_saddle
    #   zombie_horse_saddle
    #   happy_ghast_body
    #   camel_husk_saddle
    #   nautilus_body

  # ==========================================================================
  # 示例 8：多层复合盔甲 — 花环 + 装饰 (Wreath + Decorations)
  # ==========================================================================
  # 展示如何通过组合多个纹理层创建复合纹理盔甲。
  #
  # 典型用例：一个共用底料纹理（wreath），叠加不同的装饰花卉。
  # 通过共享底料纹理，可以减少资源包中的纹理文件数量。
  # ==========================================================================

  # --- 红色花卉花环 ---
  custom:red_flower_wreath:
    type: component
    humanoid:
      # 层 0：花环底座（所有变体共用）
      - texture: "minecraft:entity/equipment/humanoid/wreath"
      # 层 1：红色花卉装饰
      - texture: "minecraft:entity/equipment/humanoid/red_flower"
    humanoid_leggings:
      - texture: "minecraft:entity/equipment/humanoid_leggings/wreath"
      - texture: "minecraft:entity/equipment/humanoid_leggings/red_flower"

  # --- 黄色花卉花环 ---
  custom:yellow_flower_wreath:
    type: component
    humanoid:
      - texture: "minecraft:entity/equipment/humanoid/wreath"
      - texture: "minecraft:entity/equipment/humanoid/yellow_flower"
    humanoid_leggings:
      - texture: "minecraft:entity/equipment/humanoid_leggings/wreath"
      - texture: "minecraft:entity/equipment/humanoid_leggings/yellow_flower"

  # --- 白色花卉花环 ---
  custom:white_flower_wreath:
    type: component
    humanoid:
      - texture: "minecraft:entity/equipment/humanoid/wreath"
      - texture: "minecraft:entity/equipment/humanoid/white_flower"
    humanoid_leggings:
      - texture: "minecraft:entity/equipment/humanoid_leggings/wreath"
      - texture: "minecraft:entity/equipment/humanoid_leggings/white_flower"

  # --- 金色镶边花环（混合染色与固定层） ---
  custom:golden_wreath:
    type: component
    humanoid:
      # 可染色的底座花环
      - texture: "minecraft:entity/equipment/humanoid/wreath"
        dyeable:
          color_when_undyed: -6265536
      # 固定颜色的金色装饰
      - texture: "minecraft:entity/equipment/humanoid/golden_trim"
    humanoid_leggings:
      - texture: "minecraft:entity/equipment/humanoid_leggings/wreath"
        dyeable:
          color_when_undyed: -6265536
      - texture: "minecraft:entity/equipment/humanoid_leggings/golden_trim"


# ============================================================================
# 物品配置 (Items)
# ============================================================================
# 以下展示如何将上述装备资源应用到实际物品上。
# 每个盔甲物品通过 settings.equipment.asset_id 关联到上方定义的装备资源。
# ============================================================================
items:

  # ==========================================================================
  # 对应示例 1：钢制盔甲四件套 (Component 类型)
  # ==========================================================================
  custom:steel_helmet:
    # -------- 基础材质 --------
    # 盔甲类 material 选择：
    #   头盔：leather_helmet, chainmail_helmet, iron_helmet, golden_helmet, diamond_helmet, netherite_helmet
    #   胸甲：leather_chestplate, chainmail_chestplate, iron_chestplate, golden_chestplate, diamond_chestplate, netherite_chestplate
    #   护腿：leather_leggings, chainmail_leggings, iron_leggings, golden_leggings, diamond_leggings, netherite_leggings
    #   靴子：leather_boots, chainmail_boots, iron_boots, golden_boots, diamond_boots, netherite_boots
    material: iron_helmet
    custom_model_data: 2001
    item_model: custom:steel_helmet

    data:
      item_name: "<!i><#808080>钢制头盔"
      lore:
        - "<!i><gray>★★ 精良装备 ★★"
        - ""
        - "<!i><gray>坚固的钢制头盔，提供可靠防护"
        - ""
        - "<!i><dark_gray>▶ 护甲值: <blue>+3"
        - "<!i><dark_gray>▶ 护甲韧性: <dark_aqua>+1"

      # -------- 属性修饰符 --------
      attribute_modifiers:
        - type: armor
          amount: 3.0
          operation: add_value
          slot: head
        - type: armor_toughness
          amount: 1.0
          operation: add_value
          slot: head
        # 击退抗性（可选）
        - type: knockback_resistance
          amount: 0.1
          operation: add_value
          slot: head

      # -------- 最大耐久 --------
      max_damage: 275

    # -------- 物品模型（背包/物品栏中的图标） --------
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/steel_helmet"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/steel_helmet"

    # -------- 物品设置 --------
    settings:
      tags:
        - "custom:equipment"
        - "custom:armor"
        - "custom:steel_gear"
      repairable:
        crafting_table: true
        anvil_repair: true
        anvil_combine: true
      # 铁砧修复材料
      anvil_repair_item:
        - target: "minecraft:iron_ingot"
          percent: 0.25

      # -------- 装备关联（核心） --------
      # asset_id 指向 equipments 中定义的装备资源
      equipment:
        asset_id: custom:steel_armor
        # slot 指定装备槽位
        slot: head
        # 是否可通过发射器穿戴
        dispensable: true
        # 受伤时是否损耗耐久
        damage_on_hurt: true
        # 是否可直接右键穿戴
        swappable: true
        # >= 1.21.5：对生物使用时是否可为其穿戴
        equip_on_interact: true
        # 第一人称遮罩纹理（可选）
        # camera_overlay: "custom:misc/steel_helmet_overlay"

    events:
      - on: right_click
        functions:
          - type: message
            message: "<#808080>你戴上了钢制头盔，视野一片坚毅。"
            target: "self"

  # --- 钢制胸甲 ---
  custom:steel_chestplate:
    material: iron_chestplate
    custom_model_data: 2002
    item_model: custom:steel_chestplate

    data:
      item_name: "<!i><#808080>钢制胸甲"
      lore:
        - "<!i><gray>★★ 精良装备 ★★"
        - ""
        - "<!i><gray>厚重的钢制胸甲，守护你的心脏"
        - ""
        - "<!i><dark_gray>▶ 护甲值: <blue>+6"
        - "<!i><dark_gray>▶ 护甲韧性: <dark_aqua>+1"
      attribute_modifiers:
        - type: armor
          amount: 6.0
          operation: add_value
          slot: chest
        - type: armor_toughness
          amount: 1.0
          operation: add_value
          slot: chest
        - type: knockback_resistance
          amount: 0.15
          operation: add_value
          slot: chest
      max_damage: 400

    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/steel_chestplate"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/steel_chestplate"

    settings:
      tags:
        - "custom:equipment"
        - "custom:armor"
        - "custom:steel_gear"
      equipment:
        asset_id: custom:steel_armor
        slot: chest
        dispensable: true
        damage_on_hurt: true
        swappable: true
        equip_on_interact: true

  # --- 钢制护腿 ---
  custom:steel_leggings:
    material: iron_leggings
    custom_model_data: 2003
    item_model: custom:steel_leggings

    data:
      item_name: "<!i><#808080>钢制护腿"
      lore:
        - "<!i><gray>★★ 精良装备 ★★"
        - ""
        - "<!i><gray>灵活而坚固的钢制护腿"
        - ""
        - "<!i><dark_gray>▶ 护甲值: <blue>+5"
        - "<!i><dark_gray>▶ 护甲韧性: <dark_aqua>+1"
      attribute_modifiers:
        - type: armor
          amount: 5.0
          operation: add_value
          slot: legs
        - type: armor_toughness
          amount: 1.0
          operation: add_value
          slot: legs
      max_damage: 375

    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/steel_leggings"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/steel_leggings"

    settings:
      tags:
        - "custom:equipment"
        - "custom:armor"
        - "custom:steel_gear"
      equipment:
        asset_id: custom:steel_armor
        slot: legs
        dispensable: true
        damage_on_hurt: true
        swappable: true
        equip_on_interact: true

  # --- 钢制靴子 ---
  custom:steel_boots:
    material: iron_boots
    custom_model_data: 2004
    item_model: custom:steel_boots

    data:
      item_name: "<!i><#808080>钢制靴子"
      lore:
        - "<!i><gray>★★ 精良装备 ★★"
        - ""
        - "<!i><gray>踏遍千山万水的钢靴"
        - ""
        - "<!i><dark_gray>▶ 护甲值: <blue>+2"
        - "<!i><dark_gray>▶ 护甲韧性: <dark_aqua>+1"
      attribute_modifiers:
        - type: armor
          amount: 2.0
          operation: add_value
          slot: feet
        - type: armor_toughness
          amount: 1.0
          operation: add_value
          slot: feet
        # 靴子可以增加移动速度
        - type: movement_speed
          amount: 0.02
          operation: add_multiplied_base
          slot: feet
      max_damage: 325

    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/steel_boots"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/steel_boots"

    settings:
      tags:
        - "custom:equipment"
        - "custom:armor"
        - "custom:steel_gear"
      equipment:
        asset_id: custom:steel_armor
        slot: feet
        dispensable: true
        damage_on_hurt: true
        swappable: true
        equip_on_interact: true

  # ==========================================================================
  # 对应示例 2：钢制盔甲四件套 (Trim 类型, 1.20+)
  # ==========================================================================
  custom:steel_helmet_trim:
    material: iron_helmet
    custom_model_data: 2011
    item_model: custom:steel_helmet_trim

    data:
      item_name: "<!i><#808080>钢制头盔 (Trim)"
      lore:
        - "<!i><gray>★★ 精良装备 ★★"
        - "<!i><dark_gray>基于 Trim 方式渲染"
        - ""
        - "<!i><dark_gray>▶ 护甲值: <blue>+3"
      attribute_modifiers:
        - type: armor
          amount: 3.0
          operation: add_value
          slot: head
        - type: armor_toughness
          amount: 1.0
          operation: add_value
          slot: head
      max_damage: 275

    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/steel_helmet_trim"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/steel_helmet_trim"

    settings:
      tags:
        - "custom:equipment"
        - "custom:armor"
        - "custom:steel_gear"
      # 指向 trim 类型的装备资源
      equipment:
        asset_id: custom:steel_armor_trim
        slot: head
        dispensable: true
        damage_on_hurt: true
        swappable: true

  custom:steel_chestplate_trim:
    material: iron_chestplate
    custom_model_data: 2012
    item_model: custom:steel_chestplate_trim

    data:
