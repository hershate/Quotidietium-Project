# =============================================================================
# CraftEngine 消耗品与药水模板
# =============================================================================
# 严格遵循 CraftEngine Wiki:
#   configuration/item.md
#   configuration/item/data.md
#   configuration/item/settings.md
# =============================================================================

items:

  # ===========================================================================
  # 1. 自定义药水 (饮用效果 + 返回空瓶)
  # ===========================================================================
  custom:magic_potion:
    material: potion
    data:
      item_name: "<!i><#DDA0DD>魔力药水"
      lore:
        - "<!i><gray>一瓶散发着紫色光芒的魔力药水"
      food:
        nutrition: 2
        saturation: 1.0
        can_always_eat: true
      components:
        minecraft:consumable:
          consume_seconds: 2.0
          animation: drink
          sound: "entity.generic.drink"
          has_consume_particles: true
          on_consume_effects:
            - type: apply_effects
              effects:
                minecraft:speed:
                  duration: 600
                  amplifier: 1
                  ambient: true
                  show_particles: true
                  show_icon: true
                minecraft:night_vision:
                  duration: 1200
                  amplifier: 0
                  ambient: false
                  show_particles: false
                  show_icon: true
              probability: 1.0
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/magic_potion"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/magic_potion"

  # ===========================================================================
  # 2. 带冷却的消耗品
  # ===========================================================================
  custom:cooldown_star:
    material: nether_star
    data:
      item_name: "<!i><gold>冷却之星"
      lore:
        - "<!i><gray>使用后需等待30秒"
    events:
      - on: right_click
        functions:
          - type: set_cooldown
            time: 30s
            id: "cooldown_star_ability"
          - type: message
            message: "<gold>冷却之星已激活!"
            target: "self"
          - type: command
            command: "give %player_name% minecraft:diamond 1"
        conditions:
          - type: "!on_cooldown"
            id: "cooldown_star_ability"

  # ===========================================================================
  # 3. 投掷物 (末影珍珠风格)
  # ===========================================================================
  custom:throwable_item:
    material: snowball
    data:
      item_name: "<!i><#FF6347>投掷物"
      lore:
        - "<!i><gray>右键投掷"
