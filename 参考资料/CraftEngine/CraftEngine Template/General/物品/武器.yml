# =============================================================================
# CraftEngine 武器模板
# =============================================================================
# 严格遵循 CraftEngine Wiki:
#   configuration/item.md
#   configuration/item/data.md
#   configuration/item/settings.md
#   configuration/item/models.md + subpages
# =============================================================================

items:

  # ===========================================================================
  # 示例 1: 基础自定义剑
  # ===========================================================================
  custom:flame_sword:
    material: diamond_sword
    custom_model_data: 1001
    data:
      item_name: "<!i><#FF4500>烈焰之刃"
      lore:
        - "<!i><red>★★★★ 史诗武器 ★★★★"
        - "<!i><gray>一把被烈焰包裹的传说之剑"
      attribute_modifiers:
        - type: attack_damage
          amount: 8.0
          operation: add_value
          slot: mainhand
        - type: attack_speed
          amount: 0.8
          operation: add_value
          slot: mainhand
      enchantment:
        minecraft:sharpness: 5
        minecraft:fire_aspect: 2
        minecraft:unbreaking: 3
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/flame_sword"
      generation:
        parent: "minecraft:item/handheld"
        textures:
          layer0: "minecraft:item/custom/flame_sword"
    settings:
      tags:
        - "custom:weapons"
        - "custom:swords"
    events:
      - on: right_click
        functions:
          - type: message
            message: "<#FF4500>⚔ 烈焰之刃感受到了你的召唤！"
            target: "self"
      - on: attack
        functions:
          - type: particle
            particle: "minecraft:flame"
            count: 15
            offset_x: 0.3
            offset_y: 0.5
            offset_z: 0.3
            speed: 0.05

  # ===========================================================================
  # 示例 2: 自定义弓 (简化模型写法)
  # ===========================================================================
  custom:storm_bow:
    material: bow
    custom_model_data: 1003
    data:
      item_name: "<!i><#00CED1>暴风之弓"
      lore:
        - "<!i><gray>风暴之力凝聚于弓弦之上"
      attribute_modifiers:
        - type: movement_speed
          amount: 0.03
          operation: add_multiplied_base
          slot: mainhand
      enchantment:
        minecraft:power: 5
        minecraft:unbreaking: 3
    # 简化模型: 弓的纹理数组 [待机, pulling_0, pulling_1, pulling_2]
    model:
      type: "minecraft:condition"
      property: "minecraft:using_item"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/storm_bow"
        generation:
          parent: "minecraft:item/bow"
          textures:
            layer0: "minecraft:item/custom/storm_bow"
      on_true:
        type: "minecraft:range_dispatch"
        property: "minecraft:use_duration"
        entries:
          - threshold: 0.0
            model:
              type: "minecraft:model"
              path: "minecraft:item/custom/storm_bow_pulling_0"
              generation:
                parent: "minecraft:item/bow"
                textures:
                  layer0: "minecraft:item/custom/storm_bow_pulling_0"
          - threshold: 0.65
            model:
              type: "minecraft:model"
              path: "minecraft:item/custom/storm_bow_pulling_1"
              generation:
                parent: "minecraft:item/bow"
                textures:
                  layer0: "minecraft:item/custom/storm_bow_pulling_1"
          - threshold: 0.9
            model:
              type: "minecraft:model"
              path: "minecraft:item/custom/storm_bow_pulling_2"
              generation:
                parent: "minecraft:item/bow"
                textures:
                  layer0: "minecraft:item/custom/storm_bow_pulling_2"
    settings:
      tags:
        - "custom:weapons"
        - "custom:bows"

  # ===========================================================================
  # 示例 3: 自定义弩
  # ===========================================================================
  custom:heavy_crossbow:
    material: crossbow
    custom_model_data: 1004
    data:
      item_name: "<!i><#B8860B>重型攻城弩"
      lore:
        - "<!i><gray>城墙上令敌人闻风丧胆的存在"
      enchantment:
        minecraft:quick_charge: 3
        minecraft:piercing: 4
        minecraft:unbreaking: 3
      max_damage: 512
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:crossbow/pull"
      fallback:
        type: "minecraft:condition"
        property: "minecraft:crossbow/charged"
        on_false:
          type: "minecraft:model"
          path: "minecraft:item/custom/heavy_crossbow_standby"
          generation:
            parent: "minecraft:item/crossbow"
            textures:
              layer0: "minecraft:item/custom/heavy_crossbow_standby"
        on_true:
          type: "minecraft:condition"
          property: "minecraft:crossbow/firework"
          on_false:
            type: "minecraft:model"
            path: "minecraft:item/custom/heavy_crossbow_arrow"
            generation:
              parent: "minecraft:item/crossbow"
              textures:
                layer0: "minecraft:item/custom/heavy_crossbow_arrow"
          on_true:
            type: "minecraft:model"
            path: "minecraft:item/custom/heavy_crossbow_firework"
            generation:
              parent: "minecraft:item/crossbow"
              textures:
                layer0: "minecraft:item/custom/heavy_crossbow_firework"
      entries:
        - threshold: 0.0
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/heavy_crossbow_pulling_0"
            generation:
              parent: "minecraft:item/crossbow"
              textures:
                layer0: "minecraft:item/custom/heavy_crossbow_pulling_0"
        - threshold: 0.58
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/heavy_crossbow_pulling_1"
            generation:
              parent: "minecraft:item/crossbow"
              textures:
                layer0: "minecraft:item/custom/heavy_crossbow_pulling_1"
        - threshold: 1.0
          model:
            type: "minecraft:model"
            path: "minecraft:item/custom/heavy_crossbow_pulling_2"
            generation:
              parent: "minecraft:item/crossbow"
              textures:
                layer0: "minecraft:item/custom/heavy_crossbow_pulling_2"
    settings:
      tags:
        - "custom:weapons"
        - "custom:crossbows"
      allowed_projectiles:
        - "minecraft:arrow"
        - "minecraft:spectral_arrow"
        - "minecraft:tipped_arrow"
        - "minecraft:firework_rocket"

  # ===========================================================================
  # 示例 4: 自定义弹射物 (projectile)
  # ===========================================================================
  custom:siege_bolt:
    material: arrow
    custom_model_data: 2001
    data:
      item_name: "<!i><#8B4513>攻城弩箭"
      lore:
        - "<!i><dark_red>重型弹药"
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/siege_bolt"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/siege_bolt"
    settings:
      tags:
        - "custom:projectiles"
      projectile:
        display:
          item: "custom:siege_bolt"
          translation: "0,0,0"
          rotation: "1,1,1,1"
          scale: 1.2
        sounds:
          throw: "minecraft:entity.arrow.shoot"
          hit_entity: "minecraft:entity.arrow.hit"
          hit_block: "minecraft:entity.arrow.hit"
        ignore_infinity_enchantment: false
        pickupable: true
        remove_on_hit: false
        gravity: true
        velocity: 3.0
        damage: 20.0
        pierce_level: 3
