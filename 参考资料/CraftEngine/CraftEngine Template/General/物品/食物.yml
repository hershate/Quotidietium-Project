# =============================================================================
# CraftEngine 食物模板
# =============================================================================
# 严格遵循 CraftEngine Wiki:
#   configuration/item.md
#   configuration/item/data.md (food, components, consumable)
#   configuration/item/models.md
# =============================================================================

items:

  # ===========================================================================
  # 示例 1: 基础食物
  # ===========================================================================
  custom:basic_bread:
    material: bread
    data:
      item_name: "<!i><white>全麦面包"
      lore:
        - "<!i><gray>一份朴实无华的全麦面包"
      food:
        nutrition: 5
        saturation: 6.0
        can_always_eat: false
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/basic_bread"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/basic_bread"

  # ===========================================================================
  # 示例 2: 食用后施加状态效果的食物
  # ===========================================================================
  custom:healing_stew:
    material: mushroom_stew
    data:
      item_name: "<!i><green>治疗炖菜"
      lore:
        - "<!i><gray>一碗热腾腾的炖菜"
      food:
        nutrition: 6
        saturation: 7.2
        can_always_eat: false
      components:
        minecraft:consumable:
          consume_seconds: 1.6
          animation: eat
          sound: "entity.generic.eat"
          has_consume_particles: true
          on_consume_effects:
            - type: apply_effects
              effects:
                minecraft:regeneration:
                  duration: 200
                  amplifier: 0
                  ambient: true
                  show_particles: true
                  show_icon: true
              probability: 1.0
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/healing_stew"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/healing_stew"

  # ===========================================================================
  # 示例 3: 始终可食用的金色食物
  # ===========================================================================
  custom:golden_apple_deluxe:
    material: golden_apple
    data:
      item_name: "<!i><gold>豪华金苹果"
      lore:
        - "<!i><gray>一种传说中的水果"
      food:
        nutrition: 8
        saturation: 12.8
        can_always_eat: true
      enchantment:
        minecraft:unbreaking: 1
      components:
        minecraft:consumable:
          consume_seconds: 3.0
          animation: eat
          sound: "entity.generic.eat"
          has_consume_particles: true
          on_consume_effects:
            - type: apply_effects
              effects:
                minecraft:absorption:
                  duration: 2400
                  amplifier: 3
                  ambient: true
                  show_particles: true
                  show_icon: true
                minecraft:regeneration:
                  duration: 600
                  amplifier: 1
                  ambient: true
                  show_particles: true
                  show_icon: true
                minecraft:fire_resistance:
                  duration: 6000
                  amplifier: 0
                  ambient: true
                  show_particles: true
                  show_icon: true
              probability: 1.0
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/golden_apple_deluxe"
      generation:
        parent: "minecraft:item/golden_apple"
        textures:
          layer0: "minecraft:item/custom/golden_apple_deluxe"

  # ===========================================================================
  # 示例 4: 自定义饮用动画食物 (drink 动画)
  # ===========================================================================
  custom:magic_potion:
    material: potion
    data:
      item_name: "<!i><#DDA0DD>魔力药水"
      lore:
        - "<!i><gray>一瓶散发着紫色光芒的药水"
      food:
        nutrition: 2
        saturation: 1.0
        can_always_eat: true
      components:
        minecraft:consumable:
          consume_seconds: 2.0
          animation: drink
          sound: "entity.generic.drink"
          has_consume_particles: true
          on_consume_effects:
            - type: apply_effects
              effects:
                minecraft:speed:
                  duration: 600
                  amplifier: 1
                  ambient: true
                  show_particles: true
                  show_icon: true
                minecraft:night_vision:
                  duration: 1200
                  amplifier: 0
                  ambient: false
                  show_particles: false
                  show_icon: true
              probability: 1.0
    model:
      type: "minecraft:model"
      path: "minecraft:item/custom/magic_potion"
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "minecraft:item/custom/magic_potion"
