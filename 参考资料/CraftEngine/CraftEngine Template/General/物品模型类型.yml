# ====================================================================
# CraftEngine 物品模型配置模板
# ====================================================================
# 本地 Wiki 参考路径（请以实际仓库路径为准）:
#   models.md (总览 + 简化模型 + 旧版模型):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models.md
#   model.md (minecraft:model + 着色):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models/model.md
#   condition.md (minecraft:condition 布尔条件型):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models/condition.md
#   range_dispatch.md (minecraft:range_dispatch 值调配型):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models/range_dispatch.md
#   composite.md (minecraft:composite 组合):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models/composite.md
#   select.md (minecraft:select 枚举条件型):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models/select.md
#   special.md (minecraft:special 特殊模型):
#     参考资料/CraftEngine/CraftEngine Wiki/configuration/item/models/special.md
# ====================================================================
# 使用说明:
#   1. 全局替换命名空间 "custom" 为你的实际命名空间
#   2. 替换所有 # << CHANGE THIS 标记的值
#   3. 删除不需要的条目和注释
#   4. 版本依赖: 1.21.4+ (完整), 26.1+ (transformation 等特性)
# ====================================================================

items:

  # ==================================================================
  # 【一】简化模型 — 快速定义
  # ==================================================================
  # 适用于常见用例，自动分析基础材质并生成对应模型。
  # 引用: models.md 简化模型部分

  # --- 2D 图标 (texture) ---
  custom:simple_icon:
    material: paper # << CHANGE THIS
    texture: minecraft:item/custom/my_icon # << CHANGE THIS

  # --- 2D 图标 + 手动指定 model 路径 ---
  custom:simple_icon_with_model:
    material: paper # << CHANGE THIS
    model: minecraft:item/custom/my_icon # << CHANGE THIS
    texture: minecraft:item/custom/my_icon # << CHANGE THIS

  # --- 手持物品 (texture) ---
  custom:simple_tool:
    material: golden_axe # << CHANGE THIS
    texture: minecraft:item/custom/my_tool # << CHANGE THIS

  # --- 多层纹理叠加 (textures) ---
  # 适用于 2D 图标或手持物品，多个纹理自动叠加渲染
  custom:layered_icon:
    material: paper # << CHANGE THIS
    textures:
      - minecraft:item/custom/layer_base # << CHANGE THIS
      - minecraft:item/custom/layer_overlay # << CHANGE THIS

  # --- 钓鱼竿 (textures) ---
  custom:simple_fishing_rod:
    material: fishing_rod # << CHANGE THIS
    textures:
      - minecraft:item/custom/my_rod # << CHANGE THIS
      - minecraft:item/custom/my_rod_cast # << CHANGE THIS

  # --- 钓鱼竿 + 手动指定 models ---
  custom:simple_rod_with_models:
    material: fishing_rod # << CHANGE THIS
    models:
      - minecraft:item/custom/rod_3d # << CHANGE THIS
      - minecraft:item/custom/rod_3d_cast # << CHANGE THIS
    textures:
      - minecraft:item/custom/rod_3d # << CHANGE THIS
      - minecraft:item/custom/rod_3d_cast # << CHANGE THIS

  # --- 鞘翅 (textures) ---
  custom:simple_elytra:
    material: elytra # << CHANGE THIS
    textures:
      - minecraft:item/custom/my_elytra # << CHANGE THIS
      - minecraft:item/custom/my_elytra_broken # << CHANGE THIS

  # --- 弓 (textures) ---
  custom:simple_bow:
    material: bow # << CHANGE THIS
    textures:
      - minecraft:item/custom/my_bow # << CHANGE THIS
      - minecraft:item/custom/my_bow_pulling_0 # << CHANGE THIS
      - minecraft:item/custom/my_bow_pulling_1 # << CHANGE THIS
      - minecraft:item/custom/my_bow_pulling_2 # << CHANGE THIS

  # --- 弩 (textures) ---
  custom:simple_crossbow:
    material: crossbow # << CHANGE THIS
    textures:
      - minecraft:item/custom/my_crossbow # << CHANGE THIS
      - minecraft:item/custom/my_crossbow_pulling_0 # << CHANGE THIS
      - minecraft:item/custom/my_crossbow_pulling_1 # << CHANGE THIS
      - minecraft:item/custom/my_crossbow_pulling_2 # << CHANGE THIS
      - minecraft:item/custom/my_crossbow_arrow # << CHANGE THIS
      - minecraft:item/custom/my_crossbow_firework # << CHANGE THIS

  # --- 盾牌 (models) ---
  custom:simple_shield:
    material: shield # << CHANGE THIS
    models:
      - minecraft:item/custom/my_shield # << CHANGE THIS
      - minecraft:item/custom/my_shield_blocking # << CHANGE THIS

  # --- 纯 model 路径 (无纹理设置) ---
  custom:simple_exit_icon:
    material: paper # << CHANGE THIS
    model: minecraft:item/custom/exit_icon # << CHANGE THIS

  # ==================================================================
  # 【二】minecraft:model — 标准模型
  # ==================================================================
  # 引用: models/model.md

  # --- 基础模型 (type 可省略) ---
  custom:basic_model:
    material: diamond_pickaxe # << CHANGE THIS
    model:
      type: minecraft:model # type 可选，默认值
      path: minecraft:item/custom/my_pickaxe # << CHANGE THIS

  # --- 模型 + 生成 (generation) ---
  custom:generated_model:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/my_item # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/my_item" # << CHANGE THIS

  # --- 手持模型 + 生成 ---
  custom:handheld_model:
    material: golden_axe # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/my_tool # << CHANGE THIS
      generation:
        parent: "minecraft:item/handheld" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/my_tool" # << CHANGE THIS

  # --- 模型 + 生成 + 变换 (26.1+) ---
  custom:model_with_transformation:
    material: diamond_pickaxe # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/my_item # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/my_item" # << CHANGE THIS
      transformation:
        scale: 1,1,1 # << CHANGE THIS 以原点为中心缩放
        translation: 0,0,0 # << CHANGE THIS 平移变换
        right_rotation:
          angle: 0.0 # << CHANGE THIS 旋转角度（弧度）
          axis: 0,0,0 # << CHANGE THIS 旋转轴三维向量
        left_rotation: 0,0,0,0 # << CHANGE THIS 再次旋转

  # --- 模型 + 着色 (tints) ---
  # tints 数组索引对应 BlockBench 中的 tintindex
  custom:model_with_tints:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/my_colored_item # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/my_colored_item" # << CHANGE THIS
      tints:
        - type: "minecraft:dye" # tintindex=0
          default: 144,80,62 # << CHANGE THIS
        - type: "minecraft:grass" # tintindex=1
          temperature: 0.5 # << CHANGE THIS
          downfall: 0.5 # << CHANGE THIS

  # ==================================================================
  # 【三】minecraft:model — 着色( Tints )类型全集
  # ==================================================================
  # 引用: models/model.md 着色部分
  # 每个 tints 条目支持以下类型之一

  custom:model_tints_constant:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/tinted_item # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/tinted_item" # << CHANGE THIS
      tints:
        # --- minecraft:constant ---
        - type: "minecraft:constant"
          value: -12012264 # << CHANGE THIS (十进制) 或 RGB 格式
          # value: 255,0,0           # RGB 逗号分隔
          # value:                    # RGB 列表
          #   - 255
          #   - 0
          #   - 0
          # value:                    # RGB 浮点列表
          #   - 1.0
          #   - 0.0
          #   - 0.0

  custom:model_tints_custom_model_data:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/cmd_tinted # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/cmd_tinted" # << CHANGE THIS
      tints:
        # --- minecraft:custom_model_data ---
        - type: "minecraft:custom_model_data"
          index: 0 # << CHANGE THIS
          default: -12012264 # << CHANGE THIS

  custom:model_tints_dye:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/dyeable # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/dyeable" # << CHANGE THIS
      tints:
        # --- minecraft:dye ---
        - type: "minecraft:dye"
          default: -12012264 # << CHANGE THIS

  custom:model_tints_firework:
    material: firework_rocket # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/firework # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/firework" # << CHANGE THIS
      tints:
        # --- minecraft:firework ---
        - type: "minecraft:firework"
          default: -12012264 # << CHANGE THIS

  custom:model_tints_grass:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/foliage # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/foliage" # << CHANGE THIS
      tints:
        # --- minecraft:grass ---
        - type: "minecraft:grass"
          temperature: 0.5 # << CHANGE THIS
          downfall: 0.5 # << CHANGE THIS

  custom:model_tints_map_color:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/map # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/map" # << CHANGE THIS
      tints:
        # --- minecraft:map_color ---
        - type: "minecraft:map_color"
          default: -12012264 # << CHANGE THIS

  custom:model_tints_potion:
    material: potion # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/potion # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/potion" # << CHANGE THIS
      tints:
        # --- minecraft:potion ---
        - type: "minecraft:potion"
          default: -12012264 # << CHANGE THIS

  custom:model_tints_team:
    material: paper # << CHANGE THIS
    model:
      type: minecraft:model
      path: minecraft:item/custom/team_colored # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated" # << CHANGE THIS
        textures:
          layer0: "minecraft:item/custom/team_colored" # << CHANGE THIS
      tints:
        # --- minecraft:team ---
        - type: "minecraft:team"
          default: -12012264 # << CHANGE THIS

  # ==================================================================
  # 【四】minecraft:condition — 布尔条件型
  # ==================================================================
  # 引用: models/condition.md
  # property 为布尔谓词, on_false / on_true 分别指定子模型

  # --- 基础结构 ---
  custom:condition_basic:
    material: fishing_rod # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:using_item" # << CHANGE THIS 谓词
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/model_false" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/model_true" # << CHANGE THIS
      transformation: # 可选; 26.1+
        scale: 1,1,1
        translation: 0,0,0
        right_rotation:
          angle: 0.0
          axis: 0,0,0
        left_rotation: 0,0,0,0

  # --- minecraft:broken ---
  custom:condition_broken:
    material: diamond_sword # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:broken"
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/sword_broken" # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/sword_normal" # << CHANGE THIS

  # --- minecraft:damaged ---
  custom:condition_damaged:
    material: diamond_pickaxe # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:damaged"
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/pickaxe_damaged" # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/pickaxe_pristine" # << CHANGE THIS

  # --- minecraft:fishing_rod/cast ---
  custom:condition_rod_cast:
    material: fishing_rod # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:fishing_rod/cast"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/my_rod" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/my_rod_cast" # << CHANGE THIS

  # --- minecraft:using_item ---
  custom:condition_using_item:
    material: bread # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:using_item"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/food_idle" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/food_eating" # << CHANGE THIS

  # --- minecraft:selected ---
  custom:condition_selected:
    material: compass # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:selected"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/compass_offhand" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/compass_selected" # << CHANGE THIS

  # --- minecraft:carried ---
  custom:condition_carried:
    material: paper # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:carried"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/item_normal" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/item_carried" # << CHANGE THIS

  # --- minecraft:extended_view ---
  custom:condition_extended_view:
    material: paper # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:extended_view"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/item_normal" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/item_shift_details" # << CHANGE THIS

  # --- minecraft:view_entity ---
  custom:condition_view_entity:
    material: paper # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:view_entity"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/item_third_person" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/item_first_person" # << CHANGE THIS

  # --- minecraft:bundle/has_selected_item ---
  custom:condition_bundle_selected:
    material: bundle # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:bundle/has_selected_item"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/bundle_empty" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/bundle_selected" # << CHANGE THIS

  # --- minecraft:has_component (带参数) ---
  custom:condition_has_component:
    material: diamond_sword # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:has_component"
      component: "minecraft:enchantments" # << CHANGE THIS
      ignore-default: false # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/sword_plain" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/sword_enchanted" # << CHANGE THIS

  # --- minecraft:keybind_down (带参数) ---
  custom:condition_keybind:
    material: paper # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:keybind_down"
      keybind: "key.left" # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/key_released" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/key_pressed" # << CHANGE THIS

  # --- minecraft:custom_model_data (带参数) ---
  custom:condition_custom_model_data:
    material: paper # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:custom_model_data"
      index: 0 # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/cmd_false" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/cmd_true" # << CHANGE THIS

  # --- minecraft:component (1.21.5+, 数据组件谓词) ---
  custom:condition_component:
    material: paper # << CHANGE THIS
    model:
      type: "minecraft:condition"
      property: "minecraft:component"
      # component: ... # 数据组件谓词，见 wiki 文档
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/custom/no_component" # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/custom/has_component" # << CHANGE THIS

  # ==================================================================
  # 【五】minecraft:range_dispatch — 值调配型
  # ==================================================================
  # 引用: models/range_dispatch.md
  # 根据数值属性选择模型，entries 按 threshold 升序排列，
  # 选择 threshold <= 属性值的最后一个条目

  # --- 基础结构 ---
  custom:range_dispatch_basic:
    material: crossbow # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:crossbow/pull" # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/model_1" # << CHANGE THIS
          threshold: 0.58 # << CHANGE THIS
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/model_2" # << CHANGE THIS
          threshold: 1.0 # << CHANGE THIS
      fallback:
        type: minecraft:model
        path: "minecraft:item/custom/model_3" # << CHANGE THIS 当小于所有阈值时使用
      transformation: # 可选; 26.1+
        scale: 1,1,1
        translation: 0,0,0
        right_rotation:
          angle: 0.0
          axis: 0,0,0
        left_rotation: 0,0,0,0

  # --- minecraft:crossbow/pull ---
  custom:range_crossbow_pull:
    material: crossbow # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:crossbow/pull"
      entries:
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/crossbow_pull_0" # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/crossbow_pull_1" # << CHANGE THIS
          threshold: 0.58
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/crossbow_pull_2" # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "minecraft:item/custom/crossbow_idle" # << CHANGE THIS

  # --- minecraft:bundle/fullness ---
  custom:range_bundle_fullness:
    material: bundle # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:bundle/fullness"
      entries:
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/bundle_empty" # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/bundle_half" # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/bundle_full" # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "minecraft:item/custom/bundle_empty" # << CHANGE THIS

  # --- minecraft:cooldown ---
  custom:range_cooldown:
    material: shield # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:cooldown"
      entries:
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/shield_ready" # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/shield_cooling" # << CHANGE THIS
          threshold: 0.5
      fallback:
        type: minecraft:model
        path: "minecraft:item/custom/shield_cooling_max" # << CHANGE THIS

  # --- minecraft:compass (带参数) ---
  custom:range_compass:
    material: compass # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:compass"
      target: spawn # << CHANGE THIS
      wobble: true # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/compass_00" # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/compass_16" # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/compass_32" # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "minecraft:item/custom/compass_00" # << CHANGE THIS

  # --- minecraft:count (带参数) ---
  custom:range_count:
    material: snowball # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:count"
      normalize: true # << CHANGE THIS 归一化到 0-1
      entries:
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/snowball_1" # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/snowball_8" # << CHANGE THIS
          threshold: 0.33
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/snowball_16" # << CHANGE THIS
          threshold: 0.66
        - model:
            type: minecraft:model
            path: "minecraft:item/custom/snowball_64" # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "minecraft:item/custom/snowball_1" # << CHANGE THIS

  # --- minecraft:damage (带参数) ---
  custom:range_damage:
    material: diamond_sword # << CHANGE THIS
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:damage"
      normalize: true # << CHANGE THIS 归一化到 0-1
      entries:
        - model:
