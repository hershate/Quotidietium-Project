# =============================================================================
# 食物/消耗品物品配置示例 | 基于 CraftEngine Wiki
# 参考 Wiki（本地路径）:
#   configuration/item/data.md
#     - food 节:          nutrition / saturation / can_always_eat
#     - components 节:    minecraft:consumable 等自定义组件格式
#   configuration.md
#     - minecraft:consumable 组件示例 (consume_seconds / animation)
# 自定义组件的扩展字段遵循 Minecraft Wiki 中 consumable 组件的规范。
# =============================================================================
# 本文件演示 5 种食物物品：
#   1) 基础食物（仅 food 组件）
#   2) 可随时食用的食物（can_always_eat: true）
#   3) 自定义消耗行为的食物（consumable 组件：耗时/动画/音效/粒子）
#   4) 消耗后施加状态效果的食物（on_consume_effects -> apply_effects）
#   5) 完整功能食物（全字段组合）
# 所有标记 << CHANGE THIS 的值请根据实际需求修改。
# 将命名空间 "myquest" 替换为你的项目命名空间。
# =============================================================================

items:

  # ============================================================================
  # 示例 1: 基础食物
  # 仅使用 food 硬编码组件（data.md food 节）
  # ============================================================================
  myquest:magic_apple:
    material: apple                                          # << CHANGE THIS
    data:
      # food 组件 — 饱食度与饱和度（data.md 第 353-365 行）
      food:
        nutrition: 6          # << CHANGE THIS 饱食度 (整数, 0-20)
        saturation: 4.0       # << CHANGE THIS 饱和度 (单精度浮点数, 0.0-20.0)
        can_always_eat: false # << CHANGE THIS 是否可满饱时食用 (布尔值)

  # ============================================================================
  # 示例 2: 可随时食用的食物 (always-edible)
  # can_always_eat: true 使物品在任何饥饿值时都可食用
  # ============================================================================
  myquest:golden_berries:
    material: sweet_berries                                   # << CHANGE THIS
    data:
      food:
        nutrition: 2          # << CHANGE THIS
        saturation: 1.5       # << CHANGE THIS
        can_always_eat: true  # << CHANGE THIS 满饱时仍可食用（总是可食）

  # ============================================================================
  # 示例 3: 自定义消耗行为的食物
  # 使用 minecraft:consumable 组件控制消耗过程（configuration.md 第 117-119 行）
  # 添加 sound、has_consume_particles 等扩展字段
  # ============================================================================
  myquest:hearty_stew:
    material: mushroom_stew                                   # << CHANGE THIS
    data:
      food:
        nutrition: 8          # << CHANGE THIS
        saturation: 6.0       # << CHANGE THIS
        can_always_eat: true  # << CHANGE THIS
      components:
        # minecraft:consumable 组件 — 控制消耗方式（configuration.md 示例 2）
        minecraft:consumable:
          consume_seconds: 1.6            # << CHANGE THIS 食用耗时 (秒, 浮点数)
          animation: eat                   # << CHANGE THIS 食用动画
                                           #   可选: eat / drink / block / bow
                                           #         crossbow / spear / spyglass
                                           #         toot_horn / brush / none
          sound: minecraft:entity.generic.eat
                                           # << CHANGE THIS 食用音效 (命名空间ID)
          has_consume_particles: true      # << CHANGE THIS 是否显示消耗粒子 (布尔值)

  # ============================================================================
  # 示例 4: 消耗后施加状态效果的食物
  # 使用 on_consume_effects -> apply_effects 施加多个状态效果
  # 遵循 Minecraft Wiki consumable 组件规范
  # ============================================================================
  myquest:warrior_ration:
    material: cooked_beef                                     # << CHANGE THIS
    data:
      food:
        nutrition: 12         # << CHANGE THIS
        saturation: 8.0       # << CHANGE THIS
        can_always_eat: true  # << CHANGE THIS
      components:
        minecraft:consumable:
          consume_seconds: 2.0            # << CHANGE THIS
          animation: eat                   # << CHANGE THIS
          sound: minecraft:entity.generic.eat
                                           # << CHANGE THIS
          has_consume_particles: true      # << CHANGE THIS
          # on_consume_effects — 消耗后触发的效果列表
          on_consume_effects:
            # 效果 1: 施加速度 II 和生命恢复 III
            - type: apply_effects
              effects:
                - effect: minecraft:speed          # << CHANGE THIS 效果 ID
                  duration: 600                     # << CHANGE THIS 持续刻数 (20刻=1秒)
                  amplifier: 1                      # << CHANGE THIS 等级 (0=I级, 1=II级)
                  ambient: false                    # 是否使用环境效果渲染 (减少粒子)
                  show_particles: true              # 是否显示效果粒子
                  show_icon: true                   # 是否显示效果图标
                - effect: minecraft:regeneration
                  duration: 200                     # << CHANGE THIS (10秒)
                  amplifier: 2                      # << CHANGE THIS (III级)
                  ambient: false
                  show_particles: true
                  show_icon: true
            # 效果 2: 施加伤害吸收 IV
            - type: apply_effects
              effects:
                - effect: minecraft:absorption
                  duration: 1200                    # << CHANGE THIS (60秒)
                  amplifier: 3                      # << CHANGE THIS (IV级)
                  ambient: false
                  show_particles: true
                  show_icon: true

  # ============================================================================
  # 示例 5: 完整功能食物 — 全字段组合
  # food + consumable 全字段 + 多重 on_consume_effects
  # ============================================================================
  myquest:ancient_biscuit:
    material: cookie                                       # << CHANGE THIS
    data:
      # 自定义名称和描述
      item_name: "<!i><#FFAA00>远古饼干"
      lore:
        - "<gray>来自失落文明的遗物"
        - "<green>食用后获得神圣庇护"
      # food 组件
      food:
        nutrition: 4          # << CHANGE THIS
        saturation: 2.0       # << CHANGE THIS
        can_always_eat: true  # << CHANGE THIS
      components:
        minecraft:consumable:
          consume_seconds: 0.8            # << CHANGE THIS 快速食用
          animation: eat                   # << CHANGE THIS
          sound: minecraft:entity.generic.eat
                                           # << CHANGE THIS
          has_consume_particles: false     # << CHANGE THIS 不显示粒子
          on_consume_effects:
            # 效果 1: 伤害吸收 IV
            - type: apply_effects
              effects:
                - effect: minecraft:absorption
                  duration: 2400                    # << CHANGE THIS (120秒)
                  amplifier: 3                      # << CHANGE THIS (IV级)
                  ambient: true                     # 环境效果渲染 (粒子较少)
                  show_particles: false
                  show_icon: true
                - effect: minecraft:resistance
                  duration: 2400                    # << CHANGE THIS
                  amplifier: 1                      # << CHANGE THIS (II级)
                  ambient: true
                  show_particles: false
                  show_icon: true
            # 效果 2: 瞬间饱和
            - type: apply_effects
              effects:
                - effect: minecraft:saturation
                  duration: 1
                  amplifier: 0
                  ambient: false
                  show_particles: false
                  show_icon: true
      # 附加硬编码数据（data.md 其他节）
      enchantment:                      # data.md enchantment 节
        minecraft:unbreaking: 1
      custom_model_data: 3001           # data.md custom_model_data 节
