        left_rotation: 0,0,0,0



# ============================================================
# 第五部分: minecraft:composite (组合)
# 按数组次序从后向前依次渲染 (后加入的在上层)
# ============================================================

  # --- 基础组合 ---
  questcraft:composite_basic:
    model:
      type: "minecraft:composite"
      models:
        - type: minecraft:model
          path: "questcraft:item/custom/base_layer"                            # << CHANGE THIS
        - type: minecraft:model
          path: "questcraft:item/custom/overlay_glow"                          # << CHANGE THIS
        - type: minecraft:model
          path: "questcraft:item/custom/overlay_gem"                           # << CHANGE THIS

  # --- 组合 + generation (每层独立生成) ---
  questcraft:composite_generated:
    model:
      type: "minecraft:composite"
      models:
        - type: minecraft:model
          path: "questcraft:item/custom/weapon_blade"                          # << CHANGE THIS
          generation:
            parent: "minecraft:item/generated"
            textures:
              layer0: "questcraft:item/custom/weapon_blade"                    # << CHANGE THIS
        - type: minecraft:model
          path: "questcraft:item/custom/weapon_handle"                         # << CHANGE THIS
          generation:
            parent: "minecraft:item/generated"
            textures:
              layer0: "questcraft:item/custom/weapon_handle"                   # << CHANGE THIS
        - type: minecraft:model
          path: "questcraft:item/custom/weapon_gem"                            # << CHANGE THIS
          generation:
            parent: "minecraft:item/generated"
            textures:
              layer0: "questcraft:item/custom/weapon_gem"                      # << CHANGE THIS

  # --- 组合 + tints (每层独立着色) ---
  questcraft:composite_tinted:
    model:
      type: "minecraft:composite"
      models:
        - type: minecraft:model
          path: "questcraft:item/custom/armor_base"                            # << CHANGE THIS
          tints:
            - type: "minecraft:dye"
              default: -12012264                                               # << CHANGE THIS
        - type: minecraft:model
          path: "questcraft:item/custom/armor_trim"                            # << CHANGE THIS
          tints:
            - type: "minecraft:constant"
              value: 16711680                                                  # << CHANGE THIS

  # --- 组合 + transformation ---
  questcraft:composite_transformed:
    model:
      type: "minecraft:composite"
      models:
        - type: minecraft:model
          path: "questcraft:item/custom/part_a"                                # << CHANGE THIS
        - type: minecraft:model
          path: "questcraft:item/custom/part_b"                                # << CHANGE THIS
      transformation:
        scale: 1,1,1
        translation: 0,0,0
        right_rotation:
          angle: 0.0
          axis: 0,0,0
        left_rotation: 0,0,0,0



