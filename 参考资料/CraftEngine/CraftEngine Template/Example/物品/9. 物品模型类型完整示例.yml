# ============================================================================
# 物品模型类型完整示例
# 参考: CraftEngine Wiki - configuration/item/models.md 及子页面
# 命名空间: questcraft
# ============================================================================
# 本文件展示 CraftEngine 支持的全部物品模型类型:
#   1. 简化模型 (texture / textures / model / models)
#   2. minecraft:model (含 tints 生成 transformation)
#   3. minecraft:condition (布尔条件型)
#   4. minecraft:range_dispatch (值调配型)
#   5. minecraft:composite (组合)
#   6. minecraft:select (枚举条件型)
#   7. minecraft:special (特殊模型/硬编码渲染器)
# ============================================================================



# ============================================================
# 第一部分: 简化模型
# 自动分析基础材质并选择最合适的方法生成模型
# ============================================================
items:

  # --- 2D 图标 (texture 单纹理) ---
  questcraft:ender_pearl_seeds:
    material: paper
    texture: questcraft:item/custom/ender_pearl_seeds                          # << CHANGE THIS

  # --- 手持物品 (texture 单纹理, 自动识别手持) ---
  questcraft:topaz_axe:
    material: golden_axe
    texture: questcraft:item/custom/topaz_axe                                  # << CHANGE THIS

  # --- 多纹理叠加 (textures 数组) ---
  questcraft:topaz_axe_overlay:
    material: golden_axe
    textures:
      - questcraft:item/custom/topaz_axe                                       # << CHANGE THIS
      - questcraft:item/custom/topaz                                           # << CHANGE THIS

  # --- 钓鱼竿 (textures 自动状态切换) ---
  questcraft:topaz_rod:
    material: fishing_rod
    textures:
      - questcraft:item/custom/topaz_rod                                       # << CHANGE THIS
      - questcraft:item/custom/topaz_rod_cast                                  # << CHANGE THIS

  # --- 鞘翅 (textures 破损/完好) ---
  questcraft:flame_elytra:
    material: elytra
    textures:
      - questcraft:item/custom/flame_elytra                                    # << CHANGE THIS
      - questcraft:item/custom/flame_elytra_broken                             # << CHANGE THIS

  # --- 弓 (textures 拉弦动画) ---
  questcraft:topaz_bow:
    material: bow
    textures:
      - questcraft:item/custom/topaz_bow                                       # << CHANGE THIS
      - questcraft:item/custom/topaz_bow_pulling_0                             # << CHANGE THIS
      - questcraft:item/custom/topaz_bow_pulling_1                             # << CHANGE THIS
      - questcraft:item/custom/topaz_bow_pulling_2                             # << CHANGE THIS

  # --- 弩 (textures 装填动画) ---
  questcraft:topaz_crossbow:
    material: crossbow
    textures:
      - questcraft:item/custom/topaz_crossbow                                  # << CHANGE THIS
      - questcraft:item/custom/topaz_crossbow_pulling_0                        # << CHANGE THIS
      - questcraft:item/custom/topaz_crossbow_pulling_1                        # << CHANGE THIS
      - questcraft:item/custom/topaz_crossbow_pulling_2                        # << CHANGE THIS
      - questcraft:item/custom/topaz_crossbow_arrow                            # << CHANGE THIS
      - questcraft:item/custom/topaz_crossbow_firework                         # << CHANGE THIS

  # --- 盾牌 (models 数组 + 已存在模型文件) ---
  questcraft:shield_3d:
    material: shield
    models:
      - questcraft:item/custom/shield_3d                                       # << CHANGE THIS
      - questcraft:item/custom/shield_3d_blocking                              # << CHANGE THIS

  # --- 直接指定 model 路径 ---
  questcraft:exit_icon:
    material: paper
    model: questcraft:item/custom/exit_icon                                    # << CHANGE THIS

  # --- model + texture 同时指定 ---
  questcraft:ender_pearl_flower_seeds:
    material: paper
    model: questcraft:item/custom/ender_pearl_flower_seeds                      # << CHANGE THIS
    texture: questcraft:item/custom/ender_pearl_flower_seeds                    # << CHANGE THIS

  # --- models + textures 同时指定 ---
  questcraft:topaz_rod_explicit:
    material: fishing_rod
    models:
      - questcraft:item/custom/topaz_rod                                       # << CHANGE THIS
      - questcraft:item/custom/topaz_rod_cast                                  # << CHANGE THIS
    textures:
      - questcraft:item/custom/topaz_rod                                       # << CHANGE THIS
      - questcraft:item/custom/topaz_rod_cast                                  # << CHANGE THIS



# ============================================================
# 第二部分: minecraft:model (基础模型)
# type 可省略, 默认 minecraft:model
# ============================================================

  # --- 基础路径 + 生成 (2D 图标) ---
  questcraft:model_generated:
    material: paper
    model:
      path: questcraft:item/custom/model_generated                              # << CHANGE THIS
      generation:
        parent: "minecraft:item/generated"
        textures:
          layer0: "questcraft:item/custom/model_generated"                     # << CHANGE THIS

  # --- 基础路径 + 生成 (手持) ---
  questcraft:model_handheld:
    material: golden_axe
    model:
      type: minecraft:model
      path: questcraft:item/custom/topaz_pickaxe                                # << CHANGE THIS
      generation:
        parent: "minecraft:item/handheld"
        textures:
          layer0: "questcraft:item/custom/topaz_pickaxe"                       # << CHANGE THIS

  # --- 变换 (transformation / 26.1+) ---
  questcraft:model_transformed:
    material: paper
    model:
      type: minecraft:model
      path: questcraft:item/custom/transformed_item                            # << CHANGE THIS
      transformation:
        scale: 1,1,1                                                           # << CHANGE THIS
        translation: 0,0,0                                                     # << CHANGE THIS
        right_rotation:
          angle: 0.0                                                           # << CHANGE THIS
          axis: 0,0,0                                                          # << CHANGE THIS
        left_rotation: 0,0,0,0                                                 # << CHANGE THIS

  # --- 着色: minecraft:constant ---
  questcraft:palm_leaves:
    material: paper
    model:
      type: minecraft:model
      path: questcraft:item/custom/palm_leaves                                  # << CHANGE THIS
      generation:
        parent: "questcraft:block/custom/palm_leaves"
      tints:
        - type: "minecraft:constant"
          value: -12012264                                                     # << CHANGE THIS

  # --- 着色: minecraft:custom_model_data ---
  questcraft:tint_custom_model_data:
    material: paper
    model:
      type: minecraft:model
      path: questcraft:item/custom/tint_cmd                                    # << CHANGE THIS
      tints:
        - type: "minecraft:custom_model_data"
          index: 0                                                             # << CHANGE THIS
          default: -12012264                                                   # << CHANGE THIS

  # --- 着色: minecraft:dye (可染色) ---
  questcraft:dyeable_example:
    material: leather_chestplate
    model:
      type: minecraft:model
      path: questcraft:item/custom/dyeable_example                             # << CHANGE THIS
      multiples: # 注: 此键不在wiki中, 仅示意 - 实际使用 tints
      tints:
        - type: "minecraft:dye"
          default: -12012264                                                   # << CHANGE THIS

  # --- 着色: minecraft:firework ---
  questcraft:firework_tint:
    material: firework_rocket
    model:
      type: minecraft:model
      path: minecraft:item/firework_rocket
      tints:
        - type: "minecraft:firework"
          default: -12012264                                                   # << CHANGE THIS

  # --- 着色: minecraft:grass (生物群系颜色) ---
  questcraft:grass_tint:
    material: paper
    model:
      type: minecraft:model
      path: questcraft:item/custom/grass_tint                                  # << CHANGE THIS
      tints:
        - type: "minecraft:grass"
          temperature: 0.5                                                     # << CHANGE THIS
          downfall: 0.5                                                        # << CHANGE THIS

  # --- 着色: minecraft:map_color ---
  questcraft:map_color_tint:
    material: filled_map
    model:
      type: minecraft:model
      path: minecraft:item/filled_map
      tints:
        - type: "minecraft:map_color"
          default: -12012264                                                   # << CHANGE THIS

  # --- 着色: minecraft:potion ---
  questcraft:potion_tint:
    material: potion
    model:
      type: minecraft:model
      path: questcraft:item/custom/potion_base                                 # << CHANGE THIS
      tints:
        - type: "minecraft:potion"
          default: -12012264                                                   # << CHANGE THIS

  # --- 着色: minecraft:team ---
  questcraft:team_tint:
    material: paper
    model:
      type: minecraft:model
      path: questcraft:item/custom/team_tint                                   # << CHANGE THIS
      tints:
        - type: "minecraft:team"
          default: -12012264                                                   # << CHANGE THIS

  # --- 多 tintindex 示例 (BlockBench 着色) ---
  questcraft:tints_example:
    material: paper
    model:
      type: minecraft:model
      path: questcraft:item/example                                            # << CHANGE THIS
      generation:
        parent: "questcraft:block/example"
      tints:
        - type: "minecraft:dye"                                                # tintindex=0
          default: 144,80,62                                                   # << CHANGE THIS
        - type: "minecraft:grass"                                              # tintindex=1
          temperature: 0.5                                                     # << CHANGE THIS
          downfall: 0.5                                                        # << CHANGE THIS

  # --- minecraft:model 着色综合示例 (RGB 三种格式) ---
  questcraft:tint_rgb_formats:
    model:
      type: minecraft:model
      path: questcraft:item/custom/tint_formats                                # << CHANGE THIS
      tints:
        - type: "minecraft:constant"
          value: 16711680                       # 十进制 (红色)               # << CHANGE THIS
        - type: "minecraft:constant"
          value:                                # RGB 列表 (整数 0-255)
            - 255                                                             # << CHANGE THIS
            - 0                                                               # << CHANGE THIS
            - 0                                                               # << CHANGE THIS
        - type: "minecraft:constant"
          value: 255,0,0                        # 逗号分隔 RGB               # << CHANGE THIS



# ============================================================
# 第三部分: minecraft:condition (布尔条件型)
# ============================================================

  # --- 谓词: minecraft:using_item ---
  questcraft:condition_using_item:
    model:
      type: "minecraft:condition"
      property: "minecraft:using_item"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/sword_idle"                              # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/sword_blocking"                          # << CHANGE THIS

  # --- 谓词: minecraft:broken ---
  questcraft:condition_broken:
    model:
      type: "minecraft:condition"
      property: "minecraft:broken"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/tool_normal"                             # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/tool_broken"                             # << CHANGE THIS

  # --- 谓词: minecraft:damaged ---
  questcraft:condition_damaged:
    model:
      type: "minecraft:condition"
      property: "minecraft:damaged"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/armor_new"                               # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/armor_damaged"                           # << CHANGE THIS

  # --- 谓词: minecraft:selected ---
  questcraft:condition_selected:
    model:
      type: "minecraft:condition"
      property: "minecraft:selected"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/weapon_holstered"                        # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/weapon_drawn"                            # << CHANGE THIS

  # --- 谓词: minecraft:carried ---
  questcraft:condition_carried:
    model:
      type: "minecraft:condition"
      property: "minecraft:carried"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/item_normal"                             # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/item_carried"                            # << CHANGE THIS

  # --- 谓词: minecraft:extended_view (Shift 查看) ---
  questcraft:condition_extended_view:
    model:
      type: "minecraft:condition"
      property: "minecraft:extended_view"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/icon_small"                              # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/icon_large"                              # << CHANGE THIS

  # --- 谓词: minecraft:fishing_rod/cast ---
  questcraft:condition_rod_cast:
    model:
      type: "minecraft:condition"
      property: "minecraft:fishing_rod/cast"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/rod_idle"                                # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/rod_cast"                                # << CHANGE THIS

  # --- 谓词: minecraft:view_entity ---
  questcraft:condition_view_entity:
    model:
      type: "minecraft:condition"
      property: "minecraft:view_entity"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/third_person"                            # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/first_person"                            # << CHANGE THIS

  # --- 谓词: minecraft:bundle/has_selected_item ---
  questcraft:condition_bundle_selected:
    model:
      type: "minecraft:condition"
      property: "minecraft:bundle/has_selected_item"
      on_false:
        type: "minecraft:model"
        path: "minecraft:item/bundle"
      on_true:
        type: "minecraft:model"
        path: "minecraft:item/bundle_filled"

  # --- 谓词: minecraft:has_component ---
  questcraft:condition_has_enchant:
    model:
      type: "minecraft:condition"
      property: "minecraft:has_component"
      component: "minecraft:enchantments"                                      # << CHANGE THIS
      ignore-default: false                                                    # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/sword_plain"                             # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/sword_enchanted"                         # << CHANGE THIS

  # --- 谓词: minecraft:keybind_down ---
  questcraft:condition_sneaking:
    model:
      type: "minecraft:condition"
      property: "minecraft:keybind_down"
      keybind: "key.left"                                                      # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/normal"                                  # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/sneaking"                                # << CHANGE THIS

  # --- 谓词: minecraft:custom_model_data ---
  questcraft:condition_cmd:
    model:
      type: "minecraft:condition"
      property: "minecraft:custom_model_data"
      index: 0                                                                 # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/default_skin"                            # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/alt_skin"                                # << CHANGE THIS

  # --- 谓词: minecraft:component (1.21.5+) ---
  questcraft:condition_component_unbreakable:
    model:
      type: "minecraft:condition"
      property: "minecraft:component"                                          # 1.21.5+
      component: "minecraft:unbreakable"                                       # << CHANGE THIS
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/tool_normal"                             # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/tool_unbreakable"                        # << CHANGE THIS

  # --- condition + transformation ---
  questcraft:condition_transformed:
    model:
      type: "minecraft:condition"
      property: "minecraft:using_item"
      on_false:
        type: "minecraft:model"
        path: "questcraft:item/custom/idle"                                    # << CHANGE THIS
      on_true:
        type: "minecraft:model"
        path: "questcraft:item/custom/active"                                  # << CHANGE THIS
      transformation:
        scale: 1,1,1                                                           # << CHANGE THIS
        translation: 0,0,0                                                     # << CHANGE THIS
        right_rotation:
          angle: 0.0                                                           # << CHANGE THIS
          axis: 0,0,0                                                          # << CHANGE THIS
        left_rotation: 0,0,0,0                                                 # << CHANGE THIS



# ============================================================
# 第四部分: minecraft:range_dispatch (值调配型)
# 选择阈值小于或等于属性值的最后一个条目
# ============================================================

  # --- 数值属性: minecraft:crossbow/pull ---
  questcraft:range_crossbow_pull:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:crossbow/pull"
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/crossbow_pulling_0"                  # << CHANGE THIS
          threshold: 0.58                                                      # << CHANGE THIS
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/crossbow_pulling_1"                  # << CHANGE THIS
          threshold: 1.0                                                       # << CHANGE THIS
      fallback:
        type: minecraft:model
        path: "questcraft:item/custom/crossbow_standby"                        # << CHANGE THIS

  # --- 数值属性: minecraft:bundle/fullness ---
  questcraft:range_bundle_fullness:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:bundle/fullness"
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/bundle_empty"                        # << CHANGE THIS
          threshold: 0.0                                                       # << CHANGE THIS
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/bundle_half"                         # << CHANGE THIS
          threshold: 0.5                                                       # << CHANGE THIS
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/bundle_full"                         # << CHANGE THIS
          threshold: 1.0                                                       # << CHANGE THIS
      fallback:
        type: minecraft:model
        path: "minecraft:item/bundle"

  # --- 数值属性: minecraft:cooldown ---
  questcraft:range_cooldown:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:cooldown"
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/ready"                               # << CHANGE THIS
          threshold: 0.0                                                       # << CHANGE THIS
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/cooling_half"                        # << CHANGE THIS
          threshold: 0.5                                                       # << CHANGE THIS
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/cooling_full"                        # << CHANGE THIS
          threshold: 1.0                                                       # << CHANGE THIS
      fallback:
        type: minecraft:model
        path: "questcraft:item/custom/cooling_max"                             # << CHANGE THIS

  # --- 数值属性: minecraft:compass (带 target/wobble) ---
  questcraft:range_compass:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:compass"
      target: spawn                                                           # << CHANGE THIS
      wobble: true                                                             # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/compass_00"                          # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/compass_16"                          # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/compass_31"                          # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "minecraft:item/compass"

  # --- 数值属性: minecraft:count (带 normalize) ---
  questcraft:range_count:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:count"
      normalize: true                                                          # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/stack_single"                        # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/stack_half"                          # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/stack_full"                          # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "questcraft:item/custom/stack_overflow"                          # << CHANGE THIS

  # --- 数值属性: minecraft:damage (带 normalize) ---
  questcraft:range_damage:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:damage"
      normalize: true                                                          # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/tool_pristine"                       # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/tool_worn"                           # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/tool_battered"                       # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "questcraft:item/custom/tool_broken"                             # << CHANGE THIS

  # --- 数值属性: minecraft:time (时钟) ---
  questcraft:range_time:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:time"
      source: daytime                                                          # << CHANGE THIS
      wobble: true                                                             # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/clock_00"                            # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/clock_06"                            # << CHANGE THIS
          threshold: 0.25
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/clock_12"                            # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/clock_18"                            # << CHANGE THIS
          threshold: 0.75
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/clock_24"                            # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "minecraft:item/clock"

  # --- 数值属性: minecraft:use_cycle ---
  questcraft:range_use_cycle:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:use_cycle"
      period: 1.0                                                              # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/cycle_0"                             # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/cycle_1"                             # << CHANGE THIS
          threshold: 0.33
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/cycle_2"                             # << CHANGE THIS
          threshold: 0.66
      fallback:
        type: minecraft:model
        path: "questcraft:item/custom/cycle_end"                               # << CHANGE THIS

  # --- 数值属性: minecraft:use_duration ---
  questcraft:range_use_duration:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:use_duration"
      remaining: false                                                         # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/eating_start"                        # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/eating_half"                         # << CHANGE THIS
          threshold: 0.5
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/eating_done"                         # << CHANGE THIS
          threshold: 1.0
      fallback:
        type: minecraft:model
        path: "questcraft:item/custom/eating_ready"                            # << CHANGE THIS

  # --- 数值属性: minecraft:custom_model_data (字符串数组下标) ---
  questcraft:range_cmd:
    model:
      type: "minecraft:range_dispatch"
      property: "minecraft:custom_model_data"
      index: 0                                                                 # << CHANGE THIS
      entries:
        - model:
            type: minecraft:model
            path: "questcraft:item/custom/variant_1"                           # << CHANGE THIS
          threshold: 0.0
        - model:
            type: minecraft:model
