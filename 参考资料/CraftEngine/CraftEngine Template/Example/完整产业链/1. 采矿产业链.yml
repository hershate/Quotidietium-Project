  mymining:mythril_chestplate_recipe:
    type: shaped
    category: equipment
    group: mythril_armor
    pattern:
      - "A A"
      - "AAA"
      - "AAA"
    ingredients:
      A: "mymining:mythril_ingot"
    result:
      id: mymining:mythril_chestplate
      count: 1

# =============================================================================
# 八、战利品表模板 (复用)
# =============================================================================
templates:
  mymining:loot/deepslate_ore:
    loot:
      pools:
        - rolls: 1
          entries:
            - type: alternatives
              children:
                - type: item
                  item: "${__NAMESPACE__}:${__ID__}"
                  conditions:
                    - type: enchantment
                      predicate: minecraft:silk_touch>=1
                - type: item
                  item: "mymining:raw_mythril"
                  functions:
                    - type: apply_bonus
                      enchantment: minecraft:fortune
                      formula:
                        type: ore_drops
