# ============================================================================
# 方块设置 — 全部可用设置项参考
# ============================================================================
# 对应 Wiki: configuration/block/settings.md
#
# 本文档以 Oraxen 风格列出所有 settings 下的可用配置项。
# 所有设置项均为**可选**（省略时使用默认值），并能通过变体按状态覆盖。
#
# 分类说明:
#   - 稳定设置: 完全支持，无已知问题
#   - 不稳定设置: 尽可能支持，可能出现服务端与客户端不同步的问题
#   - 扩展别名: 与 CraftEngine 原生设置等价的别名或概念映射
#   - 未文档化设置: 用户请求中提及但 CraftEngine 不直接支持或未文档化的项
#
# 注意: 本文件为模板参考文件，不直接加载。使用时请将所需设置项复制
#       到实际的方块配置文件中，或作为查阅速查表使用。
# ============================================================================

# --------------------------------------------------------------------------
# blocks 根键
# 所有自定义方块都定义在此根键下。每个方块以 "命名空间:方块ID" 为键。
# --------------------------------------------------------------------------
blocks:

  # ==========================================================================
  # 完整设置示例
  # ==========================================================================
  custom:all_settings_block:
    settings:
      # ======================================================================
      # 一、稳定设置 (Stable Settings)
      # ======================================================================

      # ------------------------------------------------------------------
      # item
      # ------------------------------------------------------------------
      # 决定方块对应的掉落物品 ID。通常在创造模式使用鼠标中键点击来
      # 获取方块。如果为 null，则破坏方块后不掉落任何物品。
      # 类型: string (命名空间:物品ID) 或 null
      # 默认值: null
      # ------------------------------------------------------------------
      item: custom:all_settings_item

      # ------------------------------------------------------------------
      # hardness (硬度)
      # ------------------------------------------------------------------
      # 决定挖掘这个方块需要的挖掘时间。计算方式与原版相同：
      # 挖掘时间 = 硬度 × 1.5 / 工具速度 (空手时)。
      # 常用参考: 石头 1.5, 原木 2.0, 黑曜石 50.0, 基岩 -1.0 (不可破坏)
      # 类型: float (0.0 ~ 正无穷, -1.0 = 不可破坏)
      # 默认值: 2.0
      # ------------------------------------------------------------------
      hardness: 0.5

      # ------------------------------------------------------------------
      # resistance (爆炸抗性)
      # ------------------------------------------------------------------
      # 决定方块在爆炸中吸收和阻止爆炸破坏方块传播的强度。
      # 抗性 = 爆炸抗性 × 0.3 + 0.3 (减伤计算时)。
      # 常用参考: 石头 6.0, 黑曜石 1200.0, 基岩 3600000.0 (不可摧毁)
      # 类型: float
      # 默认值: 2.0
      # ------------------------------------------------------------------
      resistance: 0.5

      # ------------------------------------------------------------------
      # push_reaction (活塞推动行为)
      # ------------------------------------------------------------------
      # 决定方块在受到活塞推动时的反应。由于客户端视觉同步问题，
      # 某些反应可能与特定方块类型不兼容。
      # 类型: enum
      # 可选值:
      #   NORMAL     - 可推动，可拉动 (默认)
      #   DESTROY    - 被推动破坏，不可拉动
      #   BLOCK      - 不可推动，不可拉动
      #   IGNORE     - 不可推动，但可粘附在粘性方块上
      #   PUSH_ONLY  - 可推动，不可拉动
      # 默认值: NORMAL
      # ------------------------------------------------------------------
      push_reaction: NORMAL

      # ------------------------------------------------------------------
      # map_color (地图颜色)
      # ------------------------------------------------------------------
      # 决定地图在表示此方块时会使用的颜色的基色。
      # 可用颜色可参考: https://zh.minecraft.wiki/w/地图存储格式#地图基色
      # 类型: int (0 ~ 255)
      # 默认值: 0
      # ------------------------------------------------------------------
      map_color: 36

      # ------------------------------------------------------------------
      # burnable (熔岩可燃性 / lava_flammable)
      # ------------------------------------------------------------------
      # 决定熔岩是否可以在该方块上生成火。若为 true，则熔岩接触时
      # 方块表面会起火。
      # 别名: lava_flammable (其他插件/概念中的等价名称)
      # 类型: boolean
      # 默认值: false
      # ------------------------------------------------------------------
      burnable: false

      # ------------------------------------------------------------------
      # fire_spread_chance (烧毁几率)
      # ------------------------------------------------------------------
      # 影响火与其相邻时破坏该方块的几率和速率。
      # 方块烧毁几率为正数时，其所有表面均可燃烧，否则只有其完整的
      # 上表面可以燃烧。
      # 类型: int (0 ~ 100)
      # 默认值: 0
      # ------------------------------------------------------------------
      fire_spread_chance: 0

      # ------------------------------------------------------------------
      # burn_chance (引燃几率)
      # ------------------------------------------------------------------
      # 影响火在其附近时传播到该方块表面上的几率和速率。
      # 引燃几率为正数的方块被称为"可燃方块"。
      # 类型: int (0 ~ 100)
      # 默认值: 0
      # ------------------------------------------------------------------
      burn_chance: 0

      # ------------------------------------------------------------------
      # replaceable (可替代)
      # ------------------------------------------------------------------
      # 决定方块是否可以被其他方块通过放置直接替代掉，影响方块物品
      # 放置出方块的方式。例如: 草、花、水等。
      # 类型: boolean
      # 默认值: false
      # ------------------------------------------------------------------
      replaceable: false

      # ------------------------------------------------------------------
      # is_redstone_conductor (红石导体)
      # ------------------------------------------------------------------
      # 决定方块在红石信号传播中的影响。具有红石导体属性的方块被
      # 称为红石导体。红石导体可以传递红石信号。
      # 类型: boolean
      # 默认值: 未定义 (undefined)
      # ------------------------------------------------------------------
      is_redstone_conductor: true

      # ------------------------------------------------------------------
      # is_suffocating (窒息生物)
      # ------------------------------------------------------------------
      # 决定生物视平线处于此方块中时会发生窒息。
      # 类型: boolean
      # 默认值: 未定义 (undefined)
      # ------------------------------------------------------------------
      is_suffocating: true

      # ------------------------------------------------------------------
      # is_view_blocking (视野阻挡)
      # ------------------------------------------------------------------
      # 决定视平线处于其中的非旁观模式玩家是否渲染阻挡视线的效果。
      # 绝大多数窒息方块都是视野阻挡方块。此选项影响服务器上的某些
      # 实体机制。
      # 类型: boolean
      # 默认值: 未定义 (undefined)
      # ------------------------------------------------------------------
      is_view_blocking: true

      # ------------------------------------------------------------------
      # sounds (音效)
      # ------------------------------------------------------------------
      # 决定方块在各种情况下的音效。每个子项支持两种格式:
      #   1. 简洁格式: minecraft:block.deepslate.break
      #   2. 高级格式 (带音量和音高控制):
      #        id: minecraft:block.deepslate.break
      #        pitch: 0.5
      #        volume: 0.25 ~ 0.3  # 也支持范围值
      # 类型: map (string 或 map)
      # 默认值: null (无自定义音效，使用材质默认音效)
      #
      # 子项:
      #   break - 当玩家破坏方块时
      #   step  - 当玩家在方块上行走时
      #   place - 当玩家放置方块时
      #   hit   - 当玩家挖掘方块时
      #   fall  - 当玩家带有坠落伤害时坠落在方块上时
      # ------------------------------------------------------------------
      sounds:
        break: minecraft:block.deepslate.break
        step: minecraft:block.deepslate.step
        place: minecraft:block.deepslate.place
        hit: minecraft:block.deepslate.hit
        fall: minecraft:block.deepslate.fall

      # ------------------------------------------------------------------
      # require_correct_tools (需要合适挖掘工具 / requires_correct_tool)
      # ------------------------------------------------------------------
      # 决定是否需要合适挖掘工具才能有效地挖掘这个方块。
      # 注意: 如果设置了 correct_tools，则 require_correct_tools 默认
      #       值为 true (自动启用)。
      # 别名: requires_correct_tool (常见替代命名)
      # 类型: boolean
      # 默认值: false (未设置 correct_tools 时)
      # ------------------------------------------------------------------
      require_correct_tools: true

      # ------------------------------------------------------------------
      # respect_tool_component (尊重 tool 组件)
      # ------------------------------------------------------------------
      # 决定 minecraft:tool 组件的 correct_for_drops 选项是否应像
      # correct_tools 一样工作。设为 true 时，物品的 tool 组件也会
      # 影响方块的挖掘效率。
      # 类型: boolean
      # 默认值: false
      # ------------------------------------------------------------------
      respect_tool_component: false

      # ------------------------------------------------------------------
      # correct_tools (合适挖掘工具)
      # ------------------------------------------------------------------
      # 决定什么物品可以有效地挖掘这个方块。列表中的物品 ID 对应的
      # 工具挖掘此方块时效率最高。
      # 类型: list[string]
      # 默认值: null (所有工具效率相同)
      # 提示: 设置此项后 require_correct_tools 默认为 true
      # ------------------------------------------------------------------
      correct_tools:
        - minecraft:wooden_pickaxe
        - minecraft:stone_pickaxe
        - minecraft:iron_pickaxe
        - minecraft:golden_pickaxe
        - minecraft:diamond_pickaxe
        - minecraft:netherite_pickaxe

      # ------------------------------------------------------------------
      # incorrect_tool_dig_speed (挖掘惩罚)
      # ------------------------------------------------------------------
      # 决定如果不使用合适挖掘工具时的挖掘速度是正常的多少倍。
      # 值越小，惩罚越大 (挖掘越慢)。
      # 范围: 0.0 ~ 1.0
      # 默认值: 0.3
      # ------------------------------------------------------------------
      incorrect_tool_dig_speed: 0.3

      # ------------------------------------------------------------------
      # tags (标签)
      # ------------------------------------------------------------------
      # 标签决定了许多方块的属性。例如使用 minecraft:mineable/axe
      # 会让方块用斧挖掘时更快。详见 CraftEngine Wiki 的方块标签参考。
      # 类型: list[string] (命名空间:标签ID)
      # 默认值: null
      # ------------------------------------------------------------------
      tags:
        - minecraft:mineable/pickaxe
        - minecraft:mineable/axe
        - minecraft:logs_that_burn
        - minecraft:logs

      # ------------------------------------------------------------------
      # client_bound_tags (客户端侧标签) [仅原版方块]
      # ------------------------------------------------------------------
      # 这只适用于原版方块。用于客户端侧的标签行为。
      # 类型: list[string]
      # 默认值: null
      # ------------------------------------------------------------------
      client_bound_tags:
        - minecraft:beacon_base_blocks

      # ------------------------------------------------------------------
      # instrument (乐器)
      # ------------------------------------------------------------------
      # 决定方块被放在音符盒下时，音符盒使用的乐器类型。
      # 全部乐器名称可参考: https://zh.minecraft.wiki/w/音符盒#方块状态
      # 常见值: harp, basedrum, snare, hat, bass, flute, bell, guitar,
      #         chime, xylophone, iron_xylophone, cow_bell, didgeridoo,
      #         bit, banjo, pling, zombie, skeleton, creeper, dragon,
      #         wither_skeleton, piglin, custom_head
      # 类型: string
      # 默认值: harp
      # ------------------------------------------------------------------
      instrument: basedrum

      # ------------------------------------------------------------------
      # fluid_state (流体状态)
      # ------------------------------------------------------------------
      # 决定方块状态的包含的流体状态。当设为 water 时，方块会像浸没
      # 在水中一样有水的视觉效果。
      # 类型: string
      # 可选值: empty, water
      # 默认值: empty
      # ------------------------------------------------------------------
      fluid_state: water

      # ------------------------------------------------------------------
      # support_shape (支撑形状)
      # ------------------------------------------------------------------
      # 决定方块提供的支撑形状。默认情况下，自定义方块会使用其对应
      # 视觉状态的支撑形状。但是可以手动指定一个原版方块的支撑形状
      # 来替代。
      # 类型: string (原版方块 ID)
      # 默认值: null (使用视觉状态的支撑形状)
      # ------------------------------------------------------------------
      support_shape: minecraft:stone

      # ======================================================================
      # 二、不稳定设置 (Unstable Settings)
      # 注意: 以下设置只对非玩家实体生效。
      #       如需对玩家实体同步，需配合特定行为 (如 bouncing_block)。
      # ======================================================================

      # ------------------------------------------------------------------
      # bounce_restitution (弹性碰撞系数) [CraftEngine 26.2+]
      # ------------------------------------------------------------------
      # 决定生物下落到方块上后可以反弹多高。
      # 参考值: 绝大多数方块 0.0, 黏液块 1.0, 床 0.75
      # 注意: 非生物实体下落碰撞时，实际值会额外乘上 0.8。
      # 提示: 可通过 bouncing_block 行为强制为玩家实体同步。
      # 类型: float (0.0 ~ 1.0)
      # 默认值: 0.0
      # ------------------------------------------------------------------
      bounce_restitution: 0.0

      # ------------------------------------------------------------------
      # friction (阻力系数 / slipperiness)
      # ------------------------------------------------------------------
      # 决定方块与站在其上方的生物的"摩擦力"，影响生物的加速度并
      # 决定稳定移动速度。
      # 别名: slipperiness (其他概念中的等价名称)
      # 参考值: 绝大多数方块 0.6, 黏液块 0.8,
      #         冰/浮冰/霜冰 0.98, 蓝冰 0.989
      # 类型: float (0.0 ~ 1.0+)
      # 默认值: 0.6
      # ------------------------------------------------------------------
      friction: 0.6

      # ------------------------------------------------------------------
      # jump_factor (跳跃乘数)
      # ------------------------------------------------------------------
      # 决定生物在此方块上跳跃时的跳跃高度倍率。
      # 1.0 = 正常跳跃高度, >1.0 = 跳得更高, <1.0 = 跳得更低。
      # 类型: float
      # 默认值: 1.0
      # ------------------------------------------------------------------
      jump_factor: 1.0

      # ------------------------------------------------------------------
      # speed_factor (速度乘数)
      # ------------------------------------------------------------------
      # 决定生物在此方块上行走时的速度倍率。
      # 1.0 = 正常速度, >1.0 = 更快, <1.0 = 更慢。
      # 类型: float
      # 默认值: 1.0
      # ------------------------------------------------------------------
      speed_factor: 1.0

      # ------------------------------------------------------------------
      # luminance (亮度)
      # ------------------------------------------------------------------
      # 决定方块自身发出的光照等级。方块自身会发光，类似于荧石、
      # 火把等光源方块。
      # 类型: int (0 ~ 15)
      # 默认值: 0
      # ------------------------------------------------------------------
      luminance: 15

      # ------------------------------------------------------------------
      # can_occlude (阻挡光线 / lava_occlusion / occlusion)
      # ------------------------------------------------------------------
      # 决定方块是否能阻挡光线。这也会决定该方块是否能将下方的方块
      # 转换为另一种类型（例如，草方块变为泥土）。
      # 注意: 方块对天空光照的遮挡完全由客户端决定，无法通过
      #       服务器发送数据包来修复。此设置仅影响方块自身发出的光。
      # 别名: lava_occlusion, occlusion (其他概念中的等价名称)
      # 类型: boolean
      # 默认值: 未定义 (undefined)
      # ------------------------------------------------------------------
      can_occlude: false

      # ------------------------------------------------------------------
      # block_light (散射光照)
      # ------------------------------------------------------------------
      # 决定光线穿过此方块后降低的光照等级。值越大，光线穿过时
      # 衰减越多。
      # 注意: 仅影响方块自身发出的光，不影响天空光照。
      # 类型: int (0 ~ 15)
      # 默认值: 未定义 (undefined)
      # ------------------------------------------------------------------
      block_light: 0

      # ------------------------------------------------------------------
      # propagate_skylight (传播天空光照)
      # ------------------------------------------------------------------
      # 决定天空光照能否穿过该方块。
      # 类型: boolean
      # 默认值: 未定义 (undefined)
      # ------------------------------------------------------------------
      propagate_skylight: false

    # ======================================================================
    # 三、扩展别名速查 (Alias Reference)
    #
    # 以下概念与 CraftEngine 原生设置等价或功能重叠，列出以便查阅。
    # ======================================================================

    # destroy_time -> hardness
    # ────────────────────────────────────────────────────
    # destroy_time 是其他插件/概念中表示"挖掘时间"的字段名，
    # 在 CraftEngine 中对应 hardness (硬度)。
    # 硬度决定基础挖掘时间，计算公式: 挖掘时间 = hardness × 1.5 / 工具速度
    #
    # hardness: 0.5   # 等价于 destroy_time 的概念

    # explosion_resistance -> resistance
    # ────────────────────────────────────────────────────
    # explosion_resistance 是其他插件/概念中表示"爆炸抗性"的字段名，
    # 在 CraftEngine 中对应 resistance (爆炸抗性)。
    #
    # resistance: 0.5   # 等价于 explosion_resistance 的概念

    # lava_flammable -> burnable
    # ────────────────────────────────────────────────────
    # lava_flammable 是其他插件/概念中表示"熔岩可燃性"的字段名，
    # 在 CraftEngine 中对应 burnable。
    #
    # burnable: true   # 等价于 lava_flammable

    # occlusion / lava_occlusion -> can_occlude
    # ────────────────────────────────────────────────────
    # occlusion 或 lava_occlusion 是其他概念中表示"阻挡光线"的字段名，
    # 在 CraftEngine 中对应 can_occlude。
    #
    # can_occlude: true   # 等价于 occlusion

    # slipperiness -> friction
    # ────────────────────────────────────────────────────
    # slipperiness 是原版或其他概念中表示"摩擦力/滑动性"的字段名，
    # 在 CraftEngine 中对应 friction。
    #
    # friction: 0.98   # 等价于 slipperiness (如冰)

    # requires_correct_tool -> require_correct_tools
    # ────────────────────────────────────────────────────
    # requires_correct_tool (单数) 是常见替代命名，
    # 在 CraftEngine 中对应 require_correct_tools (复数)。
    #
    # require_correct_tools: true   # 等价于 requires_correct_tool

    # push_state / piston_behavior -> push_reaction
    # ────────────────────────────────────────────────────
    # push_state 或 piston_behavior 是其他概念中表示"活塞行为"的字段名，
    # 在 CraftEngine 中对应 push_reaction。
    #
    # push_reaction: NORMAL   # 等价于 push_state / piston_behavior

    # velocity_factor (速度乘数-垂直方向)
    # ────────────────────────────────────────────────────
    # velocity_factor 在 CraftEngine 中没有直接对应的设置项。
    # 相关的乘数设置包括:
    #   speed_factor - 水平移动速度乘数
    #   jump_factor  - 跳跃高度乘数
    # 如果需要在垂直方向上额外控制速度，可使用 jump_factor 间接影响。

  # ==========================================================================
  # 四、未在 CraftEngine Wiki 文档化的设置项
  #
  # 以下设置项在用户请求中被提及，但 CraftEngine Wiki 中未直接记录。
  # 它们可能通过其他方式实现，或属于未来计划功能。
  # 标记为 ⚠️ 仅供参考，使用前请验证实际效果。
  # ==========================================================================

  # ------------------------------------------------------------------
  # ⚠️ no_collision (无碰撞箱)
  # ------------------------------------------------------------------
  # 决定方块是否完全没有碰撞箱。如果为 true，玩家和实体可以毫无
  # 阻碍地穿过该方块 (类似空气、草、花等)。
  # CraftEngine Wiki 未直接记录此设置项。在 CraftEngine 中，碰撞
  # 箱通常通过方块的视觉模型或行为定义间接控制。
  # 类型: boolean (假设)
  # 默认值: false (假设)
  # ------------------------------------------------------------------
  # no_collision: false

  # ------------------------------------------------------------------
  # ⚠️ collision_box (碰撞箱)
  # ------------------------------------------------------------------
  # 自定义方块的碰撞箱。通常通过 min/max 坐标或形状 ID 指定。
  # CraftEngine Wiki 未直接记录此设置项。CraftEngine 的碰撞箱
  # 通常由视觉模型决定，或通过 support_shape 间接影响。
  # 类型: string / map (假设)
  # 默认值: 由模型自动生成 (假设)
  # ------------------------------------------------------------------
  # collision_box: minecraft:stone

  # ------------------------------------------------------------------
  # ⚠️ has_collision (是否有碰撞)
  # ------------------------------------------------------------------
  # 决定方块是否有碰撞。如果为 false，实体可以穿过此方块。
  # 与 no_collision 类似，但语义相反。
  # CraftEngine Wiki 未直接记录此设置项。
  # 类型: boolean (假设)
  # 默认值: true (假设)
  # ------------------------------------------------------------------
  # has_collision: true

  # ------------------------------------------------------------------
  # ⚠️ replaceable_blocks (可替代方块列表)
  # ------------------------------------------------------------------
  # 指定哪些方块可以替代此方块。即当某种方块放置时，如果此方块
  # 在目标位置，则会被直接覆盖而不报错。
  # CraftEngine Wiki 未直接记录此设置项。CraftEngine 的 replaceable
  # 仅控制此方块是否可被替代，不控制可替代它的方块列表。
  # 类型: list[string] (假设)
  # 默认值: null (假设)
  # ------------------------------------------------------------------
  # replaceable_blocks:
  #   - minecraft:air
  #   - minecraft:water

  # ------------------------------------------------------------------
  # ⚠️ block_state_mappings (方块状态映射)
  # ------------------------------------------------------------------
  # 决定不同方块状态值如何映射到不同的视觉变体或属性。
  # CraftEngine Wiki 中，方块状态和变体在 states.md 中独立配置，
  # 未作为 settings 的子项定义。
  # 如需配置状态变体，请参考: states.yml (方块状态/变体配置)
  # 类型: map (假设)
  # 默认值: null (假设)
  # ------------------------------------------------------------------
  # block_state_mappings:
  #   lit:
  #     true: custom:block_lit
  #     false: custom:block_unlit

# ============================================================================
# 速查表
# ============================================================================
# | 设置项                     | 类型           | 稳定 | 默认值    | 说明                                |
# |----------------------------|----------------|------|-----------|-------------------------------------|
# | item                       | string | null  | 稳定 | null      | 方块对应物品 ID                     |
# | hardness                   | float          | 稳定 | 2.0       | 挖掘硬度                            |
# | resistance                 | float          | 稳定 | 2.0       | 爆炸抗性                            |
# | push_reaction              | enum           | 稳定 | NORMAL    | 活塞推动行为                        |
# | map_color                  | int            | 稳定 | 0         | 地图颜色基色                        |
# | burnable                   | boolean        | 稳定 | false     | 熔岩可燃性                          |
# | fire_spread_chance         | int (0-100)    | 稳定 | 0         | 烧毁几率                            |
# | burn_chance                | int (0-100)    | 稳定 | 0         | 引燃几率                            |
# | replaceable                | boolean        | 稳定 | false     | 可被替代性                          |
# | is_redstone_conductor      | boolean        | 稳定 | undefined | 红石导体                            |
# | is_suffocating             | boolean        | 稳定 | undefined | 窒息生物                            |
# | is_view_blocking           | boolean        | 稳定 | undefined | 视野阻挡                            |
# | sounds                     | map            | 稳定 | null      | 音效 (break/step/place/hit/fall)    |
# | require_correct_tools      | boolean        | 稳定 | false     | 需要合适挖掘工具                    |
# | respect_tool_component     | boolean        | 稳定 | false     | 尊重 tool 组件                      |
# | correct_tools              | list[string]   | 稳定 | null      | 合适挖掘工具列表                    |
# | incorrect_tool_dig_speed   | float (0-1)    | 稳定 | 0.3       | 挖掘惩罚倍率                        |
# | tags                       | list[string]   | 稳定 | null      | 方块标签                            |
# | client_bound_tags          | list[string]   | 稳定 | null      | 客户端侧标签 (仅原版)               |
# | instrument                 | string         | 稳定 | harp      | 音符盒乐器                          |
# | fluid_state                | string         | 稳定 | empty     | 流体状态 (empty/water)              |
# | support_shape              | string         | 稳定 | null      | 支撑形状                            |
# |----------------------------|----------------|------|-----------|-------------------------------------|
# | bounce_restitution         | float (0-1)    | 不稳 | 0.0       | 弹性碰撞系数 (26.2+)               |
# | friction                   | float          | 不稳 | 0.6       | 阻力系数 (滑动性)                   |
# | jump_factor                | float          | 不稳 | 1.0       | 跳跃高度乘数                        |
# | speed_factor               | float          | 不稳 | 1.0       | 移动速度乘数                        |
# | luminance                  | int (0-15)     | 不稳 | 0         | 亮度等级                            |
# | can_occlude                | boolean        | 不稳 | undefined | 阻挡光线                            |
# | block_light                | int (0-15)     | 不稳 | undefined | 散射光照 (光线衰减)                 |
# | propagate_skylight         | boolean        | 不稳 | undefined | 传播天空光照                        |
# |----------------------------|----------------|------|-----------|-------------------------------------|
# | no_collision               | boolean (不确定)|  ⚠️  | false     | 无碰撞箱 (未在 Wiki 记录)           |
# | collision_box              | string/map (?) |  ⚠️  | 自动      | 碰撞箱 (未在 Wiki 记录)             |
# | has_collision              | boolean (不确定)|  ⚠️  | true      | 是否有碰撞 (未在 Wiki 记录)         |
# | replaceable_blocks         | list[string]   |  ⚠️  | null      | 可替代方块列表 (未在 Wiki 记录)     |
# | block_state_mappings       | map            |  ⚠️  | null      | 方块状态映射 (未在 Wiki 记录)       |
# ============================================================================

