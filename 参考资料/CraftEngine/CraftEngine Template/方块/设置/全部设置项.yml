# =============================================================================
# CraftEngine 方块设置 (Block Settings) - 完整模板
# Wiki: configuration/block/settings.md
# 用法: 将 "custom" 替换为你的命名空间, 修改方块 ID 与各属性值即可使用
# 所有设置项均为可选, 省略时使用默认值
# =============================================================================

blocks:
  # ───────────────────────────────────────────────────────────────────────────
  # 完整示例 - 自定义方块
  # ───────────────────────────────────────────────────────────────────────────
  custom:example_block:
    settings:
      # ------------------------------------------------------------------
      # 基础属性
      # ------------------------------------------------------------------
      hardness: 2.0                              # << CHANGE THIS 硬度 (默认: 2.0)
      resistance: 2.0                            # << CHANGE THIS 爆炸抗性 (默认: 2.0)
      map_color: 36                              # << CHANGE THIS 地图基色 (默认: 0)

      # ------------------------------------------------------------------
      # 物品关联
      # ------------------------------------------------------------------
      item: custom:example_item                  # << CHANGE THIS 对应物品 ID (默认: null)

      # ------------------------------------------------------------------
      # 替换与碰撞
      # ------------------------------------------------------------------
      replaceable: false                         # << CHANGE THIS 是否可被替代 (默认: false)

      # ------------------------------------------------------------------
      # 红石与生物机制
      # ------------------------------------------------------------------
      is_redstone_conductor: true                # << CHANGE THIS 是否为红石导体 (默认: 未定义)
      is_suffocating: true                       # << CHANGE THIS 是否使生物窒息 (默认: 未定义)
      is_view_blocking: true                     # << CHANGE THIS 是否阻挡视野 (默认: 未定义)

      # ------------------------------------------------------------------
      # 音效
      # ------------------------------------------------------------------
      sounds:                                    # << CHANGE THIS 方块音效 (默认: null)
        break: minecraft:block.deepslate.break
        step: minecraft:block.deepslate.step
        place: minecraft:block.deepslate.place
        hit: minecraft:block.deepslate.hit
        fall: minecraft:block.deepslate.fall

      # ------------------------------------------------------------------
      # 挖掘工具
      # ------------------------------------------------------------------
      require_correct_tools: true                # << CHANGE THIS 是否需要合适工具 (默认: false)
      respect_tool_component: false              # << CHANGE THIS 是否尊重 minecraft:tool 组件 (默认: false)
      correct_tools:                             # << CHANGE THIS 合适挖掘工具列表 (默认: null)
        - minecraft:wooden_pickaxe
        - minecraft:stone_pickaxe
        - minecraft:iron_pickaxe
        - minecraft:golden_pickaxe
        - minecraft:diamond_pickaxe
        - minecraft:netherite_pickaxe
      incorrect_tool_dig_speed: 0.3              # << CHANGE THIS 挖掘惩罚倍数 0~1 (默认: 0.3)

      # ------------------------------------------------------------------
      # 标签
      # ------------------------------------------------------------------
      tags:                                      # << CHANGE THIS 方块标签 (默认: null)
        - minecraft:mineable/pickaxe
        - minecraft:logs_that_burn

      # ------------------------------------------------------------------
      # 音符盒乐器
      # ------------------------------------------------------------------
      instrument: basedrum                       # << CHANGE THIS 乐器类型 (默认: harp)

      # ------------------------------------------------------------------
      # 光照
      # ------------------------------------------------------------------
      luminance: 15                              # << CHANGE THIS 亮度等级 0-15 (默认: 0)
      can_occlude: false                         # << CHANGE THIS 是否阻挡光线 (默认: 未定义)
      block_light: 0                             # << CHANGE THIS 散射光照等级 (默认: 未定义)
      propagate_skylight: true                   # << CHANGE THIS 是否传播天空光照 (默认: 未定义)

      # ------------------------------------------------------------------
      # 活塞行为
      # ------------------------------------------------------------------
      push_reaction: NORMAL                      # << CHANGE THIS 活塞反应 (默认: NORMAL)
      # 可选值: NORMAL / DESTROY / BLOCK / IGNORE / PUSH_ONLY

      # ------------------------------------------------------------------
      # 流体
      # ------------------------------------------------------------------
      fluid_state: water                         # << CHANGE THIS 流体状态 (默认: empty)
      # 可选值: empty / water

      # ------------------------------------------------------------------
      # 支撑形状
      # ------------------------------------------------------------------
      support_shape: minecraft:stone             # << CHANGE THIS 支撑形状 (默认: 自动根据视觉状态)

      # ------------------------------------------------------------------
      # 熔岩可燃性
      # ------------------------------------------------------------------
      burnable: true                             # << CHANGE THIS 熔岩是否可引燃 (默认: false)
      fire_spread_chance: 100                    # << CHANGE THIS 烧毁几率 0-100 (默认: 0)
      burn_chance: 30                            # << CHANGE THIS 引燃几率 0-100 (默认: 0)

      # ------------------------------------------------------------------
      # 运动机制 (不稳定设置 - 仅对非玩家实体生效)
      # ------------------------------------------------------------------
      friction: 0.6                              # << CHANGE THIS 阻力系数/摩擦力 (默认: 0.6)
      jump_factor: 1.0                           # << CHANGE THIS 跳跃乘数 (默认: 1.0)
      speed_factor: 1.0                          # << CHANGE THIS 速度乘数 (默认: 1.0)
      bounce_restitution: 0.0                    # << CHANGE THIS 弹性碰撞系数 (默认: 0.0)

  # ───────────────────────────────────────────────────────────────────────────
  # 音效详细配置变体 (支持控制音量和音高)
  # ───────────────────────────────────────────────────────────────────────────
  custom:detailed_sound_block:
    settings:
      sounds:
        break:
          id: minecraft:block.deepslate.break
          pitch: 0.5
          volume: 0.25                           # << CHANGE THIS 支持范围值如 "0.25~0.3"
        step: minecraft:block.deepslate.step
        place: minecraft:block.deepslate.place
        hit: minecraft:block.deepslate.hit
        fall:
          id: minecraft:block.deepslate.fall
          pitch: 1.0
          volume: 1.0
