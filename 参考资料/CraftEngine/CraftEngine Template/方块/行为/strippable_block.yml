# ============================================================================
# 可剥离方块 (Strippable Block) — 行为模板
# ============================================================================
# 功能：使方块可用斧右键剥离，类似原版原木 → 去皮原木的机制。
#       剥离后会转换为 `stripped` 选项指定的目标方块，
#       并尽可能保留原方块的属性值（如同名 BlockState 属性）。
#
# 命名空间：使用 your_namespace 替代，建议格式为 作者/项目名_前缀
# ============================================================================

blocks:
  # ==========================================================================
  # 原方块定义
  # --------------------------------------------------------------------------
  # 格式：<命名空间>:<方块ID>
  # 示例：your_namespace:example_log
  # ==========================================================================
  your_namespace:example_log:

    # ------------------------------------------------------------------------
    # 行为 (behavior)
    # ------------------------------------------------------------------------
    behavior:

      # ------------------------------------------------------------
      # 行为类型 — strippable_block (固定值)
      # ------------------------------------------------------------
      type: strippable_block

      # ------------------------------------------------------------
      # stripped — 剥离后转化成的目标方块 (必需)
      # ------------------------------------------------------------
      # 类型：string
      # 必需：是
      # 格式：<命名空间>:<方块ID>
      # 说明：右键用斧剥离后，当前方块会被替换为此处指定的方块。
      # ------------------------------------------------------------
      stripped: "your_namespace:stripped_example_log"

      # ------------------------------------------------------------
      # excluded_properties — 转化时不继承的属性列表 (可选)
      # ------------------------------------------------------------
      # 类型：list of strings
      # 必需：否
      # 默认值：[] (空列表，即全部继承)
      # 说明：默认情况下，原方块与目标方块中同名的 BlockState 属性
      #       会一并保留。若某些属性不应在剥离后继承，可将其名称
      #       加入此列表。被排除的属性将使用目标方块对应属性的默认值。
      #
      # 典型用例：
      #   原木和去皮原木都有 axis 属性 (取值为 x/y/z)，
      #   但去皮原木默认总是 axis=y。若你不希望剥离后意外保留
      #   原始的 x 或 z 轴值，可将 axis 加入排除列表。
      #
      # 格式：
      #   excluded_properties:
      #     - <属性名1>
      #     - <属性名2>
      # ------------------------------------------------------------
      excluded_properties: []
      # excluded_properties:
      #   - axis                 # 排除轴属性，使用目标方块的默认值


# ============================================================================
# 完整示例 — 基于 custom 命名空间的棕榈木
# ============================================================================
# 此示例展示了一个带 axis 属性的可剥离原木方块，剥离后保留除 axis
# 之外的同名属性，确保去皮棕榈木始终默认为 axis=y。
# ============================================================================
# blocks:
#   custom:palm_log:
#     behavior:
#       type: strippable_block
#       stripped: "custom:stripped_palm_log"
#       excluded_properties:
#         - axis                       # 排除轴属性，避免意外复制 x 或 z
#     # ... 其他组件配置（展示组、硬度、掉落物等）请在此处补充 ...
#
#   custom:stripped_palm_log:
#     # 去皮变体的其他行为组件 ...
#     behavior:
#       # 此处可配置其他行为（如 flammable、falling_block 等）
#       # 不需要再次声明 strippable_block，因为剥离是单向操作
