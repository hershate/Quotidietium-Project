# Wiki: configuration/block/behaviors/strippable_block.md
# 可剥离方块 - 可用斧右键剥离，转换为指定的去皮变种方块

blocks:
  custom:example_log:                                          # << CHANGE THIS
    behavior:
      type: strippable_block
      stripped: custom:stripped_example_log                    # << CHANGE THIS 剥离后转化成的方块（必需）
      excluded_properties:                                     # << CHANGE THIS 转化时不继承的属性（默认空列表）
        - axis                                                 # << CHANGE THIS 例：排除 axis 避免原木方向被继承

# 属性要求：
# - stripped (string, 必需): 剥离后转化成的目标方块 ID
# - excluded_properties (list of strings, 可选): 剥离时不应继承的属性名列表；被排除的属性将使用目标方块对应属性的默认值
