# ====================================================================
# 简单粒子方块 — simple_particle_block
# ====================================================================
# 方块实体，按固定间隔在方块空间内生成粒子效果。
# 每个粒子配置可独立定义效果类型、位置偏移、扩散范围、数量与速度。
# ====================================================================

blocks:
  custom:my_particle_block:                     # 自定义命名空间:方块ID
    behavior:
      type: simple_particle_block              # 固定值，不可更改
      tick_interval: 10                        # 粒子生成间隔（单位：刻）
                                               # 可选 | 数字 | 默认值: 10
      particles:                               # 粒子列表（可包含多个粒子配置）
                                               # 必填 | 列表
        # ------------------------------------------------------------------
        # 基本粒子配置
        # ------------------------------------------------------------------
        - particle: minecraft:end_rod           # 粒子类型
                                               # 必填 | 字符串
          x: 0.5                               # 生成位置的 x 相对坐标（相对于方块原点）
                                               # 可选 | 数字 | 默认值: 0
          y: 0.7                               # 生成位置的 y 相对坐标
                                               # 可选 | 数字 | 默认值: 0
          z: 0.5                               # 生成位置的 z 相对坐标
                                               # 可选 | 数字 | 默认值: 0
          count: 1                             # 每次生成的粒子数量
                                               # 可选 | 数字 | 默认值: 1
          offset_x: 0                          # x 方向的随机扩散范围
                                               # 可选 | 数字 | 默认值: 0
          offset_y: 0                          # y 方向的随机扩散范围
                                               # 可选 | 数字 | 默认值: 0
          offset_z: 0                          # z 方向的随机扩散范围
                                               # 可选 | 数字 | 默认值: 0
          speed: 0                             # 粒子初始速度
                                               # 可选 | 数字 | 默认值: 0

        # ------------------------------------------------------------------
        # 粒子类型专属参数
        # 以下参数仅在 particle 为特定类型时才生效
        # ------------------------------------------------------------------

        # 示例：带物品粒子的粒子类型 — item
        - particle: minecraft:item              # 粒子类型带 item 选项
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          item: custom:chinese_lantern          # 物品 ID
                                               # 仅在粒子类型为 item 时生效

        # 示例：带方块粒子的粒子类型
        # 适用类型：block、block_marker、falling_dust、dust_pillar、block_crumble
        - particle: minecraft:block
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          block_state: custom:my_block[axis=y]  # 方块状态
                                               # 仅在粒子类型为 block / block_marker /
                                               # falling_dust / dust_pillar / block_crumble 时生效

        # 示例：带幽匿块充能粒子的粒子类型 — sculk_charge
        - particle: minecraft:sculk_charge
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          charge: 1.5                          # 幽匿块充能值
                                               # 仅在粒子类型为 sculk_charge 时生效

        # 示例：带尖啸粒子的粒子类型 — shriek
        - particle: minecraft:shriek
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          shriek: 1                            # 尖啸延迟（刻）
                                               # 仅在粒子类型为 shriek 时生效

        # 示例：带粉末粒子的粒子类型 — dust
        - particle: minecraft:dust
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          color: 255,255,255                   # 红,绿,蓝 (0-255)
                                               # 仅在粒子类型为 dust 时生效
          scale: 1.0                           # 粒子大小倍数
                                               # 仅在粒子类型为 dust 时生效

        # 示例：带粉末颜色过渡粒子的粒子类型 — dust_color_transition
        - particle: minecraft:dust_color_transition
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          from: 255,255,255                    # 起始颜色 红,绿,蓝 (0-255)
                                               # 仅在粒子类型为 dust_color_transition 时生效
          to: 0,0,0                            # 结束颜色 红,绿,蓝 (0-255)
                                               # 仅在粒子类型为 dust_color_transition 时生效
          scale: 4.0                           # 粒子大小倍数
                                               # 仅在粒子类型为 dust_color_transition 时生效

        # 示例：带振动粒子的粒子类型 — vibration
        - particle: minecraft:vibration
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          target_x: 0                          # 振动目标 x 坐标
                                               # 仅在粒子类型为 vibration 时生效
          target_y: 1                          # 振动目标 y 坐标
                                               # 仅在粒子类型为 vibration 时生效
          target_z: 0                          # 振动目标 z 坐标
                                               # 仅在粒子类型为 vibration 时生效
          arrival_time: 10                     # 振动到达目标所需时间（刻）
                                               # 仅在粒子类型为 vibration 时生效

        # 示例：带目标颜色粒子的粒子类型 — trail
        - particle: minecraft:trail
          x: 0.5
          y: 0.7
          z: 0.5
          count: 1
          offset_x: 0.3
          offset_y: 0.3
          offset_z: 0.3
          speed: 0
          target_x: 0                          # 轨迹目标 x 坐标
                                               # 仅在粒子类型为 trail 时生效
          target_y: 1                          # 轨迹目标 y 坐标
                                               # 仅在粒子类型为 trail 时生效
          target_z: 0                          # 轨迹目标 z 坐标
                                               # 仅在粒子类型为 trail 时生效
          duration: 10                         # 轨迹存在时间（刻）
                                               # 仅在粒子类型为 trail 时生效

