# ============================================================================
# 表面扩散方块 (surface_spreading_block) - 行为配置模板
# ============================================================================
# 该行为使方块像原版草方块一样向相邻方块扩散。
# 每个随机刻会尝试将附近的 base_block 转化为此方块；
# 若当前位置无法存活（光照不足或上方有水），则退化回 base_block。
# ============================================================================

blocks:
  # ==========================================================================
  # 自定义命名空间示例：yournamespace:your_block
  # 将 "yournamespace" 替换为你的项目命名空间，"your_block" 替换为方块 ID。
  # ==========================================================================
  yournamespace:custom_spreading_block:
    behavior:
      type: surface_spreading_block

      # ---- 光照要求 ----
      # 扩散所需的最低光照等级（0-15）。
      # 目标方块上方的光照必须 >= 此值，方块才会向它扩散。
      # 若方块自身所在位置的光照低于此值，则会退化回 base_block。
      light_requirement: 9

      # ---- 最高光照 ----
      # 扩散所需的最高光照等级（0-15）。
      # 目标方块上方的光照必须 <= 此值，方块才会向它扩散。
      # 用于防止方块在过亮的环境下扩散（如下界岩的扩散限制）。
      max_light_requirement: 15

      # ---- 基础方块 ----
      # 该方块会向此基础方块扩散（将 base_block 转化为自身）；
      # 同时，当自身无法存活时也会退化为此基础方块。
      # 格式：命名空间:方块ID
      base_block: minecraft:dirt

      # =====================================================================
      # 可选属性
      # =====================================================================
      # ---- 覆雪标记 (snowy) ----
      # 类型: boolean
      # 默认: 未定义（不启用）
      # 若启用，当上方有雪时可自动将 snowy 属性置为 true，
      # 用于切换覆雪材质（类似原版草方块）。
      # 若不需要覆雪变体，可完全省略此字段。
      # snowy: false

# ============================================================================
# 完整示例 - 一个自定义的 "幽冥苔" 方块
# ============================================================================
# blocks:
#   myquest:shadow_moss:
#     display_name: "幽冥苔"
#     material: GRASS_BLOCK
#     behavior:
#       type: surface_spreading_block
#       light_requirement: 4
#       max_light_requirement: 10
#       base_block: myquest:shadow_soil
#     properties:
#       snowy: true
#     # ... 其他配置（掉落物、合成、模型等）
#
# 说明：
# - light_requirement: 4  → 至少需要亮度 4 才能扩散
# - max_light_requirement: 10 → 亮度超过 10 不会扩散（幽冥苔喜暗）
# - base_block: myquest:shadow_soil → 向自定义的 shadow_soil 扩散
# - snowy: true → 启用覆雪属性，顶部有雪时自动切换为覆雪材质
# ============================================================================
