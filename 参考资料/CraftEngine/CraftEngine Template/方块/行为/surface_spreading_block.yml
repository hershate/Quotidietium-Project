# Wiki: configuration/block/behaviors/surface_spreading_block.md
# 表面扩散方块 —— 随机刻向相邻 base_block 扩散，无法存活时退化回 base_block

blocks:
  custom:my_spreading_block:
    properties:
      snowy:
        type: boolean
        default: false
        # << CHANGE THIS: 可选属性。启用时顶部有雪自动置 true 切换覆雪材质
    behavior:
      type: surface_spreading_block
      light_requirement: 9           # << CHANGE THIS: 扩散所需最低光照（0-15，默认 0）
      max_light_requirement: 15      # << CHANGE THIS: 扩散所需最高光照（0-15，默认 15）
      base_block: custom:my_dirt     # << CHANGE THIS: 扩散目标 / 退化回退的方块（默认 minecraft:dirt）
