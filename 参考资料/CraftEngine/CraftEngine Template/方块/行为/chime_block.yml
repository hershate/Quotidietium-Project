# 震响方块 (Chime Block)
# Wiki: configuration/block/behaviors/chime_block.md
# 被弹射物（箭、三叉戟等）击中时发出音效，类似于紫水晶块
#
# 属性要求: 无特殊属性要求，直接添加 behavior 即可

blocks:
  custom:example_block:                                          # << CHANGE THIS: 修改为你的方块ID
    behavior:
      type: chime_block
      sounds:
        chime: minecraft:block.amethyst_block.chime              # << CHANGE THIS: 被弹射物击中时播放的音效（可选，不填则无音效）
