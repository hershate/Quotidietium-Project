# ============================================================================ #
#                            震响方块 (Chime Block)                              #
# ============================================================================ #
# 行为类型: chime_block
# 描述: 被弹射物（箭、三叉戟等）击中时发出音效，类似于紫水晶块。
# 参考: https://minecraft.wiki/w/Amethyst_Cluster
# ============================================================================ #

# ---------------------------------------------------------------------------- #
# ROOT KEY: blocks                                                             #
# 必须在 blocks 根键下定义，每个方块使用一个唯一标识符。                         #
# ---------------------------------------------------------------------------- #
blocks:

  # ========================================================================== #
  # 方块 ID: custom:example_chime_block                                        #
  # - 命名空间: custom（自定义，避免与其它插件冲突）                              #
  # - 路径:     example_chime_block（见名知意，推荐 snake_case）                  #
  # ========================================================================== #
  custom:example_chime_block:

    # ------------------------------------------------------------------------ #
    # behavior 节点                                                             #
    # 必填。定义方块的核心行为。                                                  #
    # ------------------------------------------------------------------------ #
    behavior:

      # 行为类型: chime_block
      # 必填。固定为 "chime_block"，不可更改。
      type: chime_block

      # ---------------------------------------------------------------------- #
      # sounds 节点                                                             #
      # 可选。音效配置。若整个 sounds 节点省略，则使用默认紫水晶音效。            #
      # ---------------------------------------------------------------------- #
      sounds:

        # chime: 震响音效
        # 可选（默认为 minecraft:block.amethyst_block.chime）。
        # 被弹射物击中方块时播放的音效。
        # 格式: <命名空间>:<路径>，如 "minecraft:block.amethyst_block.chime"。
        # 可用选项:
        #   - minecraft:block.amethyst_block.chime    (原版紫水晶震响)
        #   - minecraft:block.note_block.*            (音符盒音效)
        #   - 自定义资源包注册的音效
        chime: "minecraft:block.amethyst_block.chime"

# ============================================================================ #
# 属性要求 (Property Requirements)                                              #
# ============================================================================ #
# 1. type: 必须为 "chime_block"，区分大小写。
# 2. blocks 下每个方块的 ID 必须唯一。
# 3. 命名空间建议使用自定义值（如 custom:, myplugin:），避免使用 default:
#    以免与 CraftEngine 内置方块冲突。
# 4. sounds.chime 值为 Minecraft 音效事件 ID，需确保存在于服务器/客户端。
# 5. 该行为无额外碰撞箱或模型要求，可与任意模型/显示/碰撞行为组合。
# ============================================================================ #

# ============================================================================ #
# 完整示例 (Full Example)                                                       #
# ============================================================================ #
# 以下展示 chime_block 与其它行为组合使用的典型场景，仅供参考。
#
# blocks:
#   custom:crystal_bell:
#     display:
#       type: model
#       model: custom:blocks/crystal_bell.geo.json
#     collision:
#       type: block
#       shape: block
#     behavior:
#       type: chime_block
#       sounds:
#         chime: "minecraft:block.amethyst_block.chime"
#
#   custom:wind_chime:
#     behavior:
#       type: chime_block
#       # 不指定 sounds，使用默认音效
#     # 省略 display/collision，使用默认方块显示和碰撞
#
#   custom:resonant_crystal:
#     behavior:
#       type: chime_block
#       sounds:
#         chime: "custom:block.resonant_crystal.chime"
#     # 自定义音效需通过资源包注册
# ============================================================================ #
