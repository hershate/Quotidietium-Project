# ============================================================================
# 草方块行为模板 (Grass Block Behavior Template)
# 命名空间: myproject (custom)
# 对应文档: CraftEngine Wiki - configuration/block/behaviors/grass_block.md
# 风格: Oraxen (全字段注释)
# ============================================================================
#
# 概述:
#   对着草方块使用骨粉后，草方块会尝试生成一个已配置的地物，
#   其决定了所生成基本内容。
#   例如 'minecraft:grass_bonemeal' 会尝试在方块上方生成草和花。
#
# 标签要求:
#   该方块 必须 拥有以下标签，否则其上生成的草和花无法存活:
#     - minecraft:dirt
#     - minecraft:supports_vegetation (CraftEngine 26.1+)
#
# ============================================================================

# ========================================================================
# blocks 根键
# 所有自定义方块的配置均在此根键下声明。
# ========================================================================
blocks:

  # ========================================================================
  # 方块 ID: myproject:my_grass_block
  # 命名空间: myproject (custom 命名空间，请按需替换)
  # 格式:   <命名空间>:<方块ID>
  # 注意:   不建议使用 'minecraft' 命名空间，请使用自定义命名空间。
  # ========================================================================
  myproject:my_grass_block:

    # ------------------------------------------------------------------
    # behavior 配置块
    # 定义该方块的核心交互行为。
    # ------------------------------------------------------------------
    behavior:

      # ----------------------------------------------------------------
      # type: 行为类型
      # 作用:  声明该方块的行为实现类。
      # 必需:  是
      # 可选值: 由 CraftEngine 注册的行为类型决定
      # 当前值: grass_block - 草方块行为（骨粉催生地物）
      # ----------------------------------------------------------------
      type: grass_block

      # ----------------------------------------------------------------
      # feature: 已配置的地物 ID (Configured Feature)
      # 作用:  指定使用骨粉时尝试生成的已配置地物。
      #        该地物会尝试在方块上方生成草、花等植被。
      # 必需:  是
      # 类型:  string (命名空间ID)
      # 示例:
      #   minecraft:grass_bonemeal        - 原版草地地物（草+花）
      #   minecraft:flower_forest_flowers - 繁花森林花丛
      #   minecraft:trees_birch           - 白桦树
      #   myproject:my_custom_feature     - 自定义地物
      # ----------------------------------------------------------------
      feature: myproject:my_custom_feature

      # ================================================================
      # [扩展字段参考 - 当前版本未启用，保留供未来使用]
      # ================================================================
      # 以下字段在草方块行为中暂未定义，但可在 behavior 层级配置
      # （取决于 CraftEngine 版本）：
      #
      #   replaceable_blocks:            # 可被植被替换的方块列表
      #     - minecraft:air              #   （默认: 仅空气）
      #     - minecraft:short_grass
      #
      #   required_light_level: 8        # 植被生长所需的最低光照等级
      #
      #   bone_meal_consume_chance: 0.8  # 骨粉消耗概率 (0.0 ~ 1.0)
      #
      #   particle_effect:               # 骨粉使用时的粒子效果
      #     type: minecraft:bone_meal
      #
      # 请查阅你所用 CraftEngine 版本的文档以确认可用字段。
      # ================================================================

    # ------------------------------------------------------------------
    # [补充] 方块标签 (tags)
    # 注意: 此章节仅作记录，实际 tags 配置可能位于 behavior 同级
    #       或其他配置文件中。请根据你的 CraftEngine 版本调整路径。
    # 必需: 是 (草方块必须拥有以下标签)
    # ------------------------------------------------------------------
    # tags:
    #   - minecraft:dirt
    #   - minecraft:supports_vegetation

# ============================================================================
# 完整示例 (Complete Example)
# ============================================================================
# 将以下内容视为一个可直接使用的完整配置参考:
# ----------------------------------------------------------------------------
# blocks:
#   myproject:my_grass_block:
#     behavior:
#       type: grass_block
#       feature: minecraft:grass_bonemeal
#     # tags:                          # 假若 tags 在此层级
#     #   - minecraft:dirt
#     #   - minecraft:supports_vegetation
#
#   myproject:flower_grass_block:
#     behavior:
#       type: grass_block
#       feature: minecraft:flower_forest_flowers
#     # tags:
#     #   - minecraft:dirt
#     #   - minecraft:supports_vegetation
# ----------------------------------------------------------------------------
#
# 注意事项:
#   1. feature 字段是 grass_block 行为唯一必需的配置项。
#   2. 方块必须配置 'minecraft:dirt' 标签，否则植物会因缺少附着方块而破坏。
#   3. 方块必须配置 'minecraft:supports_vegetation' 标签 (CraftEngine 26.1+)，
#      否则植被无法在方块上存活。
#   4. 请始终使用自定义命名空间 (如 myproject, myaddon 等)，
#      不要覆盖原版 minecraft 命名空间的方块，除非你明确知道后果。
# ============================================================================
