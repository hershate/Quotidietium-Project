# 参考文档: CraftEngine Wiki/configuration/block/behaviors/grass_block.md
# 对草方块使用骨粉后，草方块会尝试生成一个已配置的地物

blocks:
  custom:grass_block:                            # << CHANGE THIS: 命名空间:方块ID
    behavior:
      type: grass_block
      feature: custom:some_feature               # << CHANGE THIS: 已配置的地物ID（必需）

    # 标签要求（必需）
    # 方块必须拥有以下标签，否则生成的草/花无法存活：
    tags:
      - minecraft:dirt
      - minecraft:supports_vegetation            # CraftEngine 26.1+
