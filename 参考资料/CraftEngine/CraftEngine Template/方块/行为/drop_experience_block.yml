# 来源: CraftEngine Wiki/configuration/block/behaviors/drop_experience_block.md
# 行为: drop_exp_block - 掉落经验方块

blocks:
  custom:example_ore:                    # << CHANGE THIS: 方块命名空间与ID
    behavior:
      type: drop_exp_block               # 行为类型（固定）
      amount: 3~7                        # << CHANGE THIS: 掉落的经验点数（支持数字格式，详见 Wiki）

      # 可选：未配置 conditions 时始终掉落经验
      # 配置后需满足所有条件才会掉落
      # conditions:
      #   - type: enchantment
      #     predicate: "minecraft:silk_touch<=0"  # << CHANGE THIS: 条件谓词
