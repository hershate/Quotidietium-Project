# ============================================================================
# 行为类型: drop_experience_block (掉落经验方块)
# 描述: 方块被破坏时掉落经验球。经验点数和掉落条件均可配置。
# 支持自定义掉落条件（如特定附魔、工具等），若不配置条件则始终掉落。
# 注意: 若方块设置了 "需要合适挖掘工具" 且玩家使用错误工具破坏，则不触发掉落。
# ============================================================================

blocks:
  # ==========================================================================
  # 自定义命名空间示例 (custom_namespace)
  # 将 "custom_namespace" 替换为你自己的命名空间（例如 myaddon, server 等）
  # 命名空间建议使用小写英文 + 下划线，避免使用特殊字符
  # ==========================================================================
  custom_namespace:drop_exp_ore:
    # --------------------------------------------------------------------------
    # behavior: 定义方块的核心行为 (必填)
    # 注意: 若方块已有其他 behavior 配置，此部分可并列添加
    # --------------------------------------------------------------------------
    behavior:
      # type: 行为类型标识，固定为 drop_exp_block (必填)
      type: drop_exp_block

      # amount: 掉落的经验点数 (可选，默认 0)
      # 支持格式:
      #   - 固定值: 5
      #   - 范围随机: 3~7  (表示 3 到 7 之间的随机整数)
      #   - 表达式: 支持数学运算，详见数字格式参考
      # 建议: 矿石类方块通常设为 3~7，刷怪笼方块可设为 10~20
      amount: 3~7

      # ----------------------------------------------------------------------
      # conditions: 经验掉落的条件约束 (可选)
      # 未定义此字段 => 无条件，始终掉落经验
      # 定义后 => 必须满足所有列出的条件才会掉落经验
      # 支持多种条件类型，可按需添加
      # ----------------------------------------------------------------------
      conditions:
        # condition 示例 1: 附魔条件
        # 类型: enchantment
        # 用途: 仅当物品不携带特定附魔或附魔等级满足条件时掉落经验
        - type: enchantment
          # predicate: 附魔谓词表达式
          # 格式: <附魔命名空间ID><比较运算符><数值>
          # 支持运算符: <=, >=, <, >, ==, !=
          predicate: "minecraft:silk_touch<=0"

        # condition 示例 2: 工具条件 (注释示例，按需启用)
        # 类型: tool
        # 用途: 要求使用特定类型的工具挖掘
        # - type: tool
        #   predicate: "pickaxe"       # 仅允许镐类工具

        # condition 示例 3: 生物群系条件 (注释示例，按需启用)
        # 类型: biome
        # 用途: 仅在特定生物群系中掉落经验
        # - type: biome
        #   predicate: "minecraft:plains"

        # condition 示例 4: 世界条件 (注释示例，按需启用)
        # 类型: world
        # 用途: 仅在特定世界中掉落经验
        # - type: world
        #   predicate: "world"         # 世界名称

        # condition 示例 5: 游戏阶段条件 (注释示例，按需启用)
        # 类型: gamestage
        # 用途: 需要玩家达到特定游戏阶段
        # - type: gamestage
        #   stage: "mid_game"
        #   predicate: ">="           # 支持的操作符: >=, <=, >, <, ==, !=

  # ==========================================================================
  # 完整示例: 配置更复杂的经验掉落方块
  # ==========================================================================
  custom_namespace:ancient_ore:
    behavior:
      # 此方块修改了基础属性（这些属性属于 blocks 级配置，为展示完整示例而列出）
      hardness: 30.0
      resistance: 1200.0
      level: 3
      tool: pickaxe
      destroy_speed: 8.0

      # 核心行为: 掉落经验
      type: drop_exp_block
      # 高等级矿石掉落更多经验
      amount: 15~25

      # 多个条件: 所有条件需同时满足
      conditions:
        # 条件 1: 不能有精准采集
        - type: enchantment
          predicate: "minecraft:silk_touch<=0"
        # 条件 2: 需要时运 III 及以上才掉落额外经验
        - type: enchantment
          predicate: "minecraft:fortune>=3"

  # ==========================================================================
  # 最简示例: 仅基础配置，无额外条件
  # ==========================================================================
  custom_namespace:exp_pearl:
    behavior:
      type: drop_exp_block
      # 固定掉落 10 点经验，无任何条件
      amount: 10
      # conditions 字段完全省略 => 始终掉落

# ============================================================================
# 属性要求与约束
# ============================================================================
# ┌──────────────────────────────┬──────────┬──────────┬─────────────────────────┐
# │ 属性                          │ 必填     │ 默认值   │ 说明                    │
# ├──────────────────────────────┼──────────┼──────────┼─────────────────────────┤
# │ blocks.<ns:id>.behavior.type │ 是       │ 无       │ 固定值: drop_exp_block   │
# │ amount                       │ 否       │ 0        │ 数字/范围/表达式         │
# │ conditions                   │ 否       │ 无       │ 条件列表，空 = 始终掉落   │
# │ conditions[*].type           │ 条件启用时│ 无      │ enchantment / tool /     │
# │                              │ 是       │          │ biome / world /          │
# │                              │          │          │ gamestage 等             │
# │ conditions[*].predicate      │ 条件启用时│ 无      │ 条件的具体谓词表达式      │
# │                              │ 是       │          │                         │
# └──────────────────────────────┴──────────┴──────────┴─────────────────────────┘
# ============================================================================
# 注意事项
# ============================================================================
# 1. amount 支持数字格式参考中的全部功能，详见:
#    ../../reference/number_format.md (或对应参考文档)
# 2. conditions 中的多个条件为 AND 关系，必须同时满足才掉落经验
# 3. 若方块启用了 "需要合适挖掘工具" (requires_tool)，玩家用错误工具破坏时
#    不会触发经验掉落，即使 conditions 已满足
# 4. 经验掉落与方块破坏事件绑定，不受方块掉落物配置影响
# 5. 经验球生成位置为方块被破坏时的位置 (方块中心)
# ============================================================================
