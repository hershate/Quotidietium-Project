# ============================================================================
# 可悬挂方块 (Hangable Block) - 行为配置模板
# ============================================================================
# 功能: 方块既可放置于地面，也可悬挂在其他方块下方，类似原版灯笼。
#       放置时会根据周围环境自动选择有效的放置方式。
#       当对应方向的支撑方块被移除时，方块会自动破坏。
# ============================================================================
# 参考文档: CraftEngine Wiki - configuration/block/behaviors/hangable_block.md
# ============================================================================

# ============================================================================
# blocks 根节点
# ============================================================================
# 所有方块的配置定义在此根键下。
# 每个方块使用自定义命名空间（避免与默认命名空间冲突）。
# ============================================================================
blocks:

  # --------------------------------------------------------------------------
  # 示例方块: 自定义灯笼 (custom:lantern)
  # --------------------------------------------------------------------------
  custom:lantern:
    behavior:
      # ======================================================================
      # behavior.type - 行为类型 [必需]
      # ======================================================================
      # 固定值: hangable_block
      # 声明此方块使用可悬挂行为逻辑。
      # ======================================================================
      type: hangable_block

      # ======================================================================
      # hanging - 悬挂属性 [必需 | 类型: boolean]
      # ======================================================================
      # 控制方块的悬挂机制：
      #   - true  : 方块可以悬挂在方块下方，同时也可以放置在地面。
      #             放置时根据周围环境自动选择有效方式。
      #   - false : 仅作为普通方块放置，不启用悬挂功能。
      # 注意：若设为 false，则该行为与普通方块无异，建议直接使用其他行为。
      # ======================================================================
      hanging: true

      # ======================================================================
      # waterlogged - 含水属性 [可选 | 类型: boolean]
      # ======================================================================
      # 控制方块是否支持含水（Waterlog）机制：
      #   - true  : 方块可以含水，水流可穿过方块空间。
      #   - false : 方块不兼容含水（默认行为）。
      # 未配置时默认为 false。
      # ======================================================================
      waterlogged: false

  # --------------------------------------------------------------------------
  # 示例方块: 自定义吊灯 (custom:chandelier)
  # --------------------------------------------------------------------------
  custom:chandelier:
    behavior:
      type: hangable_block
      hanging: true
      waterlogged: true  # 允许水流穿过吊灯空间

  # --------------------------------------------------------------------------
  # 示例方块: 自定义壁挂火把 (custom:wall_torch)
  # --------------------------------------------------------------------------
  custom:wall_torch:
    behavior:
      type: hangable_block
      hanging: true
      # waterlogging 未配置，默认 false

  # --------------------------------------------------------------------------
  # 示例完整配置 (带 display / hardness / resistance 等)
  # --------------------------------------------------------------------------
  custom:iron_lantern:
    display:
      # 方块模型/纹理配置（此处仅作占位示意）
      model: custom:block/iron_lantern
      texture: custom:block/iron_lantern
    hardness: 3.0
    resistance: 3.0
    behavior:
      type: hangable_block
      hanging: true
      waterlogged: false
