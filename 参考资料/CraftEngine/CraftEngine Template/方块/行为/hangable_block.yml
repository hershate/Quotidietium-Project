# 本地文档: CraftEngine Wiki/configuration/block/behaviors/hangable_block.md
# 可悬挂方块 - 既可放置于地面，也可悬挂在方块下方（类似原版灯笼）。
# 放置时会根据周围环境自动选择有效的放置方式。
# 当对应方向的支撑方块被移除时，该方块会自动破坏。

blocks:
  custom:example_hangable_block:      # << CHANGE THIS - 方块 ID
    behavior:
      type: hangable_block

      # 是否支持悬挂 (必需 | boolean)
      # true: 方块可以悬挂在下方，也可放置在地面，根据环境自动选择
      # false: 仅作为普通方块放置，不启用悬挂功能
      hanging: true                     # << CHANGE THIS

      # 是否支持含水 (可选 | boolean, 默认: false)
      waterlogged: false                # << CHANGE THIS

# 必需属性 (由方块定义/状态自动管理, 无需在此声明)
#   hanging:    boolean  - 方块当前是否处于悬挂状态
#   waterlogged: boolean - 方块当前是否含水
