# Wiki: CraftEngine Wiki/configuration/block/behaviors/pressure_plate_block.md
# 压力板方块 - 探测玩家/生物等实体，踩上发出 15 级强充能信号
# 必须放置于方块支撑形状上表面中心完整或边缘完整的方块上方

blocks:
  custom:my_pressure_plate: # << CHANGE THIS block ID
    behavior:
      type: pressure_plate_block
      sensitivity: all       # << CHANGE THIS "all"（任意实体）或 "mob"（仅限生物），默认 all
      pressed_time: 20        # << CHANGE THIS 实体离开后保持按下的时长（刻），默认 20
      sounds:                 # << CHANGE THIS optional
        on: minecraft:block.stone_pressure_plate.click_on   # << CHANGE THIS 按下时音效
        off: minecraft:block.stone_pressure_plate.click_off # << CHANGE THIS 释放时音效
    properties:
      powered: false          # required boolean, 当前是否被激活
