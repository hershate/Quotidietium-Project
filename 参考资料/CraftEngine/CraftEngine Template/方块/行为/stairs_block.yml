# ============================================================================
# 楼梯方块行为模板 | stairs_block
# Wiki: configuration/block/behaviors/stairs_block.md
# ============================================================================
# 行为: stairs_block
# 作用: 使自定义方块获得与原版楼梯一致的放置、朝向、半区与形状连接逻辑
# 限制: 自定义楼梯无法与原版楼梯形成内角/外角连接（Minecraft 硬编码限制）
# ============================================================================

blocks:
  # --------------------------------------------------------------------------
  # 自定义楼梯方块
  # 修改 <命名空间>:<方块ID> 后即可使用
  # --------------------------------------------------------------------------
  custom:palm_stairs:  # << CHANGE THIS (方块ID)
    behavior:
      type: stairs_block

      # ==================== 必需属性 (Required) ====================

      # 楼梯朝向 | horizontal_direction
      # 玩家放置楼梯时，楼梯背板所朝的方向
      # 可选值: north, east, south, west
      facing: north  # << CHANGE THIS

      # 楼梯半区 | single_block_half
      # 楼梯位于方块的上半部分还是下半部分
      # 可选值: top, bottom
      half: bottom  # << CHANGE THIS

      # 楼梯形状 | stairs_shape
      # 根据相邻楼梯自动计算；手动指定初始形状后，游戏仍会按周围环境自动覆盖
      # 可选值: straight, inner_left, inner_right, outer_left, outer_right
      shape: straight  # << CHANGE THIS

      # ==================== 可选属性 (Optional) ====================

      # 含水 | boolean
      # 楼梯方块内是否可容纳水源
      # 默认值: false
      waterlogged: false  # << CHANGE THIS
