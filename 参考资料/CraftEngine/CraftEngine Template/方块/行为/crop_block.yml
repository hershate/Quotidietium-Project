# Wiki: CraftEngine Wiki/configuration/block/behaviors/crop_block.md
# 农作物方块 - 通过随机刻在年龄阶段中生长，类似小麦或马铃薯。
# 仅在光照等级位于 light_requirement 与 max_light_requirement 之间时生长。

blocks:
  custom:my_crop:
    behavior:
      type: crop_block

      # grow_speed: 每随机刻增加的 age 值
      # 整数部分每次随机刻直接增加对应数量的 age，小数部分作为概率额外增加 1。
      # 例如 0.25 表示 25% 概率增加 1；1.25 表示必定增加 1 并额外有 25% 概率再增加 1。
      grow_speed: 0.25                                            # << CHANGE THIS (默认 0.125)

      light_requirement: 9                                        # << CHANGE THIS 生长所需最低光照
      max_light_requirement: 15                                   # << CHANGE THIS 生长所需最高光照 (默认 15)

      spawn_light_requirement: 9                                  # << CHANGE THIS 区块生成时最低光照 (默认等于 light_requirement)
      max_spawn_light_requirement: 15                             # << CHANGE THIS 区块生成时最高光照 (默认等于 max_light_requirement)

      is_bone_meal_target: true                                   # << CHANGE THIS 骨粉是否对此农作物生效 (默认 true)

      # bone_meal_age_bonus: 骨粉增加的 age 值范围
      bone_meal_age_bonus:
        type: uniform
        min: 1                                                    # << CHANGE THIS
        max: 3                                                    # << CHANGE THIS

    # property requirements: age (int, required)
    properties:
      age:
        type: int
        default: 0
        min: 0
