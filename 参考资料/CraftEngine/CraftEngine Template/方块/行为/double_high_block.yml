# Wiki: CraftEngine Wiki/configuration/block/behaviors/double_high_block.md
# 双层方块 (Double High Block)
# 由下半部分与上半部分组成的两格高结构。
# 若上半部分下方不再是与其配对的下半部分（下方方块被移除或类型不一致），
# 上半部分会自动破坏。破坏上半部分时，若处于创造模式或未使用正确的工具，
# 下半部分也会被一并移除，且不会额外掉落物品。

blocks:
  custom:my_double_high_block:                            # << CHANGE THIS
    # --- 必需属性 ---
    # half (类型: double_block_half)
    # 表示当前方块实例是双层方块的上半部分还是下半部分
    properties:
      half:
        values:
          - lower
          - upper

    behavior:
      type: double_high_block
