# ============================================================================
# 双层方块 (Double High Block) 行为配置
# ============================================================================
# 此行为使方块成为两格高的结构，由下半部分与上半部分组成。
# 若上半部分下方不再是与其配对的下半部分（例如下方方块被移除或类型不一致），
# 上半部分会自动破坏。破坏上半部分时，若处于创造模式或未使用正确的工具，
# 下半部分也会被一并移除，且不会额外掉落物品。
#
# 参考文档: CraftEngine Wiki - configuration/block/behaviors/double_high_block.md
# ============================================================================

# ============================================================
# 根配置: blocks
# ============================================================
# 在此键下定义所有自定义方块。
blocks:

  # ============================================================
  # 方块定义
  # ============================================================
  # 使用自定义命名空间 (custom:) 以避免与默认或其他插件冲突。
  # 命名空间仅支持小写字母、数字、下划线和连字符。
  # ============================================================

  # ------------------------------------------------------------------
  # 示例 1: 基本的双层方块
  # ------------------------------------------------------------------
  # 最简单的双层方块配置，仅指定行为类型。
  custom:double_high_block:
    behavior:
      type: double_high_block

  # ------------------------------------------------------------------
  # 示例 2: 完整的双层方块配置
  # ------------------------------------------------------------------
  # 展示所有可用选项及属性要求。
  # 将此配置与 display、hardness、drop 等组合以实现完整功能。
  # ------------------------------------------------------------------
  custom:example_door:
    display:
      # 显示名称，支持 MiniMessage 格式
      name: "<gradient:#FFD700:#FFA500>示例门</gradient>"
      # 方块模型 (可选，需与行为配合)
      model:
        type: ITEM_FRAME  # 或 MODEL_ENGINE
        id: custom:example_door
    behavior:
      # ----------------------------------------------------------
      # 行为类型: double_high_block (必需)
      # ----------------------------------------------------------
      # 将此方块标记为双层方块结构。
      type: double_high_block

      # ----------------------------------------------------------
      # half 属性 (必需)
      # ----------------------------------------------------------
      # 指定当前方块实例是双层方块的上半部分还是下半部分。
      # 类型: double_block_half
      # 可选值:
      #   - upper  : 上半部分 (顶部方块)
      #   - lower  : 下半部分 (底部方块)
      #
      # 注意: 当此行为应用于 BlockBench 模型时，CraftEngine 会根据
      # 方块的放置位置自动为每个实例分配 half 值。当手动指定时，
      # 请确保上下两部分配对正确。
      # ============================================================
      half: lower

      # ----------------------------------------------------------
      # linked_block (推荐)
      # ----------------------------------------------------------
      # 指定与此半块配对的另一半块的命名空间ID。
      # 当下半部分放置时，CraftEngine 会自动在上方生成 linked_block 指定的方块。
      # 当上半部分被破坏时，下方对应的 linked_block 也会被破坏。
      # 类型: NamespacedId (String)
      # 默认值: <无>
      # ============================================================
      linked_block: custom:example_door_top

    # ----------------------------------------------------------
    # 破坏相关配置 (可选，但推荐)
    # ----------------------------------------------------------
    hardness:
      # 破坏硬度 (默认: 1.0)
      break: 1.5

    # ----------------------------------------------------------
    # 掉落物配置 (可选)
    # ----------------------------------------------------------
    drop:
      type: single
      item: custom:example_door_item

    # ----------------------------------------------------------
    # 声音配置 (可选)
    # ----------------------------------------------------------
    sounds:
      break:
        type: BLOCK_WOODEN_DOOR_BREAK
      place:
        type: BLOCK_WOODEN_DOOR_PLACE
      step:
        type: BLOCK_WOODEN_DOOR_STEP

    # ----------------------------------------------------------
    # 交互配置 (可选)
    # ----------------------------------------------------------
    interaction:
      # 右键单击时的行为
      right_click:
        type: open_door

  # ------------------------------------------------------------------
  # 示例 3: 完整的上下配对双层方块
  # ------------------------------------------------------------------
  # 展示如何成对配置上下两部分以形成完整的双层方块。
  # 使用自定义命名空间，适用于实际项目中需要独立控制上下两部分的场景。
  # ------------------------------------------------------------------

  # 下半部分定义
  custom:custom_door_bottom:
    display:
      name: "<white>自定义门 (下)</white>"
    behavior:
      type: double_high_block
      half: lower
      linked_block: custom:custom_door_top  # 指定配对的顶部方块
    hardness:
      break: 2.0
      tool: WOODEN_PICKAXE                  # 需要木镐及以上

  # 上半部分定义
  custom:custom_door_top:
    display:
      name: "<white>自定义门 (上)</white>"
    behavior:
      type: double_high_block
      half: upper
      linked_block: custom:custom_door_bottom  # 指定配对的底部方块
    hardness:
      break: 2.0
      tool: WOODEN_PICKAXE

# ============================================================
# 属性总结
# ============================================================
# 下表列出了 double_high_block 行为的所有配置属性:
#
# | 属性           | 类型                | 必需 | 描述                                      |
# |---------------|---------------------|------|-------------------------------------------|
# | type          | String              | 是   | 必须为 "double_high_block"                |
# | half          | double_block_half   | 是   | 指定当前实例为上半部分(upper)或下半部分(lower) |
# | linked_block  | NamespacedId/String | 否   | 配对半块的命名空间ID，用于自动生成/破坏关联方块 |
#
# half 可选值:
#   - upper: 上半部分
#   - lower: 下半部分
#
# 注意事项:
# 1. linked_block 是双向关联的关键: 破坏下半部分时，上半部分也会被自动移除。
#    破坏上半部分时，若满足条件（创造模式或使用正确工具），下半部分会被保留；
#    否则下半部分也会一并移除且不会额外掉落物品。
# 2. 当使用 BlockBench 模型时，half 属性通常在放置时由引擎自动分配，
#    无需手动配置。若通过配置手动指定，必须确保上下配对正确。
# 3. 所有配置项均区分大小写，建议统一使用小写命名空间。
# ============================================================
