# ============================================================================
# 定向附着方块行为模板 (Directional Attached Block Behavior Template)
# 命名空间: custom (请按需替换)
# 对应文档: CraftEngine Wiki - configuration/block/behaviors/directional_attached_block.md
# 风格: Oraxen (全字段注释)
# ============================================================================
#
# 概述:
#   定向附着方块可以附着在另一个方块的侧面上，类似墙上的火把。
#   若附着的方块变动（移动、破坏、替代等）而不再允许附着时，方块会被破坏。
#   放置时会尝试附着到这块空间内最近的有效附着表面。
#
# 附着规则:
#   是否能附着在目标方块上是由 blacklist 选项和方块（标签）列表共同决定：
#   - 黑名单模式（blacklist: true，默认）：可附着到除了列表中的任意方块。
#   - 白名单模式（blacklist: false）：只能附着到列表中的方块。
#   在满足以上条件的同时，还需要附着的方块侧面完整。
#
# 依赖行为:
#   此行为通常作为独立 behavior 使用，也可与其他行为组合（如灯、按钮等）
#   在 behaviors 列表中共同作用于同一方块。
#
# ============================================================================

# ========================================================================
# blocks 根键
# 所有自定义方块的配置均在此根键下声明。
# ========================================================================
blocks:

  # ========================================================================
  # 方块 ID: custom:my_wall_torch
  # 命名空间: custom (自定义命名空间，请按需替换为项目命名空间)
  # 格式:   <命名空间>:<方块ID>
  # 注意:   不建议使用 'minecraft' 命名空间，请使用自定义命名空间。
  # ========================================================================
  custom:my_wall_torch:

    # ====================================================================
    # behavior 配置块
    # 定义该方块的核心定向附着行为。
    #
    # 注意: 若方块只有一个行为，使用单数 behavior 键；
    #       若方块有多个行为，使用复数 behaviors 列表。
    # ====================================================================
    behavior:

      # ----------------------------------------------------------------
      # type: 行为类型
      # 作用:  声明该方块的行为实现类。
      # 必需:  是
      # 可选值: 由 CraftEngine 注册的行为类型决定
      # 当前值: directional_attached_block - 定向附着方块行为
      # ----------------------------------------------------------------
      type: directional_attached_block

      # ----------------------------------------------------------------
      # blacklist: 黑名单/白名单模式切换
      # 作用:  控制 attached_blocks / attached_block_tags 的匹配逻辑：
      #       - true  = 黑名单模式：可附着到除了列表中的任意方块。
      #       - false = 白名单模式：只能附着到列表中的方块。
      # 必需:  否
      # 类型:  boolean (布尔值)
      # 默认:  true
      # 注意:  不配置此字段时默认为 true（黑名单模式），
      #        即不限制附着表面，除非在列表中明确排除。
      # ----------------------------------------------------------------
      blacklist: true

      # ----------------------------------------------------------------
      # attached_blocks: 附着方块列表（可选）
      # 作用:  指定要检查的方块 ID 列表。
      #       在黑名单模式下，排除这些方块（不可附着到其上）；
      #       在白名单模式下，仅允许附着到这些方块上。
      # 必需:  否
      # 类型:  list of strings (字符串列表)
      # 格式:  <命名空间>:<方块ID>
      # 注意:  与 attached_block_tags 同时配置时，两者取交集效果。
      # ----------------------------------------------------------------
      attached_blocks:
        - custom:unattachable_block
        - minecraft:stone

      # ----------------------------------------------------------------
      # attached_block_tags: 附着方块标签列表（可选）
      # 作用:  指定要检查的方块标签列表。
      #       Minecraft 标签以 minecraft: 为前缀，也支持自定义标签。
      #       在黑名单模式下，排除匹配这些标签的方块；
      #       在白名单模式下，仅允许附着到匹配这些标签的方块上。
      # 必需:  否
      # 类型:  list of strings (字符串列表)
      # 格式:  <命名空间>:<标签名>
      # 注意:  与 attached_blocks 同时配置时，两者取交集效果。
      # ----------------------------------------------------------------
      attached_block_tags:
        - minecraft:dirt
        - minecraft:farmland

    # ====================================================================
    # properties: 方块运行时状态属性
    # 注意:  这些属性通常由引擎自动管理，不需要在配置中手动定义，
    #        此处仅作文档说明。它们定义了方块在运行时的状态数据类型。
    # 当通过 API 或指令读写方块属性时，请使用以下定义。
    # ====================================================================
    # properties:
    #   facing: north                          # horizontal_direction | 必需 | 方块附着朝向
    #
    # ------------------------------------------------------------------
    # 属性速查表
    # ------------------------------------------------------------------
    # | 属性名称 | 属性类型             | 是否必需 | 说明                     |
    # |----------|----------------------|----------|--------------------------|
    # | facing   | horizontal_direction | 是       | 方块附着朝向（东/南/西/北） |
    # ------------------------------------------------------------------

  # ====================================================================
  # 完整示例 1: 基础黑名单模式壁挂火把
  # ====================================================================
  # 使用黑名单模式，仅排除少数不可附着方块，其他所有完整侧面均可附着。
  # 适用于通用型的壁挂装饰方块。
  # ====================================================================
  custom:wall_torch_basic:
    behavior:
      type: directional_attached_block
      blacklist: true
      attached_blocks:
        - minecraft:glass
        - minecraft:ice
      attached_block_tags:
        - minecraft:leaves

  # ====================================================================
  # 完整示例 2: 白名单模式——仅限特定方块附着
  # ====================================================================
  # 使用白名单模式，方块只能附着在石头类方块上。
  # 适用于需要在特定建筑方块上使用的装饰元素。
  # ====================================================================
  custom:stone_only_wall_ornament:
    behavior:
      type: directional_attached_block
      blacklist: false
      attached_block_tags:
        - minecraft:stone_bricks
        - minecraft:base_stone_overworld
        - minecraft:base_stone_nether

  # ====================================================================
  # 完整示例 3: 无限制模式——可附着到任意方块
  # ====================================================================
  # 不配置任何列表，使用默认黑名单模式且列表为空，
  # 意味着可以附着到任何侧面完整的方块上。
  # 适用于完全通用的壁挂物品。
  # ====================================================================
  custom:universal_wall_hook:
    behavior:
      type: directional_attached_block

  # ====================================================================
  # 完整示例 4: 复合行为——附着壁挂灯（带灯行为）
  # ====================================================================
  # 定向附着方块也可以与其他行为组合，例如与灯行为组合
  # 实现一个可附着在墙上的灯。此时需要使用 behaviors 列表。
  # ====================================================================
  # custom:wall_lamp:
  #   behaviors:
  #     - type: directional_attached_block
  #       blacklist: true
  #       attached_block_tags:
  #         - minecraft:stone_bricks
  #         - minecraft:planks
  #     - type: lamp_block
  #       light_level: 15
  #
  # 复合行为下的属性:
  #   - facing (来自 directional_attached_block): horizontal_direction | 必需
  #   - 无额外属性来自 lamp_block

# ====================================================================
# 配置要点总结
# ====================================================================
#
# 必需配置:
#   blocks.<方块ID>.behavior.type = "directional_attached_block"
#
# 可选配置 (及默认值):
#   blocks.<方块ID>.behavior.blacklist            (boolean, 默认: true)
#   blocks.<方块ID>.behavior.attached_blocks       (list,    默认: 空)
#   blocks.<方块ID>.behavior.attached_block_tags   (list,    默认: 空)
#
# 必需属性 (由引擎自动管理):
#   blocks.<方块ID>.properties.facing  (horizontal_direction)
#
# 附着规则:
#   - 黑名单模式（blacklist: true，默认）：
#     可附着到除了列表中的任意方块。列表为空时等同于"可附着到任何方块"。
#   - 白名单模式（blacklist: false）：
#     只能附着到列表中的方块。列表为空时等同于"不可附着到任何方块"。
#   - attached_blocks 与 attached_block_tags 同时配置时，两者取交集：
#     即方块必须在两个列表中都匹配（或都不匹配，取决于模式）。
#
# 行为特性:
#   - 当附着的方块变动（移动、破坏、替代等）而不再允许附着时，
#     方块会被自动破坏。
#   - 放置时会自动尝试附着到这块空间内最近的有效附着表面。
#   - 还需要附着方块的目标侧面完整。
#
# 复合行为:
#   - 若方块仅有此一个行为，使用 behavior（单数）键；
#   - 若与其他行为（如 lamp_block、button_block 等）组合，
#     使用 behaviors（复数）列表。
#
# 命名空间:
#   始终使用自定义命名空间（如 custom, myproject, myaddon 等），
#   不要覆盖原版 minecraft 命名空间的方块，除非明确知道后果。
# ============================================================================
