# Wiki: CraftEngine Wiki/configuration/block/behaviors/directional_attached_block.md
# 定向附着方块 - 可附着在另一个方块的侧面上，类似墙上火把
# 当附着的方块变动而不再允许附着时，此方块会被自动破坏

blocks:
  custom:example_wall_torch:  # << CHANGE THIS
    behavior:
      type: directional_attached_block
      blacklist: true  # << CHANGE THIS - true=黑名单(列表外均可附着), false=白名单(仅可附着列表中的方块)
      attached_blocks:  # << CHANGE THIS - 可选，方块ID列表
        - custom:example_block
        - minecraft:stone
      attached_block_tags:  # << CHANGE THIS - 可选，方块标签列表
        - minecraft:dirt
        - minecraft:farmland

    # 必需属性
    properties:
      facing: north  # << CHANGE THIS - 附着方向 (north/south/east/west, 类型: horizontal_direction)
