# ============================================================================
# 配置要点总结
# ============================================================================
# [必需配置]
#   1. blocks.<方块ID>.behavior.type = "snowy_block"
#      -> 声明方块使用覆雪行为。
#
#   2. properties 中必须声明 snowy 属性：
#        properties:
#          snowy:
#            type: boolean
#      -> 行为需要根据 snowy 的值切换纹理和逻辑。
#
# [建议的最佳实践]
#   1. 始终为 snowy 属性的两种状态（true / false）定义对应的外观变体，
#      否则覆雪/无雪时可能显示错误的纹理。
#   2. 在方块的 settings.tags 中添加 minecraft:snow 标签，
#      可以让其他 snowy_block 方块识别它作为雪源。
#   3. 覆雪纹理建议在原始纹理基础上添加白色顶层覆盖。
#
# [属性要求]
#   | 属性名称 | 属性类型  | 是否必需 | 说明                     |
#   |----------|-----------|----------|--------------------------|
#   | snowy    | boolean   | 是       | true = 上方有雪 / false = 无雪 |
#
# [工作原理]
#   1. 当方块上方放置了带有 minecraft:snow 标签的方块时，
#      snowy 属性会自动更新为 true。
#   2. 当上方雪方块被移除时，snowy 属性自动更新为 false。
#   3. 方块被放置时也会同步检测上方方块状态，
#      确保初始 snowy 值正确。
# ============================================================================
