# ============================================================================
# CraftEngine 覆雪方块 (snowy_block) 行为配置模板
# ============================================================================
# 覆雪方块会自动检测其上方是否有雪（或带有 minecraft:snow 标签的方块），
# 并根据检测结果动态设置 snowy 属性的值 (true / false)。
#
# 这与原版草方块切换到覆雪材质的机制相同 —— 当上方放置了雪时，
# snowy 属性会被设置为 true，移除雪时恢复为 false。
#
# 放置时也会同步检测上方方块，确保初始状态正确。
#
# 命名空间说明：
#   使用自定义命名空间（如 myproject:）而非 minecraft: 或 default:，
#   以避免覆盖原版方块。建议格式：<命名空间>:<方块ID>
# ============================================================================

# ============================================================================
# blocks 根键
# ============================================================================
# 所有自定义方块的配置均在此根键下声明。
# 下级每一项代表一种方块定义。
blocks:

  # ==========================================================================
  # 方块定义：myproject:snowy_grass_block
  # ==========================================================================
  # 使用 myproject 自定义命名空间定义覆雪草方块。
  # 格式：<命名空间>:<方块ID>
  #   - 命名空间建议使用项目/插件简称（如 quest, boss, myproject）
  #   - 方块ID 使用小写蛇形命名（如 snowy_grass_block）
  # ==========================================================================
  myproject:snowy_grass_block:

    # ========================================================================
    # behavior 节点
    # ========================================================================
    # 方块的类型行为定义，决定方块在游戏中的核心逻辑。
    behavior:

      # ------------------------------------------------------------------
      # type - 行为类型（必需）
      # ------------------------------------------------------------------
      # 声明该方块使用的行为实现类。
      # 固定值：snowy_block
      # 作用：使方块具备检测上方雪方块的能力，并自动切换 snowy 属性。
      # 必需：是
      # 类型：string
      # ------------------------------------------------------------------
      type: snowy_block

    # ========================================================================
    # properties 节点 —— 属性定义（必需）
    # ========================================================================
    # snowy_block 行为要求方块必须声明 snowy 属性。
    # 属性定义在 state.appearances 或 state.variants 中的 properties 段，
    # 或直接在 behavior 同级/内嵌的 properties 中（取决于 CraftEngine 版本）。
    #
    # 注意：对于 snowy_block，snowy 属性是必需的，否则行为无法正常工作。
    # ========================================================================

    # ========================================================================
    # state 节点 —— 方块状态（必需，至少定义一种状态）
    # ========================================================================
    # 定义方块的外观模型、纹理和属性变体。
    # 一个完整的 snowy_block 需要至少两种外观变体：
    #   - snowy = false 时使用普通纹理
    #   - snowy = true  时使用覆雪纹理
    # ========================================================================
    state:

      # ------------------------------------------------------------------
      # auto_state: 自动状态选择（推荐快速入门）
      # ------------------------------------------------------------------
      # 让插件自动选择一个合适的原版方块作为视觉基础。
      # 常用的兼容状态：note_block, grass_block, stone 等。
      # 对于覆雪方块，建议使用 grass_block 作为基础以获得最佳兼容性。
      # 更高级的用法请参考 appearances 和 variants 配置。
      # ------------------------------------------------------------------
      auto_state: note_block

      # ------------------------------------------------------------------
      # model: 模型配置
      # ------------------------------------------------------------------
      # 指定方块的模型和纹理。
      # 注意：需要为两个 snowy 状态分别准备纹理。
      # ------------------------------------------------------------------
      model:
        # texture - 方块纹理路径（必需）
        # 格式：<命名空间>:<路径> 或 minecraft:block/<路径>
        # 此处假设使用自定义纹理（普通状态）
        texture: "myproject:block/my_snowy_grass_block"

      # ------------------------------------------------------------------
      # appearances: 外观变体配置（进阶用法）
      # ------------------------------------------------------------------
      # 通过 appearances 可以为不同的属性值组合指定不同的视觉表现。
      # 对于覆雪方块，最常见的用法是根据 snowy 属性的值切换纹理。
      # ------------------------------------------------------------------
      appearances:
        # 当 snowy = false 时（无覆雪）
        - properties:
            snowy: false
          model:
            # 普通草方块纹理
            texture: "myproject:block/my_grass_block"

        # 当 snowy = true 时（覆雪）
        - properties:
            snowy: true
          model:
            # 覆雪纹理（建议在普通纹理基础上叠加白色雪层）
            texture: "myproject:block/my_snowy_grass_block_top"

    # ========================================================================
    # settings 节点 —— 方块设置（可选）
    # ========================================================================
    # 定义方块的基础属性，如硬度、音效、亮度等。
    # 对于覆雪方块，建议参考原版草方块或雪块的设置。
    # ========================================================================
    settings:
      # hardness - 硬度
      # 原版草方块为 0.6，雪块为 0.2
      hardness: 0.6

      # resistance - 爆炸抗性
      # 原版草方块为 0.6，雪块为 0.2
      resistance: 0.6

      # sounds - 音效
      sounds:
        break: minecraft:block.grass.break
        step: minecraft:block.grass.step
        place: minecraft:block.grass.place
        hit: minecraft:block.grass.hit
        fall: minecraft:block.grass.fall

      # map_color - 地图颜色（可选）
      # 参考原版草方块的草绿色
      map_color: 79

      # is_suffocating - 是否窒息（可选，默认 true）
      is_suffocating: true

      # is_redstone_conductor - 是否传导红石（可选，默认 false）
      is_redstone_conductor: false

      # correct_tools - 合适挖掘工具（可选）
      correct_tools:
        - minecraft:wooden_shovel
        - minecraft:stone_shovel
        - minecraft:iron_shovel
        - minecraft:golden_shovel
        - minecraft:diamond_shovel
        - minecraft:netherite_shovel

      # tags - 方块标签（可选）
      tags:
        - minecraft:mineable/shovel
        - minecraft:snow  # 让其他 snowy_block 也能检测此方块为雪

