# 覆雪方块 - 自动检测顶部是否有雪并设置 snowy 属性

blocks:
  custom:snowy_block:                             # << CHANGE THIS (namespace:block_id)
    properties:
      snowy:
        type: boolean                             # 必需 - 由行为自动设置
        default: false
    behavior:
      type: snowy_block
