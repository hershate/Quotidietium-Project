# =============================================================================
# CraftEngine 茎方块行为配置模板 (stem_block)
# =============================================================================
# 对应 Wiki: CraftEngine Wiki/configuration/block/behaviors/stem_block.md
#
# 茎方块会随时间生长，类似原版西瓜或南瓜茎。每次随机刻都会增加 age 阶段。
# 达到最大值后，随机选择一个水平方向；若目标位置为空气且其下方方块满足条件，
# 则在该位置生成果实，并将自身替换为朝向果实的附着茎方块。
#
# 骨粉可使茎额外生长多个 age 阶段，若已达到最大值，则立即尝试生成果实。
# =============================================================================

blocks:

  # ===========================================================================
  # 茎方块 - 主配置
  # ===========================================================================
  custom:hami_melon_stem:                                  # << CHANGE THIS

    # ---- 属性定义（必需）----
    states:
      properties:
        age:
          type: int                                         # 属性类型必须为 int
          default: 0                                        # 默认值
          range: 0~7                                        # 取值范围（最大值即成熟阶段）

      appearances:
        default:
          auto_state: sapling
          model:
            path: "custom:block/hami_melon_stem"            # << CHANGE THIS
            generation:
              parent: "minecraft:block/stem_fruit"
              textures:
                stem: "custom:block/hami_melon_stem"        # << CHANGE THIS
                upperstem: "custom:block/attached_hami_melon_stem"  # << CHANGE THIS

      variants:
        "age=0": appearance: default
        "age=1": appearance: default
        "age=2": appearance: default
        "age=3": appearance: default
        "age=4": appearance: default
        "age=5": appearance: default
        "age=6": appearance: default
        "age=7": appearance: default

    # ---- 方块行为（必需）----
    behavior:
      type: stem_block

      # 果实方块 ID（必需）
      fruit: custom:hami_melon                              # << CHANGE THIS

      # 结果后茎转变的附着茎方块 ID（必需）
      attached_stem: custom:attached_hami_melon_stem        # << CHANGE THIS

      # 生长所需最低光照等级，默认 0
      light_requirement: 0                                  # << CHANGE THIS

      # 生长所需最高光照等级，默认 15
      max_light_requirement: 15                             # << CHANGE THIS

      # 果实可坐落的方块（白名单）。仅当目标下方方块匹配时果实才会生成。
      # 与 fruit_bottom_block_tags 同时使用；两者均为空则果实永不生成。
      fruit_bottom_blocks:                                  # << CHANGE THIS
        - minecraft:farmland
        - minecraft:dirt
        - minecraft:grass_block

      # 果实可坐落的方块标签（白名单）
      fruit_bottom_block_tags: []                           # << CHANGE THIS

    # ---- 方块设置（可选）----
    settings:
      hardness: 0.0
      resistance: 0.0
      replaceable: false
      sounds:
        break: minecraft:block.crop.break
        step: minecraft:block.grass.step
        place: minecraft:block.crop.place
        hit: minecraft:block.grass.hit
        fall: minecraft:block.grass.fall
      tags:
        - minecraft:crops

    # ---- 战利品表（可选）----
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: survives_explosion
          entries:
            - type: item
              item: "custom:hami_melon_seeds"               # << CHANGE THIS


  # ===========================================================================
  # 示例：南瓜茎（多外观分段 + 完整 loot 表）
  # ===========================================================================
  custom:pumpkin_stem:                                      # << CHANGE THIS
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~7

      appearances:
        seedling:
          auto_state: sapling
          model:
            path: "custom:block/pumpkin_stem_stage0"        # << CHANGE THIS
            generation:
              parent: "minecraft:block/cross"
              textures:
                cross: "custom:block/pumpkin_stem_stage0"   # << CHANGE THIS
        growing:
          auto_state: sapling
          model:
            path: "custom:block/pumpkin_stem_stage1"        # << CHANGE THIS
            generation:
              parent: "minecraft:block/cross"
              textures:
                cross: "custom:block/pumpkin_stem_stage1"   # << CHANGE THIS
        mature:
          auto_state: sapling
          model:
            path: "custom:block/pumpkin_stem_stage2"        # << CHANGE THIS
            generation:
              parent: "minecraft:block/stem_fruit"
              textures:
                stem: "custom:block/pumpkin_stem_stage2"    # << CHANGE THIS
                upperstem: "custom:block/attached_pumpkin_stem"  # << CHANGE THIS

      variants:
        "age=0,1":
          appearance: seedling
        "age=2,3,4":
          appearance: growing
        "age=5,6,7":
          appearance: mature

    behavior:
      type: stem_block
      fruit: custom:pumpkin                                 # << CHANGE THIS
      attached_stem: custom:attached_pumpkin_stem            # << CHANGE THIS
      light_requirement: 8                                  # << CHANGE THIS
      max_light_requirement: 15
      fruit_bottom_blocks:
        - minecraft:farmland
        - minecraft:dirt
        - minecraft:grass_block
      fruit_bottom_block_tags:
        - minecraft:dirt                                    # << CHANGE THIS

    settings:
      hardness: 0.0
      resistance: 0.0
      push_reaction: DESTROY
      sounds:
        break: minecraft:block.crop.break
        step: minecraft:block.grass.step
        place: minecraft:block.crop.place
        hit: minecraft:block.grass.hit
        fall: minecraft:block.grass.fall
      tags:
        - minecraft:crops

    loot:
      pools:
        - rolls: 1
          conditions:
            - type: survives_explosion
          entries:
            - type: item
              item: "custom:pumpkin_seeds"                  # << CHANGE THIS
        - rolls: 1
          conditions:
            - type: survives_explosion
            - type: block_state_property
              block: "custom:pumpkin_stem"
              properties:
                age: "7"
          entries:
            - type: item
              item: "minecraft:experience_bottle"
              weight: 1
              functions:
                - type: set_count
                  count:
                    type: uniform
                    min: 1
                    max: 3


# =============================================================================
# 属性要求（Property Requirements）
# =============================================================================
# stem_block 行为要求方块必须定义以下属性：
#
# | 属性名称 | 属性类型 | 是否必需 | 说明                        |
# |---------|---------|---------|----------------------------|
# | age     | int     | 是       | 生长阶段，0=刚种下，最大值时结成果实 |
#
# 注意事项:
#   1. age 的 range 必须定义（典型值 0~7，与原版一致）。
#   2. 最大 age 由 range 上限决定，而不是由行为配置指定。
#   3. stem_block 本身无 grow_speed 配置；生长进度完全由随机刻驱动。
#   4. fruit_bottom_blocks 与 fruit_bottom_block_tags 使用白名单模式，
#      而非黑名单。两者均为空时果实永不生成。
#   5. attached_stem 必须是一个附带 attached_stem_block 行为的方块，
#      且拥有 facing (horizontal_direction) 属性。
# =============================================================================


# =============================================================================
# 文档中所有配置选项汇总
# =============================================================================
# blocks:
#   <namespace:path>:
#     states:
#       properties:
#         age:
