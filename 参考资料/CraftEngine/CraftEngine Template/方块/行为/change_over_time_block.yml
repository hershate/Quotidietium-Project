# Wiki: configuration/block/behaviors/change_over_time_block.md
# 方块收到随机刻后按概率转化为目标方块，属性被携带，except excluded_properties.

blocks:
  custom:example_block:
    behavior:
      type: change_over_time_block
      # 每随机刻转化概率，0.0~1.0 (默认 0.057)
      change_speed: 0.057                                         # << CHANGE THIS
      # 目标方块 ID，必需
      next_block: custom:oxidized_example_block                   # << CHANGE THIS
      # 转化时不携带到目标方块的属性列表 (默认 [])
      excluded_properties: []                                      # << CHANGE THIS

# ---- 键说明 (requirements) ----
# type:                string  必填  固定 "change_over_time_block"
# change_speed:        double  可选  默认 0.057  每随机刻转化概率
# next_block:          string  必填  目标方块完整 ID
# excluded_properties: string[] 可选 默认 []     不携带到目标方块的属性
