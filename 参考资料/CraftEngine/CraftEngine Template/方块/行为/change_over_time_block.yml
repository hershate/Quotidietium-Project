# ============================================================================
# 方块行为配置模板 —— change_over_time_block (随时间更改方块)
# ============================================================================
# 此行为使方块在收到随机刻后有概率转化为另一种方块。
# 类似于铜块的氧化机制：每个随机刻按指定概率尝试转化，
# 转化时原方块的大部分属性会携带到目标方块。
# ============================================================================

blocks:
  # --------------------------------------------------------------------------
  # 自定义命名空间 —— 此处使用 myitems 作为示例，可替换为任意命名空间
  # 格式: <namespace>:<block_id>
  # --------------------------------------------------------------------------
  myitems:weathered_copper_block:
    behavior:
      # ---- 行为类型 (必填) -------------------------------------------------
      # 固定值: change_over_time_block
      # 将此方块标记为 "随时间更改" 行为
      type: change_over_time_block

      # ---- change_speed (转化速度) -----------------------------------------
      # 每个随机刻方块转化为 next_block 的概率 (0.0 ~ 1.0)
      # 默认值: 0.057 (约等于铜块每随机刻的原始氧化概率)
      # 数值越大，转化越快；数值为 1.0 时必定在首个随机刻转化
      # 建议范围: 0.01 ~ 0.5，根据期望的氧化/老化速度调整
      change_speed: 0.057

      # ---- next_block (目标方块) (必填) ------------------------------------
      # 转化后变为的方块的完整 ID (含命名空间)
      # 此键不可省略，否则转化行为无法生效
      # 格式: <namespace>:<block_id>
      next_block: myitems:fully_oxidized_copper_block

      # ---- excluded_properties (排除属性) -----------------------------------
      # 转化时**不携带**到目标方块的属性列表。
      # 未在此列表中的属性会被原样传递；列出的属性会重置为目标方块的默认值。
      # 默认值: [] (空列表，即所有属性均携带)
      # 场景举例:
      #   - 方块状态如 "facing"、"waterlogged" 在转化后应保持 —— 不放此处
      #   - 特殊标签如 "custom_name" 要丢弃 —— 放入此处
      # ----------------------------------------------------------------------
      excluded_properties:
        # - custom_name      # 示例: 忽略自定义名称，使用目标方块的默认值
        # - custom_data      # 示例: 忽略自定义数据
        # - some_state       # 示例: 忽略某个方块状态

# ============================================================================
# 完整示例 —— 三级氧化链 (铜块 -> 锈蚀铜块 -> 完全锈蚀铜块)
# ============================================================================
# 下面展示一个从普通铜块逐步氧化到完全锈蚀铜块的完整配置。
# 每个阶段的可视化属性 (custom_light_level、custom_texture 等)
# 会随转化递进，但 "custom_data" 属性会在最后一步被丢弃。
# ============================================================================
# blocks:
#   myitems:copper_block:
#     behavior:
#       type: change_over_time_block
#       change_speed: 0.057
#       next_block: myitems:exposed_copper_block
#       excluded_properties: []
#     # 其他方块属性 (硬度、亮度等) ...
#
#   myitems:exposed_copper_block:
#     behavior:
#       type: change_over_time_block
#       change_speed: 0.057
#       next_block: myitems:weathered_copper_block
#       excluded_properties: []
#     # 其他方块属性 ...
#
#   myitems:weathered_copper_block:
#     behavior:
#       type: change_over_time_block
#       change_speed: 0.057
#       next_block: myitems:fully_oxidized_copper_block
#       excluded_properties:
#         - custom_data           # 最终阶段丢弃 custom_data
#     # 其他方块属性 ...
#
#   myitems:fully_oxidized_copper_block:
#     # 终点方块 —— 不再配置 change_over_time_block 行为
#     # 此方块不会再继续转化
#     behavior: {}
#     # 其他方块属性 ...

# ============================================================================
# 配置索引
# ============================================================================
# 键名                 类型      必填    默认值      说明
# ----------------------------------------------------------------------------
# type                 string    是      -           行为类型，固定为 "change_over_time_block"
# change_speed         double    否      0.057       每随机刻转化概率 (0.0 ~ 1.0)
# next_block           string    是      -           目标方块的完整 ID
# excluded_properties  string[]  否      []          转化时丢弃的属性列表
# ============================================================================
