# Wiki: configuration/block/behaviors/concrete_powder_block.md
# 混凝土粉末方块遇水硬化成固体方块
# 触发时机：放置时 / 下落后 / PP更新时
# 硬化时触发 BlockFormEvent，用 solid_block 替换自身
blocks:
  custom:my_concrete_powder:                          # << CHANGE THIS - 方块命名空间ID
    behavior:
      type: concrete_powder_block
      solid_block: custom:my_solid_concrete           # << CHANGE THIS - 硬化后转化成的方块（必需，支持带状态 ID 如 minecraft:stone[axis=y]）

# 属性要求：
#   type          string  必需  固定 "concrete_powder_block"
#   solid_block   string  必需  硬化后替换的方块ID（支持方块状态）
# 注意：solid_block 省略将导致配置加载失败
# 提示：可与 falling_block 行为组合使用（效果：重力下落 + 遇水硬化）
