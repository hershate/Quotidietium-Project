# ============================================================================
# 混凝土粉末方块 (Concrete Powder Block) — 行为配置模板
# 参考: CraftEngine Wiki -> configuration/block/behaviors/concrete_powder_block.md
# ============================================================================
#
# 【行为概述】
# 混凝土粉末方块遇水会硬化成固体方块，硬化触发时机:
#   - 放置时       — 放置后与水接触即刻硬化
#   - 下落后       — 若为下落方块 (常与 falling_block 行为组合)，落水/触水即硬化
#   - PP更新时     — 水流到已放置的粉末方块旁时触发
# 硬化时会触发 BlockFormEvent，并用 solid_block 替换自身。
#
# 【命名空间】
# 本模板使用自定义命名空间 "mythic"，请根据实际项目替换。
# ============================================================================

# ============================================================================
# blocks — 根键 (必需)
# ============================================================================
# 所有方块定义均位于此键下，每项为一个方块的完整配置。
blocks:

  # ==========================================================================
  # 方块 ID: my_custom_namespace:concrete_powder_block
  #   - 格式: <命名空间>:<方块标识符>
  #   - 命名空间: 建议使用项目名/作者名，避免与其他插件冲突
  #   - 标识符: 小写+下划线，见名知意
  # ==========================================================================
  mythic:concrete_powder_block:

    # ------------------------------------------------------------------
    # behavior — 行为配置 (必需)
    # ------------------------------------------------------------------
    behavior:

      # type — 行为类型 (必需)
      # 固定为 concrete_powder_block，声明本方块使用混凝土粉末行为。
      type: concrete_powder_block

      # solid_block — 硬化后转化成的固体方块 (必需)
      # ------------------------------------------------------------------
      # 类型: string
      # 必填: 是 — 省略将导致配置加载失败
      # 取值: 任意有效的方块 ID 或完整方块状态
      #
      # 合法值示例:
      #   - "minecraft:stone"                         — 仅方块 ID
      #   - "minecraft:stone[axis=y]"                 — 方块 ID + 方块状态
      #   - "default:solid_gunpowder_block"           — 自定义命名空间方块
      #   - "mythic:hardened_concrete_powder"         — 同项目内的硬化方块
      #
      # 注意: 目标方块必须存在，否则运行时硬化会失败。
      # ------------------------------------------------------------------
      solid_block: mythic:hardened_concrete_powder

# ============================================================================
# 完整示例 (完整配置，可直接复制使用)
# ============================================================================
# 以下展示 concrete_powder_block 与 falling_block 组合使用的完整配置:
#
# blocks:
#   # ------------------------------------------------------------------
#   # 普通混凝土粉末 (仅硬化)
#   # ------------------------------------------------------------------
#   myproject:white_concrete_powder:
#     behavior:
#       type: concrete_powder_block
#       solid_block: minecraft:white_concrete
#
#   # ------------------------------------------------------------------
#   # 可下落的混凝土粉末 (硬化 + 重力)
#   # ------------------------------------------------------------------
#   myproject:gravel_concrete_powder:
#     behaviors:                               # 注意: 组合多个行为时用复数键 behaviors
#       - type: falling_block                  # 可下落行为
#       - type: concrete_powder_block          # 混凝土粉末行为
#         solid_block: myproject:solid_gravel_concrete
#
#   # ------------------------------------------------------------------
#   # 带方块状态的硬化目标
#   # ------------------------------------------------------------------
#   myproject:axis_concrete_powder:
#     behavior:
#       type: concrete_powder_block
#       solid_block: minecraft:stone[axis=y]   # 硬化成指定状态的方块
#
# ============================================================================
# 属性要求总结
# ============================================================================
#
# | 配置项          | 类型     | 必需 | 默认值 | 说明                                    |
# |-----------------|----------|------|--------|----------------------------------------|
# | type            | string   | 是   | —      | 必须为 "concrete_powder_block"         |
# | solid_block     | string   | 是   | —      | 硬化后替换为的方块 ID (支持方块状态)    |
#
# 注意事项:
# 1. solid_block 为必填字段 — 若省略，配置加载将直接失败
# 2. 可与 falling_block 行为组合，实现重力+遇水硬化效果
# 3. 目标方块 (solid_block) 必须提前在服务端注册，否则硬化无效果
# 4. 行为组合时注意 behaviors 为复数形式（数组），而非 behavior
# 5. 方块 ID 格式遵循 <命名空间>:<路径>，自定义方块需保证命名空间唯一
# ============================================================================
