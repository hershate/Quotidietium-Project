# ============================================================================
#  流体推动方块 (Liquid Flowable Block) - 行为配置模板
# ============================================================================
# 功能：使方块可被水或熔岩流体替换（类似矮草丛、火把的流体交互行为）。
#       当流体流入时，方块会被破坏并替换为对应流体。
# ----------------------------------------------------------------------------
# 流体行为差异：
#   - 水 (Water)  ：若 drop_item 为 true，方块会掉落对应物品。
#   - 熔岩 (Lava) ：方块不会掉落任何物品，直接摧毁方块。
# ============================================================================

# ============================================================================
# blocks 根键
# ============================================================================
# 所有方块定义必须位于此根键下。
blocks:

  # ==========================================================================
  # 方块定义
  # ==========================================================================
  # 命名格式：<命名空间>:<方块ID>
  # - 使用自定义命名空间 "custom"（可根据项目需要替换）
  # - 方块ID 使用小写字母和下划线
  # ==========================================================================
  custom:liquid_flowable_example:

    # --------------------------------------------------------------------------
    # behavior - 行为配置
    # --------------------------------------------------------------------------
    # 定义方块的核心交互行为类型及其参数。
    behavior:

      # type - 行为类型（必需）
      # 取值：liquid_flowable_block
      # 说明：将此方块标记为可被流体推动/替换的方块。
      type: liquid_flowable_block

      # drop_item - 掉落物品开关（可选，默认值：true）
      # 类型：boolean
      # 说明：控制当方块被水替换时是否掉落对应物品。
      #   - true  ：方块被水替换时会掉落自身物品。
      #   - false ：方块被水替换时不会掉落物品（类似植物被水冲毁）。
      # 注意：被熔岩替换时此选项无效，熔岩总是直接摧毁方块。
      drop_item: true           # 默认值

    # ========================================================================
    # 可选配置参考 (Oraxen/CraftEngine 通用)
    # ========================================================================
    # 以下为方块可附加的其他配置项（按需启用，仅作参考不在此示例中激活）：

    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # display - 显示配置
    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # display:
    #   material: PAPER                    # 底层 MC 材质
    #   model: custom/block/liquid_flowable_example  # 自定义模型路径

    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # hardness - 硬度（破坏时间）
    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # hardness: 0          # 默认值 0，瞬间破坏

    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # sound - 音效
    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # sound:
    #   place: block.grass.place
    #   break: block.grass.break
    #   hit: block.grass.hit

    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # limit - 放置限制
    # %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
    # limit:
    #   placeable_on:
    #     - GRASS_BLOCK
    #     - DIRT

# ============================================================================
# 完整示例 - 水中可破坏的火把类方块
# ============================================================================
# 以下展示一个完整的、可直接使用的配置示例。
# ============================================================================
# blocks:
#   custom:water_torch:
#     display:
#       material: PAPER
#       model: custom/block/water_torch
#     behavior:
#       type: liquid_flowable_block
#       drop_item: true
#     hardness: 0
#     sound:
#       place: block.wood.place
#       break: block.wood.break
#       hit: block.wood.hit

# ============================================================================
# 注意事项
# ============================================================================
# 1. type: liquid_flowable_block 是行为类型，必需字段。
# 2. drop_item 仅影响被水替换时的掉落行为；熔岩替换时总会摧毁方块。
# 3. 此行为适用于：矮草丛、火把、红石粉、线、按钮等可被流体冲毁的方块。
# 4. 若想在自定义模型上实现此行为，确保模型配置（display）与行为配置配合使用。
# 5. 命名空间建议统一管理，避免与其他插件冲突。
# ============================================================================
