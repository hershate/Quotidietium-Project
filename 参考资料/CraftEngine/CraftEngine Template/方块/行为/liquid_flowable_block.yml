# 流体推动方块 (Liquid Flowable Block)
# 可被水或熔岩替换，类似矮草丛或火把。流体流入时方块被破坏并替换为对应流体。
#   水：  若 drop_item 为 true 则掉落对应物品。
#   熔岩：直接摧毁方块，不掉落物品。

blocks:
  custom:your_block_id:                                   # << CHANGE THIS
    behavior:
      type: liquid_flowable_block
      drop_item: true                                     # << CHANGE THIS (被水替换时是否掉落物品，默认 true)
