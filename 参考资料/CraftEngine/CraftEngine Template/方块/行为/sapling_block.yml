# 树苗方块 (sapling_block)
# Wiki: CraftEngine Wiki/configuration/block/behaviors/sapling_block.md
#
# 树苗方块会随时间生长。每次随机刻，若光照条件满足，则以 grow_speed 的
# 概率使 stage 增加 1。当 stage 达到最大值时，会调用配置的 feature 生成
# 完整树木。骨粉可无视光照和生长概率，立即将 stage 增加 1。

# =============================================================================
# 方块配置
# =============================================================================
blocks:

  # ===========================================================================
  # 树苗方块
  # ===========================================================================
  custom:sapling:                                          # << CHANGE THIS (namespace:block_id)
    states:
      properties:
        stage:                                             # 必需属性 (int)，记录生长阶段
          type: int
          default: 0
          values:                                          # << CHANGE THIS (取值范围)
            - 0
            - 1
            - 2
            - 3

      # 每个生长阶段的外观 (0 ~ max)
      appearances:
        stage_0:                                           # << CHANGE THIS (外观名称)
          auto_state: solid
          model:
            path: minecraft:block/custom/sapling           # << CHANGE THIS (模型路径)
            generation:
              parent: minecraft:block/cross
              textures:
                cross: minecraft:block/custom/sapling_stage_0  # << CHANGE THIS (纹理路径)
          settings:
            collision_box: -4, 0, -4, 4, 8, 4

        stage_1:                                           # << CHANGE THIS
          auto_state: solid
          model:
            path: minecraft:block/custom/sapling
            generation:
              parent: minecraft:block/cross
              textures:
                cross: minecraft:block/custom/sapling_stage_1  # << CHANGE THIS
          settings:
            collision_box: -4, 0, -4, 4, 8, 4

        stage_2:                                           # << CHANGE THIS
          auto_state: solid
          model:
            path: minecraft:block/custom/sapling
            generation:
              parent: minecraft:block/cross
              textures:
                cross: minecraft:block/custom/sapling_stage_2  # << CHANGE THIS
          settings:
            collision_box: -4, 0, -4, 4, 12, 4

        stage_3:                                           # << CHANGE THIS (最终阶段)
          auto_state: solid
          model:
            path: minecraft:block/custom/sapling
            generation:
              parent: minecraft:block/cross
              textures:
                cross: minecraft:block/custom/sapling_stage_3  # << CHANGE THIS
          settings:
            collision_box: -4, 0, -4, 4, 12, 4

      # 变体映射: stage 值 -> 外观
      variants:
        stage=0:
          appearance: stage_0
        stage=1:
          appearance: stage_1
        stage=2:
          appearance: stage_2
        stage=3:
          appearance: stage_3

    settings:
      hardness: 0.0
      resistance: 0.0
      is_suffocating: false
      is_redstone_conductor: false
      map_color: 38
      instrument: harp
      sounds:
        break: minecraft:block.grass.break
        step: minecraft:block.grass.step
        place: minecraft:block.grass.place
        hit: minecraft:block.grass.hit
        fall: minecraft:block.grass.fall
      correct_tools:
        - minecraft:wooden_hoe
        - minecraft:stone_hoe
        - minecraft:iron_hoe
        - minecraft:golden_hoe
        - minecraft:diamond_hoe
        - minecraft:netherite_hoe
      tags:
        - minecraft:mineable/hoe
        - minecraft:saplings
      item: custom:sapling                                   # << CHANGE THIS (对应物品 ID)

    # 树苗生长行为
    behavior:
      type: sapling_block
      feature: custom:tree_feature                          # << CHANGE THIS (完全成熟时生成的已配置地物 ID，必需)
      light_requirement: 9                                  # << CHANGE THIS (生长所需最低光照，默认 9)
      max_light_requirement: 15                             # << CHANGE THIS (生长所需最高光照，默认 15)
      grow_speed: 0.143                                     # << CHANGE THIS (每随机刻增加 stage 的概率，默认约 0.143)
      bone_meal_success_chance: 0.45                        # << CHANGE THIS (骨粉产生成功粒子的概率，默认 0.45)

    # 破坏时掉落自身
    loot:
      type: generic
      entries:
        - item: custom:sapling                              # << CHANGE THIS (掉落物品 ID)
          count: 1

# =============================================================================
# 物品配置 (使玩家能手持放置该方块)
# =============================================================================
items:
  custom:sapling:                                          # << CHANGE THIS (物品 ID)
    behavior:
      type: block_item
      block: custom:sapling                                # << CHANGE THIS (对应的方块 ID)
