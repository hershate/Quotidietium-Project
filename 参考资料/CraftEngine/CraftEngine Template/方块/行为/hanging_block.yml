# Wiki: configuration/block/behaviors/hanging_block.md
# 悬挂方块 (Hanging Block) — 附着在另一个方块下方，类似钟乳石。
# 支撑方块被移除则悬挂方块破坏。可选 stackable 实现向下堆叠。

blocks:
  # << CHANGE THIS — 替换为你的方块 ID
  custom:hanging_block:
    behavior:
      type: hanging_block

      # true = 黑名单模式（禁止悬挂在列表中的方块下方）
      # false = 白名单模式（仅能悬挂在列表中的方块下方）
      # << CHANGE THIS
      blacklist: false

      # 是否允许同类型方块向下连续悬挂
      # << CHANGE THIS
      stackable: false

      # 最大悬挂层数。仅在 stackable: true 时生效，必须 > 1
      # << CHANGE THIS
      max_height: 0

      # 支撑移除后延迟破坏的游戏刻数（20刻 = 1秒），0 = 立即破坏
      # << CHANGE THIS
      delay: 0

      # 上方支撑方块列表（可选）
      # << CHANGE THIS — 按需修改
      above_blocks:
        - custom:support_block
        - minecraft:stone

      # 上方支撑方块标签列表（可选），与 above_blocks 配合使用
      # << CHANGE THIS — 按需修改
      above_block_tags:
        - minecraft:dirt

# ============================================================================
# 属性要求 (Property Requirements)
# ============================================================================
# type: hanging_block (必须)
#
# blacklist:      false (默认，白名单模式) | true (黑名单模式)
# stackable:      false (默认，不堆叠) | true (允许堆叠)
# max_height:     0 (默认，堆叠禁用)。stackable: true 时需 > 1
# delay:          0 (默认，立即破坏)
# above_blocks:   可选，方块ID列表
# above_block_tags: 可选，方块标签列表
#
# 约束:
#   1. above_blocks 和 above_block_tags 均未配置时：
#      白名单模式 → 方块无法悬挂在任何方块下方
#      黑名单模式 → 方块可悬挂在任何方块下方
#   2. max_height 仅在 stackable: true 且 > 1 时生效
# ============================================================================
