# ============================================================================
# 悬挂方块 (Hanging Block) - 行为配置模板
# ============================================================================
# 功能: 方块附着在另一个方块的下方，类似钟乳石（stalactites）。
#       当上方支撑方块被移除时，悬挂方块会自动破坏。
#       可选择堆叠：开启 stackable 后，多个同类型方块可向下悬挂，
#       最多至 max_height 层。
# ============================================================================
# 参考文档: CraftEngine Wiki - configuration/block/behaviors/hanging_block.md
# ============================================================================
# Oraxen 风格配置 - 使用自定义命名空间 myitems
# ============================================================================

# ============================================================================
# blocks 根键 (Root Key)
# ============================================================================
# 所有自定义方块在此根键下注册，每个方块一个条目。
# 键名格式: <命名空间>:<方块ID>
#   - 命名空间: 用于区分不同来源的方块，避免 ID 冲突
#   - 方块ID:   方块的唯一标识符
# ============================================================================
blocks:

  # =========================================================================
  # 示例方块: 钟乳石 (myitems:stalactites)
  # =========================================================================
  # 使用自定义命名空间 "myitems"
  # 仅悬挂在特定方块下方（白名单模式），不可堆叠，失去支撑立即破坏
  # =========================================================================
  myitems:stalactites:

    # -----------------------------------------------------------------------
    # behavior 配置段 (必须)
    # -----------------------------------------------------------------------
    # 定义方块的行为逻辑。必须配置 type 字段指定行为类型。
    # -----------------------------------------------------------------------
    behavior:

      # 行为类型: hanging_block (必须)
      # 使方块获得类似钟乳石的悬挂特性。
      type: hanging_block

      # -------------------------------------------------------------------
      # blacklist - 黑名单/白名单模式 (可选, 默认: false)
      # -------------------------------------------------------------------
      # 控制 above_blocks / above_block_tags 的匹配逻辑。
      #   true  = 黑名单模式: 方块可悬挂在除了列表以外的任何方块下方
      #   false = 白名单模式: 方块只能悬挂在列表中的方块下方
      # 类型: boolean
      # 默认: false (白名单模式)
      # -------------------------------------------------------------------
      blacklist: false

      # -------------------------------------------------------------------
      # stackable - 允许堆叠悬挂 (可选, 默认: false)
      # -------------------------------------------------------------------
      # 是否允许同类型方块向下连续悬挂（堆叠）。
      #   true  = 允许堆叠: 多个同类型方块可依次向下悬挂，形成长条结构
      #   false = 禁止堆叠: 方块下方不能继续悬挂同类型方块
      # 类型: boolean
      # 默认: false
      # 注意: 启用后请同时配置 max_height 限制最大长度
      # -------------------------------------------------------------------
      stackable: false

      # -------------------------------------------------------------------
      # max_height - 最大悬挂长度 (可选, 默认: 0)
      # -------------------------------------------------------------------
      # 仅在 stackable 为 true 时生效。
      # 指定同类型方块向下堆叠的最大层数（包括最上方的方块）。
      # 类型: int
      # 默认: 0 (堆叠禁用)
      # 约束: 启用堆叠时必须 > 1，否则堆叠不生效
      # 示例:
      #   max_height: 3  → 最多悬挂 3 层（含顶部方块）
      # -------------------------------------------------------------------
      max_height: 0

      # -------------------------------------------------------------------
      # delay - 检查延迟 (可选, 默认: 0)
      # -------------------------------------------------------------------
      # 上方支撑方块被移除后，延迟多少游戏刻再检查悬挂条件并破坏。
      # 1 秒 = 20 刻。
      # 类型: int
      # 默认: 0 (立即破坏)
      # 设置为正数时，方块会在支撑移除后延迟指定刻数再破坏，
      # 可配合红石或流水机制使用。
      # -------------------------------------------------------------------
      delay: 0

      # -------------------------------------------------------------------
      # above_blocks - 上方方块列表 (可选)
      # -------------------------------------------------------------------
      # 指定悬挂时需要检查的上方方块列表。
      # 结合 blacklist 模式使用：
      #   - 白名单模式 (blacklist: false): 仅当上方方块在此列表中时允许悬挂
      #   - 黑名单模式 (blacklist: true):  上方方块不在此列表中时允许悬挂
      # 格式: 每项为 "<命名空间>:<方块ID>"
      # 可使用 custom: 自定义命名空间或 minecraft: 原版命名空间
      # 不配置此列表时，行为取决于 blacklist 模式和 above_block_tags
      # -------------------------------------------------------------------
      above_blocks:
        - minecraft:stone          # 上方可以是石头
        - minecraft:dripstone_block # 上方可以是滴水石块
        # - custom:xxx              # 上方可以是自定义方块（按需取消注释）

      # -------------------------------------------------------------------
      # above_block_tags - 上方方块标签列表 (可选)
      # -------------------------------------------------------------------
      # 按标签匹配上方方块，优先级高于 above_blocks。
      # 当 above_blocks 和 above_block_tags 同时配置时，
      # 标签匹配优先于具体方块匹配。
      # 格式: 每项为 "<命名空间>:<标签名>"
      # 常用原版标签:
      #   minecraft:base_stone_overworld - 主世界石质方块
      #   minecraft:dirt                 - 泥土类方块
      #   minecraft:logs                 - 原木类方块
      #   minecraft:planks              - 木板类方块
      # -------------------------------------------------------------------
      # above_block_tags:
      #   - minecraft:base_stone_overworld
      #   - minecraft:dirt

  # =========================================================================
  # 完整配置速查 - 白名单模式, 不可堆叠 (最小化示例)
  # =========================================================================
  # 最简单的 hanging_block 配置，仅指定行为类型和上方白名单。
  # 适合只需要基本悬挂功能、不堆叠的装饰方块。
  # =========================================================================
  myitems:simple_icicle:
    behavior:
      type: hanging_block
      blacklist: false                # 白名单模式
      above_blocks:
        - minecraft:stone
        - minecraft:ice
        - minecraft:packed_ice
      # stackable: false              # 默认，不堆叠
      # max_height: 0                 # 默认，堆叠禁用
      # delay: 0                      # 默认，立即破坏

  # =========================================================================
  # 完整配置速查 - 黑名单模式, 不可堆叠
  # =========================================================================
  # 使用黑名单模式，方块可悬挂在除列表以外的任何方块下方。
  # 适合通用性强的悬挂方块（如藤蔓类）。
  # =========================================================================
  myitems:generic_hanging_vine:
    behavior:
      type: hanging_block
      blacklist: true                 # 黑名单模式
      above_blocks:
        - minecraft:air               # 不允许悬挂在空气中
        - minecraft:cave_air          # 不允许悬挂在洞穴空气中
        - minecraft:void_air          # 不允许悬挂在虚空中
      # 不配置 above_block_tags，仅使用 above_blocks 黑名单
      # stackable: false              # 默认，不堆叠

  # =========================================================================
  # 完整配置速查 - 堆叠模式, 有限长度
  # =========================================================================
  # 启用堆叠悬挂，同类型方块可向下连续悬挂，最多 5 层。
  # 支撑移除后延迟 10 刻（0.5 秒）再破坏。
  # 适合需要形成长条结构的悬挂方块（如钟乳石柱、冰柱）。
  # =========================================================================
  myitems:long_icicle:
    behavior:
      type: hanging_block
      blacklist: false                # 白名单模式
      stackable: true                 # 启用堆叠
      max_height: 5                   # 最多 5 层（含顶部方块）
      delay: 10                       # 支撑移除后延迟 10 刻破坏
      above_blocks:
        - minecraft:stone
        - minecraft:ice
        - minecraft:packed_ice
      above_block_tags:
        - minecraft:base_stone_overworld

  # =========================================================================
  # 完整配置速查 - 标签匹配, 无堆叠
  # =========================================================================
  # 仅使用 above_block_tags 进行匹配，不配置具体的 above_blocks。
  # 适合需要利用原版方块标签进行批量匹配的场景。
  # =========================================================================
  myitems:tag_matched_hanging:
    behavior:
      type: hanging_block
      blacklist: false                # 白名单模式
      above_block_tags:
        - minecraft:base_stone_overworld  # 可悬挂在所有主世界石质方块下
        - minecraft:dirt                  # 可悬挂在所有泥土类方块下
      # 不配置 above_blocks - 仅使用标签匹配

  # =========================================================================
  # 完整配置速查 - 全选项综合示例
  # =========================================================================
  # 此示例展示所有配置选项同时使用的场景。
  # 适合需要精细控制悬挂逻辑的高级用法。
  # =========================================================================
  myitems:advanced_stalactite:
    display_name: "&7高级钟乳石"
    material: DRIPSTONE_BLOCK
    behavior:
      type: hanging_block
      blacklist: false                # 白名单模式
      stackable: true                 # 启用堆叠
      max_height: 7                   # 最大 7 层
      delay: 5                        # 延迟 5 刻破坏
      above_blocks:
        - minecraft:stone
        - minecraft:dripstone_block
        - minecraft:deepslate
        - minecraft:tuff
      above_block_tags:
        - minecraft:base_stone_overworld
    hardness: 1.5
    resistance: 1.5
    drop:
      type: self
    # sound:
    #   break: block.dripstone_block.break
    #   place: block.dripstone_block.place
    #   step: block.dripstone_block.step

# ============================================================================
# 属性要求与约束说明 (Property Requirements & Constraints)
# ============================================================================
# 行为类型:
#   type: hanging_block (必须)
#
# 可选属性及默认值:
#   blacklist:      false (白名单模式)
#   stackable:      false (禁止堆叠)
#   max_height:     0     (堆叠禁用)
#   delay:          0     (立即破坏)
#   above_blocks:   未配置 (依赖 above_block_tags 或 blacklist 模式)
#   above_block_tags: 未配置 (依赖 above_blocks 或 blacklist 模式)
#
# 约束条件:
#   1. blacklist 控制匹配模式:
#      - true  = 黑名单: 方块可悬挂在除配置列表以外的任何方块下方
#      - false = 白名单: 方块只能悬挂在配置列表中的方块下方
#   2. stackable 必须为 true 且 max_height > 1 才能启用堆叠
#   3. max_height 仅在 stackable: true 时生效，否则被忽略
#   4. delay 的单位为游戏刻 (tick)，20 刻 = 1 秒
#   5. above_blocks 和 above_block_tags 可同时使用，标签匹配优先级更高
#   6. 若 above_blocks 和 above_block_tags 均未配置：
#      - 白名单模式: 方块无法悬挂在任何方块下方（实际无法放置）
#      - 黑名单模式: 方块可悬挂在任何方块下方
#   7. 方块自身不保存悬挂状态属性（与 hangable_block 不同），
#      hanging_block 始终悬挂在支撑方块下方，方向固定为向下
#   8. 当支撑方块被破坏时，悬挂方块会检查延迟后自动破坏，
#      不会像 falling_block 那样变为下落实体
#
# 行为说明:
#   - 方块只能放置在满足支撑条件的方块下方
#   - 支撑破坏后，方块会在 delay 刻后自动破坏
#   - 堆叠模式下，同类型方块可连续向下悬挂
#   - 堆叠时，中间方块被破坏不会导致上方方块破坏（仅影响下方悬挂链）
#   - 最下层方块失去支撑时，整条悬挂链从下往上逐个破坏
#
# 命名空间建议:
#   - 使用有意义的命名空间避免 ID 冲突
#   - 推荐格式: <项目名/作者名>:<方块ID>
#   - 示例: myitems:, myproject:, yourname:
#
# 相关行为参考:
#   - hangable_block:   可在地面或天花板放置的方块（如灯笼）
#   - falling_block:    失去支撑后下落（如沙子）
#   - sturdy_base_block: 需要坚固基底支持的方块
# ============================================================================
