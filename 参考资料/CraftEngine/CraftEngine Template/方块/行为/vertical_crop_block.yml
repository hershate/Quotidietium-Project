# ============================================================================
# 垂直作物方块 (Vertical Crop Block)
# 行为类型: vertical_crop_block
# 参考文档: CraftEngine Wiki - configuration/block/behaviors/vertical_crop_block.md
# ============================================================================
# 垂直作物方块会在随机刻中向上或向下生长，类似甘蔗或海带。
# 在垂直方向上，只有最顶端的茎段会增加 age 值。每次随机刻触发时，
# 若生长方向的方块为空且总高度未达上限，则增加 age 值。
# 当 age 值积累至最大值时，会在顶端延伸出一个新茎段，并将原顶端的 age 值重置为最小值。
# ============================================================================

# ---- 方块定义根键 ----
blocks:

  # ===========================================================================
  # 自定义命名空间: 使用 <namespace>:<block_id> 格式
  # 示例: custom:flame_cane, myrpg:magic_bamboo, server:glow_kelp
  # ===========================================================================
  custom:flame_cane:
    # ---- 方块行为列表 ----
    behaviors:

      # -------------------------------------------------------
      # 垂直作物行为 (vertical_crop_block)
      # 使方块沿垂直方向逐段生长，类似甘蔗/海带机制
      # -------------------------------------------------------
      - type: vertical_crop_block

        # @最大值高度 (max_height)
        # 一株茎秆的最大段数（包含根部和所有茎段）
        # 类型: int
        # 默认值: 3
        # 说明: 当总高度达到此值后停止生长
        max_height: 4

        # @生长速度 (grow_speed)
        # 每随机刻增加的 age 值
        # 类型: float
        # 默认值: 1
        # 说明:
        #   - 整数部分: 每随机刻直接加给 age
        #   - 小数部分: 作为概率提供额外 +1
        #     例如 0.333 表示每刻有 33.3% 的概率使 age 额外 +1
        grow_speed: 0.333

        # @生长方向 (direction)
        # 茎秆的延伸方向
        # 类型: enum (string)
        # 可选值: up | down
        # 默认值: up
        # 说明:
        #   - up:   向上生长（类似甘蔗）
        #   - down: 向下生长（类似藤蔓/垂根）
        direction: down

    # ======================================================================
    # 实体的资源包定义（可选，用于定义模型/纹理/音效等）
    # ======================================================================

# ============================================================================
# 属性要求 (Property Requirements)
# ============================================================================
# 此行为对应的方块状态 (BlockState) 必须包含以下属性:
#
# | 属性名称 | 属性类型 | 是否必需 | 说明                  |
# |----------|----------|----------|-----------------------|
# | age      | int      | 是       | 当前茎段的生长阶段值  |
#
# 在 blocks/<id>.yml 或通过 CraftEngine 注册方块时需确保:
#   properties:
#     age:
#       type: int
#       min: 0
#       max: <根据 grow_speed 和 max_height 设计>

# ============================================================================
# 完整示例 - 向上生长的灼热甘蔗 (custom:blaze_sugarcane)
# ============================================================================
# blocks:
#   custom:blaze_sugarcane:
#     behaviors:
#       - type: vertical_crop_block
#         max_height: 5            # 最多 5 段
#         grow_speed: 1.5          # 每刻稳定 +1，50% 概率再 +1
#         direction: up            # 向上生长（类似甘蔗）
#       - type: hanging_block
#         stackable: true
#         delay: 1
#     # 此处可添加更多行为，如可替换、亮度、碰撞箱等
#
# ============================================================================
# 完整示例 - 向下生长的幽灵藤蔓 (custom:ghost_vine)
# ============================================================================
# blocks:
#   custom:ghost_vine:
#     properties:
#       age:
#         type: int
#         min: 0
#         max: 3
#     behaviors:
#       - type: vertical_crop_block
#         max_height: 6            # 最多 6 段
#         grow_speed: 0.5          # 每刻 50% 概率 age +1
#         direction: down          # 向下生长（类似藤蔓）
#       - type: light_emission
#         light_level: 8           # 发光等级 8
#
# ============================================================================
# 注意事项
# ============================================================================
# 1. 这是一个随机刻行为 —— 只有方块收到随机刻时才会生长。
#    这意味着需要设置适当的随机刻速度 (random_tick_speed) 才能正常生长。
#
# 2. age 值积累至最大值时，会在顶端延伸出一个新茎段，并将原顶端的
#    age 值重置为最小值（通常为 0）。
#
# 3. 建议配合 stacking 类行为（如 hanging_block）使用，使茎段可堆叠。
#
# 4. 每个茎段各自拥有独立的 age 值，但只有最顶端的 age 会增长。
# ============================================================================
