# Wiki: configuration/block/behaviors/vertical_crop_block.md
# 垂直作物方块 —— 随机刻驱动，沿垂直方向逐段生长（类似甘蔗/海带）

blocks:
  custom:my_vertical_crop:
    properties:
      age:
        type: int
        min: 0
        max: 7
    behaviors:
      - type: vertical_crop_block
        max_height: 4            # << CHANGE THIS 最大段数（默认 3）
        grow_speed: 0.333        # << CHANGE THIS 每随机刻 age 增量，小数部分为额外 +1 概率（默认 1）
        direction: up            # << CHANGE THIS up=向上（甘蔗）/ down=向下（藤蔓）（默认 up）

# ---- 属性要求 ----
# | 属性 | 类型 | 必需 | 说明                             |
# |------|------|------|----------------------------------|
# | age  | int  | 是   | 当前茎段的生长进度              |
#
# 注意：这是一个随机刻行为，方块收到随机刻时才会生长。
# 只有最顶端的茎段会增加 age。当 age 达到最大值时，顶端延伸
# 出新茎段，原顶端 age 重置为最小值（通常为 0）。
