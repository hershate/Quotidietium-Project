# ============================================================================
# 物品展示框方块 (Item Frame Block)
# ============================================================================
# 原版物品展示框的高性能替代方案，用于存储和展示单个物品。
#
# 交互行为:
#   - 右键手持物品 → 放入物品
#   - 空主手右键     → 取出物品
#   - 潜行 + 右键    → 旋转展示物品 (共 8 个方向)
#
# 比较器信号:
#   有物品时输出 rotation + 1 (刚放置未旋转的展示框发出信号 1)
#   空框时输出 0
#
# 特别感谢: 该功能由 SIMMC 服务器赞助 jhqwqmc 开发。
# ============================================================================

# ============================================================================
# blocks 根键
# ============================================================================
# 所有自定义方块的注册入口。每个键代表一种方块 ID，格式为 "命名空间:方块id"。
# ============================================================================
blocks:

  # --------------------------------------------------------------------------
  # 示例方块: 自定义展示框
  # --------------------------------------------------------------------------
  my_namespace:custom_item_frame:
    # ==========================================================================
    # behavior 小节 — 定义方块的逻辑行为
    # ==========================================================================
    behavior:
      # ---------------------------------------------------------------
      # type (必需)
      # ---------------------------------------------------------------
      # 行为类型标识符，固定为 "item_frame_block"。
      type: item_frame_block

      # ---------------------------------------------------------------
      # facing (必需)
      # ---------------------------------------------------------------
      # 展示框的附着方向。可选值:
      #   north, south, east, west, up, down
      # 此属性决定方块的朝向及物品的展示平面。
      facing: north

      # ---------------------------------------------------------------
      # position (可选, 默认: "0,0,0")
      # ---------------------------------------------------------------
      # 展示物品相对于方块中心的位置偏移 (x,y,z)。
      # 可用于微调物品在展示框中的视觉位置。
      # 格式: "offsetX,offsetY,offsetZ"
      position: "0,0,0"

      # ---------------------------------------------------------------
      # glow (可选, 默认: false)
      # ---------------------------------------------------------------
      # 是否使展示物品发光 (发光效果，类似荧光展示框)。
      # 当设置为 true 时，物品会带有发光轮廓。
      glow: false

      # ---------------------------------------------------------------
      # invisible (可选, 默认: false)
      # ---------------------------------------------------------------
      # 是否隐藏展示框的边框。
      # 当设置为 true 时，只显示其中的物品，不显示框体。
      invisible: false

      # ---------------------------------------------------------------
      # render_map_item (可选, 默认: true)
      # ---------------------------------------------------------------
      # 是否启用静态地图渲染功能。
      # 如果展示框中放入的是地图物品，此选项控制是否渲染地图内容。
      # 注意: 开启有少量性能开销，不需要时建议关闭。
      render_map_item: true

      # ---------------------------------------------------------------
      # data_key (可选, 默认: "craftengine:item_frame")
      # ---------------------------------------------------------------
      # 用于持久化存储展示物品数据的 NBT 键名。
      # 只有在需要与其他插件兼容或手动操作 NBT 时才需要修改。
      data_key: "craftengine:item_frame"

      # ---------------------------------------------------------------
      # sounds (可选)
      # ---------------------------------------------------------------
      # 自定义交互音效。省略则使用原版默认音效。
      # 值使用 Minecraft 音效事件的命名空间 ID。
      sounds:
        # 放入物品时播放的音效
        put: "entity.item_frame.add_item"
        # 取出物品时播放的音效
        take: "entity.item_frame.remove_item"
        # 旋转物品时播放的音效
        rotate: "entity.item_frame.rotate_item"

  # ==========================================================================
  # 完整示例: 发光隐形展示框 (用于地图展示)
  # ==========================================================================
  my_namespace:glowing_map_display:
    behavior:
      type: item_frame_block
      facing: up                              # 朝上放置，类似展示台
      position: "0,0.1,0"                     # 略微抬高物品位置
      glow: true                              # 发光效果
      invisible: true                         # 隐藏边框，只显示物品
      render_map_item: true                   # 启用地图渲染
      data_key: "myplugin:map_display_data"   # 自定义 NBT 键
      sounds:
        put: "block.amethyst_block.place"
        take: "block.amethyst_block.break"
        rotate: "ui.loom.take_result"

  # ==========================================================================
  # 完整示例: 普通展示框 (极简配置)
  # ==========================================================================
  my_namespace:simple_frame:
    behavior:
      type: item_frame_block
      facing: north
      # 其余所有选项均使用默认值
