# Wiki: configuration/block/behaviors/item_frame_block.md
# 物品展示框方块行为 - 高性能物品展示/存储方块
# 属性要求:
#   facing (direction) - 必需, 朝向

blocks:
  custom:item_frame_block:                             # << CHANGE THIS: 方块命名空间与ID
    behavior:
      type: item_frame_block
      facing: north                                    # << CHANGE THIS: 朝向 (north/south/east/west/up/down)
      position: 0,0,0                                  # << CHANGE THIS: 展示物品的位置偏移
      glow: false                                      # << CHANGE THIS: 是否发光
      invisible: false                                 # << CHANGE THIS: 是否隐藏展示框边框
      render_map_item: true                            # << CHANGE THIS: 是否启用静态地图渲染
      data_key: "craftengine:item_frame"               # << CHANGE THIS: 持久化数据NBT键
      sounds:                                          # 可选-音效配置
        put: entity.item_frame.add_item                # << CHANGE THIS: 放入时音效
        take: entity.item_frame.remove_item            # << CHANGE THIS: 取出时音效
        rotate: entity.item_frame.rotate_item          # << CHANGE THIS: 旋转时音效
