# Local wiki: CraftEngine Wiki/configuration/block/behaviors/drawer_block.md
blocks:
  custom:drawer_block:
    properties:
      facing: north                    # << CHANGE THIS (可选 direction 属性)
    behavior:
      type: drawer_block
      max_stacks: 20                    # << CHANGE THIS (默认 32)
      has_signal: true                  # << CHANGE THIS (默认 true)
      allow_input: true                 # << CHANGE THIS (默认 true)
      allow_output: true                # << CHANGE THIS (默认 true)
      item_position: 0,0,-0.52          # << CHANGE THIS (默认 0.5,0.5,0.5)
      text_position: 0,-0.4,-0.52       # << CHANGE THIS (默认 0.5,0.5,0.5)
      item_scale: 0.6,0.6,0.6           # << CHANGE THIS (默认 0.5,0.5,0.5)
      text_scale: 0.5,0.5,0.5           # << CHANGE THIS (默认 0.5,0.5,0.5)
      data_key: "custom:drawer"         # << CHANGE THIS (默认 "craftengine:drawer")
      compatible_mode: false            # << CHANGE THIS (默认 false)
      sounds:
        put: "minecraft:block.decorated_pot.insert"       # << CHANGE THIS (可选)
        take: "minecraft:block.decorated_pot.insert_fail"  # << CHANGE THIS (可选)
