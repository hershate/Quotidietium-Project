# ============================================================
#  CraftEngine — 抽屉方块 (Drawer Block) 配置模板
#  样式: Oraxen 风格 · 全注释 · 自定义命名空间
# ============================================================
#
# 抽屉方块是一种存储容器，只能存放一种物品，但能大量存储该物品。
# 它会记住首次存入的物品类型，此后只接受相同物品。
#
# 交互方式:
#   - 右键点击: 放入手中物品
#   - 右键双击 (0.5秒内): 将物品栏中所有相同物品全部放入
#   - 左键点击: 取出一个物品
#   - 潜行 + 左键点击: 取出一组物品
#
# 可选属性:
#   若配置了 `facing` 属性，抽屉可朝向特定方向，
#   以便展示物品模型随朝向旋转。
#
#   | 属性名  | 类型        | 必需 |
#   |---------|-------------|------|
#   | facing  | direction   | 否   |
#
# ============================================================

# ——— blocks 根键 ——————————————————————————————
# 所有方块配置必须位于此键下。
blocks:

  # === 自定义抽屉方块 ==========================================
  # 命名空间格式: <your_namespace>:<block_id>
  # 请将 "your_namespace" 替换为你的实际命名空间
  # 示例: myplugin:precious_drawer, server:drill_drawer, rpg:gem_drawer
  your_namespace:drawer_block:

    # ——— behavior (行为定义) ————————————————
    behavior:

      # ============================================================
      # 类型 (必填)
      # ============================================================
      # 固定值: "drawer_block"
      type: drawer_block

      # ============================================================
      # max_stacks (可选)
      # ============================================================
      # 抽屉最多可容纳的物品组数。
      # 一组 = 64 个物品 (或对应物品的最大堆叠数)。
      # 例如: 20 组 = 最多 1280 个物品 (64 × 20)。
      # 默认值: 32
      # 类型: 正整数
      # max_stacks: 20

      # ============================================================
      # has_signal (可选)
      # ============================================================
      # 是否允许比较器根据容器填充比例输出对应信号。
      # 信号范围: 0 ~ 15，与填充比例成正比。
      #   空 = 0，满 = 15。
      # 设为 false 可关闭比较器信号。
      # 默认值: true
      # 类型: boolean
      # has_signal: true

      # ============================================================
      # allow_input (可选)
      # ============================================================
      # 是否允许漏斗向抽屉放入物品。
      # 设为 false 可禁止漏斗输入，仅允许手动放入。
      # 默认值: true
      # 类型: boolean
      # allow_input: true

      # ============================================================
      # allow_output (可选)
      # ============================================================
      # 是否允许漏斗从抽屉取出物品。
      # 设为 false 可禁止漏斗输出，仅允许手动取出。
      # 默认值: true
      # 类型: boolean
      # allow_output: true

      # ============================================================
      # item_position (可选)
      # ============================================================
      # 抽屉内展示物品的坐标偏移 (相对于方块中心)。
      # 格式: "x,y,z"  浮点数，用半角逗号分隔。
      # 默认值: "0.5,0.5,0.5"
      # 常用值:
      #   "0,0,-0.52"   — 面朝玩家的方向 (适合墙面抽屉)
      #   "0.5,0.5,0.5" — 方块中心
      # 类型: string (逗号分隔的三元组)
      # item_position: 0,0,-0.52

      # ============================================================
      # text_position (可选)
      # ============================================================
      # 抽屉内数量文本的坐标偏移 (相对于方块中心)。
      # 格式: "x,y,z"  浮点数，用半角逗号分隔。
      # 默认值: "0.5,0.5,0.5"
      # 常用值:
      #   "0,-0.4,-0.52" — 物品下方 (适合墙面抽屉)
      #   "0.5,0.5,0.5"  — 方块中心
      # 类型: string (逗号分隔的三元组)
      # text_position: 0,-0.4,-0.52

      # ============================================================
      # item_scale (可选)
      # ============================================================
      # 展示物品的缩放比例。
      # 格式: "scaleX,scaleY,scaleZ"  浮点数，用半角逗号分隔。
      # 默认值: "0.5,0.5,0.5"
      # 常用值:
      #   "0.6,0.6,0.6" — 略大 (适合展示物品细节)
      #   "1.0,1.0,1.0" — 原大小
      # 类型: string (逗号分隔的三元组)
      # item_scale: 0.6,0.6,0.6

      # ============================================================
      # text_scale (可选)
      # ============================================================
      # 数量文本的缩放比例。
      # 格式: "scaleX,scaleY,scaleZ"  浮点数，用半角逗号分隔。
      # 默认值: "0.5,0.5,0.5"
      # 类型: string (逗号分隔的三元组)
      # text_scale: 0.5,0.5,0.5

      # ============================================================
      # data_key (可选)
      # ============================================================
      # 持久化抽屉数据 (存储的物品类型、数量等) 的 NBT 键。
      # 不同抽屉方块应使用不同的 data_key 以避免数据冲突。
      # 默认值: "craftengine:drawer"
      # 类型: string (NBT 路径)
      # data_key: "craftengine:drawer"

      # ============================================================
      # compatible_mode (可选)
      # ============================================================
      # 与其他存储插件的兼容模式。
      # 启用后可能改变抽屉的数据存储方式以兼容其他插件。
      # 仅在遇到兼容性问题时启用。
      # 默认值: false
      # 类型: boolean
      # compatible_mode: false

      # ============================================================
      # sounds (可选)
      # ============================================================
      # 抽屉交互音效配置。
      # 未配置时使用默认音效或不播放音效。
      sounds:

        # --- put (放入音效) ---
        # 右键放入物品时播放的音效。
        # 格式: <命名空间>:<音效ID>
        # 使用 Minecraft 原版音效或资源包自定义音效。
        # 可选，不配置则无放入音效。
        # put: "minecraft:block.decorated_pot.insert"

        # --- take (取出音效) ---
        # 左键取出物品时播放的音效。
        # 格式: <命名空间>:<音效ID>
        # 可选，不配置则无取出音效。
        # take: "minecraft:block.decorated_pot.insert_fail"

      # ============================================================
      # 属性配置 (可选)
      # ============================================================
      # 若需要朝向功能，添加 facing 属性到方块的 properties 中。
      # 注意: properties 定义在 behavior 之外 (同级于 behavior)。
      # 此处在注释中展示，实际使用时需取消注释并放在 behavior 同级。

    # 属性示例 (取消注释后放在 behavior 同级):
    # properties:
    #   facing:
    #     type: direction
    #     default: north


# ============================================================
# 完整示例 (可直接使用)
# ============================================================
# blocks:
#   myplugin:metal_drawer:
#     properties:
#       facing:
#         type: direction
#         default: north
#     behavior:
#       type: drawer_block
#       max_stacks: 64
#       has_signal: true
#       allow_input: true
#       allow_output: true
#       item_position: "0,0,-0.52"
#       text_position: "0,-0.4,-0.52"
#       item_scale: "0.6,0.6,0.6"
#       text_scale: "0.5,0.5,0.5"
#       data_key: "myplugin:metal_drawer_data"
#       compatible_mode: false
#       sounds:
#         put: "minecraft:block.decorated_pot.insert"
#         take: "minecraft:block.decorated_pot.insert_fail"
