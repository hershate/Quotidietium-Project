# 可堆叠方块 (stackable_block)
# Wiki: configuration/block/behaviors/stackable_block.md
# 允许使用指定物品对方块进行堆叠（类似海泡菜或蜡烛）

blocks:
  custom:example_block:
    behavior:
      type: stackable_block
      property: amount          # << CHANGE THIS: 记录堆叠数量的 int 属性名（默认 "amount"）
      items:                    # << CHANGE THIS: 可用于增加堆叠的物品（必需）
        - custom:example_item

    # 属性要求：必须定义一个 int 属性，名称与 behavior.property 一致
    properties:
      custom:
        amount:                 # 属性名需与 behavior.property 相同
          type: int
          min: 0                # << CHANGE THIS: 堆叠最小值
          max: 3                # << CHANGE THIS: 最大堆叠数（决定视觉状态等级数）
          default: 0            # << CHANGE THIS: 首次放置时的默认值
