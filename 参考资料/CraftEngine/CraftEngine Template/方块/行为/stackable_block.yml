# ============================================================================
# 可堆叠方块 (Stackable Block) - 行为配置模板
# 参考: CraftEngine Wiki - configuration/block/behaviors/stackable_block.md
# 行为类型: stackable_block
# 描述: 允许使用指定物品对已有方块进行堆叠（类似海泡菜或蜡烛）。
#        使用 items 列表中配置的物品对方块放置时，会递增指定 int 属性
#        的值，直到达到该属性的最大值。不同的属性值可用于切换不同的
#        视觉状态（通过 BlockModel 或 BlockState 变种实现）。
# ============================================================================

# ============================================================
# 根键: blocks
# 说明: 所有自定义方块定义均在此根键下声明。
#       每个方块由其命名空间 ID 唯一标识。
# ============================================================
blocks:

  # ----------------------------------------------------------
  # 方块定义: <namespace>:<block_id>
  # 命名空间建议: 使用你的项目/插件名称作为命名空间，避免冲突。
  # 例如: custom:stackable_candle, myplugin:pebble_pile
  # ----------------------------------------------------------
  custom:stackable_candle:

    # ----------------------------------------------------------
    # behavior - 行为配置
    # 定义方块的核心行为逻辑。
    # ----------------------------------------------------------
    behavior:

      # type: string [必需]
      # 行为类型，必须设置为 "stackable_block"。
      type: stackable_block

      # property: string [可选，默认值: "amount"]
      # 用于记录堆叠数量的 int 属性名称。
      # 该属性的取值范围决定了可用的堆叠等级数量。
      # 属性必须在方块的 properties 中定义，并设置合理的 min 和 max。
      # 每次使用 items 中的物品对方块放置时，该属性值递增 1。
      # 达到属性的 max 值后，无法继续堆叠。
      property: stack_amount

      # items: List<string> [必需]
      # 可用于增加堆叠的物品列表。列表中任意物品对方块使用/放置时，
      # 都会触发堆叠操作（递增 property 的值）。
      # 格式: "<namespace>:<item_id>"
      # 若物品数量不足 1 个（持有 0 个），堆叠将被跳过。
      items:
        - custom:candle_item       # 堆叠物品1
        - custom:candle_bundle     # 堆叠物品2（可选）

    # ----------------------------------------------------------
    # properties - 方块的属性定义 [推荐: 与 behavior 配合使用]
    # stackable_block 行为依赖一个 int 属性来跟踪堆叠数量。
    # 通常还需要其他属性（如变种选择属性）来驱动视觉状态。
    # ----------------------------------------------------------
    properties:
      # stack_amount - 堆叠计数属性，与 behavior.property 对应
      stack_amount:
        type: int
        min: 1                    # 最小堆叠数（通常为 1）
        max: 4                    # 最大堆叠数（决定视觉等级数量）
        default: 1                # 首次放置时的默认值

    # ----------------------------------------------------------
    # block_model - 方块模型配置 [可选，推荐用于不同堆叠等级的视觉表现]
    # 可根据属性值选择不同的模型变种，实现视觉堆叠效果。
    # ----------------------------------------------------------
    block_model:
      # materials 定义各方向材质
      materials:
        all: custom:block/candle

      # variants 根据属性值选择不同模型
      variants:
        - key: stack_amount       # 依赖的属性名
          mapping:                # 属性值 -> 模型文件映射
            1: custom:block/candle_1  # 单层模型
            2: custom:block/candle_2  # 两层堆叠模型
            3: custom:block/candle_3  # 三层堆叠模型
            4: custom:block/candle_4  # 四层堆叠模型（满堆叠）

    # ----------------------------------------------------------
    # display - 显示配置 [可选]
    # ----------------------------------------------------------
    display:
      display_name: "堆叠蜡烛"    # 方块显示名称
      lore:                       # 方块 Lore 描述
        - "最多可堆叠 4 层"
        - "右击使用对应物品增加堆叠层数"

# ============================================================================
# 完整示例 - 鹅卵石堆叠 (对应 Wiki 官方示例的完整版本)
# ============================================================================
# blocks:
#   custom:pebble:
#     behavior:
#       type: stackable_block          # 行为类型
#       property: pebble_count         # 堆叠计数属性名
#       items:                         # 堆叠物品列表
#         - custom:pebble_item
#
#     properties:
#       pebble_count:
#         type: int
#         min: 1
#         max: 4
#         default: 1
#
#     block_model:
#       materials:
#         all: custom:block/pebble
#       variants:
#         - key: pebble_count
#           mapping:
#             1: custom:block/pebble_1
#             2: custom:block/pebble_2
#             3: custom:block/pebble_3
#             4: custom:block/pebble_4
#
#     display:
#       display_name: "小鹅卵石堆"
#       lore:
#         - "一堆松散的鹅卵石"
#         - "§7右击放入更多鹅卵石以堆叠"
# ============================================================================

# ============================================================================
# 配置参数总结:
# ----------------------------------------------------------------------------
# | 配置路径             | 类型     | 必需 | 默认值   | 说明                 |
# |----------------------|----------|------|----------|----------------------|
# | behavior.type        | string   | 是   | -        | 固定值: stackable    |
# | behavior.property    | string   | 否   | "amount" | 堆叠计数的 int 属性名|
# | behavior.items       | string[] | 是   | -        | 可堆叠物品 ID 列表  |
# ----------------------------------------------------------------------------
# 属性约束:
# - property 指定的属性必须为 int 类型
# - 属性值递增 1 直到达到 max 值
# - min 通常设为 1（至少 1 层才存在方块）
# - 属性的 max 值决定了可堆叠的最大层数
# ============================================================================
