# ============================================================================
# CraftEngine 树叶方块 (leaves_block) 行为配置模板
# ============================================================================
# 树叶方块会在 PP 更新中计算其到最近原木的距离并作为 distance 的值。
# 原木距离为 0，直接相邻的树叶为 1，以此类推。达到最大距离的树叶会
# 在接收到随机刻时枯萎并掉落物品。
#
# 命名空间说明：
#   使用自定义命名空间（如 custom:）而非 default:，以避免覆盖原版方块。
#   建议格式：<命名空间>:<方块ID>
# ============================================================================

# ============================================================================
# blocks 根节点
# ============================================================================
# 所有方块配置的根键，下级每一项代表一种方块定义。
blocks:

  # ==========================================================================
  # 方块定义：custom:palm_leaves
  # ==========================================================================
  # 使用 custom 命名空间定义棕榈树叶方块。
  # 格式：<命名空间>:<方块ID>
  #   - 命名空间建议使用项目/插件简称（如 quest, boss, custom）
  #   - 方块ID 使用小写蛇形命名（如 palm_leaves, cherry_leaves）
  # ==========================================================================
  custom:palm_leaves:

    # ========================================================================
    # behavior 节点
    # ========================================================================
    # 方块的类型行为定义，决定方块在游戏中的核心逻辑。
    behavior:

      # behavior.type - 行为类型（必需）
      # 固定值：leaves_block
      # 表示此方块使用树叶行为逻辑。
      type: leaves_block

      # ======================================================================
      # 属性 (properties)
      # ======================================================================
      # 树叶方块的专属属性配置，定义在 properties 节点下。
      properties:

        # ------------------------------------------------------------------
        # distance - 距离属性（必需，int）
        # ------------------------------------------------------------------
        # 定义树叶到最近原木的距离值。
        #
        # 配置项：
        #   range: 距离范围，格式 "最小值~最大值"
        #         达到最大值时，树叶会在随机刻时枯萎。
        #         原版树叶最大距离为 7。
        #         对于较大的树木（如高大棕榈树），建议设高一些。
        #
        # 可选值示例：
        #   "1~7"   - 原版风格，距离原木 7 格以上枯萎
        #   "1~10"  - 大型树木，允许更远距离
        #   "0~4"   - 小型灌木，较近距离即枯萎
        # ------------------------------------------------------------------
        distance:
          range: "1~7"

        # ------------------------------------------------------------------
        # persistent - 持久性（必需，boolean）
        # ------------------------------------------------------------------
        # 控制树叶是否参与距离计算。
        #   true  - 树叶不参与距离计算，无论距离多远都不会枯萎。
        #          适用于装饰性树叶或人为放置的树叶。
        #   false - 树叶正常参与距离计算，超过最大距离会枯萎。
        #          适用于自然生成的树叶。
        # ------------------------------------------------------------------
        persistent: false

        # ------------------------------------------------------------------
        # waterlogged - 含水状态（可选，boolean）
        # ------------------------------------------------------------------
        # 控制树叶方块是否可以被水浸泡。
        # 不配置或省略此属性时，默认为 false。
        #   true  - 树叶可以含水，水中放置的树叶会有水的视觉效果
        #          和碰撞行为。
        #   false - 树叶不可含水。
        # ------------------------------------------------------------------
        waterlogged: false

  # ==========================================================================
  # 完整示例：大型棕榈树树叶
  # ==========================================================================
  # 展示所有配置项的实际用法。
  # 适用于大型树木（如热带棕榈树），distance range 设得较高，
  # persistent 设为 true 防止枯萎，允许含水。
  # ==========================================================================
  custom:tropical_palm_leaves:
    behavior:
      type: leaves_block
      properties:
        distance:
          range: "1~14"
        persistent: true
        waterlogged: true

  # ==========================================================================
  # 完整示例：原版风格橡树树叶
  # ==========================================================================
  # 模拟原版橡树树叶行为。
  # distance 使用原版默认值 1~7，persistent 为 false（自然枯萎），
  # waterlogged 为 true（允许含水）。
  # ==========================================================================
  custom:oak_leaves:
    behavior:
      type: leaves_block
      properties:
        distance:
          range: "1~7"
        persistent: false
        waterlogged: true

  # ==========================================================================
  # 完整示例：装饰性常青树叶（永不枯萎）
  # ==========================================================================
  # 适用于人造景观或装饰性树木。
  # persistent 设为 true 确保树叶永不枯萎，
  # waterlogged 设为 false 防止意外含水。
  # ==========================================================================
  custom:evergreen_leaves:
    behavior:
      type: leaves_block
      properties:
        distance:
          range: "1~7"
        persistent: true
        waterlogged: false

# ============================================================================
# 配置要点总结
# ============================================================================
# 必需配置：
#   blocks.<方块ID>.behavior.type = "leaves_block"
#   blocks.<方块ID>.behavior.properties.distance.range  (int, 如 "1~7")
#   blocks.<方块ID>.behavior.properties.persistent      (boolean)
#
# 可选配置：
#   blocks.<方块ID>.behavior.properties.waterlogged     (boolean)
#
# 属性约束：
#   - distance.range 的最小值建议为 1，最大值建议 1~14（原版最高 7）
#   - persistent 是保护性开关，装饰性树叶建议设为 true
#   - waterlogged 省略时默认为 false
# ============================================================================
