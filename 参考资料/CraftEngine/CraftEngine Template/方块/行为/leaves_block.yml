# Source: CraftEngine Wiki/configuration/block/behaviors/leaves_block.md
# 树叶方块 - 在 PP 更新中计算到最近原木的距离，达到 range 最大值时枯萎掉落
blocks:
  custom:my_leaves:                              # << CHANGE THIS: block ID
    states:
      properties:
        distance:
          type: int
          range: 1~7                             # << CHANGE THIS: max distance before withering (vanilla default 7)
          default: 7
        persistent:
          type: boolean
          default: false                         # << CHANGE THIS: true = never wither, skip distance calculation
        waterlogged:                             # optional property, remove if not needed
          type: boolean
          default: false                         # << CHANGE THIS: whether the block can be waterlogged
    behavior:
      type: leaves_block
