# Source: CraftEngine Wiki/configuration/block/behaviors/seat_block.md
# 座椅方块 (seat_block) - 玩家右键方块坐在上面

blocks:
  custom:my_seat: # << CHANGE THIS: 替换为你的方块ID
    behavior:
      type: seat_block
      seats:
        # 格式: "x,y,z [角度]"  - 角度可选，省略则玩家可自由旋转
        - 0.5,0.6,0.5 0 # << CHANGE THIS: 座位相对偏移与锁定角度
    # properties:
    #   facing: north   # << CHANGE THIS: 可选 (north/east/south/west)
    #                   # 配置后方块朝向变化时座位坐标自动旋转
