# ============================================================
# 座椅方块 (Seat Block) — 行为配置模板
# ============================================================
# 功能      : 玩家右键点击方块时坐在上面
# 方块实体  : 是
# 配置文件  : block/behaviors/seat_block
# 源文档    : CraftEngine Wiki - configuration/block/behaviors/seat_block.md
# 风格      : Oraxen 风格（全注释 + 示例）
# 命名空间  : 请将 your_namespace 替换为实际命名空间
# ============================================================

blocks:
  # ============================================================
  # 【必填】方块 ID，格式 <命名空间>:<id>
  # 示例：your_namespace:oak_chair
  # ============================================================
  your_namespace:your_seat_block:

    # ============================================================
    # 【可选】方块在游戏内显示的本地化名称
    # 支持 & 颜色代码（&f = 白色，&6 = 金色，&c = 红色等）
    # ============================================================
    display_name: "&f座椅"

    # ============================================================
    # 【可选】方块属性 (properties)
    # seat_block 目前支持以下属性：
    # ============================================================
    #   facing
    #   ------
    #   类型     : horizontal_direction
    #   必需     : 否
    #   支持值   : north / east / south / west
    #   作用     : 当配置了该属性时，系统会根据方块的
    #              实际朝向自动计算座位的相对位置，使座位
    #              随方块朝向旋转。seats 中的坐标基于
    #              "默认朝向"定义，系统自动适配所有方向。
    #              适合沙发、长椅等需要改变放置方向的道具。
    # ============================================================
    # properties:
    #   facing: north

    # ============================================================
    # 【必填】行为 (behavior) 配置块
    # ============================================================
    behavior:

      # ============================================================
      # 【必填】行为类型 — 必须为 "seat_block"
      # ============================================================
      type: seat_block

      # ============================================================
      # 【必填】座位列表 (seats)
      # 定义玩家坐下时的位置与旋转限制。
      # 可以配置多个座位以实现双人沙发、长凳等效果。
      # -----------------------------------------
      # 格式 : "x,y,z [yaw角度]"
      #   x     — 相对方块原点的 X 轴偏移（浮点数，方块为单位）
      #   y     — 相对方块原点的 Y 轴偏移（浮点数，方块为单位）
      #   z     — 相对方块原点的 Z 轴偏移（浮点数，方块为单位）
      #   yaw   — 【可选】水平旋转限制（偏航角，0~360°）
      #           设置后玩家身体被锁定在该角度，无法左右转头
      #           省略该值时玩家可以自由旋转视角
      # -----------------------------------------
      # 坐标系: 原点为方块西北下角，(东+, 上+, 南+)
      #         通常 0.5,1.0,0.5 表示方块正中心上方 1 格高处
      #         即玩家臀部位置
      # ============================================================
      seats:
        # 示例 1: 方块中心上方，自由旋转（无 yaw）
        # - 0.5,1.0,0.5

        # 示例 2: 方块中心上方，锁定朝向南（z 正方向）
        #         玩家坐在上面时身体始终面向 z 轴正方向
        # - 0.5,1.0,0.5 0

        # 示例 3: 双人沙发的两个座位
        # - 0.25,1.0,0.5
        # - 0.75,1.0,0.5

# ============================================================
# 完整示例 1 — 单人办公椅（无朝向，自由旋转）
# ============================================================
# blocks:
#   your_namespace:office_chair:
#     display_name: "&7办公椅"
#     behavior:
#       type: seat_block
#       seats:
#         - 0.5,0.6,0.5

# ============================================================
# 完整示例 2 — 双人沙发（有朝向属性，座位随方向旋转）
# ============================================================
# blocks:
#   your_namespace:double_sofa:
#     display_name: "&6双人沙发"
#     properties:
#       facing: north
#     behavior:
#       type: seat_block
#       seats:
#         - 0.3,0.9,0.5
#         - 0.7,0.9,0.5

# ============================================================
# 完整示例 3 — 长椅（长条形，4 座位，锁定朝向）
# ============================================================
# blocks:
#   your_namespace:bench:
#     display_name: "&f公园长椅"
#     properties:
#       facing: north
#     behavior:
#       type: seat_block
#       seats:
#         - 0.2,0.7,0.5 0
#         - 0.4,0.7,0.5 0
#         - 0.6,0.7,0.5 0
#         - 0.8,0.7,0.5 0

# ============================================================
# 配置要求速查表
# ============================================================
# | 路径                             | 必需 | 类型                   | 说明                   |
# |----------------------------------|------|------------------------|------------------------|
# | blocks.<id>                      | 是   | section                | 方块定义根节点          |
# | blocks.<id>.behavior             | 是   | section                | 行为配置块              |
# | blocks.<id>.behavior.type        | 是   | string                 | 固定为 "seat_block"     |
# | blocks.<id>.behavior.seats      | 是   | list[string]           | 座位列表，至少一项      |
# | blocks.<id>.properties.facing    | 否   | horizontal_direction   | 方块朝向属性            |
# | blocks.<id>.display_name        | 否   | string                 | 显示名称（支持 & 颜色） |
# ============================================================
