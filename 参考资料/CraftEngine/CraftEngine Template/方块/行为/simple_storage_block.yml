# ============================================================================
# 简单存储方块 (Simple Storage Block) - Oraxen 风格配置模板
# ============================================================================
# 类似箱子的容器方块实体，支持自定义行数、红石比较器信号、
# 漏斗输入/输出控制，以及开关音效。
# 右键打开 GUI 界面以存取物品。
# ============================================================================

# === blocks 根键 ===
# 在此注册所有自定义方块。
blocks:

  # ------------------- 自定义方块示例 -------------------
  # <命名空间>:<方块标识>  例如 myquest:secure_storage
  myquest:secure_storage:

    # ------------------- 行为 (behavior) -------------------
    # 定义方块的核心交互逻辑。
    behavior:
      # --- 行为类型 ---
      # 必填。固定为 simple_storage_block。
      type: simple_storage_block

      # --- 容器标题 (title) ---
      # 可选。容器 GUI 顶部显示的标题。
      # 支持 MiniMessage 格式 (HTML-like color, gradient, 等)。
      # 默认值: "<lang:container.chest>" (即原版"箱子"本地化文本)
      # 示例: "<bold><gradient:gold:yellow>保险柜</gradient></bold>"
      title: "保险柜"

      # --- 容器行数 (rows) ---
      # 可选。容器的 GUI 行数，取值范围 1 ~ 6。
      # 默认值: 1
      rows: 6

      # --- 红石比较器信号 (has_signal) ---
      # 可选。是否根据容器填充比例输出 0~15 的红石比较器信号。
      # 默认值: true
      has_signal: true

      # --- 允许放入物品 (allow_input) ---
      # 可选。是否允许漏斗等外部容器向本方块放入物品。
      # 默认值: true
      allow_input: true

      # --- 允许取出物品 (allow_output) ---
      # 可选。是否允许漏斗等外部容器从本方块取出物品。
      # 默认值: true
      allow_output: true

      # --- 方块状态: 开/关 (open) ---
      # 可选 (boolean)。用于反映容器当前的开关状态。
      # 适合在方块模型中根据此属性切换打开/关闭的视觉效果。
      # 注意: 此属性通常由方块实体运行时维护，也可在配置中硬编码初始状态。
      # open: false

      # --- 数据持久化键 (data_key) ---
      # 可选。容器内物品数据在 NBT 中持久化的键名。
      # 默认值: "craftengine:simple_storage"
      # 如需与其他插件区分存储数据，可改为自定义键名。
      data_key: "myquest:secure_storage_data"

      # ------------------- 音效配置 (sounds) -------------------
      # 可选。容器打开和关闭时播放的音效。
      sounds:

        # --- 打开音效 (open) ---
        # 可选。玩家打开容器 GUI 时播放的音效。
        # 值格式: minecraft:<音效名称>
        # 参考: https://minecraft.wiki/w/Sounds.json#Sound_events
        open: minecraft:block.iron_trapdoor.open

        # --- 关闭音效 (close) ---
        # 可选。玩家关闭容器 GUI 时播放的音效。
        close: minecraft:block.iron_trapdoor.close

  # ==========================================================================
  # 附加示例: 极简配置 (仅使用默认值)
  # ==========================================================================
  myquest:tiny_pouch:
    behavior:
      type: simple_storage_block
      # 仅设置标题，其余全部使用默认值:
      #   rows: 1
      #   has_signal: true
      #   allow_input: true
      #   allow_output: true
      #   data_key: "craftengine:simple_storage"
      title: "小袋子"

  # ==========================================================================
  # 附加示例: 禁止外部访问的只读展示柜
  # ==========================================================================
  myquest:display_case:
    behavior:
      type: simple_storage_block
      title: "<italic><gray>展示柜</gray></italic>"
      rows: 3
      has_signal: false            # 不产生红石信号
      allow_input: false           # 不允许漏斗放入
      allow_output: false          # 不允许漏斗取出
      # open: true                 # 默认打开状态
      data_key: "myquest:display_case_inv"
      sounds:
        open: minecraft:block.glass.place
        close: minecraft:block.glass.break

# ============================================================================
# 参数速查表
# ============================================================================
# | 属性          | 类型      | 必需 | 默认值                        | 说明                                   |
# |---------------|-----------|------|-------------------------------|----------------------------------------|
# | type          | string    | 是   | -                             | 固定为 simple_storage_block            |
# | title         | string    | 否   | "<lang:container.chest>"      | 容器标题, 支持 MiniMessage             |
# | rows          | int       | 否   | 1                             | GUI 行数, 1~6                          |
# | has_signal    | boolean   | 否   | true                          | 是否输出比较器信号                     |
# | allow_input   | boolean   | 否   | true                          | 允许外部容器放入物品                   |
# | allow_output  | boolean   | 否   | true                          | 允许外部容器取出物品                   |
# | open          | boolean   | 否   | -                             | 方块开/关状态 (用于模型切换)            |
# | data_key      | string    | 否   | "craftengine:simple_storage"  | NBT 持久化键名                         |
# | sounds.open   | string    | 否   | -                             | 打开音效 (命名空间ID)                  |
# | sounds.close  | string    | 否   | -                             | 关闭音效 (命名空间ID)                  |
# ============================================================================
