# Wiki: configuration/block/behaviors/simple_storage_block.md
# 简单存储方块 —— 类似箱子的容器，支持自定义行数、比较器信号、物品输入/输出控制

blocks:
  custom:my_safe_block:
    behavior:
      type: simple_storage_block
      title: "我的保险柜"                          # << CHANGE THIS 容器标题，支持 MiniMessage 格式（默认 "<lang:container.chest>"）
      rows: 3                                      # << CHANGE THIS 行数，1~6（默认 1）
      has_signal: true                             # 根据填充比例输出比较器信号 0–15（默认 true）
      allow_input: true                            # 允许放入物品（默认 true）
      allow_output: true                           # 允许取出物品（默认 true）
      data_key: "custom:simple_storage"            # << CHANGE THIS 持久化数据的 NBT 键（默认 "craftengine:simple_storage"）
      sounds:
        open: minecraft:block.iron_trapdoor.open   # << CHANGE THIS 容器打开时播放的音效（可选）
        close: minecraft:block.iron_trapdoor.close # << CHANGE THIS 容器关闭时播放的音效（可选）
    properties:
      open: false                                  # << CHANGE THIS 反映容器开关状态，用于方块模型视觉切换（可选，boolean）
