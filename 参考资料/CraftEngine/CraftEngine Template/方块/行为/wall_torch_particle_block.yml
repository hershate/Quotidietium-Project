# CraftEngine Wiki: configuration/block/behaviors/wall_torch_particle_block.md
# 墙上火把粒子方块 - 按固定间隔生成粒子效果，类似原版墙上的火把
# 方块实体，必须提供 facing 属性

blocks:
  custom:example_wall_torch:                                       # << CHANGE THIS block ID
    facing: north                                                   # << CHANGE THIS required; direction: north/south/east/west
    behavior:
      type: wall_torch_particle_block
      tick_interval: 10                                             # << CHANGE THIS 粒子生成间隔，单位：刻（默认 10）
      particles:
        - particle: minecraft:smoke                                 # << CHANGE THIS 粒子类型（必填）
          x: 0.5                                                    # << CHANGE THIS 生成 x 相对坐标（可选，默认 0）
          y: 0.7                                                    # << CHANGE THIS 生成 y 相对坐标（可选，默认 0）
          z: 0.5                                                    # << CHANGE THIS 生成 z 相对坐标（可选，默认 0）
          count: 1                                                  # << CHANGE THIS 每次生成数量（可选，默认 1）
          offset_x: 0                                               # << CHANGE THIS x 方向随机扩散（可选，默认 0）
          offset_y: 0                                               # << CHANGE THIS y 方向随机扩散（可选，默认 0）
          offset_z: 0                                               # << CHANGE THIS z 方向随机扩散（可选，默认 0）
          speed: 0                                                  # << CHANGE THIS 粒子速度（可选，默认 0）

          # --- 以下参数仅在特定粒子类型下生效 ---

          # 粒子类型 item 时使用
          item: custom:chinese_lantern                              # << CHANGE THIS

          # 粒子类型 block / block_marker / falling_dust / dust_pillar / block_crumble 时使用
          block_state: custom:plam_log[axis=y]                      # << CHANGE THIS

          # 粒子类型 sculk_charge 时使用
          charge: 1.5                                               # << CHANGE THIS

          # 粒子类型 shriek 时使用
          shriek: 1                                                 # << CHANGE THIS

          # 粒子类型 dust 时使用
          color: 255,255,255                                        # << CHANGE THIS
          scale: 1.0                                                # << CHANGE THIS

          # 粒子类型 dust_color_transition 时使用
          from: 255,255,255                                         # << CHANGE THIS
          to: 0,0,0                                                 # << CHANGE THIS
          scale: 4.0                                                # << CHANGE THIS

          # 粒子类型 vibration 时使用
          target_x: 0                                               # << CHANGE THIS
          target_y: 1                                               # << CHANGE THIS
          target_z: 0                                               # << CHANGE THIS
          arrival_time: 10                                          # << CHANGE THIS

          # 粒子类型 trail 时使用
          target_x: 0                                               # << CHANGE THIS
          target_y: 1                                               # << CHANGE THIS
          target_z: 0                                               # << CHANGE THIS
          duration: 10                                              # << CHANGE THIS
