# =============================================================================
# CraftEngine 扩散方块 (spreading_block) 配置模板
# =============================================================================
#
# 概述:
#   扩散方块会在收到随机刻后尝试向周围扩散。
#   每次扩散尝试会在当前位置周围的随机区域 (X/Z ±1 格, Y -3 ~ +1 格) 中
#   随机选择一个位置，若该位置的方块类型与 target_block 相同，则将其替换为自身。
#
#   这是 随机刻 行为——只有方块收到随机刻时才会尝试扩散。
#   原版随机刻速度由 gamerule randomTickSpeed 控制 (默认 3)。
#   提高 randomTickSpeed 可加速扩散，降低可减缓。
#
# 行为类型: spreading_block
#
# 兼容版本:
#   - CraftEngine 26.1+
#
# 命名空间约定:
#   所有示例使用 custom: 命名空间，实际使用时替换为你的项目命名空间。
#   纹理路径使用 custom:block/custom/ 前缀。
#
# 参考资料:
#   CraftEngine Wiki/configuration/block/behaviors/spreading_block.md
# =============================================================================


# =============================================================================
# 模板: 通用方块设置
# 用途: 提供基础的硬度、抗性、音效、挖掘工具等通用属性
# =============================================================================
templates:

  # --- 通用石块级方块设置 (镐挖掘) ---
  custom:template/block_settings_stone:
    settings:
      hardness: 1.5
      resistance: 6.0
      is_suffocating: true
      is_redstone_conductor: true
      instrument: basedrum
      map_color: 11
      sounds:
        break: minecraft:block.stone.break
        step: minecraft:block.stone.step
        place: minecraft:block.stone.place
        hit: minecraft:block.stone.hit
        fall: minecraft:block.stone.fall
      correct_tools:
        - minecraft:wooden_pickaxe
        - minecraft:stone_pickaxe
        - minecraft:iron_pickaxe
        - minecraft:golden_pickaxe
        - minecraft:diamond_pickaxe
        - minecraft:netherite_pickaxe
      tags:
        - minecraft:mineable/pickaxe

  # --- 通用泥土级方块设置 (锹挖掘) ---
  custom:template/block_settings_dirt:
    settings:
      hardness: 0.5
      resistance: 0.5
      is_suffocating: true
      is_redstone_conductor: true
      instrument: basedrum
      map_color: 10
      sounds:
        break: minecraft:block.grass.break
        step: minecraft:block.grass.step
        place: minecraft:block.grass.place
        hit: minecraft:block.grass.hit
        fall: minecraft:block.grass.fall
      correct_tools:
        - minecraft:wooden_shovel
        - minecraft:stone_shovel
        - minecraft:iron_shovel
        - minecraft:golden_shovel
        - minecraft:diamond_shovel
        - minecraft:netherite_shovel
      tags:
        - minecraft:mineable/shovel

  # --- 通用方块物品绑定 (用于物品侧, 让物品可放置方块) ---
  custom:template/block_item_binding:
    behavior:
      type: block_item
      block: "${block_id}"


# =============================================================================
# 方块配置
# =============================================================================
blocks:

  # ===========================================================================
  # 示例 1: 基础扩散方块 — 腐化之石
  # ===========================================================================
  #
  # 说明:
  #   经典的"腐化/感染"型方块。收到随机刻时，若周围 X/Z ±1、Y -3 ~ +1
  #   范围内存在原版石头 (minecraft:stone)，则将其替换为自身。
  #   经过足够的时间，整个石质地层将被逐步感染。
  #
  # 行为参数:
  #   target_block  [必需] — 可被转化的目标方块 ID。
  #     只有与该 ID 完全匹配的方块才会被替换。
  #     若要使多种方块可被转化，可使用 events 监听 replace 事件或
  #     配置多个不同 target_block 的扩散方块形成"感染链"。
  #
  # 设计思路:
  #   - target_block 设为 minecraft:stone → 感染地下石层
  #   - 配合 grass_block 行为 → 骨粉催生地物
  #   - 配合 decay_block 行为 → 感染后缓慢衰变为其他方块 (污染消退)
  # ===========================================================================
  custom:corruption_stone:

    # ---- 方块状态 ----
    # 单状态方块：使用 state 而非 states
    state:
      # auto_state: solid 让插件从音符盒/蘑菇方块组中分配一个空闲视觉状态
      auto_state: solid

      # 模型：单张纹理自动推断为 cube_all 全立方体贴图模型
      model:
        texture: "custom:block/custom/corruption_stone"

    # ---- 方块设置 ----
    settings:
      # 使用模板继承基础设置
      template:
        - custom:template/block_settings_stone

      # 方块物品绑定 (鼠标中键选取)
      item: custom:corruption_stone

      # 发光等级 (可选) — 感染方块发出微弱紫光
      luminance: 3

      # 光照遮挡 (可选) — 可阻挡光线传播
      can_occlude: true

    # ---- 方块行为 ----
    # 扩散行为：在随机刻中将周围石头替换为自身
    behavior:
      type: spreading_block
      target_block: minecraft:stone               # 可被转化的目标方块（必需）

    # ---- 战利品表 (可选) ----
    # 破坏后掉落自身
    loot:
      type: generic
      entries:
        - item: custom:corruption_stone


  # ===========================================================================
  # 示例 2: 感染链 — 三级扩散体系
  # ===========================================================================
  #
  # 说明:
  #   通过三个不同 target_block 的扩散方块形成"感染链"：
  #     苔石 → 腐化石 → 深渊石
  #   实现逐步转化的效果：石头先变为苔石，苔石再变为腐化石，
  #   腐化石最后变为深渊石。每一级的扩散范围相同 (X/Z ±1, Y -3 ~ +1)。
  #
  # 使用场景:
  #   地牢/废墟/深渊生物群系中随时间扩散的"深渊侵蚀"效果。
  # ===========================================================================

  # ---- 阶段 1: 苔石 (感染初期) ----
  custom:mossy_infection:
    state:
      auto_state: solid
      model:
        texture: "custom:block/custom/mossy_infection"

    settings:
      template:
        - custom:template/block_settings_stone
      item: custom:mossy_infection
      luminance: 1                                 # 微弱发光

    behavior:
      type: spreading_block
      target_block: minecraft:stone                # 将原版石头转化为苔石

    loot:
      type: generic
      entries:
        - item: custom:mossy_infection

  # ---- 阶段 2: 腐化石 (感染中期) ----
  custom:decayed_stone:
    state:
      auto_state: solid
      model:
        texture: "custom:block/custom/decayed_stone"

    settings:
      template:
        - custom:template/block_settings_stone
      item: custom:decayed_stone
      luminance: 5                                 # 中度发光 — 腐败能量聚集

    behavior:
      type: spreading_block
      target_block: custom:mossy_infection         # 将苔石转化为腐化石

    loot:
      type: generic
      entries:
        - item: custom:decayed_stone

  # ---- 阶段 3: 深渊石 (感染末期) ----
  custom:abyssal_stone:
    state:
      auto_state: solid
      model:
        texture: "custom:block/custom/abyssal_stone"

    settings:
      template:
        - custom:template/block_settings_stone
      item: custom:abyssal_stone
      luminance: 10                                # 强发光 — 深渊能量满溢

    behavior:
      type: spreading_block
      target_block: custom:decayed_stone           # 将腐化石转化为深渊石

    loot:
      type: generic
      entries:
        - item: custom:abyssal_stone


  # ===========================================================================
  # 示例 3: 扩散 + 弹跳 (复合行为) — 腐蚀黏液块
  # ===========================================================================
  #
  # 说明:
  #   将扩散行为与弹跳行为组合，实体落在其上会被弹回空中。
  #   同时会像感染一样将周围泥土转化为自身。
  #
  # 复合行为: behaviors 列表中的多个行为自动组合。
  # ===========================================================================
  custom:corrupt_slime:
    state:
      auto_state: solid
      model:
        texture: "custom:block/custom/corrupt_slime"

    settings:
      hardness: 0.8
      resistance: 0.8
      is_suffocating: false
      is_redstone_conductor: false
      instrument: chime
      map_color: 36
      sounds:
        break: minecraft:block.slime_block.break
        step: minecraft:block.slime_block.step
        place: minecraft:block.slime_block.place
        hit: minecraft:block.slime_block.hit
        fall: minecraft:block.slime_block.fall
      correct_tools:
        - minecraft:wooden_shovel
        - minecraft:stone_shovel
        - minecraft:iron_shovel
        - minecraft:golden_shovel
        - minecraft:diamond_shovel
        - minecraft:netherite_shovel
      tags:
        - minecraft:mineable/shovel
      # 弹性碰撞系数 (不稳定设置, 仅非玩家实体)
      bounce_restitution: 1.0
      friction: 0.8

    # ---- 复合行为: 扩散 + 弹跳 ----
    behaviors:
      - type: spreading_block
        target_block: minecraft:dirt               # 将泥土转化为腐蚀黏液块
      - type: bouncing_block
        bounce_height: 0.8                         # 反弹速度系数
        fall_damage_multiplier: 0.0                # 完全无摔落伤害
        sync_player_position: true                 # 强制同步客户端位置

    loot:
      type: generic
      entries:
        - item: custom:corrupt_slime


  # ===========================================================================
  # 示例 4: 扩散 + 衰变 (复合行为) — 活性冰雪 (夏季融化)
  # ===========================================================================
  #
  # 说明:
  #   扩散行为将周围的水源方块转化为活性冰，
  #   而衰变行为又使活性冰在光照充足时缓慢融化为水。
  #   形成"冻结 ↔ 融化"的动态平衡，模拟极地/高山生物群系中
  #   冰层的季节性变化。
  #
  #   注意: spreading_block 的 target_block 可设为液体吗？
  #   文档显示 target_block 是方块 ID。水 (minecraft:water) 是流体而非方块，
  #   因此无法直接将水转化为冰。建议使用 events 或配合其他行为实现。
  #   此处为示意性配置，展示组合可能性。
  # ===========================================================================
  # custom:active_ice:
  #   states:
  #     properties:
  #       age:                                      # 衰变阶段
  #         type: int
  #         default: 0
  #         range: "0~3"

  #     appearances:
  #       default:
  #         auto_state: solid
  #         model:
  #           texture: "custom:block/custom/active_ice_0"
  #       age1:
  #         auto_state: solid
  #         model:
  #           texture: "custom:block/custom/active_ice_1"
  #       age2:
  #         auto_state: solid
  #         model:
  #           texture: "custom:block/custom/active_ice_2"
  #       age3:
  #         auto_state: solid
  #         model:
  #           texture: "custom:block/custom/active_ice_3"

  #     variants:
  #       age=0:
  #         appearance: default
  #       age=1:
  #         appearance: age1
  #       age=2:
  #         appearance: age2
  #       age=3:
  #         appearance: age3

  #   settings:
  #     hardness: 0.5
  #     resistance: 0.5
  #     is_suffocating: true
  #     is_redstone_conductor: true
  #     friction: 0.98                              # 冰面滑度
  #     sounds:
  #       break: minecraft:block.glass.break
  #       step: minecraft:block.glass.step
  #       place: minecraft:block.glass.place
  #       hit: minecraft:block.glass.hit
  #       fall: minecraft:block.glass.fall
  #     correct_tools:
  #       - minecraft:wooden_pickaxe
  #     tags:
  #       - minecraft:mineable/pickaxe
  #       - minecraft:ice

  #   behaviors:
  #     - type: spreading_block
  #       target_block: minecraft:ice                # 将原版冰转化为活性冰 (扩散)
  #     - type: decay_block
  #       decay_into: minecraft:water                # 完全融化后变为水
  #       delay: "200~400"                           # 计划刻模式: 10~20秒间隔
  #       chance: 0.5                                # 50% 概率增加 age
  #       required_light: 10                         # 仅光照 >= 10 时融化

  #   loot:
  #     type: generic
  #     entries:
  #       - item: custom:active_ice


  # ===========================================================================
  # 示例 5: 扩散 + 可下落 (复合行为) — 流沙
  # ===========================================================================
  #
  # 说明:
  #   受重力影响下落的沙质方块，同时会向周围扩散转化沙子。
  #   适合制作会"吞噬"地形的流沙陷阱。
  #
  # 注意:
  #   falling_block 会使其受重力下落，spreading_block 在落地后(作为方块时)
  #   才会尝试扩散。因此大部分扩散发生在已经着床的方块上。
  # ===========================================================================
  custom:quicksand:
    state:
      auto_state: solid
      model:
        texture: "custom:block/custom/quicksand"

    settings:
      hardness: 0.5
      resistance: 0.5
      is_suffocating: true
      is_redstone_conductor: false
      map_color: 12
      sounds:
        break: minecraft:block.sand.break
        step: minecraft:block.sand.step
        place: minecraft:block.sand.place
        hit: minecraft:block.sand.hit
        fall: minecraft:block.sand.fall
      correct_tools:
        - minecraft:wooden_shovel
        - minecraft:stone_shovel
        - minecraft:iron_shovel
        - minecraft:golden_shovel
        - minecraft:diamond_shovel
        - minecraft:netherite_shovel
      tags:
        - minecraft:mineable/shovel

    # ---- 复合行为: 扩散 + 可下落 ----
    behaviors:
      - type: spreading_block
        target_block: minecraft:sand                # 将沙子转化为流沙
      - type: falling_block
        hurt_amount: -1                             # 不造成伤害
        max_hurt: -1

    loot:
      type: generic
      entries:
        - item: custom:quicksand


  # ===========================================================================
  # 示例 6: 扩散 + 事件 (变质反应)
  # ===========================================================================
  #
  # 说明:
  #   在扩散行为的基础上添加事件响应。当玩家右键点击时触发反馈：
  #   播放音效并发送消息。破坏时额外生成粒子效果。
  #   展示如何将 spreading_block 与 events 系统结合。
  # ===========================================================================
  custom:necrotic_flesh:
    state:
      auto_state: solid
      model:
        texture: "custom:block/custom/necrotic_flesh"

    settings:
      hardness: 0.8
      resistance: 0.8
      is_suffocating: false
      is_redstone_conductor: false
      instrument: bass
      map_color: 27
      sounds:
        break: minecraft:block.wood.break
        step: minecraft:block.wood.step
        place: minecraft:block.wood.place
        hit: minecraft:block.wood.hit
        fall: minecraft:block.wood.fall
      correct_tools:
        - minecraft:wooden_axe
        - minecraft:stone_axe
        - minecraft:iron_axe
        - minecraft:golden_axe
        - minecraft:diamond_axe
        - minecraft:netherite_axe
      tags:
        - minecraft:mineable/axe

    behavior:
      type: spreading_block
      target_block: minecraft:podzol               # 将灰化土转化为坏死肉块

    # ---- 事件 ----
    events:
      # 右键点击时播放恶心音效
      - on: right_click
        functions:
          - type: play_sound
            sound: minecraft:entity.zombie.ambient
            pitch: 0.5
            volume: 1.0
            target: self
          - type: actionbar
            actionbar: "<dark_red>这团血肉在蠕动...</dark_red>"
            target: self

      # 破坏时生成孢子粒子
      - on: break
        functions:
          - type: particle
            particle: minecraft:spore_blossom_air
            count: 8
            offset_x: 0.4
            offset_y: 0.4
            offset_z: 0.4
            speed: 0.05

    loot:
      type: generic
      entries:
        - item: custom:necrotic_flesh


# =============================================================================
# 附录 A: spreading_block 配置速查
# =============================================================================
#
# ┌─ 行为参数 ───────────────────────────────────────────────────────────┐
# │                                                                      │
# │   behavior:                                                          │
# │     type: spreading_block              # 行为类型 (必需)              │
# │     target_block: <方块ID>             # 可被转化的目标方块 (必需)     │
# │                                        # 格式: "命名空间:路径"        │
# │                                        # 例如: "minecraft:stone"     │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# ┌─ 扩散机制 ───────────────────────────────────────────────────────────┐
# │                                                                      │
# │   1. 方块收到随机刻时触发 (gamerule randomTickSpeed 控制频率)         │
# │   2. 在周围随机区域选择一个位置:                                      │
# │        X/Z: ±1 格 (水平方向)                                         │
# │        Y:   -3 ~ +1 格 (垂直方向, 向下优先)                         │
# │   3. 若目标位置的方块 == target_block，则将其替换为自身               │
# │   4. 替换后新方块也会在后续随机刻中继续扩散                           │
# │                                                                      │
# │   核心特征:                                                          │
# │     - 纯随机扩散, 无方向偏好 (除 Y 轴略微向下倾斜)                   │
# │     - 逐格扩散, 类似病毒感染传播                                      │
# │     - 仅影响 target_block 指定的方块                                  │
# │     - 自身不会被 target_block 反向转化                                │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# ┌─ 常见 target_block 场景 ────────────────────────────────────────────┐
# │                                                                      │
# │   minecraft:stone          → 感染石层 (地下城/矿洞主题)              │
# │   minecraft:dirt           → 感染地表 (腐化生物群系)                 │
# │   minecraft:grass_block    → 感染草地 (荒芜主题)                     │
# │   minecraft:sand           → 吞噬沙地 (流沙/荒漠主题)                │
# │   minecraft:podzol         → 转化针叶林地表 (黑暗森林主题)           │
# │   minecraft:mycelium       → 菌丝转化 (真菌感染主题)                 │
# │   custom:some_block        → 自定义方块间的转化链                    │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# ┌─ 复合行为组合建议 ─────────────────────────────────────────────────┐
# │                                                                      │
# │   扩散 + 弹跳     → 蹦床式感染块 (如示例 3)                          │
# │   扩散 + 可下落   → 流沙陷阱 (如示例 5)                              │
# │   扩散 + 衰变     → 动态平衡 (冻结↔融化, 感染↔消退)                 │
# │   扩散 + 遇水凝固 → 水边固化的感染体                                │
# │   扩散 + 邻液     → 只在液体附近存在的感染体                        │
# │   扩散 + 树叶     → 像树叶一样枯萎扩散的病变植物                    │
# │   扩散 + 事件     → 交互反馈 (如示例 6)                              │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# ┌─ 性能注意事项 ───────────────────────────────────────────────────────┐
# │                                                                      │
# │   1. spreading_block 仅在有随机刻时运行，不会主动 tick               │
# │      因此大量放置不会导致显著的性能开销                               │
# │   2. 扩散效率受 randomTickSpeed 控制                                  │
# │      (默认 3, 每区块每 tick 随机选中 3 个方块)                        │
# │   3. 大规模感染场景建议控制目标方块数量，避免瞬间大面积替换           │
# │   4. 短传播链 (1~2 级) 性能开销无感知                                 │
# │      长传播链 (3+ 级) 需要更长时间完成扩散                             │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# ┌─ 关键概念速查 ───────────────────────────────────────────────────────┐
# │                                                                      │
# │   方块配置结构:                                                      │
# │     blocks:                    ← 配置区域根键                       │
# │       namespace:block_id:      ← 方块唯一标识符                     │
# │         state: / states:       ← 视觉状态 (单状态用 state)          │
# │           properties:          ←   属性定义 (多状态必需)             │
# │           appearances:         ←   外观定义                          │
# │           variants:            ←   状态→外观映射                     │
# │         settings:              ← 基础属性 (硬度/音效/标签等)         │
# │         behavior: / behaviors: ← 行为 (单一 behavior, 多 behaviors) │
# │         loot:                  ← 战利品表                           │
# │         events:                ← 事件响应                           │
# │                                                                      │
# └──────────────────────────────────────────────────────────────────────┘
#
# =============================================================================
# 文件结尾
# =============================================================================
