# ============================================================================
#  slab_block 行为模板 | CraftEngine 方块配置
#  行为类型: slab_block — 台阶方块
#  描述: 台阶方块与原版台阶一致，可放置在下半部分（下半台阶）或上半部分
#        （上半台阶）。将相同台阶放置在已有的单层台阶上会合并为双层台阶。
#        双层台阶无法含水，液体也无法流入双层台阶。
# ============================================================================

blocks:
  # ==========================================================================
  # 【自定义命名空间:方块ID】
  #   命名空间建议使用自定义名称（如 custom:）而非 default:，避免覆盖原版注册
  #   - 命名空间: 通常为插件/模组名
  #   - 方块ID:   小写英文 + 下划线，唯一标识
  # ==========================================================================
  custom:my_slab:
    # ==========================================================================
    # behavior 节 — 定义方块行为
    # ==========================================================================
    behavior:
      # 行为类型 (必需) — 固定值 slab_block
      #   可选值: slab_block, stair_block, fence_block, wall_block,
      #           door_block, trapdoor_block, log_block, leaf_block, 等
      type: slab_block

      # 注: slab_block 行为无额外配置选项，所有行为逻辑由方块属性驱动。
      #     详见下方 properties 节。

    # ==========================================================================
    # properties 节 — 方块状态属性 (必需)
    #   台阶方块通过属性控制其变体（单层上半/下半、双层）及含水状态。
    #   CraftEngine 会根据放置方式/交互自动计算这些值。
    # ==========================================================================
    properties:
      # type (必需) — 台阶变体类型
      #   类型: slab_type
      #   可选值:
      #     bottom — 下半台阶（放置在方块下半部分）
      #     top    — 上半台阶（放置在方块上半部分）
      #     double — 双层台阶（两个单层台阶合并）
      #   说明: 双层台阶视为完整方块，无法含水，液体也无法流入
      type:
        default: bottom

      # waterlogged (可选) — 台阶是否含水
      #   类型: boolean
      #   默认: false
      #   说明: true  — 台阶内部含水（仅 bottom/top 可用）
      #          false — 不含水
      #   注意: 双层台阶 (double) 无法含水，此属性无效
      # waterlogged:
      #   default: false

    # ==========================================================================
    # display 节 (可选) — 方块显示/模型配置
    #   台阶方块通常需要三个模型（上半、下半、双层），
    #   或使用单一模型配合 blockstate JSON 变体。
    # ==========================================================================
    # display:
    #   model:
    #     type: MODEL_JSON
    #     path: custom/models/block/my_slab.json
    #   texture: custom/textures/block/my_slab.png

    # ==========================================================================
    # hardness 节 (可选) — 方块硬度（破坏时间基准）
    # ==========================================================================
    # hardness: 2.0

    # ==========================================================================
    # resistance 节 (可选) — 爆炸抗性
    # ==========================================================================
    # resistance: 3.0

    # ==========================================================================
    # tool 节 (可选) — 采集工具类型
    #   可选值: axe, pickaxe, shovel, hoe, sword, shears, none
    # ==========================================================================
    # tool: pickaxe

    # ==========================================================================
    # sounds 节 (可选) — 方块音效组
    #   常用值: stone, wood, metal, glass, grass, gravel, sand, snow, etc.
    # ==========================================================================
    # sounds: stone

    # ==========================================================================
    # drops 节 (可选) — 掉落物
    #   注: 台阶方块默认掉落自身，双层台阶掉落两个单层台阶。
    #       可通过此节覆写掉落逻辑。
    # ==========================================================================
    # drops:
    #   - item: custom:my_slab
    #     amount: 1

# ============================================================================
# 完整示例
# ============================================================================
# blocks:
#   custom:marble_slab:
#     behavior:
#       type: slab_block
#     properties:
#       type:
#         default: bottom
#       waterlogged:
#         default: false
#     display:
#       model:
#         type: MODEL_JSON
#         path: custom/models/block/marble_slab.json
#       texture: custom/textures/block/marble_slab.png
#     hardness: 1.5
#     resistance: 6.0
#     tool: pickaxe
#     sounds: stone
#     drops:
#       - item: custom:marble_slab
#       - condition: type == double
#         item: custom:marble_slab
#         amount: 2
