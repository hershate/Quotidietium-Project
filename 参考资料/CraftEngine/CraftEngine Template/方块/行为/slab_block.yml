# 本地文档: CraftEngine Wiki/configuration/block/behaviors/slab_block.md
# 台阶方块 - 与原版台阶一致。放置在方块下半部分或上半部分可创建下半台阶或
#   上半台阶。将相同台阶放置在已有的单层台阶上会合并为双层台阶。
#   双层台阶无法含水，液体也无法流入双层台阶。

blocks:
  custom:my_slab:                                    # << CHANGE THIS: 方块ID
    behavior:
      # 行为类型 (必需) — 固定值 slab_block
      type: slab_block

    # ==================== 必需属性 (Required) ====================
    # type: slab_type — 台阶变体类型
    #   可选值: bottom (下半台阶), top (上半台阶), double (双层台阶)
    properties:
      type:
        default: bottom                              # << CHANGE THIS

      # ==================== 可选属性 (Optional) ====================
      # waterlogged: boolean — 台阶是否含水
      #   默认值: false
      #   说明: true=含水源, false=不含水
      #   注意: 双层台阶 (type: double) 无法含水，此属性无效
      # waterlogged:
      #   default: false
