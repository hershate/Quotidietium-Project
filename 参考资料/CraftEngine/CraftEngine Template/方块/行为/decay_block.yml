# ============================================================
# CraftEngine - 衰变方块 (decay_block) 行为配置模板
# ============================================================
# 适用版本: CraftEngine 1.x
# 命名空间: mythic (自定义命名空间示例)
# 风格参考: Oraxen
# ============================================================
# 【行为概述】
# 衰变方块会随时间流逝逐步增加内部 age 值，直到达到最大值时
# 转变为 decay_into 指定的目标方块。例如：冰块融化为水。
#
# 【两种工作模式】
# 1. 计划刻模式 — delay > 0（或为数字格式字符串）：
#    由计划任务触发，每次间隔 delay，检查光照与 chance，
#    通过则 age+1，直至 decay_into。
# 2. 随机刻模式 — delay 未设置或 <= 0：
#    由游戏随机刻速率控制触发，其他逻辑同上。
# ============================================================

# ============================================================
# blocks 根键
# ============================================================
# 所有方块定义位于此根键下。
# 每个键的格式为: <命名空间>:<方块ID>
# ============================================================
blocks:

  # ============================================================
  # 方块: mythic:frost_ice
  # 说明: 自定义霜冻冰块，暴露在空气中会逐渐融化
  # ============================================================
  mythic:frost_ice:

    # ============================================================
    # behavior — 行为定义
    # ============================================================
    behavior:

      # ---- 行为类型 (必需) ----
      # 固定值: decay_block
      type: decay_block

      # ---- decay_into — 衰变目标方块 (可选) ----
      # 当内部 age 达到最大值时，当前方块将变为此方块。
      # 支持完整方块 ID 格式: <命名空间>:<ID>
      # 默认值: air (即方块直接消失)
      # 类型: String
      decay_into: mythic:water_puddle

      # ---- delay — 衰变间隔 (可选) ----
      # 每次增加 age 的等待时间（单位为游戏刻）。
      # 支持数字格式字符串，如 "100~200" 表示 100~200 刻之间随机。
      # ❗ 设置此选项 (>0) → 启用计划刻模式
      # ❗ 省略或 ≤0 → 启用随机刻模式
      # 默认值: 无 (使用随机刻模式)
      # 类型: int | 数字格式字符串
      delay: 100~200

      # ---- chance — 衰变概率 (可选) ----
      # 每次 tick 触发时，实际增加 age 的概率。
      # 取值范围: 0.0 ~ 1.0
      #   - 1.0  → 必定增加
      #   - 0.5  → 50% 概率增加
      # 默认值: 1.0
      # 类型: double
      chance: 0.5

      # ---- required_light — 最低光照要求 (可选) ----
      # 方块所在位置需要达到的最低光照等级才会触发衰变。
      # 取值为 0~15 (Minecraft 光照等级)。
      #   - 0  → 始终衰变（无视光照）
      #   - 7  → 光照等级 ≥7 时才衰变
      # 默认值: 0
      # 类型: int
      required_light: 7

    # ============================================================
    # properties — 方块属性 (部分与 behavior 协同)
    # ============================================================
    properties:

      # ---- age — 当前衰变阶段 (必需) ----
      # 跟踪方块的当前衰变进度。从 0 开始，每次触发 +1。
      # 最大值等于 decay_block 行为内部定义的 age 上限
      # （由 max_age 或层数隐式定义），达到后触发方块转变。
      # ❗ 此项为必需属性
      # 类型: int
      age: 0

  # ============================================================
  # 示例二：myserver:melting_snow
  # 简化配置 - 使用随机刻模式，快速融化
  # ============================================================
  myserver:melting_snow:
    behavior:
      type: decay_block
      decay_into: air               # 融化后消失
      # delay: 未设置 → 使用随机刻模式
      chance: 0.3                   # 30% 概率每次随机刻增加 age
      required_light: 12            # 仅在光照 >= 12 时融化
    properties:
      age: 0
