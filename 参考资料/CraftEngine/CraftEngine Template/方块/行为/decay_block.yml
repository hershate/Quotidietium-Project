# ============================================================
# CraftEngine - decay_block (衰变方块) 行为配置模板
# Wiki: configuration/block/behaviors/decay_block.md
# ============================================================
# 所有可自定义的值均已用 # << CHANGE THIS 标记
# 将命名空间 "custom" 替换为你的项目命名空间即可使用
# ============================================================

blocks:

  # ============================================================
  # 方块: custom:melting_ice
  # 说明: 暴露在空气中逐渐融化的冰块示例
  # ============================================================
  custom:melting_ice:                                    # << CHANGE THIS

    behavior:
      type: decay_block                                  # 固定值: decay_block
      decay_into: custom:water_puddle                    # << CHANGE THIS (衰变完成后变为的方块, 默认 air)
      delay: 100~200                                     # << CHANGE THIS (衰变间隔/刻, 支持数字格式如 "100~200"; 省略或 ≤0 为随机刻模式)
      chance: 0.5                                        # << CHANGE THIS (每次触发时增加 age 的概率, 0.0~1.0, 默认 1.0)
      required_light: 7                                  # << CHANGE THIS (衰变所需最低光照等级, 0=始终衰变, 默认 0)

    properties:
      age: 0                                             # << CHANGE THIS (当前衰变阶段, int, 必需)

  # ============================================================
  # 方块: custom:evaporating_puddle
  # 说明: 简化配置 - 使用随机刻模式, 无延迟, 仅在高光照下蒸发
  # ============================================================
  custom:evaporating_puddle:                             # << CHANGE THIS
    behavior:
      type: decay_block
      decay_into: custom:dried_mud                       # << CHANGE THIS
      chance: 0.3                                        # << CHANGE THIS
      required_light: 12                                 # << CHANGE THIS
    properties:
      age: 0
