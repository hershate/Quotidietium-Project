# Wiki: CraftEngine Wiki/configuration/block/behaviors/sturdy_base_block.md
# 稳固基底方块：需要在指定方向上有一个坚固的支撑面，支撑方块被移除时自身也会被破坏。
# 三种支撑类型可选：full（完整方块）、rigid（刚性结构）、center（中心支撑）。

blocks:
  custom:my_sturdy_block:
    behavior:
      type: sturdy_base_block

      # 检查支撑的方向，可选 down / up / north / south / east / west # << CHANGE THIS
      direction: down

      # 所需的支撑类型列表 # << CHANGE THIS
      support_types:
        - full

      # 是否允许堆叠在同类型方块上 # << CHANGE THIS
      stackable: false

      # 堆叠时的最大连续高度。stackable 为 true 时需设置 >1 的值 # << CHANGE THIS
      max_height: 0

      # 支撑检查延迟（游戏刻），0 = 立即破坏 # << CHANGE THIS
      delay: 0
