# ============================================================================
# 稳固基底方块 (Sturdy Base Block) - 行为配置模板
# ============================================================================
# 功能：方块需要在指定方向上有一个坚固的支撑面才能存在。
#       若支撑的方块被移除，此方块也会被破坏。
#       可选地支持在同类型方块上垂直堆叠。
#
# 文档参考: CraftEngine Wiki - configuration/block/behaviors/sturdy_base_block
# ============================================================================

blocks:
  # --------------------------------------------------------------------------
  # 方块定义：<命名空间>:<方块ID>
  # 此处使用自定义命名空间 "custom"，请根据项目实际情况替换
  # --------------------------------------------------------------------------
  custom:sturdy_pebble:

    # --------------------------------------------------------------------------
    # 行为 (behavior) 定义
    # --------------------------------------------------------------------------
    behavior:
      # 行为类型：固定为 sturdy_base_block
      type: sturdy_base_block

      # ------------------------------------------------------------------
      # direction - 支撑检查方向 (可选，默认: down)
      # ------------------------------------------------------------------
      # 指定方块在哪个方向上需要支撑面。
      # 有效值: down, up, north, south, east, west
      # - down  : 方块下方需要支撑 (类似于沙砾/砂岩)
      # - up    : 方块上方需要支撑 (类似于悬挂)
      # - north : 方块北面需要支撑
      # - south : 方块南面需要支撑
      # - east  : 方块东面需要支撑
      # - west  : 方块西面需要支撑
      direction: down

      # ------------------------------------------------------------------
      # support_types - 所需的支撑类型列表 (可选，默认: ["full"])
      # ------------------------------------------------------------------
      # 指定支撑方块需要满足的碰撞箱类型。
      # 可用的支撑类型:
      #   - full   : 完整方块 (如石头、泥土、木板等完整碰撞箱的方块)
      #   - rigid  : 刚性方块 (包括完整方块和某些特定模型方块)
      #   - center : 中心支撑 (只有碰撞箱中心有支撑柱的方块，如栅栏)
      #
      # 可以同时指定多种类型，例如：
      #   support_types:
      #     - full
      #     - rigid
      # 表示 full 或 rigid 类型的方块都可以作为支撑。
      support_types:
        - full

      # ------------------------------------------------------------------
      # stackable - 是否允许在同类型方块上堆叠 (可选，默认: false)
      # ------------------------------------------------------------------
      # 启用后，方块可以放置在相同类型方块的对应方向上，
      # 形成垂直/水平堆叠。堆叠的方块会相互提供支撑。
      # true  - 允许堆叠
      # false - 不允许堆叠，每个方块都依赖外部支撑
      stackable: false

      # ------------------------------------------------------------------
      # max_height - 堆叠最大高度 (可选，默认: 0)
      # ------------------------------------------------------------------
      # 当 stackable 为 true 时，指定最多可以连续堆叠多少个同类型方块。
      # 一旦连续数量达到此上限，将无法继续向上/向对应方向堆叠。
      # 该值必须大于 1 才具有实际意义。
      # 如果 stackable 为 false，此选项无效。
      # 设为 0 表示不限制高度（但 stackable 仍为 false 时无效果）。
      max_height: 0

      # ------------------------------------------------------------------
      # delay - 支撑检查延迟，单位为游戏刻 (可选，默认: 0)
      # ------------------------------------------------------------------
      # 当支撑方块被破坏后，等待指定的游戏刻数再检查并破坏此方块。
      # 游戏刻: 20 刻 = 1 秒
      # 0  : 立即破坏 (无延迟)
      # 1+ : 延迟指定刻数后再破坏
      # 此选项可用于模拟方块掉落前的短暂悬空效果，
      # 或者与其他机制配合实现连锁破坏的视觉延迟。
      delay: 0

# ============================================================================
# 完整示例 - 多种石头堆叠柱子
# ============================================================================
# 下方展示了一个完整配置的示例，演示如何创建一根可堆叠的石柱，
# 最大堆叠 5 块，支撑方向向下，支撑类型为完整方块，
# 带 1 刻的检查延迟以实现自然的连锁破坏效果。
#
# blocks:
#   custom:stone_pillar:
#     behavior:
#       type: sturdy_base_block
#       direction: down
#       support_types:
#         - full
#       stackable: true
#       max_height: 5
#       delay: 1
#
# 该配置效果：
# 1. 玩家可以在石头地面上放置 custom:stone_pillar
# 2. 可以在已放置的 custom:stone_pillar 上方继续放置，最多堆叠 5 块
# 3. 破坏最下方的支撑方块后，整根柱子会从上到下依次破坏，
#    每块之间有 1 刻 (0.05 秒) 的延迟
# 4. 达到 5 块后无法继续向上堆叠
# ============================================================================
