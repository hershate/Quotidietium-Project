# 灯方块 (lamp_block)
# Wiki: configuration/block/behaviors/lamp_block.md
#
# 根据红石信号切换 lit 点亮状态，就像原版红石灯。
# - 收到红石信号：立刻点亮
# - 失去红石信号：4 刻后熄灭
# - 放置时自动检测附近红石信号并设置正确的初始状态
#
# 必需属性:
#   lit (boolean): 灯方块的点亮状态

blocks:
  custom:your_lamp_block:  # << CHANGE THIS - 方块 ID
    behavior:
      type: lamp_block
