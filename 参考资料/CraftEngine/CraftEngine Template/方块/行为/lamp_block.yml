# ============================================================================
# 灯方块 (lamp_block) 行为模板
# ============================================================================
# 对应 Wiki: configuration/block/behaviors/lamp_block.md
# 灯方块根据红石信号切换 lit (点亮) 状态，行为与原版红石灯一致。
#
# 行为特性:
#   - 收到红石信号 → 立刻点亮 (lit: true)
#   - 失去红石信号 → 延迟 4 刻 (0.2 秒) 后熄灭 (lit: false)
#   - 放置时自动检测附近红石信号并设置正确的初始状态
#
# 注意: 本文件为模板文件，不直接加载。使用时请将内容复制到实际的
#       方块配置文件中，或作为参考查阅。
# ============================================================================

# --------------------------------------------------------------------------
# blocks 根键
# 所有自定义方块都定义在此根键下。每个方块以 "命名空间:方块ID" 为键。
# 命名空间建议使用你的项目名或作者标识，例如 custom, myproject, server 等。
# --------------------------------------------------------------------------
blocks:

  # ==========================================================================
  # 示例 1: 带自定义纹理的红石灯 (完整配置)
  # 使用 custom 命名空间，展示所有可用选项。
  # ==========================================================================
  custom:red_lamp:

    # ---------- 显示与基础属性 ----------
    display_name: "&c红色灯"                    # 方块显示名称，支持 & 颜色代码
    material: REDSTONE_LAMP                    # 基础材质，建议使用 REDSTONE_LAMP
    placed_model:
      path: custom/red_lamp                    # 模型路径 (相对于 models/ 目录)

    # ---------- 行为: lamp_block ----------
    behavior:
      type: lamp_block                         # 行为类型，固定为 lamp_block
      # ----------------------------------------------------------------
      # lit: boolean (必需)
      # 方块的初始点亮状态。
      #   true  - 放置时默认点亮 (收到红石信号般的状态)
      #   false - 放置时默认熄灭 (无红石信号时的状态)
      # 注意: 放置后实际状态受附近红石信号影响，此值仅决定无红石信号
      #       时的初始状态。
      # 未设置时默认值: false
      # ----------------------------------------------------------------
      lit: false

    # ---------- 可选: 硬度与破坏属性 ----------
    hardness: 0.3                              # 方块硬度 (原版红石灯为 0.3)
    resistance: 0.3                            # 爆炸抗性
    break_tool: PICKAXE                        # 推荐破坏工具
    drops:
      type: self                               # 破坏后掉落自身

    # ---------- 可选: 合成配方 ----------
    recipes:
      shaped:
        red_lamp:
          result: custom:red_lamp
          amount: 1
          pattern:
            - "RRR"
            - "RGR"
            - "RRR"
          ingredients:
            R: REDSTONE
            G: GLOWSTONE

  # ==========================================================================
  # 示例 2: 极简配置 (仅必需项)
  # ==========================================================================
  default:copper_coil:
    behavior:
      type: lamp_block
      # lit 省略，默认为 false

  # ==========================================================================
  # 示例 3: 默认点亮的灯
  # ==========================================================================
  custom:always_on_lamp:
    display_name: "&e常亮灯"
    material: REDSTONE_LAMP
    behavior:
      type: lamp_block
      lit: true                                # 默认点亮 (但仍受红石信号控制)

# ============================================================================
# 属性速查表
# ============================================================================
# | 属性名称 | 属性类型 | 必需 | 默认值  | 说明                        |
# |----------|----------|------|---------|-----------------------------|
# | lit      | boolean  | 是   | false   | 无红石信号时的初始点亮状态   |
# | type     | string   | 是   | —       | 必须为 "lamp_block"         |
# ============================================================================
