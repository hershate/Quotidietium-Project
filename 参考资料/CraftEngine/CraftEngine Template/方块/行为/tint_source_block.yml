# ============================================================================
#   tint_source_block 行为模板 — 颜色提供器方块
# ============================================================================
# 功能说明：
#   颜色提供器方块是一种 "方块实体" (Block Entity)。
#   它可以将一个物品作为颜色提供器存入方块实体内部，使
#   [方块实体渲染器元素] (entity_renderer) 中的元素可以
#   根据存储的物品进行动态着色 (tinting)。
#
# 依赖关系：
#   - 需要与 entity_renderer 状态配合使用，渲染元素通过引用
#     此方块中存储的物品来确定着色颜色。
#   - 启用后，破坏方块时存储的物品会掉落（由 drop_item 控制）。
#
# 行为类型：tint_source_block
# 参考文档：CraftEngine Wiki -> configuration/block/behaviors/tint_source_block.md
# ============================================================================

# ────────────────────────────────────────────────────────────────────────────
# blocks 根键
# ────────────────────────────────────────────────────────────────────────────
# 所有方块配置必须位于 blocks 根键之下。
# 每个方块使用 "命名空间:方块ID" 的格式作为唯一标识。
blocks:

  # ==========================================================================
  #   [示例] 自定义铜线圈方块 — 颜色提供器方块
  # ==========================================================================
  # 命名空间：使用 custom，避免与现有命名空间冲突
  # 方块ID：   tinted_copper_coil
  # ==========================================================================
  custom:tinted_copper_coil:

    # --------------------------------------------------------------------------
    # behavior — 行为定义
    # --------------------------------------------------------------------------
    # 定义方块的核心逻辑行为。此处使用 tint_source_block 类型。
    # --------------------------------------------------------------------------
    behavior:

      # 行为类型 — 必填
      # 指定此方块使用 "颜色提供器" 行为。
      type: tint_source_block

      # drop_item — 可选，默认值: true
      # 控制方块被破坏时，存储在方块实体中的物品是否掉落。
      # true  : 破坏方块时物品掉落在地面上（类似容器方块）
      # false : 破坏方块时物品直接消失，不会掉落
      # 建议：如果该方块只作为装饰或临时颜色源保留，可设为 false；
      #       如果玩家期望取回物品，请保持 true。
      drop_item: true

      # data_key — 可选，默认值: "craftengine:tint_source"
      # 持久化数据在 NBT 中的键名。
      # CraftEngine 会将存储的物品序列化到此 NBT 路径下。
      # 一般情况下不需要修改，除非你需要在多个行为或插件之间
      # 共享/区分不同的持久化数据存储。
      # 注意：键名应包含命名空间以避免冲突，建议格式为 "命名空间:key_name"
      data_key: "craftengine:tint_source"

    # --------------------------------------------------------------------------
    # 以下为补充配置项（非 tint_source_block 特有，但与方块行为配合使用）
    # --------------------------------------------------------------------------

    # display — 显示配置
    # 推荐使用 entity_renderer 状态来展示动态着色效果
    display:
      type: entity_renderer
      elements:
        - type: model
          model: custom:block/tinted_copper_coil
          # 颜色提供器将自动为此模型元素应用存储在方块实体中的物品颜色
          tint_source: true

    # hardness — 硬度（可选，默认值由服务端决定）
    hardness: 3.0

    # resistance — 抗爆性（可选）
    resistance: 6.0

    # tool — 所需工具类型（可选）
    tool: pickaxe

    # tool_level — 所需工具等级（可选）
    tool_level: stone

    # --------------------------------------------------------------------------
    # 完整示例：带更多实际配置的方块
    # --------------------------------------------------------------------------

  # ==========================================================================
  #   [示例] 渐变玻璃 — 使用自定义 data_key 的颜色提供器方块
  # ==========================================================================
  custom:tinted_glass:

    behavior:
      type: tint_source_block
      drop_item: true
      data_key: "custom:tint_glass_data"

    display:
      type: entity_renderer
        elements:
          - type: model
            model: custom:block/tinted_glass
            tint_source: true

    # 方块属性
    transparent: true
    light_level: 0

    # 挖掘属性
    hardness: 0.3
    tool: pickaxe
    tool_level: wood
    silk_touch: true

# ============================================================================
#   配置属性摘要
# ============================================================================
#
# behavior 段（tint_source_block 特有属性）：
# ┌────────────────────┬──────────┬────────────────────┬────────────────────────┐
# │ 属性               │ 必填     │ 默认值             │ 说明                   │
# ├────────────────────┼──────────┼────────────────────┼────────────────────────┤
# │ type               │ 必填 ✅  │ (无)               │ 固定为                 │
# │                    │          │                    │ "tint_source_block"    │
# ├────────────────────┼──────────┼────────────────────┼────────────────────────┤
# │ drop_item          │ 可选     │ true               │ 破坏方块时物品是否掉落 │
# ├────────────────────┼──────────┼────────────────────┼────────────────────────┤
# │ data_key           │ 可选     │ "craftengine:      │ NBT 持久化键名         │
# │                    │          │ tint_source"       │                        │
# └────────────────────┴──────────┴────────────────────┴────────────────────────┘
#
# 注意事项：
# 1. tint_source_block 是一个 "方块实体" 行为，意味着该方块在游戏中
#    会占用额外的服务器资源（TileEntity），请勿大量放置。
# 2. 要使颜色动态着色生效，方块必须使用 entity_renderer 显示类型，
#    并在渲染元素中启用 tint_source。
# 3. data_key 修改后，旧的存储数据将无法被新 key 读取——相当于
#    存储空间隔离，请谨慎修改已部署的方块。
# 4. drop_item 设为 false 时，玩家破坏方块将无法取回存入的物品，
#    请在设计游戏机制时注意这一点。
# ============================================================================
