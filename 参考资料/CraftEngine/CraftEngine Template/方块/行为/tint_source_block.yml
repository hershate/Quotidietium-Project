# ============================================================================
# tint_source_block 行为 — 颜色提供器方块
# Wiki: CraftEngine Wiki/configuration/block/behaviors/tint_source_block.md
# ============================================================================
# 功能：将物品作为颜色提供器存入方块实体，使 entity_renderer 元素可据此
#       动态着色。方块被破坏时存储的物品会掉落（受 drop_item 控制）。
# ============================================================================
# 【行为属性要求】
# type        必填    固定为 "tint_source_block"
# drop_item   可选    默认 true    是否在被破坏时掉落存储物品
# data_key    可选    默认 "craftengine:tint_source"    NBT 持久化键名
# ============================================================================

blocks:

  custom:tinted_copper_coil:  # << CHANGE THIS

    behavior:
      type: tint_source_block
      drop_item: true          # << CHANGE THIS if items should not drop on break
      data_key: "craftengine:tint_source"  # << CHANGE THIS if NBT key conflicts

    # ── 以下是通用方块配置（非 tint_source_block 特有） ──

    display:
      type: entity_renderer
      elements:
        - type: model
          model: custom:block/tinted_copper_coil  # << CHANGE THIS
          tint_source: true

    hardness: 3.0    # << CHANGE THIS
    resistance: 6.0  # << CHANGE THIS
    tool: pickaxe    # << CHANGE THIS
