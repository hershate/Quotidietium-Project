# 参考资料: CraftEngine Wiki/configuration/block/behaviors/fence_block.md
# 栅栏方块 - 在四个水平方向自动与相邻方块连接，行为与原版栅栏相同
blocks:
  custom:my_fence:                            # << CHANGE THIS
    behavior:
      type: fence_block
      connectable_block_tag: custom:fences    # << CHANGE THIS 可连接方块的标签（默认 minecraft:wooden_fences）
      can_leash: false                        # << CHANGE THIS 是否允许拴绳拴上
    properties:
      north:
        default: false
      east:
        default: false
      south:
        default: false
      west:
        default: false
