# ============================================================================
# 方块行为: face_attached_horizontal_directional_block
# 水平面定向附着方块
# ============================================================================
# 描述:
#   此方块可以附着在另一个方块的侧面上，类似按钮或拉杆。
#   当附着的方块变动（移动、破坏、替代等）而不再允许附着时，此方块会被破坏。
#   放置时会尝试附着到这块空间内最近的有效附着表面。
#
# 附着规则:
#   - 黑名单模式 (blacklist: true, 默认): 可附着到除了列表中的方块
#   - 白名单模式 (blacklist: false): 只能附着到列表中的方块
#   同时需要附着的方块上方表面中心完整或附着的侧面完整。
#
# 必需属性 (属性参数):
#   face:   anchor_type          - 附着面方向
#   facing: horizontal_direction - 水平方向朝向
# ============================================================================

# ============================================================================
# blocks 根键 - 所有方块定义的入口
# ============================================================================
blocks:

  # --------------------------------------------------------------------------
  # 方块: 自定义按钮 (基于拉杆/按钮机制的附着水平方向方块)
  # 命名空间: custom (请替换为你的项目命名空间)
  # --------------------------------------------------------------------------
  custom:example_button:

    # ========================================================================
    # behavior 小节 - 方块行为与交互逻辑
    # ========================================================================
    behavior:

      # --------------------------------------------------------------
      # type: 行为类型 (必需)
      # 固定为 face_attached_horizontal_directional_block
      # --------------------------------------------------------------
      type: face_attached_horizontal_directional_block

      # --------------------------------------------------------------
      # blacklist: 黑白名单模式 (可选, 默认 true)
      #   true  = 黑名单模式 - 可附着到除了列表中的方块
      #   false = 白名单模式 - 只能附着到列表中的方块
      # --------------------------------------------------------------
      blacklist: true

      # --------------------------------------------------------------
      # attached_blocks: 附着方块列表 (可选)
      # 当列表中指定了方块时, 会根据 blacklist 模式决定是否允许附着
      # 格式: "命名空间:方块ID"
      # --------------------------------------------------------------
      attached_blocks:
        # - custom:forbidden_block     # 黑名单模式下禁止附着的方块
        # - minecraft:obsidian         # 示例: 黑名单中包含黑曜石
        # - minecraft:bedrock          # 示例: 黑名单中包含基岩

      # --------------------------------------------------------------
      # attached_block_tags: 附着方块标签列表 (可选)
      # 与 attached_blocks 类似, 但使用标签进行匹配
      # 格式: "命名空间:标签名"
      # --------------------------------------------------------------
      attached_block_tags:
        # - minecraft:dirt             # 示例: 匹配所有泥土类方块
        # - minecraft:farmland        # 示例: 匹配耕地

    # ========================================================================
    # properties 小节 - 方块的状态属性定义
    # 必需属性 (放置时必须设置, 否则方块无法正常工作):
    #   face:   anchor_type          - 附着面 (例如: floor, ceiling, wall 等)
    #   facing: horizontal_direction - 水平朝向 (例如: north, south, east, west)
    # ========================================================================
    properties:
      # ---------- 必需属性 ----------
      face:                                # anchor_type - 附着面方向
        # 可选值: floor, ceiling, wall_north, wall_south, wall_east, wall_west
      facing:                              # horizontal_direction - 水平朝向
        # 可选值: north, south, east, west

# ============================================================================
# 完整示例 - 参考 CraftEngine 官方文档
# ============================================================================
#
# blocks:
#   custom:palm_button:                    # 棕榈木按钮 (自定义命名空间)
#     behavior:
#       type: face_attached_horizontal_directional_block
#       blacklist: true                    # true = 黑名单, false = 白名单 (默认 true)
#       attached_blocks:                   # 要检查的方块列表 (可选)
#         - custom:xxx
#         - minecraft:stone
#       attached_block_tags:               # 要检查的方块标签列表 (可选)
#         - minecraft:dirt
#         - minecraft:farmland
#     properties:
#       face: wall                         # 附着在墙面上
#       facing: north                      # 朝向北
#
# ============================================================================
# 属性参考 (properties)
# ============================================================================
# | 属性名称 | 属性类型                 | 是否必需 |
# |----------|--------------------------|----------|
# | face     | anchor_type              | 是       |
# | facing   | horizontal_direction     | 是       |
#
# anchor_type 可选值:
#   - floor       - 附着在地面 (上方表面)
#   - ceiling     - 附着在天花板 (下方表面)
#   - wall_north  - 附着在北侧墙面
#   - wall_south  - 附着在南侧墙面
#   - wall_east   - 附着在东侧墙面
#   - wall_west   - 附着在西侧墙面
#
# horizontal_direction 可选值:
#   - north       - 朝北
#   - south       - 朝南
#   - east        - 朝东
#   - west        - 朝西
# ============================================================================
