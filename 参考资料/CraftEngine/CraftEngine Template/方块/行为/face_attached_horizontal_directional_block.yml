# ============================================================================
# 行为: face_attached_horizontal_directional_block
# Wiki: configuration/block/behaviors/face_attached_horizontal_directional_block.md
# ============================================================================
# 方块可附着在另一个方块的侧面上（类似按钮或拉杆）。
# 当附着的方块变动而不再允许附着时，方块会被破坏。
# 放置时会尝试附着到空间内最近的有效附着表面。
# ============================================================================

blocks:

  # --------------------------------------------------------------------------
  # 方块定义 — 替换 custom:example_block 为你的命名空间:方块ID
  # --------------------------------------------------------------------------
  custom:example_block:                                        # << CHANGE THIS

    behavior:
      # 行为类型 (必需，固定值)
      type: face_attached_horizontal_directional_block

      # 附着模式: true = 黑名单, false = 白名单 (默认 true)
      # 黑名单: 可附着到除了列表中的任何方块
      # 白名单: 只能附着到列表中的方块
      blacklist: true                                          # << CHANGE THIS (如需)

      # 附着方块 ID 列表 (可选)
      attached_blocks:
        # - minecraft:stone
        # - minecraft:obsidian

      # 附着方块标签列表 (可选), 优先级高于单独方块列表
      attached_block_tags:
        # - minecraft:dirt
        # - minecraft:farmland

    # ========================================================================
    # 必需属性 — 方块必须包含以下属性定义
    # ========================================================================
    properties:
      # face:    anchor_type           — 附着面 (floor / wall / ceiling)
      # facing:  horizontal_direction  — 水平朝向 (north / south / east / west)
      # 注意: properties 通常在 state/states 中定义, 此处仅标注必需属性类型。
      #       详细定义请参考 方块/属性状态/属性与状态.yml。
      face: wall                                               # << CHANGE THIS
      facing: north                                            # << CHANGE THIS

# ============================================================================
# 属性速查
# ============================================================================
# | 属性     | 类型                  | 必需 | 值域                                  |
# |----------|-----------------------|------|---------------------------------------|
# | face     | anchor_type           | 是   | floor, wall, ceiling                  |
# | facing   | horizontal_direction  | 是   | north, south, east, west              |
#
# 附着条件:
#   1. 黑名单模式 (blacklist: true):  可附着到除了列表中的方块
#   2. 白名单模式 (blacklist: false): 只能附着到列表中的方块
#   3. 附着的方块上方表面中心完整 或 附着的侧面完整
# ============================================================================
