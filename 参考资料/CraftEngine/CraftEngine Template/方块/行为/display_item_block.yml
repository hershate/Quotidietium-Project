# Wiki: configuration/block/behaviors/display_item_block.md
# 物品展示方块 — 方块实体，手持物品右键放入，空手右键取出，同时只能展示一件物品。
# 比较器：有物品输出 15，无物品输出 0（需启用 has_signal）。

blocks:
  custom:display_item_block:
    behavior:
      type: display_item_block
      position: "0.5,0.5,0.5"                 # << CHANGE THIS 物品展示位置偏移，默认 "0.5,0.5,0.5"
      has_signal: true                         # << CHANGE THIS 启用比较器信号，默认 true
      data_key: "craftengine:display_item"     # << CHANGE THIS NBT 持久化键名，默认 "craftengine:display_item"
      tint_source: false                       # << CHANGE THIS 存储物品是否为方块实体提供颜色，默认 false
      sounds:
        put: "minecraft:block.decorated_pot.insert"        # << CHANGE THIS 放入音效（可选）
        take: "minecraft:block.decorated_pot.insert_fail"  # << CHANGE THIS 取出音效（可选）
    properties:
      facing: north                            # << CHANGE THIS 展示物品朝向（north/south/east/west，可选）
