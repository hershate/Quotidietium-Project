# 弹跳方块行为模板
# Wiki: configuration/block/behaviors/bouncing_block.md

blocks:
  custom:my_bouncing_block:
    behavior:
      # 行为类型标识 (必填)
      type: bouncing_block

      # 反弹速度系数 (0=不反弹, 默认 0.66)
      # 注意: 仅在 26.1.2 及更低版本生效; 26.2+ 通过方块视觉状态的 bounce_restitution 定义
      bounce_height: 0.66                                              # << CHANGE THIS

      # 摔落伤害系数 (0=无摔落伤害, 默认 0.5)
      fall_damage_multiplier: 0.5                                      # << CHANGE THIS

      # 弹跳后强制同步客户端与服务端移动向量 (默认 true)
      # 若视觉方块状态的 bounce_restitution 与此 bounce_height 值相同可设为 false
      sync_player_position: true                                       # << CHANGE THIS

# ---------------------------------------------------------------------------
# 快速使用: 将 custom:my_bouncing_block 替换为你的命名空间:方块ID,
#           调整三个可选值, 其余配置无需改动即可使用。
# ---------------------------------------------------------------------------
