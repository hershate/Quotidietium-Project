# ============================================================================
# 弹跳方块行为模板 (Bouncing Block Behavior Template)
# 命名空间: custom (请按需替换)
# 对应文档: CraftEngine Wiki - configuration/block/behaviors/bouncing_block.md
# 风格: Oraxen (全字段注释)
# ============================================================================
#
# 概述:
#   弹跳方块能将落在其上的实体弹回空中。当实体落到这个方块上时，
#   其下落速度会被反转——bounce_height 控制反弹时保留多少速度。
#   处于潜行状态下的实体不会被反弹，而是正常落地。
#
# 额外机制:
#   - 摔落伤害仍会生效，但会按 fall_damage_multiplier 等比缩放。
#     设为 0 可完全禁用摔落伤害。
#   - sync_player_position 用于缓解与原版可弹跳方块行为不一致的问题。
#
# ============================================================================

# ========================================================================
# blocks 根键
# 所有自定义方块的配置均在此根键下声明。
# ========================================================================
blocks:

  # ========================================================================
  # 方块 ID: custom:bouncy_mushroom
  # 命名空间: custom (自定义命名空间，请按需替换为项目命名空间)
  # 格式:   <命名空间>:<方块ID>
  # 注意:   不建议使用 'minecraft' 命名空间，请使用自定义命名空间。
  # ========================================================================
  custom:bouncy_mushroom:

    # ====================================================================
    # behavior 配置块
    # 定义该方块的核心交互行为。
    # ====================================================================
    behavior:

      # ----------------------------------------------------------------
      # type: 行为类型
      # 作用:  声明该方块的行为实现类。
      # 必需:  是
      # 可选值: 由 CraftEngine 注册的行为类型决定
      # 当前值: bouncing_block - 弹跳方块行为
      # ----------------------------------------------------------------
      type: bouncing_block

      # ----------------------------------------------------------------
      # bounce_height: 反弹速度系数
      # 作用:  控制实体被反弹时保留的下落速度比例。
      #       值越大，弹得越高。
      # 必需:  否
      # 类型:  double (浮点数)
      # 默认:  0.66
      # 范围:  0.0 (不反弹) ~ 1.0 (完全反弹)
      # 注意:  - 设置为 0 则实体不会反弹，等同于普通方块。
      #       - 此默认值 0.66 仅在 CraftEngine 26.1.2 及更低版本生效。
      #       - CraftEngine 26.2+ 推荐通过方块的视觉方块状态设置
      #         bounce_restitution 来定义弹跳高度，此字段可能被覆盖。
      # ----------------------------------------------------------------
      bounce_height: 0.66

      # ----------------------------------------------------------------
      # fall_damage_multiplier: 摔落伤害系数
      # 作用:  控制实体被反弹后所受摔落伤害的缩放比例。
      #       实际摔落伤害 = 原始计算值 × fall_damage_multiplier。
      # 必需:  否
      # 类型:  double (浮点数)
      # 默认:  0.5
      # 范围:  0.0 (无伤害) ~ 1.0 (全额伤害)
      # 注意:  设为 0 可完全禁用弹跳引起的摔落伤害。
      # ----------------------------------------------------------------
      fall_damage_multiplier: 0.5

      # ----------------------------------------------------------------
      # sync_player_position: 反弹后同步玩家位置
      # 作用:  弹跳后强制同步客户端与服务端的移动向量。
      #       设为 true 时，服务器会在弹跳 1 刻后标记需要向客户端
      #       修正移动向量。
      # 必需:  否
      # 类型:  boolean (布尔值)
      # 默认:  true
      # 注意:  - 可缓解与原版可弹跳方块（如床、史莱姆块）行为不一致的问题，
      #         但并非完美解决方案。
      #       - 如果自定义方块使用的视觉方块状态的 bounce_height 数值
      #         （例如床在 26.1.2 之前是 0.66）与弹跳方块行为的数值相同，
      #         可以将此选项设为 false 以节省服务端开销。
      # ----------------------------------------------------------------
      sync_player_position: true

  # ====================================================================
  # 完整示例 1: 超级弹跳方块 (高弹跳 + 无摔落伤害)
  # ====================================================================
  # 适用于游乐场地图、跑酷小游戏等需要高弹跳的场景。
  # bounce_height 设为接近 1.0 实现几乎完全反弹，
  # fall_damage_multiplier 设为 0 避免玩家因反复弹跳累积摔落伤害。
  # ====================================================================
  custom:super_bouncer:
    behavior:
      type: bouncing_block
      bounce_height: 0.95
      fall_damage_multiplier: 0.0
      sync_player_position: true

  # ====================================================================
  # 完整示例 2: 弱反弹方块 (低弹跳 + 视觉状态匹配)
  # ====================================================================
  # 适用于装饰性用途或微弱弹跳效果。
  # bounce_height 设为 0.25 仅产生轻微反弹。
  # 假设视觉方块状态的 bounce_restitution 也匹配了相同数值，
  # 因此 sync_player_position 可以关闭以优化性能。
  # ====================================================================
  custom:soft_cushion:
    behavior:
      type: bouncing_block
      bounce_height: 0.25
      fall_damage_multiplier: 0.8
      sync_player_position: false

  # ====================================================================
  # 完整示例 3: 完全静默方块 (不反弹 + 无伤害)
  # ====================================================================
  # 虽然名为弹跳方块，但 bounce_height 设为 0 后实体不会反弹，
  # 配合 fall_damage_multiplier 为 0 可以完全消除摔落伤害。
  # 适用于安全落地区域或保护玩家免摔的场景。
  # ====================================================================
  custom:safety_foam:
    behavior:
      type: bouncing_block
      bounce_height: 0.0
      fall_damage_multiplier: 0.0
      sync_player_position: true

  # ====================================================================
  # 完整示例 4: 原版床风格弹跳 (经典数值 + 无位置同步)
  # ====================================================================
  # 模拟原版床的弹跳效果。
  # 原版床在 CraftEngine 26.1.2 之前的 bounce 值为 0.66，
  # 若视觉方块状态使用了相同的 bounce_restitution 值，
  # sync_player_position 可设为 false 以避免多余同步。
  # ====================================================================
  custom:bed_bouncer:
    behavior:
      type: bouncing_block
      bounce_height: 0.66
      fall_damage_multiplier: 0.5
      sync_player_position: false

# ============================================================================
# 配置要点总结
# ============================================================================
#
# 必需配置:
#   blocks.<方块ID>.behavior.type = "bouncing_block"
#
# 可选配置 (及默认值):
#   blocks.<方块ID>.behavior.bounce_height             (double,  默认: 0.66)
#   blocks.<方块ID>.behavior.fall_damage_multiplier    (double,  默认: 0.5)
#   blocks.<方块ID>.behavior.sync_player_position      (boolean, 默认: true)
#
# 行为特性:
#   - 处于潜行状态的实体不会被反弹，而是正常落地。
#   - 摔落伤害按 fall_damage_multiplier 缩放，设为 0 可完全禁用。
#   - sync_player_position 为 true 时，服务器在弹跳 1 刻后
#     向客户端发送移动向量修正，用于缓解与原版行为的不一致。
#   - 若自定义方块的视觉方块状态的 bounce_restitution 与
#     bounce_height 相同，可将 sync_player_position 设为 false。
#
# 版本兼容性:
#   - bounce_height 默认值 0.66 仅在 CraftEngine 26.1.2 及更低版本生效。
#   - CraftEngine 26.2+ 推荐通过方块的视觉方块状态属性设置
#     bounce_restitution 来定义弹跳高度。
#
# 命名空间:
#   始终使用自定义命名空间 (如 custom, myproject, myaddon 等)，
#   不要覆盖原版 minecraft 命名空间的方块，除非明确知道后果。
# ============================================================================
