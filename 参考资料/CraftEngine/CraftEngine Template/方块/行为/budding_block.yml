# Wiki: configuration/block/behaviors/budding_block.md
# 母岩方块 (Budding Block) - 按阶段催生附近的方块，类似紫水晶母岩

blocks:
  custom:my_budding_block:                                     # << CHANGE THIS
    behavior:
      type: budding_block
      growth_chance: 0.2                                       # << CHANGE THIS 每次随机刻触发生长的概率（默认 0.2）
      blocks:                                                  # [必需] 分阶段方块 ID 列表，按生长顺序排列
        - custom:growth_stage_1                                # << CHANGE THIS 阶段 1：空气/水位置放置此方块
        - custom:growth_stage_2                                # << CHANGE THIS 阶段 2：阶段 1 方块升级为此
        - custom:growth_stage_3                                # << CHANGE THIS 阶段 3：最终阶段，不再继续生长

# ---------------------------------------------------------------------------
# 属性要求
# ---------------------------------------------------------------------------
# behavior.type    | 必需  | string   | "budding_block"
# growth_chance    | 可选  | double   | 0.2 (0.0~1.0)
# blocks           | 必需  | string[] | 至少 1 个方块 ID，按生长阶段排序
# ---------------------------------------------------------------------------
# 机制说明：
# - 随机刻行为：仅当方块收到随机刻时触发生长逻辑
# - 方向自动适配：放置时若目标方块支持 facing 属性，朝向设为生长方向
# - 含水自动适配：若目标方块支持 waterlogged 属性，自动根据目标位置是否在水中设置
# - 性能提示：建议将生长链控制在 3~5 阶段以内
# ---------------------------------------------------------------------------
