# ============================================================================
# 方块行为 - budding_block（母岩方块 / 催生方块行为）
# 灵感来自紫水晶母岩：方块每隔一定随机刻尝试在相邻位置生长 / 升级方块。
# ============================================================================
# 适用版本: CraftEngine 1.x+
# 命名空间: 此处使用 custom（请按需替换为你的项目命名空间）
# ============================================================================

# === blocks 根键 ============================================================
# Oraxen 风格：所有方块定义统一放在 blocks 根键下。
# 方块 ID 格式: <命名空间>:<方块名称>
# ============================================================================
blocks:
  custom:budding_mushroom_stone:
    # ========================================================================
    # behavior 节 - 定义方块的特殊行为
    # ========================================================================
    behavior:
      # ---- type (必需) -----------------------------------------------------
      # 行为类型标识符，固定为 "budding_block"
      type: budding_block

      # ---- growth_chance (可选) --------------------------------------------
      # 每次方块收到随机刻时，执行生长逻辑的概率。
      #   取值范围: 0.0 ~ 1.0（浮点数）
      #   默认值: 0.2
      #   说明: 0 = 永不生长, 1 = 每随机刻必生长。
      #         紫水晶母岩原版使用 0.2（20% 概率）。
      # ======================================================================
      growth_chance: 0.2                     # 每次随机刻触发生长的概率

      # ---- blocks (必需) ---------------------------------------------------
      # 方块生长阶段列表，按顺序定义从初始到最终的所有方块 ID。
      #   阶段规则:
      #     1. 如果相邻位置是空气或水 → 放置 blocks[0]（第一个方块）
      #     2. 如果相邻位置已是 blocks 中的方块（且非最后阶段）
      #        → 升级为 blocks 中的下一个方块
      #     3. 如果相邻位置已是 blocks 最后一个方块 → 不再变化
      #
      #   最少项数: 1（仅放置，不升级）
      #   注意事项:
      #     - 列表顺序决定生长管线，不可乱序
      #     - 最后一个阶段是"成熟"状态，不再继续生长
      # ======================================================================
      blocks:
        # ---- 阶段 0: 初始催生形态 ------------------------------------------
        # 当相邻位置为空气/水时，放置此方块。
        - custom:small_mushroom              # 小蘑菇（第 1 阶段）

        # ---- 阶段 1: 中级形态 ----------------------------------------------
        # 当 blocks[0] 已存在时，升级为此方块。
        - custom:medium_mushroom             # 中蘑菇（第 2 阶段）

        # ---- 阶段 2: 最终成熟形态 ------------------------------------------
        # 最终阶段 - 不再继续生长。
        - custom:large_mushroom              # 大蘑菇（第 3 阶段 / 成熟）

    # ========================================================================
    # 重要机制说明（不会出现在 YAML 中，仅用于理解行为逻辑）：
    #
    # 1. 方向与朝向
    #    放置新方块时，若目标方块支持 facing 属性，朝向将自动设置为
    #    母岩指向该位置的方向（即生长方向）。
    #
    # 2. 含水（waterlogged）
    #    若目标方块支持 waterlogged 属性，将根据目标位置是否处于水中
    #    自动设置 waterlogged: true/false。
    #
    # 3. 触发条件
    #    此行为仅在方块收到 随机刻（random tick） 时触发。
    #    需要确保方块所在的区块已加载，且方块本身支持随机刻。
    #    可通过 settings.random_tick 调整全局随机刻频率。
    #
    # 4. 光照等额外条件
    #    budding_block 本身不检查光照、红石信号等条件。
    #    如需额外的生长限制，建议在 blocks 中使用具备环境检查条件的
    #    方块，或通过其他行为组合实现。
    #
    # 5. 性能提示
    #    每个阶段都会增加服务器负载。建议将生长链控制在 3~5 阶段以内。
    #    growth_chance 值越小，对性能影响越小。
    # ========================================================================

# ============================================================================
# 完整示例 1：紫水晶母岩风格（水晶生长）
# ============================================================================
# blocks:
#   custom:budding_amethyst:
#     behavior:
#       type: budding_block
#       growth_chance: 0.2
#       blocks:
#         - custom:small_amethyst_bud
#         - custom:medium_amethyst_bud
#         - custom:large_amethyst_bud
#         - custom:amethyst_cluster

# ============================================================================
# 完整示例 2：藤蔓蔓延（单阶段，仅放置不升级）
# ============================================================================
# blocks:
#   custom:budding_vine_stone:
#     behavior:
#       type: budding_block
#       growth_chance: 0.3
#       blocks:
#         - custom:hanging_vines          # 仅放置，永不升级

# ============================================================================
# 完整示例 3：矿物结晶（包含 facing 和 waterlogged 支持）
# ============================================================================
# blocks:
#   custom:budding_crystal_ore:
#     behavior:
#       type: budding_block
#       growth_chance: 0.15                # 较慢的生长速度
#       blocks:
#         - custom:crystal_spike_small      # 小水晶刺
#         - custom:crystal_spike_medium     # 中水晶刺
#         - custom:crystal_spike_large      # 大水晶刺（最终形态）

# ============================================================================
# 属性要求总结
# ============================================================================
# 字段             | 必需  | 类型       | 默认值 | 说明
# ============================================================================
# behavior.type    | 是    | string     | -      | 固定为 "budding_block"
# growth_chance    | 否    | double     | 0.2    | 0~1 生长概率
# blocks           | 是    | string[]   | -      | 至少 1 个方块 ID 的阶段列表
# ============================================================================
