# Wiki: CraftEngine Wiki/configuration/block/behaviors/sofa_block.md
# 沙发方块 (Sofa Block) - 可连接座椅。shape 在 PP 更新时根据周围沙发朝向自动计算为直形或内角，形成连续沙发结构。

blocks:
  custom:sofa: # << CHANGE THIS (namespace:block_id)
    behavior:
      type: sofa_block
    properties:
      # shape (必需): sofa_shape - 沙发形状。PP 更新时自动计算为直形或内角
      shape: straight # << CHANGE THIS (可选: straight | inner_right | inner_left)
      # facing (必需): horizontal_direction - 沙发正面朝向
      facing: north # << CHANGE THIS (可选: north | south | east | west)
      # waterlogged (可选): boolean - 是否可含水
      waterlogged: false # << CHANGE THIS
