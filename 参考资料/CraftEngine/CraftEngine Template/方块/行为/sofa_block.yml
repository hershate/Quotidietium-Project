# ============================================================================
# CraftEngine - 沙发方块 (Sofa Block) 配置模板
# ============================================================================
# 行为类型: sofa_block
# 描述:     沙发的行为类似可连接的座椅。shape 属性会在 PP 更新时根据周围
#           沙发的朝向自动计算为直形或内角，从而形成连续的沙发结构。
# 参考文档: CraftEngine Wiki - configuration/block/behaviors/sofa_block.md
# ============================================================================

# ----------------------------------------------------------------------------
# blocks 根键
# 在此注册所有自定义方块。每个键为一个方块的命名空间 ID。
# 格式: <命名空间>:<方块名称>
# 使用自定义命名空间（而非 "default"）以避免与 CraftEngine 内置方块冲突。
# ----------------------------------------------------------------------------
blocks:

  # ==========================================================================
  # 单座沙发 (单人沙发)
  # ==========================================================================
  # 一个独立的单人沙发，可放置并连接成连续的沙发结构。
  # ==========================================================================
  myitems:single_sofa:
    behavior:
      # behavior.type: 必须为 "sofa_block"
      type: sofa_block

      # shape (必需): sofa_shape 类型
      # 控制沙发的形状外观。
      # 可选值:
      #   - straight      直形 / 直线段沙发
      #   - inner_corner  内角拐角沙发
      #   - outer_corner  外角拐角沙发 (若有)
      #   - single        独立单座沙发 (不与其它沙发连接)
      # 注意: 在 PP 更新时，shape 会根据周围沙发的朝向自动计算，
      #       此处为初始值。
      shape: straight

      # facing (必需): horizontal_direction 类型
      # 沙发的朝向（正面朝向的方向）。
      # 可选值:
      #   - north  朝北 (Z 负方向)
      #   - east   朝东 (X 正方向)
      #   - south  朝南 (Z 正方向)
      #   - west   朝西 (X 负方向)
      facing: north

      # waterlogged (可选): boolean
      # 此方块是否可以含水（即放置在水源中时呈现含水材质）。
      # 默认值: false
      # 注意: 若设为 true，在放置于水中时方块的碰撞箱和视觉效果
      #       会以含水状态呈现，但不影响沙发本身的坐姿功能。
      waterlogged: false

  # ==========================================================================
  # 双人沙发 (双座沙发)
  # ==========================================================================
  # 一个横向放置的双人沙发示例。
  # ==========================================================================
  myitems:double_sofa:
    behavior:
      type: sofa_block
      shape: straight
      facing: east
      # 水没任意值均可——此处显式使用默认值以表明意图
      waterlogged: false

  # ==========================================================================
  # L 形拐角沙发
  # ==========================================================================
  # 在角落里配置为内角形状的沙发。
  # ==========================================================================
  myitems:corner_sofa:
    behavior:
      type: sofa_block
      shape: inner_corner
      facing: south
      waterlogged: false

# ============================================================================
# 属性汇总
# ============================================================================
# 属性名称        | 属性类型                 | 必需  | 默认值   | 说明
# ----------------+-------------------------+-------+---------+------------------
# shape           | sofa_shape              | 是    | -       | 沙发形状 (straight,
#                 |                         |       |         | inner_corner,
#                 |                         |       |         | outer_corner, single)
# facing          | horizontal_direction    | 是    | -       | 放置朝向 (north,
#                 |                         |       |         | east, south, west)
# waterlogged     | boolean                 | 否    | false   | 是否可含水
# ============================================================================
