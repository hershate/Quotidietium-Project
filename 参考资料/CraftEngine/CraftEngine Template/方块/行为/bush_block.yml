# Source: CraftEngine Wiki/configuration/block/behaviors/bush_block.md
# 灌木方块 - 只能生长在特定支撑方块上，支撑破坏时方块随之破坏

blocks:
  custom:your_bush:                          # << CHANGE THIS: 方块ID
    behavior:
      type: bush_block
      blacklist: false                        # << CHANGE THIS: true=黑名单, false=白名单
      bottom_blocks:                          # << CHANGE THIS: 支撑方块列表（白名单/黑名单目标）
        - minecraft:grass_block
        - minecraft:dirt
        - custom:example_soil
      bottom_block_tags:                      # << CHANGE THIS: 方块标签（可选，与 bottom_blocks 取并集）
        - minecraft:dirt
        - minecraft:farmland
      stackable: false                        # << CHANGE THIS: 是否允许同类型方块向上堆叠
      max_height: 0                           # << CHANGE THIS: 最大堆叠高度（stackable: true 时需大于 1）
      delay: 0                                # << CHANGE THIS: 支撑检查延迟刻数（0=立即破坏）

# ========== 属性要求 ==========
# type:             必填, 固定为 "bush_block"
# blacklist:        可选, 默认 false
# stackable:        可选, 默认 false
# max_height:       可选, 默认 0, 仅 stackable=true 时生效且必须 > 1
# delay:            可选, 默认 0
# bottom_blocks:    可选, 默认空列表
# bottom_block_tags: 可选, 默认空列表
