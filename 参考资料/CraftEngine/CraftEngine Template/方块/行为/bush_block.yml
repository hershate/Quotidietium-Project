# ============================================================================
# 灌木方块配置模板 (Bush Block Configuration Template)
# 对应Wiki页面: configuration/block/behaviors/bush_block.md
# 命名空间: custom (请根据实际项目替换)
# ============================================================================
#
# 【行为概述】
# 灌木方块只能生长在特定的支撑方块上——类似花或树苗。
# 若支撑方块被破坏或变为无效，该方块即会自行破坏。
# 可选择堆叠：开启 stackable 后，多个同类型方块可互相堆叠。
#
# 【模式说明】
#   blacklist: true  黑名单模式 —— 方块可生长在除了列表以外的任何方块上
#   blacklist: false 白名单模式 —— 方块只能生长在列表中的方块上
# ============================================================================

# --------------------------------------------------------------------------
# blocks —— 根键，所有方块配置的入口
# 格式: <命名空间>:<方块ID>
# --------------------------------------------------------------------------
blocks:
  # 示例：custom:magic_mushroom
  # 命名空间建议使用自定义前缀（如 custom、project、modid 等）
  custom:glowing_bush:
    # --------------------------------------------------------------------------
    # behavior —— 方块行为定义
    # 注意：behavior 是行为层根键，内部通过 type 指定行为类型
    # --------------------------------------------------------------------------
    behavior:
      # type: 行为类型标识，必填
      # 固定值: bush_block
      # 约束: 必须为 bush_block，不可省略
      type: bush_block

      # --------------------------------------------------------------------------
      # blacklist —— 匹配模式开关
      # 数据类型: boolean
      # 默认值: false
      #    true  —— 黑名单模式：方块可生长在除了 bottom_blocks/bottom_block_tags 以外的任何方块上
      #    false —— 白名单模式：方块只能生长在 bottom_blocks/bottom_block_tags 列出的方块上
      # 注意: 白名单模式下若列表为空，则无法在任何方块上生长
      # --------------------------------------------------------------------------
      blacklist: false

      # --------------------------------------------------------------------------
      # stackable —— 是否允许同类型方块向上堆叠
      # 数据类型: boolean
      # 默认值: false
      # 说明: 开启后，多个同类型的灌木方块可互相堆叠生长。
      #       堆叠时会计算下方连续的同类型方块数量。
      # --------------------------------------------------------------------------
      stackable: true

      # --------------------------------------------------------------------------
      # max_height —— 最大堆叠高度
      # 数据类型: integer
      # 默认值: 0
      # 约束: 仅在 stackable 为 true 时生效，且值须大于 1
      # 说明: 当下方同类型方块数量达到此值时，将无法继续向上堆叠。
      #       若 stackable 为 false，此选项无效，建议保持 0。
      # --------------------------------------------------------------------------
      max_height: 3

      # --------------------------------------------------------------------------
      # delay —— 存活检查延迟（单位：游戏刻）
      # 数据类型: integer
      # 默认值: 0
      # 说明: 0   = 支撑方块无效时立即破坏方块
      #       >0 = 因 PP更新（方块更新）触发的存活检查会延迟相应刻数执行，
      #            而非立即执行。适用于需要在短暂方块替换过程中存活的方块。
      # 建议: 对普通植物设为 0；对需要抵抗瞬间方块替换的场景可设 1-2 tick
      # --------------------------------------------------------------------------
      delay: 0

      # --------------------------------------------------------------------------
      # bottom_blocks —— 支撑方块列表（按具体方块匹配）
      # 数据类型: list[string]
      # 可选：可根据需求决定是否提供
      # 格式: <命名空间>:<方块ID> 或 <命名空间>:<标签>
      # 说明: 指定哪些方块可作为此灌木的支撑方块。
      #       白名单模式下，只有在此列表 和/或 bottom_block_tags 中的方块才允许生长。
      #       黑名单模式下，此列表中的方块将被排除（不可生长）。
      # 注意: 若既不设置 bottom_blocks 也不设置 bottom_block_tags，
      #       白名单模式将导致方块无法在任何地方生长。
      # --------------------------------------------------------------------------
      bottom_blocks:
        - custom:enchanted_soil
        - custom:magical_dirt
        - minecraft:grass_block
        - minecraft:podzol

      # --------------------------------------------------------------------------
      # bottom_block_tags —— 支撑方块标签列表（按标签匹配）
      # 数据类型: list[string]
      # 可选：可根据需求决定是否提供
      # 格式: <命名空间>:<标签名>
      # 说明: 通过标签批量匹配支撑方块，适用于需要对一类方块生效的场景。
      #       与 bottom_blocks 共同作用（逻辑或关系）。
      # 用法示例:
      #   - minecraft:dirt        # 所有泥土类方块
      #   - minecraft:farmland    # 所有耕地类方块
      #   - custom:magical_blocks # 自定义标签
      # --------------------------------------------------------------------------
      bottom_block_tags:
        - minecraft:dirt
        - minecraft:farmland
        - custom:fertile_soils

# ============================================================================
# 完整使用示例（可直接复制使用）
# ============================================================================
#
# blocks:
#   custom:fairy_flower:
#     behavior:
#       type: bush_block
#       blacklist: false                # 白名单模式
#       stackable: false                # 不允许堆叠
#       max_height: 0                   # 无堆叠，设为 0
#       delay: 0                        # 支撑无效时立即破坏
#       bottom_blocks:                  # 允许生长的支撑方块
#         - minecraft:grass_block
#         - minecraft:podzol
#       bottom_block_tags:
#         - minecraft:dirt
#
# --------------------------------------------------------------------------
#
# blocks:
#   custom:magic_vine:
#     behavior:
#       type: bush_block
#       blacklist: true                 # 黑名单模式
#       stackable: true                 # 允许堆叠
#       max_height: 5                   # 最多堆叠 5 层
#       delay: 1                        # 延迟 1 tick 检查
#       bottom_blocks:                  # 以下方块不能生长
#         - minecraft:air
#         - minecraft:water
#       bottom_block_tags:
#         - minecraft:lava
#
# ============================================================================
# 【属性要求汇总】
# ============================================================================
# 字段名            | 类型      | 必填 | 默认值 | 约束说明
# ------------------|-----------|------|--------|--------------------------------
# type              | string    | 是   | -      | 固定为 "bush_block"
# blacklist         | boolean   | 否   | false  | true=黑名单, false=白名单
# stackable         | boolean   | 否   | false  | 是否允许同类型方块堆叠
# max_height        | integer   | 否   | 0      | stackable=true 时须 > 1
# delay             | integer   | 否   | 0      | 存活检查延迟（游戏刻）
# bottom_blocks     | string[]  | 否   | []     | 支撑方块列表（命名空间:ID）
# bottom_block_tags | string[]  | 否   | []     | 支撑方块标签列表
# ============================================================================
