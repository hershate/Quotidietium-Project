# ============================================================================
# CraftEngine - 附着茎方块 (Attached Stem Block) 配置模板
# ============================================================================
# 对应 Wiki: configuration/block/behaviors/attached_stem_block.md
# 风格: Oraxen 式注释模板
# ============================================================================
#
# 【行为概述】
# 附着茎方块将茎与其果实相连，行为类似原版附着的南瓜茎或西瓜茎。
# 它朝向果实方块，并在 PPUpdate 中检查朝向一侧是否仍为指定的果实方块。
# 当果实被移除时，附着茎会自动退化为普通茎方块（转换为 stem 所指向的方块，
# 若目标方块具有 age 属性则设为最大值，否则使用默认状态）。
#
# 【必需属性】
#   - facing (horizontal_direction): 指定附着茎朝向果实的方向
#
# 【必需配置项】
#   - fruit: 此茎所附着的果实方块（命名空间完整 ID）
#   - stem:  果实被破坏后退化成的普通茎方块（命名空间完整 ID）
# ============================================================================

# ============================================================================
# blocks 根键
# ============================================================================
# 在此处注册所有自定义方块。每个方块以 <namespace>:<id> 作为键名。
# 注意: 请将下方 "custom" 替换为你的项目命名空间（例如 myproject, server, epic 等）。
# ============================================================================
blocks:

  # ==========================================================================
  # 示例方块: 哈密瓜附着茎
  # 方块 ID: custom:attached_hami_melon_stem
  # ==========================================================================
  custom:attached_hami_melon_stem:

    # ------------------------------------------------------------------------
    # behavior - 方块行为定义
    # ------------------------------------------------------------------------
    behavior:

      # type - 行为类型 (固定为 attached_stem_block)
      # 不可更改，否则 CraftEngine 无法识别此行为。
      type: attached_stem_block

      # fruit - 此附着茎所连接的果实方块 (必需)
      # 格式: <namespace>:<block_id>
      # 说明: 当果实方块存在时，此茎保持附着状态；
      #       若果实被破坏/移除，附着茎将退化为 stem 指定的方块。
      fruit: custom:hami_melon

      # stem - 退化后的普通茎方块 (必需)
      # 格式: <namespace>:<block_id>
      # 说明: 当附着状态失效时（果实被破坏），方块会转换为该值指定的普通茎方块。
      #       若该方块具有 age 属性，则其值会被设置为最大值；
      #       否则将使用其默认状态。
      stem: custom:hami_melon_stem

  # ==========================================================================
  # 示例方块: 黄金甜瓜附着茎 (第二个配置示例)
  # ==========================================================================
  custom:attached_golden_melon_stem:

    behavior:
      type: attached_stem_block
      fruit: custom:golden_melon
      stem: custom:golden_melon_stem

  # ==========================================================================
  # 【属性定义】（如需覆盖默认方块属性）
  # 附着茎必须定义 facing 属性，类型为 horizontal_direction。
  # 你可以通过 properties 节点覆盖或补充属性。
  # ==========================================================================
  custom:attached_fancy_berry_stem:

    # ----------------------------------------------------------------------
    # properties - 方块属性 (可选)
    # 如果只想使用默认属性行为可省略此节点。
    # 注意: attached_stem_block 行为内部要求必须存在 facing 属性，
    #       未显式定义时 CraftEngine 会使用默认的水平方向处理逻辑。
    # ----------------------------------------------------------------------
    properties:
      facing:
        type: horizontal_direction
        # 可选约束项：
        # default: north     # 默认朝向（若不指定则随机）
        # values: [north, south, east, west]  # 限制允许的值

    behavior:
      type: attached_stem_block
      fruit: custom:fancy_berry
      stem: custom:fancy_berry_stem

# ============================================================================
# 【完整示例】—— 可直接复制使用
# ============================================================================
# 以下是一个可直接粘贴到你项目的 blocks 配置中的完整示例。
# 将 "your_namespace" 替换为你的项目命名空间。
#
# blocks:
#   your_namespace:attached_diamond_fruit_stem:
#     properties:
#       facing:
#         type: horizontal_direction
#         default: north
#     behavior:
#       type: attached_stem_block
#       fruit: your_namespace:diamond_fruit
#       stem: your_namespace:diamond_fruit_stem
# ============================================================================

# ============================================================================
# 【注意事项】
# ============================================================================
# 1. fruit 和 stem 均为必需项，缺失任一都会导致配置加载失败。
# 2. fruit 必须指向一个已注册的果实方块（确保存在对应的 behavior 定义）。
# 3. stem 必须指向一个已注册的茎方块（通常是 stem_block 行为）。
# 4. 退化逻辑：当附着状态失效时 ->
#      a) 若 stem 方块具有 age 属性，将其 age 设为最大值（成熟状态）
#      b) 若 stem 方块无 age 属性，使用其默认状态
# 5. facing 方向是在 PPUpdate 时进行检查，确保朝向一侧仍然是指定的果实方块。
# ============================================================================
