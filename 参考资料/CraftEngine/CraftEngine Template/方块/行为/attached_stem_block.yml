# Wiki: configuration/block/behaviors/attached_stem_block.md
# 附着茎方块 - 将茎与其果实相连，朝向果实方块，果实被移除时自动退化为普通茎

blocks:
  custom:attached_example_stem:
    # 必需属性：水平朝向
    properties:
      facing:
        type: horizontal_direction
        default: north                                          # << CHANGE THIS

    behavior:
      type: attached_stem_block
      fruit: custom:example_fruit                               # << CHANGE THIS - 此茎所附着的果实方块
      stem: custom:example_stem                                 # << CHANGE THIS - 果实被破坏后退化成的普通茎方块

# 属性要求:
#   facing | horizontal_direction | 必需
# 行为配置要求:
#   fruit | 方块ID | 必需
#   stem  | 方块ID | 必需
# 当附着状态失效时，方块会转换为 stem 指定的普通茎方块。
# 若该方块具有 age 属性，则其值会被设置为最大值，否则将使用其默认状态。
