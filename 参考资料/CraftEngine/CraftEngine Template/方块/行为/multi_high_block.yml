# ============================================================================
# 方块行为配置模板 —— multi_high_block (多层方块)
# ============================================================================
# 多层方块会根据指定的 int 属性自动生成一个垂直连续的多格结构。
# 属性的取值范围决定结构的层数。
#
# 行为特性：
# - 例如 range: 0~2 会生成三层结构：
#   - 0 = 底部 (bottom)
#   - 1 = 中部 (middle)
#   - 2 = 顶部 (top)
# - 放置时会自动在上方生成其余层级，并将每层的属性值设置为对应高度。
# - 每一层必须与相邻层保持连续。若某层检测到相邻层缺失、
#   属性值不连续或不是同一种自定义方块，则该层会被移除，
#   并通过 PP 更新使整个结构最终被移除。
#
# 破坏行为：
# - 破坏非底部部分 + 正确工具 → 正常掉落逻辑
# - 破坏非底部部分 + 错误工具 → 底部一并移除，无掉落
# - 破坏非底部部分 + 创造模式 → 底部一并移除，无掉落
#
# 放置条件：
# - 所有需要占用的位置都必须可替换
# - 结构顶部不能超过世界建筑高度上限
# ============================================================================

blocks:
  # ==========================================================================
  # 自定义命名空间示例：yournamespace:multi_high_block_example
  # 将 "yournamespace" 替换为你的项目命名空间，
  # "multi_high_block_example" 替换为方块 ID。
  # ==========================================================================
  yournamespace:multi_high_block_example:
    # ---- 方块状态 (states) --------------------------------------------------
    # 声明方块的所有属性状态。
    # 多层方块需要至少一个自定义 int 属性来控制高度。
    states:
      properties:
        # ---- 高度属性 (自定义名称) -------------------------------------------
        # 用于控制结构层数的 int 属性。
        # 属性名可自定义，但必须与 behavior.property 中的值一致。
        # 类型: int
        # 必需: 是
        # range: "min~max" 格式，必须包含至少 2 个值。
        #       层数 = max - min + 1。例如 "0~2" 生成 3 层。
        height:
          type: int
          default: 0                  # 默认值，通常为 range 最小值
          range: 0~2                  # 0=底部, 1=中部, 2=顶部

    # ---- 行为配置 (behavior) ------------------------------------------------
    behavior:
      # ---- 行为类型 (必填) ---------------------------------------------------
      # 固定值: multi_high_block
      # 将此方块标记为 "多层方块" 行为
      type: multi_high_block

      # ---- property (高度属性名) (必填) ---------------------------------------
      # 指定用于控制结构层数的 int 属性名称。
      # 必须与 states.properties 中定义的某个 int 属性名一致。
      # 类型: string
      # 示例: "height"
      property: height

# ============================================================================
# 完整示例 —— 一个 4 层高的 "远古之柱"
# ============================================================================
# 下面展示一个从底部到顶部共 4 层的立柱方块配置。
# 层数由 range: 0~3 决定，共 4 层：
#   - 0 = 底部 (底座，最粗)
#   - 1 = 下层 (柱身下部)
#   - 2 = 上层 (柱身上部)
#   - 3 = 顶部 (柱顶装饰)
# ============================================================================
# blocks:
#   myquest:ancient_pillar:
#     display_name: "远古之柱"
#     material: STONE
#     states:
#       properties:
#         # 高度属性 —— 0=底部, 1=下层, 2=上层, 3=顶部
#         layer:
#           type: int
#           default: 0
#           range: 0~3
#     behavior:
#       type: multi_high_block
#       property: layer                # 告诉行为使用 "layer" 属性控制层数
#     # ... 其他方块配置 (模型、硬度、亮度、掉落物等)
#
# 说明：
# - property: layer → 告诉 multi_high_block 行为使用哪个属性来控制高度
# - range: 0~3 → 共 4 层 (0, 1, 2, 3)
# - 层数计算公式: max - min + 1 = 3 - 0 + 1 = 4
# - 放置规则：
#   - 玩家在目标位置放置时，系统自动在 Y+1, Y+2, Y+3 处生成上方层级
#   - 每层的 layer 属性值自动设置为对应值: 0, 1, 2, 3
# - 破坏规则：
#   - 使用正确工具破坏任意非底部层 → 仅破坏该层 + 正常掉落
#   - 使用错误工具破坏非底部层 → 整个结构移除 + 无掉落
#   - 创造模式破坏非底部层 → 整个结构移除 + 无掉落
# - 完整性检测：
#   - 任意一层检测到相邻层缺失 → 整结构通过 PP 更新移除
#   - 任意一层检测到属性值不连续 → 整结构通过 PP 更新移除
# - 放置限制：
#   - 所有层所在位置必须可替换 (replaceable)
#   - 结构顶部不能超过世界建筑高度上限
#
# 完整属性列表 (behavior 中)：
#   键名        类型      必填    默认值  说明
#   --------------------------------------------------------------------
#   type        string    是      -       行为类型，固定为 "multi_high_block"
#   property    string    是      -       用于控制高度的 int 属性名，需与 states.properties 中定义的属性名一致
#
# states.properties 要求：
#   至少定义一个 int 类型的属性，并设置合理的 range。
#   该属性名必须与 behavior.property 的值相同。
#   range 的最小值和最大值的差值至少为 1 (即至少 2 层)。
# ============================================================================
