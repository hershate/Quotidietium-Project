# Wiki: CraftEngine Wiki/configuration/block/behaviors/multi_high_block.md
# 多层方块 - 根据 int 属性自动生成垂直连续的多格结构

blocks:
  custom:multi_high_block:                     # << CHANGE THIS (命名空间:方块ID)
    states:
      properties:
        height:                                # << CHANGE THIS (自定义 int 属性名，需与下方 property 一致)
          type: int
          default: 0
          range: 0~2                           # << CHANGE THIS (0=底部，中值=中部，最大值=顶部；总层数 = max - min + 1)
    behavior:
      type: multi_high_block
      property: height                         # << CHANGE THIS (用于控制高度的 int 属性名，必需；必须与上方 properties 中的键名一致)

# states.properties 要求:
#   - 至少定义一个 int 类型属性，设置合理的 range (差值 >= 1，即至少 2 层)
#   - 属性名必须与 behavior.property 的值相同
#
# behavior 属性:
#   type     string  必需  固定为 "multi_high_block"
#   property string  必需  用于控制高度的 int 属性名
