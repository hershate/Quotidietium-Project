# =============================================================================
# 可切换灯方块 (toggleable_lamp_block)
# Wiki: CraftEngine Wiki/configuration/block/behaviors/toggleable_lamp_block.md
# 通过切换 lit 属性控制亮灭状态。可由红石、手动交互或两者共同控制。
# =============================================================================

blocks:
  custom:my_toggleable_lamp:                                          # << CHANGE THIS
    behavior:
      type: toggleable_lamp_block
      # false = 仅红石控制 (powered 属性为必需)
      # true  = 允许右键手动切换 lit (powered 为可选)
      can_open_with_hand: false                                       # << CHANGE THIS

    properties:
      # lit (boolean, 必需): 当前亮灭状态
      lit: false                                                      # << CHANGE THIS

      # powered (boolean): 当前是否受红石信号充能
      # 条件必需: can_open_with_hand 为 false 时必需; 为 true 时可选
      powered: false                                                  # << CHANGE THIS
