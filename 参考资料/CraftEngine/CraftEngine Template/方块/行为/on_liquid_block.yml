# ============================================================================
# 液面方块 (on_liquid_block) 行为模板
# ============================================================================
# 功能：方块只能放置在液体源表面上（类似睡莲）。
#       与 near_liquid_block 不同，它要求正下方必须是液体**源**方块，
#       流动液体不算。冰视为水源。
# ============================================================================

blocks:
  # ==========================================================================
  # 自定义命名空间示例 (namespace:id)
  # 请将 "my_items" 替换为你实际的命名空间
  # ==========================================================================
  my_items:lotus_leaf:
    # ========================================================================
    # 行为配置
    # ========================================================================
    behavior:
      # 行为类型 —— 固定为 on_liquid_block
      type: on_liquid_block

      # --------------------------------------------------------------------
      # liquid_type (可选, 列表)
      # --------------------------------------------------------------------
      # 描述：方块可坐落的液体类型列表。
      # 默认值：["water"]
      # 可选项: water / lava / any 或具体液体材质名称
      # 注意：如果填写 any，则所有液体源均可放置
      # --------------------------------------------------------------------
      liquid_type:
        - water
        # - lava
        # - any

      # --------------------------------------------------------------------
      # stackable (可选, 布尔值)
      # --------------------------------------------------------------------
      # 描述：是否允许方块堆叠在同类型方块上存活。
      # 默认值：false
      # - true  -> 即使下方无指定液体源，只要堆叠在同类型方块上即可存活
      # - false -> 需要正下方有指定的液体源
      # 适用场景：甘蔗/竹子等多层生长作物需要开启堆叠
      # --------------------------------------------------------------------
      stackable: false

  # ==========================================================================
  # 完整示例：多层芦苇（堆叠模式）
  # ==========================================================================
  my_items:reed:
    display_name: "&a芦苇"
    material: SUGAR_CANE
    behavior:
      type: on_liquid_block
      liquid_type:
        - water
      stackable: true                          # 允许堆叠，芦苇可多层生长
    mechanics:
      # 此处可添加其他机制配置（如生长、掉落等）
      ...

  # ==========================================================================
  # 完整示例：岩浆莲（非堆叠模式，只能放置在岩浆源上）
  # ==========================================================================
  my_items:lava_lily:
    display_name: "&c岩浆莲"
    material: LILY_PAD
    behavior:
      type: on_liquid_block
      liquid_type:
        - lava
      stackable: false                         # 非堆叠，正下方必须有岩浆源
    # ... 其他配置 ...

  # ==========================================================================
  # 完整示例：通用液体漂浮物（支持所有液体）
  # ==========================================================================
  my_items:floating_debris:
    display_name: "&7浮游残骸"
    material: DEAD_BUSH
    behavior:
      type: on_liquid_block
      liquid_type:
        - any                                  # 可在所有液体源上放置
      stackable: false
    # ... 其他配置 ...

# ============================================================================
# 属性要求与注意事项
# ============================================================================
# 1. 必填属性:
#    - behavior.type = "on_liquid_block"  (固定值)
#
# 2. 选填属性:
#    - liquid_type: 列表，指定可放置的液体类型 (默认 ["water"])
#    - stackable:   false（默认）/ true
#
# 3. 行为规则:
#    - 非堆叠模式 (stackable: false):
#      方块正下方必须是指定的液体**源**方块（流动液体无效）
#    - 堆叠模式 (stackable: true):
#      方块正下方即使无液体源，只要下方是同类型方块即可存活
#    - 冰 (ICE / PACKED_ICE / BLUE_ICE) 视为水源
#
# 4. 兼容性说明:
#    - 可配合其他机制（mechanics）使用，如掉落、生长、交互等
#    - 与 near_liquid_block 的区别：
#      on_liquid_block 要求正下方必须是液体源（严格位置要求）
#      near_liquid_block 只要求附近存在液体（宽松范围要求）
#
# 5. 常见液体类型:
#    - water  -> 水源方块
#    - lava   -> 岩浆源方块
#    - any    -> 任意液体源
# ============================================================================
