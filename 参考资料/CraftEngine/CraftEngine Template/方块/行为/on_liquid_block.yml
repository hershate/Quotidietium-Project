# Wiki: configuration/block/behaviors/on_liquid_block.md
# 液面方块 (on_liquid_block) — 方块只能放置在液体源表面上（类似睡莲）
# 要求正下方必须是液体源方块（流动液体无效，冰视为水源）

blocks:
  custom:my_lily_pad:                             # << CHANGE THIS block ID
    behavior:
      type: on_liquid_block
      liquid_type:                                # 可坐落的液体类型列表（默认 ["water"]）
        - water                                   # << CHANGE THIS liquid type(s): water / lava / any
      stackable: false                            # << CHANGE THIS: true=可堆叠在同类型方块上存活

# ============================================================================
# 属性要求
# ============================================================================
# [必填]
#   behavior.type = "on_liquid_block"  (固定值)
#
# [选填]
#   liquid_type (list):  指定可放置的液体类型  默认 ["water"]
#   stackable   (bool):  允许堆叠在同ID方块上  默认 false
#
# 堆叠模式 (stackable: true):   下方无液体源时，只要下方是同类型方块即可存活
# 非堆叠模式 (stackable: false): 正下方必须是指定的液体源方块
# 兼容: ICE / PACKED_ICE / BLUE_ICE 均视为水源
# 区别: near_liquid_block 只要求附近存在液体（宽松范围），
#       on_liquid_block 要求正下方必须是液体源（严格位置）
# ============================================================================
