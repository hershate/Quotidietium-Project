# Wiki: configuration/block/behaviors/falling_block.md
# 可下落方块 (Falling Block) - 失去支撑时变为下落的方块实体

blocks:
  custom:falling_block_example:
    behavior:
      type: falling_block

      # 每次碰撞造成的伤害值。需与 max_hurt 同时大于 0 才生效
      # -1 = 禁用伤害（默认）
      hurt_amount: -1  # << CHANGE THIS

      # 单次下落最多伤害的实体数量。需与 hurt_amount 同时大于 0 才生效
      # -1 = 禁用伤害（默认）
      max_hurt: -1  # << CHANGE THIS

      sounds:
        # 落地时播放的音效（可选）
        land: minecraft:block.anvil.land  # << CHANGE THIS
        # 摔毁时播放的音效（可选）
        destroy: minecraft:block.anvil.destroy  # << CHANGE THIS
