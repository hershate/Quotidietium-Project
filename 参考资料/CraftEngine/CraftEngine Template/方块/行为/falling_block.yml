# ===========================================================================
# CraftEngine - 可下落方块行为模板 (Falling Block Behavior)
# ===========================================================================
# 使方块在失去支撑时变为下落的方块实体，类似原版沙子/沙砾。
# 方块放置后 2 刻检查下方支撑，若下方为空且未低于世界最低高度则下落。
# 可配置下落方块对碰撞实体造成伤害，以及自定义落地/摔毁音效。
# ===========================================================================
# Oraxen 风格配置 - 使用自定义命名空间 myitems
# ===========================================================================

# ---------------------------------------------------------------------------
# blocks 根键 (Root Key)
# ---------------------------------------------------------------------------
# 所有自定义方块在此根键下注册，每个方块一个条目。
# 键名格式: <命名空间>:<方块ID>
#   - 命名空间: 用于区分不同来源的方块，避免 ID 冲突
#   - 方块ID:   方块的唯一标识符
# ---------------------------------------------------------------------------
blocks:

  # =========================================================================
  # 示例方块: 下落的危险岩
  # =========================================================================
  # 使用自定义命名空间 "myitems"
  # 此方块会在失去支撑时下落，并对碰撞实体造成伤害
  # =========================================================================
  myitems:falling_danger_rock:

    # -----------------------------------------------------------------------
    # behavior 配置段 (必须)
    # -----------------------------------------------------------------------
    # 定义方块的行为逻辑。必须配置 type 字段指定行为类型。
    # -----------------------------------------------------------------------
    behavior:

      # 行为类型: falling_block (必须)
      # 使方块获得类似沙子/沙砾的下落特性。
      type: falling_block

      # -------------------------------------------------------------------
      # hurt_amount - 每次碰撞造成的伤害值 (可选, 默认: -1)
      # -------------------------------------------------------------------
      # 下落的方块实体每碰撞一个实体时造成的伤害点数（半心）。
      # 设置为 -1 表示禁用伤害。
      # 注意: 此选项与 max_hurt 必须同时大于 0 才会生效。
      #       任意一项 <= 0 时，下落方块不会对实体造成任何伤害。
      # -------------------------------------------------------------------
      hurt_amount: 4.0

      # -------------------------------------------------------------------
      # max_hurt - 单次下落最多伤害的实体数量 (可选, 默认: -1)
      # -------------------------------------------------------------------
      # 一次下落过程中最多能伤害多少个实体。
      # 达到此数量后，下落方块将继续下落但不再造成伤害。
      # 设置为 -1 表示禁用（不限制数量，但伤害本身被禁用）。
      # -------------------------------------------------------------------
      max_hurt: 3

      # -------------------------------------------------------------------
      # sounds - 音效配置 (可选)
      # -------------------------------------------------------------------
      # 自定义下落方块在落地和摔毁时播放的音效。
      # 不配置则不播放自定义音效（使用原版行为默认音效或无音效）。
      # 音效值使用 Minecraft 命名空间 ID 格式。
      # -------------------------------------------------------------------
      sounds:

        # land - 落地音效 (可选)
        # 下落的方块成功落地（接触到方块表面）时播放。
        # 可替换为任意 Minecraft 音效，如:
        #   minecraft:block.sand.place      - 沙子落地声
        #   minecraft:block.gravel.place    - 沙砾落地声
        #   minecraft:block.stone.break     - 石头破碎声
        land: minecraft:block.anvil.land

        # destroy - 摔毁音效 (可选)
        # 下落的方块在坠落过程中摔毁（被破坏）时播放。
        # 可替换为任意 Minecraft 音效，如:
        #   minecraft:block.sand.break      - 沙子破坏声
        #   minecraft:block.gravel.break    - 沙砾破坏声
        #   minecraft:entity.item.break     - 物品破坏声
        destroy: minecraft:block.anvil.destroy

  # =========================================================================
  # 完整配置速查 - 最小化示例 (无伤害, 无音效)
  # =========================================================================
  # 最简单的 falling_block 配置，仅包含行为类型，使用所有默认值。
  # 适合只需要基本下落效果、不需要额外功能的方块。
  # =========================================================================
  myitems:simple_falling_dust:
    behavior:
      type: falling_block
      # hurt_amount 与 max_hurt 均使用默认值 -1，不造成伤害
      # 不配置 sounds 段，无自定义音效

  # =========================================================================
  # 完整配置速查 - 仅伤害, 无音效
  # =========================================================================
  # 启用伤害但使用原版音效（或不自定义音效时）的配置方式。
  # 适合只需要伤害功能、音效使用默认的方块。
  # =========================================================================
  myitems:spiky_falling_rock:
    behavior:
      type: falling_block
      hurt_amount: 2.5            # 每次碰撞造成 2.5 点伤害（1.25 心）
      max_hurt: 5                 # 一次下落最多伤害 5 个实体
      # 不配置 sounds 段 - 无自定义音效

  # =========================================================================
  # 完整配置速查 - 仅音效, 无伤害
  # =========================================================================
  # 自定义音效但不启用伤害的配置方式。
  # 适合需要下落音效反馈但不想造成伤害的装饰性方块。
  # 注意: 即使配置了 hurt_amount 和 max_hurt，只要任意一项 <= 0 则伤害禁用。
  # =========================================================================
  myitems:sandy_falling_block:
    behavior:
      type: falling_block
      # hurt_amount 不配置，默认 -1 → 伤害禁用
      # max_hurt 不配置，默认 -1 → 伤害禁用
      sounds:
        land: minecraft:block.sand.place
        destroy: minecraft:block.sand.break

  # =========================================================================
  # 属性要求与约束说明
  # =========================================================================
  # 必要属性:
  #   behavior.type - 必须设置为 "falling_block"
  #
  # 可选属性及默认值:
  #   hurt_amount: -1    (禁用伤害)
  #   max_hurt:    -1    (禁用伤害)
  #
  # 约束条件:
  #   1. hurt_amount 与 max_hurt 必须同时 > 0 才能启用实体伤害
  #   2. 若任意一项 <= 0 (包括默认值 -1)，下落方块不会造成伤害
  #   3. 伤害值可为小数（如 2.5 表示 1.25 心）
  #   4. sounds 段下的 land 和 destroy 均为可选，可单独配置其中一个
  #   5. 音效值使用 Minecraft 命名空间 ID 格式:
  #      minecraft:<分类>.<子分类>.<名称>
  #
  # 行为说明:
  #   - 方块放置后 2 刻 (1 秒) 检查下方支撑
  #   - 下方为空且未低于世界最小高度 → 转换为下落的方块实体
  #   - 下落方块实体使用当前方块状态
  #   - 与 vanilla 沙子和沙砾行为一致
  #
  # 命名空间建议:
  #   - 使用有意义的命名空间避免 ID 冲突
  #   - 推荐格式: <项目名/作者名>:<方块ID>
  #   - 示例: myitems:, myproject:, yourname:
  # =========================================================================
