# 本地文档: CraftEngine Wiki/configuration/block/behaviors/door_block.md
# 门方块 - 由上下两半组成的双格方块,放置时自动生成两半

blocks:
  custom:example_door:
    behavior:
      type: door_block

      # 是否允许右键点击切换开关 (默认: true)
      can_open_with_hand: true             # << CHANGE THIS

      # 是否允许风弹击中下半部分时切换 (默认: true)
      can_open_by_wind_charge: true        # << CHANGE THIS

      # 音效 (可选)
      sounds:
        open: block.wooden_door.open       # << CHANGE THIS
        close: block.wooden_door.close     # << CHANGE THIS

# 必需属性 (由方块定义/状态自动管理,无需在此声明)
#   open:        boolean               - 门是否开启
#   powered:     boolean               - 门是否被红石充能
#   half:        double_block_half     - 上半部分/下半部分
#   facing:      horizontal_direction  - 门朝向
#   hinge:       hinge                 - 铰链侧 (left/right)
