# ============================================================================
# 按钮方块 (button_block) — 行为配置模板
# ============================================================================
# 按钮方块是一种红石电源。被按下时激活并输出信号，片刻后自动弹起关闭。
# 可由以下方式触发：
#   - 玩家对着按钮使用
#   - 射出去的箭和投掷出的三叉戟落在按钮上
#   - 风弹命中产生风暴
# 按钮激活时会强充能自身附着的红石导体至充能等级15。
#
# 依赖行为: face_attached_horizontal_directional_block （必需，否则不会强充能）
# ============================================================================

blocks:
  # --------------------------------------------------------------------------
  # 自定义按钮方块
  # 命名空间格式: <namespace>:<id>
  # 建议使用你的项目名或作者名作为命名空间
  # --------------------------------------------------------------------------
  custom:my_button:
    # ==========================================================================
    # 行为列表 (behaviors)
    # 按钮方块至少需要两个行为：
    #   1. face_attached_horizontal_directional_block — 附着与朝向逻辑
    #   2. button_block                              — 按钮交互逻辑
    # ==========================================================================
    behaviors:

      # ------------------------------------------------------------------------
      # 行为 1: 水平面定向附着方块
      # 处理方块的附着面、朝向以及附着条件
      # 如果不需要强充能红石导体，此行为可省略，但按钮将失去朝向感知能力
      # ------------------------------------------------------------------------
      - type: face_attached_horizontal_directional_block

        # 附着模式: true = 黑名单, false = 白名单
        # 黑名单模式: 可附着到除了列表中的任何方块
        # 白名单模式: 只能附着到列表中的方块
        # 默认值: true
        blacklist: true

        # 附着方块列表（可选）：具体方块的 ID 列表
        # 仅在 face_attached_horizontal_directional_block 行为中生效
        # attached_blocks:
        #   - minecraft:stone
        #   - minecraft:oak_planks
        #   - minecraft:polished_blackstone_bricks

        # 附着方块标签列表（可选）：按标签匹配
        # 优先级高于单独方块列表
        attached_block_tags:
          - minecraft:dirt

      # ------------------------------------------------------------------------
      # 行为 2: 按钮方块
      # 按钮的核心交互行为
      # ------------------------------------------------------------------------
      - type: button_block

        # 按钮保持激活的时长，单位：游戏刻 (tick)
        # 1 秒 = 20 刻
        # 默认值: 30（1.5 秒）
        ticks_to_stay_pressed: 30

        # 是否允许箭或三叉戟激活按钮
        # true  = 箭/三叉戟落在按钮上会使其保持激活
        # false = 只有玩家和风弹可以激活按钮
        # 默认值: true
        can_be_activated_by_arrows: true

        # -----------------------------------------------
        # 音效配置（可选）
        # -----------------------------------------------
        sounds:
          # 按钮按下的音效
          on: minecraft:block.wooden_button.click_on

          # 按钮弹起的音效
          off: minecraft:block.wooden_button.click_off

    # ==========================================================================
    # 属性 (properties)  — 方块运行时状态
    # 注意: 这些属性通常由引擎自动管理，不需要在配置中手动定义，
    #        此处仅作文档说明
    # ==========================================================================
    # properties:
    #   powered: false        # boolean | 必需 | 按钮是否处于激活状态
    #   face: bottom          # anchor_type | 必需(*) | 按钮附着面（来自依赖行为）
    #   facing: north         # horizontal_direction | 必需(*) | 按钮朝向（来自依赖行为）
    #                         # (*) 仅在需要强充能自身附着的红石导体时必需

# ============================================================================
# 完整示例 (可直接复制使用)
# ============================================================================
# blocks:
#   custom:stone_button:
#     behaviors:
#       - type: face_attached_horizontal_directional_block
#         blacklist: true
#         attached_block_tags:
#           - minecraft:stone_bricks
#           - minecraft:base_stone_overworld
#       - type: button_block
#         ticks_to_stay_pressed: 40
#         can_be_activated_by_arrows: true
#         sounds:
#           on: minecraft:block.stone_button.click_on
#           off: minecraft:block.stone_button.click_off
#
# # ============================================================================
# # 属性速查表
# # ============================================================================
# # | 属性名称  | 属性类型               | 是否必需 | 来源行为                                    |
# # |-----------|------------------------|----------|---------------------------------------------|
# # | powered   | boolean                | 是       | button_block                                |
# # | face      | anchor_type            | 是*      | face_attached_horizontal_directional_block  |
# # | facing    | horizontal_direction   | 是*      | face_attached_horizontal_directional_block  |
# #                                                                        |
# # * 仅在需要强充能自身附着的红石导体时必需。                             |
# # face 与 facing 并非由 button_block 声明，而是来自与                       |
# # face_attached_horizontal_directional_block 行为的组合——这是一种典型的      |
# # 复合行为依赖。                                                            |
# # ============================================================================
