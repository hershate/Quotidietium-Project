# -------------------------------------------------------------------
# CraftEngine 方块状态配置参考模板
# 本地路径: configuration/block/states.md
#            configuration/block/states/properties.md
#            configuration/block/states/entity_renderer.md
# 用法: 复制需要的 block 定义到你的包中，替换 namespace 和 ID
# -------------------------------------------------------------------

# ===================================================================
# 一、单状态方块 (state) — 方块只有一种内部状态
# ===================================================================

# -----------------------------------------------------------
# 1.1 单状态 + auto_state 简单形式（插件自动分配原版状态）
# -----------------------------------------------------------
blocks:
  custom:my_simple_block:                                    # << CHANGE THIS
    state:
      auto_state: solid                                      # << CHANGE THIS（可选值: solid / note_block / mushroom_stem / leaves / sapling / pressure_plate / cactus / sugar_cane / tripwire / etc.）
      model:
        path: "minecraft:block/custom/my_simple_block"       # << CHANGE THIS

# -----------------------------------------------------------
# 1.2 单状态 + auto_state 展开形式（多个方块共享同一原版状态）
# -----------------------------------------------------------
  custom:shared_visual_block:                                # << CHANGE THIS
    state:
      auto_state:
        type: solid                                          # << CHANGE THIS
        id: "my_shared_visual"                               # << CHANGE THIS — 相同 id 的方块共用同一个原版方块状态
      model:
        path: "minecraft:block/custom/shared_visual_block"   # << CHANGE THIS

# -----------------------------------------------------------
# 1.3 单状态 + 精确指定原版状态（完整方块状态字符串）
# -----------------------------------------------------------
  custom:exact_state_block:                                  # << CHANGE THIS
    state:
      state: "minecraft:note_block[instrument=hat,note=0,powered=false]"  # << CHANGE THIS
      model:
        path: "minecraft:block/custom/exact_state_block"     # << CHANGE THIS

# -----------------------------------------------------------
# 1.4 单状态 + 精确指定原版状态（映射缩写 — 需预先配置 block_state_mappings）
# -----------------------------------------------------------
  custom:mapped_state_block:                                 # << CHANGE THIS
    state:
      state: "note_block:0"                                  # << CHANGE THIS — 映射缩写
      model:
        path: "minecraft:block/custom/mapped_state_block"    # << CHANGE THIS

# ===================================================================
# 二、模型配置 (model) 的六种形式
# ===================================================================

# -----------------------------------------------------------
# 2.1 仅 path — 使用已有的模型文件
# -----------------------------------------------------------
  custom:model_path_only:                                    # << CHANGE THIS
    state:
      auto_state: solid
      model:
        path: "minecraft:block/custom/existing_model"        # << CHANGE THIS

# -----------------------------------------------------------
# 2.2 path + generation — 自动生成模型（指定父模型和纹理）
# -----------------------------------------------------------
  custom:model_generation:                                   # << CHANGE THIS
    state:
      auto_state: solid
      model:
        path: "minecraft:block/custom/generated_block"       # << CHANGE THIS
        generation:
          parent: "minecraft:block/cube_column"              # << CHANGE THIS
          textures:
            end: "minecraft:block/custom/top"                # << CHANGE THIS
            side: "minecraft:block/custom/side"              # << CHANGE THIS

# -----------------------------------------------------------
# 2.3 path + textures 列表 — 插件自动推断模型结构
#      纹理数量 → 推断模型:
#        1 → cube_all       (path 可省略)
#        2 → cube_column    (path 必填, 顺序: end, side)
#        3 → cube_bottom_top(path 必填, 顺序: bottom, side, top)
#        4 → orientable     (path 必填, 顺序: bottom, front, side, top)
#       5+ → block/cube     (path 必填, 顺序: down, up, north, south, west, east)
# -----------------------------------------------------------
  custom:model_textures_list:                                # << CHANGE THIS
    state:
      auto_state: solid
      model:
        path: "minecraft:block/custom/textures_block"       # << CHANGE THIS — 2 张及以上纹理必填
        textures:
          - "minecraft:block/custom/bottom"                  # << CHANGE THIS
          - "minecraft:block/custom/top"                     # << CHANGE THIS
          - "minecraft:block/custom/side"                    # << CHANGE THIS

# 单张纹理（path 可省略，自动取纹理路径）
  custom:model_single_texture:                               # << CHANGE THIS
    state:
      auto_state: solid
      model:
        texture: "minecraft:block/custom/my_block"           # << CHANGE THIS

# ^ 前缀 — 该纹理同时用作粒子纹理
  custom:model_particle_texture:                             # << CHANGE THIS
    state:
      auto_state: solid
      model:
        path: "minecraft:block/custom/particle_block"        # << CHANGE THIS
        textures:
          - "^minecraft:block/custom/top"                    # << CHANGE THIS — 顶面纹理同时作为粒子效果
          - "minecraft:block/custom/bottom"                  # << CHANGE THIS
          - "minecraft:block/custom/side"                    # << CHANGE THIS

# -----------------------------------------------------------
# 2.4 models 列表 — 多个模型加权随机
# -----------------------------------------------------------
  custom:model_weighted_random:                              # << CHANGE THIS
    state:
      auto_state: solid
      models:
        - path: "minecraft:block/custom/flower_1"            # << CHANGE THIS
          weight: 8                                          # << CHANGE THIS
        - path: "minecraft:block/custom/flower_2"            # << CHANGE THIS
          weight: 5                                          # << CHANGE THIS

# -----------------------------------------------------------
# 2.5 transparent — 移除原始模型（通常用于配合 entity_renderer）
# -----------------------------------------------------------
  custom:model_transparent:                                  # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane                                     # << CHANGE THIS
        id: transparent                                      # << CHANGE THIS — 推荐使用 "transparent" 作为共享 id
      transparent: true
      entity_renderer:
        type: item_display                                   # << CHANGE THIS
        item: "custom:my_decoration"                         # << CHANGE THIS

# -----------------------------------------------------------
# 2.6 模型旋转与 uvlock
# -----------------------------------------------------------
  custom:model_rotated:                                      # << CHANGE THIS
    state:
      auto_state: solid
      model:
        path: "minecraft:block/custom/rotated_block"         # << CHANGE THIS
        x: 90                                                # << CHANGE THIS — 绕 X 轴旋转（90 的倍数）
        y: 0                                                 # << CHANGE THIS — 绕 Y 轴旋转（90 的倍数）
        z: 0                                                 # << CHANGE THIS — 绕 Z 轴旋转（90 的倍数，1.21.11+）
        uvlock: false                                        # << CHANGE THIS — 是否锁定纹理方向

# ===================================================================
# 三、多状态方块 (states) — 方块有多个内部状态
# ===================================================================

# -----------------------------------------------------------
# 3.1 最简单：只定义属性，使用默认外观
# -----------------------------------------------------------
  custom:palm_log_simple:                                    # << CHANGE THIS
    states:
      properties:
        axis:
          type: axis                                         # << CHANGE THIS
          default: "y"
      appearances:
        default:                                             # 第一个外观 → 默认回退
          auto_state: solid
          model:
            path: "minecraft:block/custom/palm_log"          # << CHANGE THIS

# -----------------------------------------------------------
# 3.2 为不同属性值配置不同外观 + variants 精确匹配
# -----------------------------------------------------------
  custom:palm_log_variants:                                  # << CHANGE THIS
    states:
      properties:
        axis:
          type: axis
          default: "y"
      appearances:
        axisY:                                               # << CHANGE THIS — 外观名称可自定义
          auto_state: solid
          model:
            path: "minecraft:block/custom/palm_log"          # << CHANGE THIS
            generation:
              parent: "minecraft:block/cube_column"
              textures:
                end: "minecraft:block/custom/palm_log_top"   # << CHANGE THIS
                side: "minecraft:block/custom/palm_log"      # << CHANGE THIS
        axisX:
          auto_state: solid
          model:
            path: "minecraft:block/custom/palm_log_horizontal" # << CHANGE THIS
            x: 90
            y: 90
            generation:
              parent: "minecraft:block/cube_column_horizontal"
              textures:
                end: "minecraft:block/custom/palm_log_top"   # << CHANGE THIS
                side: "minecraft:block/custom/palm_log"      # << CHANGE THIS
        axisZ:
          auto_state: solid
          model:
            path: "minecraft:block/custom/palm_log_horizontal" # << CHANGE THIS
            x: 90
      variants:
        axis=y:
          appearance: axisY
        axis=x:
          appearance: axisX
        axis=z:
          appearance: axisZ

# -----------------------------------------------------------
# 3.3 用 textures 简化（自动推断模型）+ 特定外观仍需 generation
# -----------------------------------------------------------
  custom:palm_log_textures:                                  # << CHANGE THIS
    states:
      properties:
        axis:
          type: axis
          default: "y"
      appearances:
        axisY:                                               # 使用 textures 简化
          auto_state: solid
          model:
            path: "minecraft:block/custom/palm_log"          # << CHANGE THIS — 2 张纹理必填 path
            textures:
              - "minecraft:block/custom/palm_log_top"        # << CHANGE THIS
              - "minecraft:block/custom/palm_log_side"       # << CHANGE THIS
        axisX:
          auto_state: solid
          model:
            x: 90
            y: 90
            path: "minecraft:block/custom/palm_log_horizontal" # << CHANGE THIS
            generation:
              parent: "minecraft:block/cube_column_horizontal"
              textures:
                end: "minecraft:block/custom/palm_log_top"   # << CHANGE THIS
                side: "minecraft:block/custom/palm_log"      # << CHANGE THIS
        axisZ:
          auto_state: solid
          model:
            x: 90
            path: "minecraft:block/custom/palm_log_horizontal" # << CHANGE THIS
      variants:
        axis=y:
          appearance: axisY
        axis=x:
          appearance: axisX
        axis=z:
          appearance: axisZ

# -----------------------------------------------------------
# 3.4 树叶：waterlogged + persistent + distance 多属性完整示例
# -----------------------------------------------------------
  custom:palm_leaves:                                        # << CHANGE THIS
    states:
      properties:
        waterlogged:
          type: boolean
          default: false
        persistent:
          type: boolean
          default: true
        distance:
          type: int
          default: 7
          range: 1~7                                          # << CHANGE THIS
      appearances:
        default:
          auto_state: leaves                                   # << CHANGE THIS
          model:
            path: "minecraft:block/custom/palm_leaves"         # << CHANGE THIS
            textures:
              - "minecraft:block/custom/palm_leaves"           # << CHANGE THIS
        waterlogged:
          auto_state: waterlogged_leaves                       # << CHANGE THIS
          model:
            path: "minecraft:block/custom/palm_leaves"         # << CHANGE THIS
      variants:
        waterlogged=false:
          appearance: default
        waterlogged=true:
          appearance: waterlogged
          settings:
            resistance: 1200.0                                 # << CHANGE THIS
            burnable: false                                    # << CHANGE THIS
            fluid_state: water                                 # << CHANGE THIS

# -----------------------------------------------------------
# 3.5 变体高级用法：多属性约束 + 仅覆写 settings
# -----------------------------------------------------------
  custom:advanced_variants:                                   # << CHANGE THIS
    states:
      properties:
        facing:
          type: horizontal_direction
          default: north
        waterlogged:
          type: boolean
          default: false
        powered:
          type: boolean
          default: false
      appearances:
        default:
          auto_state: solid
          model:
            path: "minecraft:block/custom/advanced_block"      # << CHANGE THIS
        waterlogged_app:
          auto_state: waterlogged_leaves
          model:
            path: "minecraft:block/custom/advanced_block"      # << CHANGE THIS
      variants:
        # 单个变体约束多个属性（用逗号分隔）
        waterlogged=true,facing=north:                         # 同时满足 waterlogged=true 和 facing=north
          appearance: waterlogged_app
        # 只覆写方块设置，不动外观
        powered=true:
          settings:
            luminance: 7                                       # << CHANGE THIS
        # 多个变体叠加 — appearance 取第一个匹配，settings 合并
        waterlogged=true:
          settings:
            resistance: 100.0
            fluid_state: water
        facing=up:
          settings:
            resistance: 50.0                                   # 覆写上面的 100.0
            luminance: 15

# -----------------------------------------------------------
# 3.6 多状态 + 每个外观使用 entity_renderer
# -----------------------------------------------------------
  custom:sign_post:                                           # << CHANGE THIS
    states:
      properties:
        facing:
          type: horizontal_direction
          default: north
      appearances:
        north:                                                # << CHANGE THIS
          auto_state:
            type: sugar_cane                                   # << CHANGE THIS
            id: transparent
          transparent: true
          entity_renderer:
            type: item_display
            item: "custom:sign_post"                           # << CHANGE THIS
            rotation: 0
        east:                                                 # << CHANGE THIS
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity_renderer:
            type: item_display
            item: "custom:sign_post"                           # << CHANGE THIS
            rotation: 90
        south:                                                # << CHANGE THIS
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity_renderer:
            type: item_display
            item: "custom:sign_post"                           # << CHANGE THIS
            rotation: 180
        west:                                                 # << CHANGE THIS
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity_renderer:
            type: item_display
            item: "custom:sign_post"                           # << CHANGE THIS
            rotation: 270
      variants:
        facing=north:
          appearance: north
        facing=east:
          appearance: east
        facing=south:
          appearance: south
        facing=west:
          appearance: west

# -----------------------------------------------------------
# 3.7 配置内部方块 ID（仅当需要固定 ID 时使用）
# -----------------------------------------------------------
  custom:fixed_id_block:                                      # << CHANGE THIS
    states:
      id: 100                                                  # << CHANGE THIS — 起始 ID，28 个变体占用 100~127（需全局唯一）
      properties:
        waterlogged:
          type: boolean
          default: false
        persistent:
          type: boolean
          default: true
        distance:
          type: int
          default: 7
          range: 1~7
      appearances:
        default:
          auto_state: leaves
          model:
            path: "minecraft:block/custom/fixed_id_block"     # << CHANGE THIS
      variants:
        waterlogged=false:
          appearance: default
        waterlogged=true:
          appearance: default
          settings:
            fluid_state: water

# ===================================================================
# 四、实体渲染器 (entity_renderer) — 各类型完整配置
# ===================================================================

# -----------------------------------------------------------
# 4.1 item_display — 物品展示实体
# -----------------------------------------------------------
  custom:entity_item_display:                                 # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: item_display
        item: "custom:sofa"                                   # << CHANGE THIS
        translation: 0,0.5,0                                  # << CHANGE THIS
        scale: 1,1,1                                          # << CHANGE THIS
        rotation: 0,45,0                                      # << CHANGE THIS
        billboard: fixed                                      # << CHANGE THIS (fixed / vertical / horizontal / center)
        glow_color: 255,200,100                               # << CHANGE THIS
        brightness:
          block_light: 15                                     # << CHANGE THIS
          sky_light: 15                                       # << CHANGE THIS
        view_range: 1.0                                       # << CHANGE THIS
        shadow_radius: 0                                      # << CHANGE THIS
        shadow_strength: 1                                    # << CHANGE THIS
        display_transform: none                               # << CHANGE THIS (none / third_person_left_hand / third_person_right_hand / first_person_left_hand / first_person_right_hand / head / gui / ground / fixed / on_shelf)
        tint_source:
          type: default
          components:
            - minecraft:dyed_color                            # << CHANGE THIS

# -----------------------------------------------------------
# 4.2 text_display — 文本展示实体
# -----------------------------------------------------------
  custom:entity_text_display:                                 # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: text_display
        text: "<yellow>点击交互</yellow>"                     # << CHANGE THIS — 支持 MiniMessage 和 PlaceholderAPI
        translation: 0,1.2,0                                  # << CHANGE THIS
        scale: 1.5                                            # << CHANGE THIS
        billboard: center                                     # << CHANGE THIS
        alignment: center                                     # << CHANGE THIS (center / left / right)
        line_width: 200                                       # << CHANGE THIS
        background_color: 0,0,0,0                             # << CHANGE THIS (A,R,G,B)
        text_opacity: 200                                     # << CHANGE THIS
        has_shadow: true                                      # << CHANGE THIS
        is_see_through: false                                 # << CHANGE THIS
        view_range: 0.8                                       # << CHANGE THIS

# -----------------------------------------------------------
# 4.3 item — 物品实体（带自动旋转动画）
# -----------------------------------------------------------
  custom:entity_item:                                         # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: item
        item: "custom:sleeper_sofa"                           # << CHANGE THIS
        position: 0.5,0.5,0.5                                 # << CHANGE THIS
        tint_source:
          type: default
          components:
            - minecraft:dyed_color                            # << CHANGE THIS

# -----------------------------------------------------------
# 4.4 armor_stand — 盔甲架渲染
# -----------------------------------------------------------
  custom:entity_armor_stand:                                  # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: armor_stand
        item: "custom:bench"                                  # << CHANGE THIS
        position: 0,0.2,0                                     # << CHANGE THIS
        yaw: 0                                                # << CHANGE THIS
        pitch: 0                                              # << CHANGE THIS
        scale: 1                                              # << CHANGE THIS
        small: false                                          # << CHANGE THIS
        glow_color: white                                     # << CHANGE THIS (black/dark_blue/dark_green/dark_aqua/dark_red/dark_purple/gold/gray/dark_gray/blue/green/aqua/red/light_purple/yellow/white)

# -----------------------------------------------------------
# 4.5 better_model — BetterModel 插件模型（需安装 BetterModel）
# -----------------------------------------------------------
  custom:entity_better_model:                                 # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: better_model
        model: "custom_model"                                 # << CHANGE THIS
        position: 0.5,0.5,0.5                                 # << CHANGE THIS
        yaw: 0                                                # << CHANGE THIS
        pitch: 0                                              # << CHANGE THIS
        sight_trace: true                                     # << CHANGE THIS

# -----------------------------------------------------------
# 4.6 model_engine — ModelEngine 插件模型（需安装 ModelEngine）
# -----------------------------------------------------------
  custom:entity_model_engine:                                 # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: model_engine
        model: "custom_model"                                 # << CHANGE THIS
        position: 0.5,0.5,0.5                                 # << CHANGE THIS
        yaw: 0                                                # << CHANGE THIS
        pitch: 0                                              # << CHANGE THIS

# -----------------------------------------------------------
# 4.7 多个渲染元素叠加（列表格式）
# -----------------------------------------------------------
  custom:entity_multi_element:                                # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        - type: item_display
          item: "custom:sofa"                                 # << CHANGE THIS
          translation: 0,0.5,0
        - type: text_display
          text: "沙发"                                        # << CHANGE THIS
          translation: 0,1.2,0
          billboard: center
          alignment: center

# -----------------------------------------------------------
# 4.8 颜色提供器（tint_source）多元素着色
# -----------------------------------------------------------
  custom:entity_tinted:                                       # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        - item: "custom:element_1"                            # << CHANGE THIS
          tint_source:
            type: default
            components:
              - minecraft:dyed_color                          # << CHANGE THIS
            index: 0                                          # 对应第 1 个颜色提供器
        - item: "custom:element_2"                            # << CHANGE THIS
          tint_source:
            type: default
            components:
              - minecraft:dyed_color                          # << CHANGE THIS
            index: 1                                          # 对应第 2 个颜色提供器

# -----------------------------------------------------------
# 4.9 实体剔除 (entity_culling) 与渲染条件 (conditions)
# -----------------------------------------------------------
  custom:entity_with_culling:                                 # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        - type: item_display
          item: "custom:secret_block"                         # << CHANGE THIS
          translation: 0,0.5,0
      entity_culling:
        aabb: -0.5,-0.5,-0.5,0.5,1.5,0.5                     # << CHANGE THIS
        view_distance: 64                                     # << CHANGE THIS
        aabb_expansion: 0.5                                   # << CHANGE THIS
        ray_tracing: true                                     # << CHANGE THIS

# -----------------------------------------------------------
# 4.10 entity_culling: false — 禁用剔除（实体始终可见）
# -----------------------------------------------------------
  custom:entity_no_culling:                                   # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: item_display
        item: "custom:always_visible"                         # << CHANGE THIS
      entity_culling: false

# -----------------------------------------------------------
# 4.11 渲染条件 — 仅对指定玩家可见
# -----------------------------------------------------------
  custom:entity_conditional:                                  # << CHANGE THIS
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        - type: item_display
          item: "custom:secret_block"                         # << CHANGE THIS
          conditions:
            - type: permission
              permission: "vip.secret"                        # << CHANGE THIS
            - type: world
              world: "world_nether"                           # << CHANGE THIS

# ===================================================================
# 五、属性类型参考 (properties) — 每个类型一个独立 block 示例
# ===================================================================

# -----------------------------------------------------------
# 5.1 boolean — true / false
# -----------------------------------------------------------
  custom:prop_boolean:                                        # << CHANGE THIS
    states:
      properties:
        active:
          type: boolean
          default: false
      appearances:
        default:
          auto_state: solid
          model:
            path: "minecraft:block/custom/prop_boolean"       # << CHANGE THIS

# -----------------------------------------------------------
# 5.2 int — 整数范围
# -----------------------------------------------------------
  custom:prop_int:                                            # << CHANGE THIS
    states:
      properties:
        mode:
          type: int
          default: 1
          range: 1~3                                          # << CHANGE THIS
      appearances:
        default:
          auto_state: solid
          model:
            path: "minecraft:block/custom/prop_int"           # << CHANGE THIS

# -----------------------------------------------------------
# 5.3 string — 预定义字符串集合
# -----------------------------------------------------------
  custom:prop_string:                                         # << CHANGE THIS
    states:
      properties:
        color:
          type: string
          default: red
          values:                                             # << CHANGE THIS
            - red
            - green
            - blue
      appearances:
        default:
          auto_state: solid
          model:
            path: "minecraft:block/custom/prop_string"        # << CHANGE THIS

# -----------------------------------------------------------
# 5.4 direction — 六方向 (east/south/west/north/up/down)
# -----------------------------------------------------------
  custom:prop_direction:                                      # << CHANGE THIS
    states:
      properties:
        facing:
          type: direction
          default: north
      appearances:
        default:
          auto_state: solid
          model:
            path: "minecraft:block/custom/prop_direction"     # << CHANGE THIS

# -----------------------------------------------------------
# 5.5 horizontal_direction — 水平四方向 (east/south/west/north)
# -----------------------------------------------------------
  custom:prop_horizontal_dir:                                 # << CHANGE THIS
    states:
      properties:
        facing:
          type: horizontal_direction
          default: north
      appearances:
        default:
          auto_state: solid
          model:
            path: "minecraft:block/custom/prop_horizontal"    # << CHANGE THIS

# -----------------------------------------------------------
# 5.6 axis — 三轴 (x/y/z)
# -----------------------------------------------------------
  custom:prop_axis:                                           # << CHANGE THIS
    states:
      properties:
        axis:
          type: axis
          default: "y"
      appearances:
        default:
