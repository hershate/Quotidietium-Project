settings:
  # Should Oraxen automatically generate sounds.json according to your settings?
  automatically_generate: true

# Please note due to config limitations,
# block.second.something will
# add empty entries for 'block' and 'block.second'
# The actual sounds will still be under 'block.second.something'
# The above are just empty and side-effect of generating the json file.
sounds:
- id: welcome
  category: records
  sound: welcome.ogg
  stream: true
  subtitle: Welcome Song
  jukebox:
    description: <gold>Welcome <yellow>Song</yellow></gold>
    duration: 180s
    comparator_output: 12
- id: nugalaetiter_light
  category: records
  sound: onexhs/nugalaetiter_light.ogg
  stream: true
  subtitle: "ONEXHS - Nugalaetiter - 琐欢行乐 主奏曲 - 畅清"
  jukebox:
    description: <green>ONEXHS <blue>- Nugalaetiter - 琐欢行乐 主奏曲 - 畅清</blue></green>
    duration: 210s
    comparator_output: 12
- id: nugalaetiter_thick
  category: records
  sound: onexhs/nugalaetiter_thick.ogg
  stream: true
  subtitle: "ONEXHS - Nugalaetiter - 琐欢行乐 主奏曲 - 盛辉"
  jukebox:
    description: <green>ONEXHS <gold>- Nugalaetiter - 琐欢行乐 主奏曲 - 盛辉</gold></green>
    duration: 314s
    comparator_output: 12
