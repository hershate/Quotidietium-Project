# ============================================================================
# 条件完整示例
# 本地 Wiki: reference/conditions.md
# 说明: 条件 (conditions) 是 events/functions 的子键，不独立存在。
#       本文件分为两大部分:
#         第一部分 — 所有条件类型参考目录 (在 items 下正确嵌套)
#         第二部分 — 完整事件配置范例 (综合运用各种条件)
# ============================================================================

items:
  # ==========================================================================
  # 第一部分: 条件类型参考目录
  # 所有条件均正确嵌套在 conditions: 列表下
  # ==========================================================================
  quartzietium:condition_demo:
    material: stick
    data:
      item_name: "<gold>条件演示物品"
    events:
      - on: right_click
        functions:
          - type: command
            command: "say 条件通过!"
        conditions:

          # ================================================================
          # 一、复合条件
          # ================================================================

          # ------------------------------------------------------------------
          # 1.1 any_of — 任意条件满足即可 (OR)
          # ------------------------------------------------------------------
          - type: any_of
            terms:
              # 子条件 1: 检查权限
              - type: permission
                permission: "quartzietium.op"           # << CHANGE THIS
              # 子条件 2: 检查手持物品 (反向: 不是钻石)
              - type: "!match_item"
                id: "minecraft:diamond"
                regex: false

          # ------------------------------------------------------------------
          # 1.2 all_of — 所有条件必须满足 (AND)
          # ------------------------------------------------------------------
          - type: all_of
            terms:
              - type: worldguard:region
                mode: 1                               # 1=并集, 2=交集
                regions:
                  - "spawn_area"                      # << CHANGE THIS
              - type: distance
                min: 10                               # << CHANGE THIS
                max: 50                               # << CHANGE THIS

          # ------------------------------------------------------------------
          # 1.3 inverted — 对单个条件取反 (NOT)
          # ------------------------------------------------------------------
          - type: inverted
            term:
              type: on_cooldown
              id: "quartzietium:super_ability"        # << CHANGE THIS


          # ================================================================
          # 二、上下文检测条件
          # ================================================================

          # ------------------------------------------------------------------
          # 2.1 falling_block — 检测掉落物是否由下落方块产生
          # ------------------------------------------------------------------
          - type: falling_block
          # 反向
          - type: "!falling_block"

          # ------------------------------------------------------------------
          # 2.2 survives_explosion — 以 1/爆炸半径 概率通过
          # ------------------------------------------------------------------
          - type: survives_explosion
          - type: "!survives_explosion"

          # ------------------------------------------------------------------
          # 2.3 has_item — 是否手持物品
          # ------------------------------------------------------------------
          - type: has_item
          - type: "!has_item"

          # ------------------------------------------------------------------
          # 2.4 hand — 检测交互手
          # ------------------------------------------------------------------
          - type: hand
            hand: main_hand                           # main_hand | off_hand
          - type: "!hand"
            hand: off_hand


          # ================================================================
          # 三、物品/方块/实体匹配条件
          # ================================================================

          # ------------------------------------------------------------------
          # 3.1 match_item — 手持物品匹配 (支持正则与多值)
          # ------------------------------------------------------------------
          # 单物品
          - type: match_item
            id: "quartzietium:topaz_pickaxe"          # << CHANGE THIS
            regex: false
          # 多物品
          - type: match_item
            id:
              - "quartzietium:topaz_pickaxe"          # << CHANGE THIS
              - "quartzietium:ruby_pickaxe"
            regex: false
          # 正则匹配
          - type: match_item
            id: "quartzietium:.*_pickaxe"
            regex: true
          # 反向
          - type: "!match_item"
            id: "minecraft:diamond"
            regex: false

          # ------------------------------------------------------------------
          # 3.2 match_block — 方块类型匹配
          # ------------------------------------------------------------------
          - type: match_block
            x: "<arg:position.x>"
            y: "<arg:position.y>"
            z: "<arg:position.z>"
            id: "quartzietium:topaz_ore"              # << CHANGE THIS
            regex: false
          # 反向: 不是空气
          - type: "!match_block"
            x: "<arg:position.x>"
            y: "<arg:position.y>"
            z: "<arg:position.z>"
            id: "minecraft:air"
            regex: false

          # ------------------------------------------------------------------
          # 3.3 match_block_property — 方块状态匹配
          # ------------------------------------------------------------------
          - type: match_block_property
            properties:
              age: 3
          # 多属性
          - type: match_block_property
            properties:
              facing: north                           # << CHANGE THIS
              lit: "true"
          # 反向
          - type: "!match_block_property"
            properties:
              age: 7

          # ------------------------------------------------------------------
          # 3.4 match_entity — 实体类型匹配
          # ------------------------------------------------------------------
          - type: match_entity
            id: "minecraft:ender_dragon"
            regex: false
          # 多实体
          - type: match_entity
            id:
              - "minecraft:zombie"
              - "minecraft:skeleton"
            regex: false
          # 正则
          - type: match_entity
            id: "minecraft:(zombie|skeleton|phantom).*"
            regex: true
          # 反向
          - type: "!match_entity"
            id: "minecraft:enderman"
            regex: false

          # ------------------------------------------------------------------
          # 3.5 match_furniture_variant — 家具变体匹配
          # ------------------------------------------------------------------
          - type: match_furniture_variant
            variants:
              - wall                                  # << CHANGE THIS
              - corner
              - center
          # 反向
          - type: "!match_furniture_variant"
            variants:
              - stool                                # << CHANGE THIS

          # ------------------------------------------------------------------
          # 3.6 inventory_has_item — 背包物品检测
          # ------------------------------------------------------------------
          - type: inventory_has_item
            id: "quartzietium:topaz_gem"              # << CHANGE THIS
            count: 5                                  # << CHANGE THIS
          # 反向
          - type: "!inventory_has_item"
            id: "quartzietium:brass_ingot"
            count: 1


          # ================================================================
          # 四、魔咒与概率条件
          # ================================================================

          # ------------------------------------------------------------------
          # 4.1 enchantment — 附魔检测 (支持 >= > = < <=)
          # ------------------------------------------------------------------
          - type: enchantment
            predicate: "minecraft:silk_touch>=1"      # << CHANGE THIS
          - type: enchantment
            predicate: "minecraft:fortune>2"
          - type: enchantment
            predicate: "minecraft:sharpness=5"
          - type: "!enchantment"
            predicate: "minecraft:mending>=1"

          # ------------------------------------------------------------------
          # 4.2 table_bonus — 附魔等级查表概率
          # ------------------------------------------------------------------
          - type: table_bonus
            enchantment: "minecraft:fortune"          # << CHANGE THIS
            chances:
              - 0.1                                   # 等级0: 10%
              - 0.5                                   # 等级1: 50%
              - 0.8                                   # 等级2: 80%
              - 1.0                                   # 等级3: 100%
          # 反向
          - type: "!table_bonus"
            enchantment: "minecraft:looting"
            chances:
              - 0.0
              - 0.25
              - 0.5
              - 0.75

          # ------------------------------------------------------------------
          # 4.3 random — 纯随机概率
          # ------------------------------------------------------------------
          - type: random
            value: 0.5                                # 50%
          - type: random
            value: 0.05                               # 5%
          - type: "!random"
            value: 0.75


          # ================================================================
          # 五、权限与表达式条件
          # ================================================================

          # ------------------------------------------------------------------
          # 5.1 permission — 权限检测
          # ------------------------------------------------------------------
          - type: permission
            permission: "quartzietium.mining.bypass"  # << CHANGE THIS
          # 多权限 (利用 all_of)
          - type: all_of
            terms:
              - type: permission
                permission: "quartzietium.vip"
              - type: permission
                permission: "quartzietium.event_access"
          # 反向
          - type: "!permission"
            permission: "quartzietium.admin"

          # ------------------------------------------------------------------
          # 5.2 expression — EvalEx 表达式求值
          # ------------------------------------------------------------------
          - type: expression
            expression: "<papi:farming_level> >= 10"  # << CHANGE THIS
          - type: expression
            expression: "<arg:player.health> < 6.0"
          - type: expression
            expression: "<arg:player.food_level> == 20"
          # 反向
          - type: "!expression"
            expression: "<papi:farming_level> >= 5"

          # ------------------------------------------------------------------
          # 5.3 test_flag — 位置权限标志检测
          # ------------------------------------------------------------------
          - type: test_flag
            flag: break                               # break/place/interact/open_container
          - type: test_flag
            flag: place
          - type: test_flag
            flag: interact
          - type: test_flag
            flag: open_container
          # 反向
          - type: "!test_flag"
            flag: place

          # ------------------------------------------------------------------
          # 5.4 worldguard:region — WorldGuard 区域检测
          # ------------------------------------------------------------------
          - type: worldguard:region
            mode: 1                                   # 1=并集, 2=交集
            regions:
              - "spawn"                              # << CHANGE THIS
              - "shop"
          - type: worldguard:region
            mode: 2
            regions:
              - "pvp_zone"
              - "arena"
          # 反向
          - type: "!worldguard:region"
            mode: 1
            regions:
              - "safe_zone"


          # ================================================================
          # 六、字符串与空值条件
          # ================================================================

          # ------------------------------------------------------------------
          # 6.1 string_equals — 字符串相等判定
          # ------------------------------------------------------------------
          - type: string_equals
            value1: "<arg:player.name>"
            value2: "Notch"                           # << CHANGE THIS
          - type: string_equals
            value1: "<arg:block.world>"
            value2: "world_the_end"
          - type: "!string_equals"
            value1: "<arg:player.name>"
            value2: "Steve"

          # ------------------------------------------------------------------
          # 6.2 string_contains — 字符串包含判定
          # ------------------------------------------------------------------
          - type: string_contains
            value1: "<arg:player.name>"
            value2: "Build"                           # << CHANGE THIS
          - type: "!string_contains"
            value1: "<arg:player.name>"
            value2: "Admin"

          # ------------------------------------------------------------------
          # 6.3 regex — 正则表达式匹配
          # ------------------------------------------------------------------
          - type: regex
            value: "<arg:player.name>"
            regex: "Player[0-9]+"                     # << CHANGE THIS
          - type: regex
            value: "<arg:player.uuid>"
            regex: "^[a-f0-9-]{36}$"
          - type: "!regex"
            value: "<arg:player.name>"
            regex: "^[A-Z].*"

          # ------------------------------------------------------------------
          # 6.4 is_null — 空值检测
          # ------------------------------------------------------------------
          - type: is_null
            argument: "player.main_hand_item"         # << CHANGE THIS
          - type: is_null
            argument: "block.top_property"
          # 反向: 值存在
          - type: "!is_null"
            argument: "arg:target.name"


          # ================================================================
          # 七、玩家状态条件
          # ================================================================

          # ------------------------------------------------------------------
          # 7.1 has_player — 玩家存在检测
          # ------------------------------------------------------------------
          - type: has_player
          - type: "!has_player"

          # ------------------------------------------------------------------
          # 7.2 is_bedrock_player — 基岩版玩家检测
          # ------------------------------------------------------------------
          - type: is_bedrock_player
          - type: "!is_bedrock_player"

          # ------------------------------------------------------------------
          # 7.3 distance — 距离范围检测
          # ------------------------------------------------------------------
          - type: distance
            min: 0                                    # << CHANGE THIS
            max: 32                                   # << CHANGE THIS
          - type: distance
            min: 10
            max: 50
          # 反向
          - type: "!distance"
            min: 5
            max: 100

          # ------------------------------------------------------------------
          # 7.4 on_cooldown — 冷却检测
          # ------------------------------------------------------------------
          - type: on_cooldown
            id: "quartzietium:dash_ability"           # << CHANGE THIS
          - type: on_cooldown
            id: "quartzietium:super_jump"
          # 反向: 不在冷却中
          - type: "!on_cooldown"
            id: "quartzietium:special_attack"


  # ==========================================================================
  # 第二部分: 完整事件配置范例
  # 综合运用以上所有条件类型
  # ==========================================================================
  quartzietium:events_demo:
    material: stick
    data:
      item_name: "<gold>事件演示物品"
    events:

      # ------------------------------------------------------------------
      # 8.1 采矿事件 — match_block + enchantment + random + permission
      # ------------------------------------------------------------------
      - on: right_click                             # 模拟: 右键触发
        functions:
          - type: command
            command: "give <arg:player.name> quartzietium:topaz_gem 1"  # << CHANGE THIS
          - type: command
            command: "say <arg:player.name> 挖到了黄水晶！"
        conditions:
          - type: all_of
            terms:
              - type: match_block
                x: "<arg:position.x>"
                y: "<arg:position.y>"
                z: "<arg:position.z>"
                id: "quartzietium:topaz_ore"
                regex: false
              - type: "!match_item"
                id: "minecraft:.*_pickaxe"
                regex: true
              - type: enchantment
                predicate: "minecraft:fortune>=3"
              - type: permission
                permission: "quartzietium.vip"
              - type: random
                value: 0.5

      # ------------------------------------------------------------------
      # 8.2 右键交互事件 — hand + has_item + is_null + test_flag
      # ------------------------------------------------------------------
      - on: right_click
        functions:
          - type: command
            command: "doors open <arg:position.x> <arg:position.y> <arg:position.z>"
          - type: play_sound
            sound: "minecraft:block.iron_door.open"
          - type: set_cooldown
            id: "quartzietium:key_cooldown"
            time: "5s"
        conditions:
          - type: all_of
            terms:
              - type: hand
                hand: main_hand
              - type: has_item
              - type: match_item
                id: "quartzietium:brass_key"        # << CHANGE THIS
                regex: false
              - type: "!is_null"
                argument: "item.quartzietium:door_id"
              - type: test_flag
                flag: interact
              - type: "!on_cooldown"
                id: "quartzietium:key_cooldown"

      # ------------------------------------------------------------------
      # 8.3 生物击杀事件 — any_of + match_entity + expression + inventory_has_item
      # ------------------------------------------------------------------
      - on: attack                                   # 模拟: 攻击触发
        functions:
          - type: command
            command: "give <arg:player.name> quartzietium:dragon_trophy 1"  # << CHANGE THIS
          - type: message
            message: "&6恭喜 <arg:player.name> 击败了首领！"
        conditions:
          - type: all_of
            terms:
              - type: any_of
                terms:
                  - type: match_entity
                    id: "minecraft:ender_dragon"
                    regex: false
                  - type: match_entity
                    id: "minecraft:wither"
                    regex: false
              - type: expression
                expression: "<papi:player_level> >= 30"
              - type: inventory_has_item
                id: "quartzietium:honor_sword"      # << CHANGE THIS
                count: 1
              - type: "!is_bedrock_player"

      # ------------------------------------------------------------------
      # 8.4 右键方块事件 — match_block_property + match_item + worldguard:region + distance
      # ------------------------------------------------------------------
      - on: right_click
        functions:
          - type: command
            command: "setblock <arg:position.x> <arg:position.y> <arg:position.z> minecraft:wheat[age=0]"
          - type: command
            command: "give <arg:player.name> minecraft:wheat 3"  # << CHANGE THIS
          - type: play_sound
            sound: "minecraft:block.crop.break"
        conditions:
          - type: all_of
            terms:
              - type: match_block_property
                properties:
                  age: 7
              - type: match_item
                id: "quartzietium:topaz_hoe"        # << CHANGE THIS
                regex: false
              - type: string_contains
                value1: "<arg:block.world>"
                value2: "world"
              - type: worldguard:region
                mode: 1
                regions:
                  - "farm"                          # << CHANGE THIS
              - type: distance
                min: 0
                max: 100                            # << CHANGE THIS

      # ------------------------------------------------------------------
      # 8.5 方块放置事件 — test_flag + distance + table_bonus + expression
      # ------------------------------------------------------------------
      - on: right_click                             # 模拟: 放置触发
        functions:
          - type: command
            command: "particle flame <arg:position.x> <arg:position.y> <arg:position.z>"
          - type: command
            command: "playsound minecraft:block.beacon.activate master <arg:player.name>"
        conditions:
          - type: all_of
            terms:
              - type: match_item
                id: "quartzietium:magic_block"      # << CHANGE THIS
                regex: false
              - type: "!test_flag"
                flag: place
              - type: "!distance"
                min: 0
                max: 500                            # << CHANGE THIS
              - type: table_bonus
                enchantment: "minecraft:fortune"
                chances:
                  - 0.0
                  - 0.3
                  - 0.6
                  - 1.0
              - type: expression
                expression: "<papi:player_health_percent> > 50.0"

      # ------------------------------------------------------------------
      # 8.6 掉落事件 — falling_block + survives_explosion + random
      # ------------------------------------------------------------------
      - on: right_click                             # 模拟: 破坏方块触发
        functions:
          - type: command
            command: "give <arg:player.name> quartzietium:ancient_relic 1"  # << CHANGE THIS
        conditions:
          - type: all_of
            terms:
              - type: falling_block
              - type: survives_explosion
              - type: random
                value: 0.1

      # ------------------------------------------------------------------
      # 8.7 完整嵌套条件 — inverted + any_of + all_of 组合
      # ------------------------------------------------------------------
      - on: right_click                             # 模拟: 实体交互
        functions:
          - type: command
            command: "say <arg:player.name> 与实体进行了特殊交互！"
        conditions:
          - type: all_of
            terms:
              # NOT (在safe_zone 或 no_pvp_zone)
              - type: inverted
                term:
                  type: any_of
                  terms:
                    - type: worldguard:region
                      mode: 1
                      regions:
                        - "safe_zone"               # << CHANGE THIS
                    - type: worldguard:region
                      mode: 1
                      regions:
                        - "no_pvp_zone"             # << CHANGE THIS
              # 有权限 或 手持紫水晶碎片
              - type: any_of
                terms:
                  - type: permission
                    permission: "quartzietium.special_interact"
                  - type: match_item
                    id: "quartzietium:amethyst_shard"  # << CHANGE THIS
                    regex: false
              # Java 版玩家
              - type: "!is_bedrock_player"
              # 不在冷却中
              - type: "!on_cooldown"
                id: "quartzietium:special_interact_cd"
