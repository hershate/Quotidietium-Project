# =============================================================================
# CraftEngine - 音乐唱片 & 音效 综合模板
# =============================================================================
# 参考 Wiki 路径（仓库内本地路径）：
#   参考资料/CraftEngine/CraftEngine Wiki/configuration/jukebox_song.md
#   参考资料/CraftEngine/CraftEngine Wiki/configuration/sound.md
#
# 使用说明：
#   1. 将下面所有内容放入 CraftEngine 的配置文件中（如 config.yml）。
#   2. 将 "default" 替换为你的命名空间（推荐小写字母+下划线）。
#   3. 将 "your_song_key" / "your_item_key" / "your_sound_event" 替换为实际 ID。
#   4. 修改所有带 # << CHANGE THIS 标记的值。
#   5. 重载配置后重新进入服务器（Minecraft 注册表不可变）。
# =============================================================================

# =============================================================================
# 一、唱片机曲目定义 (jukebox_songs)
# =============================================================================
# 每组曲目定义一个可在唱片机中播放的曲目。
# =============================================================================
jukebox_songs:
  # --- 示例 1：基础曲目 ------------------------------------------------------
  # << CHANGE THIS 将 "default" 改为你的命名空间，"your_song_key" 改为曲目 ID
  default:your_song_key:
    # << CHANGE THIS 音效事件名称（参考下方 sounds 章节或 Minecraft 原版声音事件）
    sound: "minecraft:music.credits"
    # << CHANGE THIS 音乐时长，单位：秒（浮点数）
    length: 100.0
    # << CHANGE THIS 唱片描述文本（游戏内显示）
    description: "Your Song Description"
    # << CHANGE THIS 红石比较器输出值（整数，0-15）
    comparator_output: 15
    # << CHANGE THIS 音乐可被听到的范围，单位：格
    range: 32

  # --- 示例 2：第二首曲目（完整标注）-----------------------------------------
  # << CHANGE THIS
  default:another_song:
    sound: "minecraft:music.game"
    length: 200.5
    description: "Another Melody"
    comparator_output: 10
    range: 48

# =============================================================================
# 二、可播放唱片的物品定义 (items)
# =============================================================================
# 为物品添加 minecraft:jukebox_playable 组件，使其能被放入唱片机播放。
# jukebox_playable 的值必须与上方 jukebox_songs 中定义的键名一致。
# =============================================================================
items:
  # --- 物品 1：基础唱片物品 --------------------------------------------------
  # << CHANGE THIS
  default:music_disc:
    # << CHANGE THIS 物品材质（Minecraft 原版材质名）
    material: music_disc_13
    data:
      # << CHANGE THIS 关联的曲目键名（与上方 jukebox_songs 中定义的一致）
      jukebox_playable: "default:your_song_key"

  # --- 物品 2：自定义唱片物品（使用非唱片材质）-------------------------------
  # << CHANGE THIS
  default:custom_record:
    material: stick
    data:
      # << CHANGE THIS 关联的曲目键名
      jukebox_playable: "default:another_song"

# =============================================================================
# 三、自定义音效定义 (sounds)
# =============================================================================
# 定义新的声音事件，或覆盖原版声音事件。
# 每个声音事件可包含多个声音文件，支持权重随机播放。
# =============================================================================
sounds:
  # --- 示例 1：简单音效（仅指定路径）----------------------------------------
  # << CHANGE THIS 声音事件键名（建议 namespace:path 格式）
  default:custom_block.place:
    # << CHANGE THIS 是否替换已有声音事件（true=覆盖原版事件）
    replace: false
    # << CHANGE THIS 字幕键名（对应语言文件中的翻译键）
    subtitle: "subtitles.custom_block.place"
    # 声音文件列表（简单格式：直接写路径字符串）
    sounds:
      - "block/custom_block_1"

  # --- 示例 2：复杂音效（对象格式，含权重/音量/流式播放）--------------------
  default:custom_ambient.custom_biome:
    replace: false
    subtitle: "subtitles.custom_ambient.custom_biome"
    # 声音文件列表（对象格式 + 简单格式混合）
    sounds:
      # 对象格式：可单独控制每个声音文件的属性
      - name: "ambient/custom_biome_1"   # << CHANGE THIS 音效文件路径
        volume: 0.4                       # << CHANGE THIS 音量（0.0-1.0）
        weight: 3                         # << CHANGE THIS 权重（越大播放概率越高）

      - name: "ambient/custom_biome_2"
        volume: 0.4
        weight: 7

      # 完整参数示例
      - name: "ambient/custom_biome_3"
        volume: 0.4
        weight: 10
        # << CHANGE THIS 是否流式播放（长背景音建议 true，短音效 false）
        stream: false
        # << CHANGE THIS 衰减距离，单位：格（声音随距离衰减的范围）
        attenuation_distance: 16
        # << CHANGE THIS 是否预加载（true=进入世界时加载，false=播放时加载）
        preload: false
        # << CHANGE THIS 类型："file"（自定义文件）或 "event"（另一个声音事件）
        type: "file"

  # --- 示例 3：覆盖原版音效（replace: true）---------------------------------
  # << CHANGE THIS
  minecraft:block.stone.break:
    # << CHANGE THIS 设为 true 以覆盖原版声音事件
    replace: true
    subtitle: "subtitles.block.generic.break"
    sounds:
      - name: "custom/stone_break_1"
        volume: 1.0
        weight: 5
      - name: "custom/stone_break_2"
        volume: 0.8
        weight: 5
        stream: false
        attenuation_distance: 16
        type: "file"
