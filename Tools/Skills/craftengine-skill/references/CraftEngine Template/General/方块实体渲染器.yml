# =============================================================================
# 方块实体渲染器配置模板
# 参考: configuration/block/states/entity_renderer.md
# entity_renderer 是 state/appearance 的子键，此处以完整 blocks: 展示
# =============================================================================

blocks:
  # ===========================================================================
  # 1. 物品展示实体 (item_display)
  # ===========================================================================
  custom:display_stool:
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: item_display
        item: custom:stool
        translation: 0,0.5,0                                    # << CHANGE THIS
        scale: 1.0,1.0,1.0                                      # << CHANGE THIS
        rotation: 0,0,0,0                                        # << CHANGE THIS

  # ===========================================================================
  # 2. 文本展示实体 (text_display)
  # ===========================================================================
  custom:sign_post:
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: text_display
        text: "<gold>公告板"                                     # << CHANGE THIS
        translation: 0,1.5,0                                     # << CHANGE THIS
        scale: 1.0,1.0,1.0
        billboard: center                                        # << CHANGE THIS: fixed/vertical/horizontal/center
        background_color: 64,0,0,0                              # << CHANGE THIS ARGB 格式 (A,R,G,B), 默认 64,0,0,0
        is_see_through: false

  # ===========================================================================
  # 3. 物品实体 (item) — 掉落物形式
  # ===========================================================================
  custom:floating_gem:
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: item
        item: custom:floating_gem
        translation: 0,0.8,0

  # ===========================================================================
  # 4. 盔甲架实体 (armor_stand)
  # ===========================================================================
  custom:armor_stand_display:
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: armor_stand
        item: custom:display_helmet
        translation: 0,0.5,0

  # ===========================================================================
  # 5. 复杂：多外观 + 实体渲染器 + glow_color
  # ===========================================================================
  custom:glowing_orb:
    state:
      auto_state:
        type: sugar_cane
        id: transparent
      transparent: true
      entity_renderer:
        type: item_display
        item: custom:orb
        glow_color: 255,200,100                                  # << CHANGE THIS
