# =============================================================================
# CraftEngine — 全局变量配置模板 (Global Variables)
# =============================================================================
# 本地文档参考:
#   CraftEngine Wiki/configuration/global_variable.md
#
# 用法:
#   - 定义: 在 global_variables 下以键值对形式声明
#   - 引用: 使用 <global:键名> 标签, 支持任意上下文 (items, holograms, 其他插件等)
#   - 传参: <global:键名:'参数1':'参数2'> 将参数传入 arg:0 / arg:1 占位符
#   - 格式码: <!i>斜体, <!shadow>阴影, <#RRGGBB>颜色, <image:命名空间:路径>图像
#
# 下文所有 << CHANGE THIS >> 标记处请替换为实际值后使用。
# =============================================================================

# =============================================================================
# 全局变量映射表
# =============================================================================
global_variables:

  # --------------------------------------------------------------------------
  # 【基础用法】纯文本 + 格式码
  # --------------------------------------------------------------------------

  # 纯文本别名, 用于统一修改或跨插件共享
  server_name: "&6&lQuotidietium"  # << CHANGE THIS

  # 格式码组合: <!i> = 斜体, <#RRGGBB> = 自定义颜色
  # 支持所有 Minecraft 标准格式码
  highlight_gold: "<!i><#FF8C00>黄金"                        # << CHANGE THIS

  # 阴影效果格式码
  # 适用于全息图 / 物品提示等需要视觉突出的场合
  coin_without_shadow: "<!shadow><image:default:icons>"       # << CHANGE THIS

  # --------------------------------------------------------------------------
  # 【带参数传值】使用 <arg:0> <arg:1> … 占位
  # 调用方通过 <global:键名:'值1':'值2'> 传入参数
  # --------------------------------------------------------------------------

  # 示例 1: 物品名称模板 (arg:0 = 玩家名, arg:1 = 物品 i18n 键)
  param_item_name_template: "<!i><#FF8C00><arg:0>的<arg:1>"
  #   调用: <global:param_item_name_template:'<arg:player.name>':'<i18n:item.topaz_rod>'>
  #   结果: "玩家A的§6黄铜棍" (假设 §6 对应 #FF8C00)

  # 示例 2: 通用前缀模板
  param_prefix_template: "&7[<arg:0>] &r"                    # << CHANGE THIS
  #   调用: <global:param_prefix_template:'VIP'>
  #   结果: "[VIP] "

  # 示例 3: 多参数数值格式
  param_stat_display: "<arg:0>&7/&f<arg:1>"                  # << CHANGE THIS
  #   调用: <global:param_stat_display:'1200':'9999'>
  #   结果: "1200/9999"

  # 示例 4: 奖励标题模板 (arg:0 = 稀有度色码, arg:1 = 奖励名称)
  param_reward_title: "<arg:0>&l奖励: <arg:1>"                # << CHANGE THIS
  #   调用: <global:param_reward_title:'&6':'每日登录奖励'>
  #   结果: "&6&l奖励: 每日登录奖励"

  # --------------------------------------------------------------------------
  # 【图像/材质标签】<image:命名空间:路径>
  # --------------------------------------------------------------------------

  # 自定义图像资源引用
  custom_icon_coin: "<!shadow><image:default:icons>"          # << CHANGE THIS
  custom_icon_star: "<!shadow><image:default:star>"           # << CHANGE THIS
  custom_icon_arrow: "<image:custom:arrow_right>"             # << CHANGE THIS

  # --------------------------------------------------------------------------
  # 【组合用法】格式码 + 参数 + 图像
  # --------------------------------------------------------------------------

  # 带图像前缀的标题 (arg:0 = 标题文字)
  combined_title_with_icon: "<!shadow><image:default:icons> <!i><#FF8C00><arg:0>"
  #   调用: <global:combined_title_with_icon:'公告'>
  #   结果: "[图标] 公告" (斜体橙色)

  # --------------------------------------------------------------------------
  # 【跨插件调用示例 — 仅供参考, 不做功能保证】
  # --------------------------------------------------------------------------
  # CraftEngine 全局变量基于数据包级文本替换, 可在其他插件的配置中引用。
  # 例如 HolographicDisplays / CMI 全息图行:
  #   line: "<global:coin_without_shadow> 我的金币: %vault_eco_balance%"
  # --------------------------------------------------------------------------

# =============================================================================
# 使用示例 (解注释即可测试)
# =============================================================================

# 1) 在物品定义中引用全局变量
# =============================================================================
# items#<< CHANGE THIS (物品组 ID) >>:
#   << CHANGE THIS (物品 ID) >>:
#     default:<< CHANGE THIS (基础物品) >>:
#       client_bound_data:
#         item_name: "<global:param_item_name_template:'<arg:player.name>':'<i18n:item.topaz_rod>'>"

# 2) 在全息图/其他插件中引用全局变量
# =============================================================================
# line: "<global:coin_without_shadow> 我的金币: %vault_eco_balance%"

# 3) 在多个上下文复用同一变量
# =============================================================================
# server_name 可同时用于:
#   - 物品 lore 中的服务器名称
#   - 全息图欢迎文本
#   - 菜单标题
# 统一修改 global_variables 下的 server_name 即可全局生效。
